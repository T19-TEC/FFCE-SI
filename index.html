/* --- Prendre rendez-vous, côté nouvel adhérent ------------------------ */
function PrendreRendezVous(){
  const [libres, setLibres] = useState([]);
  const [miens, setMiens] = useState([]);
  const [msg, setMsg] = useState('');

  const charger = useCallback(async () => {
    const [a,b] = await Promise.all([
      db.rpc('creneaux_disponibles'), db.rpc('mes_rendez_vous')
    ]);
    setLibres(a.data||[]); setMiens((b.data||[]).filter(x => !x.je_suis_hote && !x.passe));
  }, []);
  useEffect(() => { charger(); }, [charger]);

  if (miens.length === 0 && libres.length === 0) return null;

  return html`
    <div class="panneau" style="margin-bottom:24px">
      <div class="tete"><h3 style="font-size:17px">Rendez-vous d\u2019accueil</h3></div>
      ${msg && html`<div class="corps"><div class="alerte ok">${msg}</div></div>`}
      ${miens.length > 0
        ? miens.map(r => html`
          <div class="ligne">
            <div>
              <div>Avec ${r.avec}</div>
              <div class="small muted">
                ${new Date(r.debut).toLocaleString('fr-FR',
                  {weekday:'long',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'})}
                ${r.lieu ? ' · ' + r.lieu : ''}</div>
              ${r.visio && html`<a class="small" href=${r.visio} target="_blank"
                rel="noopener">Rejoindre en visioconférence ↗</a>`}
            </div>
            <button class="btn sm light" onClick=${async ()=>{
              await db.rpc('annuler_creneau', { p_creneau: r.id, p_motif: '' });
              setMsg('Rendez-vous annulé.'); charger();
            }}>Annuler</button>
          </div>`)
        : html`
          <div class="corps">
            <p class="small muted" style="margin:0 0 14px">
              Un temps d\u2019échange avec votre référent pour comprendre où vous
              pouvez agir. Choisissez ce qui vous arrange.
            </p>
            ${libres.slice(0,8).map(c => html`
              <div class="ligne" style="padding-left:0;padding-right:0">
                <div>
                  <div>${new Date(c.debut).toLocaleString('fr-FR',
                    {weekday:'long',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'})}</div>
                  <div class="small muted">Avec ${c.hote} · ${c.duree_min} min
                    ${c.lieu ? ' · ' + c.lieu : ''}${c.visio ? ' · visioconférence' : ''}</div>
                </div>
                <button class="btn sm" onClick=${async ()=>{
                  const { data } = await db.rpc('reserver_creneau', { p_creneau: c.id });
                  if (!data.ok) return setMsg(data.message);
                  setMsg('Rendez-vous confirmé.'); charger();
                }}>Réserver</button>
              </div>`)}
          </div>`}
    </div>`;
}


/* --- Distinctions -------------------------------------------------------
   Reconnaître un engagement sans attendre un palier. Une lettre de
   félicitations n'a pas besoin d'un barème.
   --------------------------------------------------------------------- */
function Distinctions({ classement, recharger, setMsg }){
  const [types, setTypes] = useState([]);
  const [recues, setRecues] = useState([]);
  const [f, setF] = useState({profil:'', type:'felicitations', motif:'', texte:'', publique:true});
  const [q, setQ] = useState('');

  const charger = useCallback(async () => {
    const [a, b] = await Promise.all([
      db.from('types_distinction').select('*').eq('actif',true).order('ordre'),
      db.from('distinctions').select('*, types_distinction(nom,couleur)')
        .is('retiree_le', null).order('decernee_le',{ascending:false}).limit(50)
    ]);
    setTypes(a.data||[]); setRecues(b.data||[]);
  }, []);
  useEffect(() => { charger(); }, [charger]);

  async function decerner(e){
    e.preventDefault();
    const { data, error } = await db.rpc('decerner_distinction', {
      p_profil: f.profil, p_type: f.type, p_motif: f.motif,
      p_texte: f.texte || null, p_publique: f.publique
    });
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data.ok) return setMsg('Erreur : ' + data.message);
    setF({profil:'', type:'felicitations', motif:'', texte:'', publique:true});
    setMsg('Distinction décernée.'); charger(); recharger && recharger();
  }

  const nomDe = id => (classement.find(c => c.profil_id === id)||{}).membre || 'Membre';
  const candidats = classement.filter(c =>
    (c.membre||'').toLowerCase().includes(q.toLowerCase()));

  return html`
    <div>
      <p class="small muted" style="margin-bottom:20px;max-width:62ch">
        Toute reconnaissance n\u2019attend pas un palier. Une distinction se
        décerne quand elle est méritée, quelle que soit la place au classement —
        et elle bonifie le total de points de son titulaire.
      </p>

      <form onSubmit=${decerner} class="panneau" style="margin-bottom:24px">
        <div class="tete"><h3 style="font-size:17px">Décerner</h3></div>
        <div class="corps stack">
          <div class="field"><label>Membre</label>
            <input placeholder="Rechercher…" value=${q}
              onInput=${e=>setQ(e.target.value)} style="margin-bottom:8px" />
            <select required value=${f.profil}
              onChange=${e=>setF(o=>({...o,profil:e.target.value}))}>
              <option value="">Choisir…</option>
              ${candidats.slice(0,60).map(c => html`
                <option value=${c.profil_id}>${c.membre} — ${c.fonction}
                  ${c.territoire ? ' · '+c.territoire : ''}</option>`)}
            </select></div>
          <div class="field"><label>Nature</label>
            <select value=${f.type} onChange=${e=>setF(o=>({...o,type:e.target.value}))}>
              ${types.map(t => html`<option value=${t.code}>
                ${t.nom}${t.points ? ' (+' + t.points + ' points)' : ''}</option>`)}
            </select>
            ${types.find(t=>t.code===f.type) && html`
              <p class="small muted" style="margin:6px 0 0">
                ${types.find(t=>t.code===f.type).description}</p>`}
          </div>
          <div class="field"><label>Motif</label>
            <textarea required value=${f.motif} style="min-height:80px"
              onInput=${e=>setF(o=>({...o,motif:e.target.value}))}
              placeholder="Ce qui est reconnu, précisément. C\u2019est ce que la personne lira." /></div>
          <div class="field"><label>Texte de la citation</label>
            <textarea value=${f.texte}
              onInput=${e=>setF(o=>({...o,texte:e.target.value}))}
              placeholder="Facultatif — le texte lu en assemblée, s\u2019il y a lieu." /></div>
          <label class="row" style="text-transform:none;letter-spacing:0;font-size:14px;
              color:var(--nuit);margin:0;cursor:pointer">
            <input type="checkbox" style="width:auto" checked=${f.publique}
              onChange=${e=>setF(o=>({...o,publique:e.target.checked}))} />
            <span>Visible des autres membres</span>
          </label>
          <div><button class="btn">Décerner</button></div>
        </div>
      </form>

      <div class="panneau">
        <div class="tete"><h3 style="font-size:17px">Distinctions décernées</h3>
          <span class="tag">${recues.length}</span></div>
        ${recues.length === 0
          ? html`<div class="vide">Aucune distinction décernée.</div>`
          : recues.map(d => html`
            <div class="ligne" style="align-items:flex-start">
              <div style="flex:1;min-width:230px">
                <div class="row" style="gap:8px">
                  <strong>${nomDe(d.profil_id)}</strong>
                  <span class=${'tag '+((d.types_distinction||{}).couleur||'or')}>
                    ${(d.types_distinction||{}).nom || d.type}</span>
                  ${!d.publique && html`<span class="tag">Non publiée</span>`}
                </div>
                <p class="small" style="margin:8px 0 0;max-width:58ch">${d.motif}</p>
                <div class="small muted" style="margin-top:4px">
                  <span class="mono">${d.numero}</span> · ${jour(d.decernee_le)}</div>
              </div>
            </div>`)}
      </div>
    </div>`;
}

/* --- Assistance : signaler, proposer ---------------------------------- */
const NATURES_TICKET = { probleme:'Un problème', amelioration:'Une amélioration',
                         question:'Une question', donnee:'Une donnée erronée' };
const ETAT_TICKET = { ouvert:['Reçu',''], pris_en_compte:['Pris en compte','bleu'],
  en_cours:['En cours','bleu'], resolu:['Résolu','vert'],
  refuse:['Écarté','rouge'], differe:['Différé','or'] };

function Assistance({ p }){
  const [ouvert, setOuvert] = useState(false);
  const [miens, setMiens] = useState([]);
  const [f, setF] = useState({nature:'probleme', titre:'', description:'', importance:'normale'});
  const [msg, setMsg] = useState('');

  const charger = useCallback(() =>
    db.rpc('liste_tickets', { p_filtre: 'miens' }).then(({data}) => setMiens(data||[])), []);
  useEffect(() => { charger(); }, [charger]);

  async function envoyer(e){
    e.preventDefault();
    const { data, error } = await db.rpc('ouvrir_ticket', {
      p_nature: f.nature, p_titre: f.titre, p_description: f.description,
      p_page: location.hash, p_importance: f.importance
    });
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data.ok) return setMsg('Erreur : ' + data.message);
    setF({nature:'probleme', titre:'', description:'', importance:'normale'});
    setOuvert(false); setMsg('Merci. Votre signalement est transmis.');
    charger();
  }

  return html`
    <div class="panneau" style="margin-top:24px">
      <div class="tete">
        <div class="row" style="gap:8px">
          <h3 style="font-size:17px">Signaler ou proposer</h3>
          <${Info} texte="Un bug, une lenteur, une idée d'amélioration, une donnée fausse : dites-le. C'est lu, et vous verrez la réponse ici." />
        </div>
        <button class="btn sm light" onClick=${()=>setOuvert(o=>!o)}>
          ${ouvert ? 'Annuler' : 'Nouveau signalement'}</button>
      </div>
      ${msg && html`<div class="corps"><div class=${'alerte '+
        (msg.startsWith('Erreur')?'err':'ok')}>${msg}</div></div>`}

      ${ouvert && html`
        <form onSubmit=${envoyer} class="corps stack">
          <div class="row" style="gap:16px;align-items:flex-start">
            <div class="field" style="flex:1;min-width:170px;margin:0"><label>Nature</label>
              <select value=${f.nature} onChange=${e=>setF(o=>({...o,nature:e.target.value}))}>
                ${Object.entries(NATURES_TICKET).map(([k,v]) =>
                  html`<option value=${k}>${v}</option>`)}
              </select></div>
            <div class="field" style="flex:1;min-width:150px;margin:0"><label>Importance</label>
              <select value=${f.importance}
                onChange=${e=>setF(o=>({...o,importance:e.target.value}))}>
                <option value="basse">Peut attendre</option>
                <option value="normale">Normale</option>
                <option value="haute">Gênant au quotidien</option>
              </select></div>
          </div>
          <div class="field"><label>En une ligne</label>
            <input required value=${f.titre}
              onInput=${e=>setF(o=>({...o,titre:e.target.value}))} /></div>
          <div class="field"><label>Ce qui s\u2019est passé, ou ce que vous proposez</label>
            <textarea required value=${f.description} style="min-height:110px"
              onInput=${e=>setF(o=>({...o,description:e.target.value}))}
              placeholder="Si c\u2019est un problème : ce que vous faisiez, ce qui devait arriver, ce qui est arrivé." /></div>
          <div><button class="btn">Transmettre</button></div>
          <p class="small muted">La page où vous vous trouvez est jointe automatiquement.</p>
        </form>`}

      ${miens.length > 0 && html`
        <div>
          ${miens.slice(0,8).map(t => html`
            <div class="ligne">
              <div style="flex:1;min-width:200px">
                <div>${t.titre}</div>
                <div class="small muted">
                  <span class="mono">${t.reference}</span> · ${jour(t.cree_le)}
                  ${t.assigne ? ' · suivi par ' + t.assigne : ''}
                </div>
                ${t.reponse && html`<div class="small" style="margin-top:6px;
                  padding:8px;background:var(--papier);border-radius:2px">${t.reponse}</div>`}
              </div>
              <span class=${'tag '+(ETAT_TICKET[t.statut]||['',''])[1]}>
                ${(ETAT_TICKET[t.statut]||[t.statut,''])[0]}</span>
            </div>`)}
        </div>`}
    </div>`;
}

/* --- Assistance, côté pilotage ---------------------------------------- */
function AssistanceAdmin({ setMsg }){
  const [liste, setListe] = useState([]);
  const [filtre, setFiltre] = useState('ouverts');
  const [gens, setGens] = useState([]);

  const charger = useCallback(async () => {
    const [a, b] = await Promise.all([
      db.rpc('liste_tickets', { p_filtre: filtre }),
      db.from('v_annuaire').select('id,prenom,nom').eq('statut','actif').order('nom')
    ]);
    setListe(a.data||[]); setGens(b.data||[]);
  }, [filtre]);
  useEffect(() => { charger(); }, [charger]);

  async function traiter(t, champs){
    const { data, error } = await db.rpc('traiter_ticket', {
      p_id: t.id, p_statut: champs.statut || null, p_assigne: champs.assigne || null,
      p_echeance: champs.echeance || null, p_importance: champs.importance || null,
      p_reponse: champs.reponse || null
    });
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data.ok) return setMsg('Erreur : ' + data.message);
    charger();
  }

  return html`
    <div class="panneau" style="margin-bottom:24px">
      <div class="tete">
        <h3 style="font-size:17px">Signalements et propositions</h3>
        <div class="row">
          <select style="width:auto" value=${filtre} onChange=${e=>setFiltre(e.target.value)}>
            <option value="ouverts">En cours</option>
            <option value="assignes">Qui me sont assignés</option>
            <option value="tous">Tous</option>
          </select>
          <span class="tag">${liste.length}</span>
        </div>
      </div>
      ${liste.length === 0
        ? html`<div class="vide">Aucun signalement.</div>`
        : html`<div style="overflow-x:auto">
            <table>
              <thead><tr><th>Signalement</th><th>Par</th><th>Assigné à</th>
                <th>Échéance</th><th>Importance</th><th>État</th><th></th></tr></thead>
              <tbody>
                ${liste.map(t => html`
                  <tr>
                    <td style="max-width:280px">
                      <div>${t.titre}</div>
                      <div class="small muted">${NATURES_TICKET[t.nature]||t.nature}
                        · <span class="mono">${t.reference}</span>
                        ${t.page ? ' · ' + t.page : ''}</div>
                      <div class="small muted" style="margin-top:4px;white-space:pre-wrap">
                        ${t.description}</div>
                    </td>
                    <td class="small">${t.auteur}
                      <div class="mono muted">${t.auteur_matricule}</div></td>
                    <td>
                      <select value=${t.assigne_id||''} style="min-width:130px"
                        onChange=${e=>traiter(t,{assigne:e.target.value||null,
                          statut: e.target.value ? 'pris_en_compte' : null})}>
                        <option value="">—</option>
                        ${gens.map(g => html`<option value=${g.id}>${nomComplet(g)}</option>`)}
                      </select></td>
                    <td>
                      <input type="date" defaultValue=${t.echeance||''} style="min-width:130px"
                        onBlur=${e=>traiter(t,{echeance:e.target.value||null})} />
                      ${t.retard && html`<div class="small"
                        style="color:var(--bordeaux)">En retard</div>`}</td>
                    <td>
                      <select value=${t.importance} style="min-width:110px"
                        onChange=${e=>traiter(t,{importance:e.target.value})}>
                        <option value="basse">Basse</option>
                        <option value="normale">Normale</option>
                        <option value="haute">Haute</option>
                        <option value="bloquante">Bloquante</option>
                      </select></td>
                    <td>
                      <select value=${t.statut} style="min-width:130px"
                        onChange=${e=>{
                          const st = e.target.value;
                          if (st === 'refuse' || st === 'differe'){
                            const r = prompt('Expliquez à la personne qui a signalé (obligatoire)');
                            if (!r) return charger();
                            return traiter(t,{statut:st, reponse:r});
                          }
                          traiter(t,{statut:st});
                        }}>
                        ${Object.entries(ETAT_TICKET).map(([k,v]) =>
                          html`<option value=${k}>${v[0]}</option>`)}
                      </select></td>
                    <td>
                      <button class="btn sm light" onClick=${()=>{
                        const r = prompt('Réponse à la personne', t.reponse||'');
                        if (r !== null) traiter(t,{reponse:r});
                      }}>Répondre</button></td>
                  </tr>`)}
              </tbody>
            </table>
          </div>`}
    </div>`;
}

/* --- Conformité des élections ----------------------------------------- */
function Conformite({ p }){
  const [cands, setCands] = useState([]);
  const [scrutins, setScrutins] = useState([]);
  const [archives, setArchives] = useState([]);
  const [onglet, setOnglet] = useState('candidatures');
  const [msg, setMsg] = useState('');

  const charger = useCallback(async () => {
    const [a,b,c] = await Promise.all([
      db.rpc('conformite_a_traiter'),
      db.rpc('scrutins_a_arreter'),
      db.rpc('archives_electorales', { p_territoire: null })
    ]);
    setCands(a.data||[]); setScrutins(b.data||[]); setArchives(c.data||[]);
  }, []);
  useEffect(() => { charger(); }, [charger]);

  async function examiner(c, ok){
    const motif = ok ? null : prompt('Motif de l\u2019irrecevabilité (obligatoire)');
    if (!ok && !motif) return;
    const { data, error } = await db.rpc('examiner_candidature',
      { p_id: c.candidature_id, p_recevable: ok, p_motif: motif });
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data.ok) return setMsg('Erreur : ' + data.message);
    setMsg('Décision enregistrée et transmise à l\u2019administrateur.'); charger();
  }

  async function phase(s, st){
    const { data, error } = await db.rpc('changer_phase_assemblee',
      { p_assemblee: s.assemblee_id, p_statut: st });
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data.ok) return setMsg('Erreur : ' + data.message);
    setMsg('Phase modifiée.'); charger();
  }

  const aFaire = scrutins.filter(s => s.action);

  return html`
    <div>
      <div class="eyebrow">Conformité des élections</div>
      <h1 style="margin:6px 0 8px">Contrôle des scrutins</h1>
      <p class="muted" style="max-width:60ch">
        La recevabilité des candidatures, l\u2019ouverture et la clôture du scrutin,
        la proclamation : chacune de ces décisions est inscrite au registre des
        actes et remonte à l\u2019administrateur.
      </p>
      ${msg && html`<div class=${'alerte '+(msg.startsWith('Erreur')?'err':'ok')}
        style="margin-top:16px">${msg}</div>`}

      <div class="chiffres" style="margin:24px 0">
        <div><div class="n" style="font-size:30px">${cands.length}</div>
          <div class="l">Candidatures à examiner</div></div>
        <div><div class="n" style="font-size:30px">${aFaire.length}</div>
          <div class="l">Scrutins en attente</div></div>
        <div><div class="n" style="font-size:30px">${archives.length}</div>
          <div class="l">Scrutins archivés</div></div>
        <div><div class="n" style="font-size:30px">
          ${cands.filter(c => c.jours_avant_cloture !== null
            && c.jours_avant_cloture <= 3).length}</div>
          <div class="l">Clôture imminente</div></div>
      </div>

      <div class="row" style="margin:0 0 24px;gap:0;border-bottom:1px solid var(--filet)">
        ${[['candidatures','Candidatures'],['scrutins','Scrutins'],['archives','Archives']]
          .map(([k,t]) => html`
          <button class="btn light" style=${'border:0;border-bottom:2px solid '+
            (onglet===k?'var(--bordeaux)':'transparent')+';border-radius:0;background:transparent'}
            onClick=${()=>setOnglet(k)}>${t}</button>`)}
      </div>

      ${onglet === 'candidatures' && html`
        <div class="panneau">
          ${cands.length === 0
            ? html`<div class="vide">Aucune candidature en attente d\u2019examen.</div>`
            : cands.map(c => html`
              <div class="ligne" style="align-items:flex-start">
                <div style="flex:1;min-width:250px">
                  <div class="row" style="gap:8px">
                    <strong>${c.candidat}</strong>
                    <span class="tag">${c.poste_nom}</span>
                    ${c.jours_avant_cloture !== null && c.jours_avant_cloture <= 3 && html`
                      <span class="tag rouge">
                        ${c.jours_avant_cloture < 0 ? 'Clôture passée'
                          : 'Clôture dans ' + c.jours_avant_cloture + ' j'}</span>`}
                  </div>
                  <div class="small muted" style="margin-top:4px">
                    <span class="mono">${c.matricule}</span> · ${c.assemblee}
                    · ${c.territoire||''}
                    · déposée le ${jour(c.depose_le)}
                  </div>
                  <p class="small" style="margin:8px 0 0;white-space:pre-wrap;max-width:58ch">
                    ${c.profession_foi}</p>
                </div>
                <div class="row">
                  <button class="btn sm" onClick=${()=>examiner(c,true)}>Recevable</button>
                  <button class="btn sm light" onClick=${()=>examiner(c,false)}>Écarter</button>
                </div>
              </div>`)}
        </div>`}

      ${onglet === 'scrutins' && html`
        <div class="panneau">
          ${scrutins.length === 0
            ? html`<div class="vide">Aucun scrutin en cours.</div>`
            : scrutins.map(sc => html`
              <div class="ligne">
                <div style="flex:1;min-width:240px">
                  <div>${sc.titre}</div>
                  <div class="small muted">
                    <span class="mono">${sc.reference}</span> · ${sc.territoire||''}
                    · ${jour(sc.date_tenue)}
                  </div>
                  <div class="small muted">
                    ${sc.candidatures_a_examiner} à examiner ·
                    ${sc.recevables} recevable${sc.recevables>1?'s':''}
                    ${sc.inscrits ? ' · ' + sc.votants + '/' + sc.inscrits + ' votants' : ''}
                  </div>
                </div>
                <div class="row">
                  ${sc.action && html`<span class="tag or">${sc.action}</span>`}
                  ${sc.statut === 'candidatures' && sc.recevables > 0 && html`
                    <button class="btn sm" onClick=${()=>phase(sc,'scrutin')}>
                      Ouvrir le scrutin</button>`}
                  ${sc.statut === 'scrutin' && html`
                    <button class="btn sm" onClick=${()=>phase(sc,'depouillement')}>
                      Clore</button>`}
                  <a class="btn sm light" href="#/espace/assemblees">Ouvrir</a>
                </div>
              </div>`)}
        </div>`}

      ${onglet === 'archives' && html`<${ArchivesElectorales} archives=${archives} />`}
    </div>`;
}

              <div class="ligne" style="cursor:pointer;border:0"

                <div style="flex:1;min-width:230px">

                  </div>
                  <div class="small muted">
                    <span class="mono">${a.reference}</span> · ${a.territoire||''}

                    <div class="spread small" style="padding:4px 0">

                </div>`}
            </div>`)}
      </div>
    </div>`;

/* --- Insigne -----------------------------------------------------------
   Une distinction n'a de sens que portée. L'insigne accompagne le nom
   partout où il apparaît : conversations, annuaire, groupes.
   --------------------------------------------------------------------- */
function Insigne({ ins, compact }){
  if (!ins) return null;
  return html`
    <span class="row" style="gap:5px;display:inline-flex;vertical-align:middle">
      <span class="insigne" title=${'Échelon ' + ins.echelon + ' — ' + (ins.echelon_nom||'')}>

/* --- Intérim -------------------------------------------------------- */
function Interims({ p, setMsg }){
  const [liste, setListe] = useState([]);
  const [gens, setGens] = useState([]);
  const [mesPostes, setMesPostes] = useState([]);
  const [ouvert, setOuvert] = useState(false);
  const [f, setF] = useState({interimaire:'', poste:'', debut:'', fin:'', motif:''});

  const charger = useCallback(async () => {
    const [a,b] = await Promise.all([
      db.rpc('mes_interims'),
      db.from('v_annuaire').select('id,prenom,nom,fonction_nom')
        .eq('statut','actif').order('nom')
    ]);
    setListe(a.data||[]); setGens((b.data||[]).filter(x => x.id !== p.id));
    setMesPostes(p.postes || []);
  }, [p]);
  useEffect(() => { charger(); }, [charger]);

  async function confier(e){
    e.preventDefault();
    const { data, error } = await db.rpc('confier_interim', {
      p_interimaire: f.interimaire, p_poste: f.poste,
      p_debut: f.debut || null, p_fin: f.fin, p_motif: f.motif
    });
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data.ok) return setMsg('Erreur : ' + data.message);
    setF({interimaire:'', poste:'', debut:'', fin:'', motif:''}); setOuvert(false);
    setMsg('Intérim proposé. Il prendra effet dès acceptation.'); charger();
  }

  async function repondre(x, ok){
    const { data, error } = await db.rpc('repondre_interim', { p_id: x.id, p_accepte: ok });
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data.ok) return setMsg('Erreur : ' + data.message);
    setMsg(ok ? 'Intérim accepté.' : 'Intérim décliné.'); charger();
  }

  const proposes = liste.filter(x => x.statut === 'propose' && x.je_suis_interimaire);
  const codes = { propose:['Proposé','bleu'], en_cours:['En cours','vert'],
    a_venir:['À venir',''], echu:['Échu',''], clos:['Clos',''], refuse:['Décliné','rouge'] };

  return html`
    <div>
      <p class="small muted" style="margin-bottom:16px;max-width:62ch">
        Un intérim délègue un poste pour une durée limitée. L\u2019intérimaire
        exerce les droits du poste, mais il agit visiblement au nom du
        titulaire — et cela figure au registre. Six mois maximum : au-delà,
        il faut nommer.
      </p>

      ${proposes.length > 0 && html`
        <div class="panneau" style="margin-bottom:24px;border-color:var(--action)">
          <div class="tete" style="border-bottom-color:var(--action)">
            <h3 style="font-size:17px">Un intérim vous est proposé</h3></div>
          ${proposes.map(x => html`
            <div class="ligne">
              <div>
                <div><strong>${x.poste_nom}</strong> au nom de ${x.titulaire}</div>
                <div class="small muted">Du ${jour(x.debut)} au ${jour(x.fin)}
                  · ${x.motif}</div>
              </div>
              <div class="row">
                <button class="btn sm" onClick=${()=>repondre(x,true)}>Accepter</button>
                <button class="btn sm light" onClick=${()=>repondre(x,false)}>Décliner</button>
              </div>
            </div>`)}
        </div>`}

      ${mesPostes.length > 0 && html`
        <div class="spread" style="margin-bottom:16px">
          <span class="small muted">Vous occupez ${mesPostes.length} poste${mesPostes.length>1?'s':''}</span>
          <button class="btn sm" onClick=${()=>setOuvert(o=>!o)}>
            ${ouvert ? 'Annuler' : 'Confier un intérim'}</button>
        </div>`}

      ${ouvert && html`
        <form onSubmit=${confier} class="panneau" style="margin-bottom:24px">
          <div class="corps stack">
            <div class="field"><label>Poste à déléguer</label>
              <select required value=${f.poste}
                onChange=${e=>setF(o=>({...o,poste:e.target.value}))}>
                <option value="">Choisir…</option>
                ${mesPostes.map(x => html`<option value=${x.poste}>${x.nom}</option>`)}
              </select></div>
            <div class="field"><label>À qui</label>
              <select required value=${f.interimaire}
                onChange=${e=>setF(o=>({...o,interimaire:e.target.value}))}>
                <option value="">Choisir…</option>
                ${gens.map(g => html`<option value=${g.id}>
                  ${nomComplet(g)} — ${g.fonction_nom}</option>`)}
              </select></div>
            <div class="row" style="gap:16px;align-items:flex-start">
              <div class="field" style="flex:1;min-width:150px;margin:0"><label>Du</label>
                <input type="date" value=${f.debut}
                  onInput=${e=>setF(o=>({...o,debut:e.target.value}))} /></div>
              <div class="field" style="flex:1;min-width:150px;margin:0"><label>Au</label>
                <input type="date" required value=${f.fin}
                  onInput=${e=>setF(o=>({...o,fin:e.target.value}))} /></div>
            </div>
            <div class="field"><label>Motif</label>
              <input required value=${f.motif}
                onInput=${e=>setF(o=>({...o,motif:e.target.value}))}
                placeholder="Congé, mission à l\u2019étranger, arrêt…" /></div>
            <div><button class="btn">Proposer</button></div>
          </div>
        </form>`}

      <div class="panneau">
        <div class="tete"><h3 style="font-size:17px">Intérims</h3>
          <span class="tag">${liste.length}</span></div>
        ${liste.length === 0
          ? html`<div class="vide">Aucun intérim.</div>`
          : liste.map(x => html`
            <div class="ligne">
              <div style="flex:1;min-width:220px">
                <div>${x.poste_nom}</div>
                <div class="small muted">
                  ${x.interimaire} au nom de ${x.titulaire}
                  · du ${jour(x.debut)} au ${jour(x.fin)}
                  ${x.statut === 'en_cours' && x.jours_restants >= 0
                    ? ' · ' + x.jours_restants + ' jours restants' : ''}
                </div>
                <div class="small muted">${x.motif}</div>
              </div>
              <div class="row">
                <span class=${'tag '+(codes[x.statut]||['',''])[1]}>
                  ${(codes[x.statut]||[x.statut,''])[0]}</span>
                ${x.statut === 'en_cours' && !x.je_suis_interimaire && html`
                  <button class="btn sm light" onClick=${async ()=>{
                    await db.rpc('clore_interim', { p_id: x.id });
                    setMsg('Intérim clos.'); charger();
                  }}>Clore</button>`}
              </div>
            </div>`)}
      </div>
    </div>`;
}

/* --- Suivi des virements, côté direction financière ------------------- */
function SuiviVirements({ setMsg }){
  const [liste, setListe] = useState([]);
  const charger = useCallback(() =>
    db.rpc('virements_a_suivre').then(({data}) => setListe(data||[])), []);
  useEffect(() => { charger(); }, [charger]);

  async function attestation(x, fichier){
    if (!fichier) return;
    try {
      if (fichier.size > 5 * 1024 * 1024) throw new Error('5 Mo maximum.');
      const ext = fichier.name.split('.').pop();
      const chemin = x.deposant_id + '/attestation-' + x.note_id + '.' + ext;
      const { error: e1 } = await db.storage.from('justificatifs').upload(chemin, fichier,
        { upsert: true });
      if (e1) throw e1;
      const { data, error } = await db.rpc('deposer_attestation',
        { p_note: x.note_id, p_fichier: chemin });
      if (error) throw error;
      if (!data.ok) throw new Error(data.message);
      setMsg('Attestation déposée. Le donateur peut la télécharger.'); charger();
    } catch (err){ setMsg('Erreur : ' + (err.message||'dépôt impossible')); }
  }

  const etats = {
    conteste:['Contesté','rouge'], sans_reponse:['Sans réponse depuis 15 j','or'],
    attestation_manquante:['Attestation à déposer','or'],
    en_attente:['En attente d\u2019accusé',''], accuse:['Reçu','vert']
  };
  const urgents = liste.filter(x => x.etat === 'conteste' || x.etat === 'sans_reponse');

  return html`
    <div>
      ${urgents.length > 0 && html`
        <div class="alerte err" style="margin-bottom:16px">
          ${urgents.length} paiement${urgents.length>1?'s':''} appelle
          ${urgents.length>1?'nt':''} une vérification.
        </div>`}
      <div class="panneau">
        ${liste.length === 0
          ? html`<div class="vide">Tous les paiements sont confirmés.</div>`
          : liste.map(x => html`
            <div class="ligne" style=${x.etat==='conteste'
              ? 'border-left:3px solid var(--bordeaux)' : ''}>
              <div style="flex:1;min-width:230px">
                <div class="row" style="gap:8px">
                  <span>${x.objet}</span>
                  <span class=${'tag '+(etats[x.etat]||['',''])[1]}>
                    ${(etats[x.etat]||[x.etat,''])[0]}</span>
                </div>
                <div class="small muted">
                  ${x.deposant} · <span class="mono">${x.reference}</span>
                  · ${EURO(x.total)}
                  · payé le ${jour(x.payee_le)} (il y a ${x.jours} j)
                  · ${x.mode === 'abandon_creance' ? 'abandon de créance' : 'virement'}
                </div>
                ${x.motif_contestation && html`
                  <div class="small" style="color:var(--bordeaux);margin-top:6px">
                    « ${x.motif_contestation} »</div>`}
              </div>
              <div class="row">
                ${x.mode === 'abandon_creance' && !x.attestation && html`
                  <label class="btn sm" style="margin:0;cursor:pointer;
                      text-transform:none;letter-spacing:.02em">
                    Déposer l\u2019attestation
                    <input type="file" accept=".pdf,image/*" style="display:none"
                      onChange=${e=>attestation(x, e.target.files[0])} />
                  </label>`}
                ${x.attestation && html`<span class="tag vert">Attestation déposée</span>`}
              </div>
            </div>`)}
      </div>
    </div>`;
}

/* --- Confirmer un virement, côté membre ------------------------------- */
function MesVirements(){
  const [liste, setListe] = useState([]);
  const [msg, setMsg] = useState('');
  const charger = useCallback(() =>
    db.rpc('mes_virements_a_confirmer').then(({data}) => setListe(data||[])), []);
  useEffect(() => { charger(); }, [charger]);
  if (liste.length === 0) return null;

  async function repondre(x, recu){
    const motif = recu ? null : prompt(
      'Que se passe-t-il ?\n\nMontant incorrect, virement non reçu, autre — précisez.');
    if (!recu && !motif) return;
    const { data, error } = await db.rpc('accuser_virement',
      { p_note: x.note_id, p_recu: recu, p_motif: motif });
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data.ok) return setMsg('Erreur : ' + data.message);
    setMsg(recu ? 'Merci de votre confirmation.'
                : 'Signalement transmis à la direction financière.');
    charger();
  }

  async function telecharger(chemin){
    const { data, error } = await db.storage.from('justificatifs')
      .createSignedUrl(chemin, 300);
    if (error) return setMsg('Document introuvable.');
    window.open(data.signedUrl, '_blank', 'noopener');
  }

  return html`
    <div class="panneau" style="margin-bottom:24px;border-left:3px solid var(--action)">
      <div class="tete"><h3 style="font-size:17px">Paiements à confirmer</h3>
        <span class="tag bleu">${liste.length}</span></div>
      ${msg && html`<div class="corps"><div class=${'alerte '+
        (msg.startsWith('Erreur')?'err':'ok')}>${msg}</div></div>`}
      ${liste.map(x => html`
        <div class="ligne">
          <div style="flex:1;min-width:220px">
            <div>${x.objet} — <span class="mono">${EURO(x.total)}</span></div>
            <div class="small muted">
              <span class="mono">${x.reference}</span>
              · ${x.mode === 'abandon_creance' ? 'abandon de créance' : 'virement'}
              ${x.reference_paiement ? ' · réf. ' + x.reference_paiement : ''}
              · émis le ${jour(x.payee_le)}
              ${x.jours > 15 ? ' — il y a ' + x.jours + ' jours' : ''}
            </div>
            ${x.recu_fiscal && html`<div class="small muted">
              Reçu fiscal ${x.recu_fiscal}</div>`}
          </div>
          <div class="row">
            ${x.attestation && html`<button class="btn sm light"
              onClick=${()=>telecharger(x.attestation)}>Attestation</button>`}
            ${x.mode === 'virement'
              ? html`
                <button class="btn sm" onClick=${()=>repondre(x,true)}>
                  J\u2019ai bien reçu</button>
                <button class="btn sm light" onClick=${()=>repondre(x,false)}>
                  Signaler un problème</button>`
              : html`<button class="btn sm" onClick=${()=>repondre(x,true)}>
                  J\u2019en prends acte</button>`}
          </div>
        </div>`)}
    </div>`;
}

function ProjetsComite({ c, p, recharger, setMsg }){
  const [ouvert, setOuvert] = useState(false);
  const [f, setF] = useState({titre:'', objet:'', lieu:'', debut:'', fin:'',
                              statut:'idee', avancement:'0', public:'', partenaires:''});

  async function enregistrer(e){
    e.preventDefault();
    const { data, error } = await db.rpc('enregistrer_projet', {
      p_id: null, p_titre: f.titre, p_objet: f.objet || null,
      p_lieu: f.lieu || null, p_debut: f.debut || null, p_fin: f.fin || null,
      p_statut: f.statut, p_avancement: Number(f.avancement||0),
      p_public: f.public || null, p_partenaires: f.partenaires || null,
      p_budget: null, p_territoire: null
    });
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data.ok) return setMsg('Erreur : ' + data.message);
    setF({titre:'', objet:'', lieu:'', debut:'', fin:'', statut:'idee',
          avancement:'0', public:'', partenaires:''});
    setOuvert(false); setMsg('Projet créé.'); recharger();
  }

  async function avancer(pj, val){
    await db.rpc('enregistrer_projet', {
      p_id: pj.id, p_titre: pj.titre, p_objet: pj.objet, p_lieu: pj.lieu,
      p_debut: pj.debut, p_fin: pj.fin, p_statut: pj.statut,
      p_avancement: Number(val), p_public: null, p_partenaires: null,
      p_budget: null, p_territoire: null
    });
    recharger();
  }

  const peutCreer = p.niveau >= 40 || c.je_pilote;

  return html`
    <div>
      ${peutCreer && html`
        <div class="spread" style="margin-bottom:16px">
          <span class="small muted">${(c.projets||[]).length} projet(s)</span>
          <button class="btn sm" onClick=${()=>setOuvert(o=>!o)}>
            ${ouvert ? 'Annuler' : 'Nouveau projet'}</button>
        </div>`}

      ${ouvert && html`
        <form onSubmit=${enregistrer} class="panneau" style="margin-bottom:24px">
          <div class="corps stack">
            <div class="field"><label>Intitulé</label>
              <input required value=${f.titre}
                onInput=${e=>setF(o=>({...o,titre:e.target.value}))} /></div>
            <div class="field"><label>De quoi s\u2019agit-il</label>
              <textarea value=${f.objet}
                onInput=${e=>setF(o=>({...o,objet:e.target.value}))} /></div>
            <div class="row" style="gap:16px;align-items:flex-start">
              <div class="field" style="flex:1;min-width:160px;margin:0"><label>Lieu</label>
                <input value=${f.lieu} onInput=${e=>setF(o=>({...o,lieu:e.target.value}))} /></div>
              <div class="field" style="flex:1;min-width:140px;margin:0"><label>Début</label>
                <input type="date" value=${f.debut}
                  onInput=${e=>setF(o=>({...o,debut:e.target.value}))} /></div>
              <div class="field" style="flex:1;min-width:140px;margin:0"><label>Fin</label>
                <input type="date" value=${f.fin}
                  onInput=${e=>setF(o=>({...o,fin:e.target.value}))} /></div>
            </div>
            <div class="field"><label>Public visé</label>
              <input value=${f.public} placeholder="Collégiens, quartier des Tilleuls…"
                onInput=${e=>setF(o=>({...o,public:e.target.value}))} /></div>
            <div class="field"><label>Partenaires</label>
              <input value=${f.partenaires}
                onInput=${e=>setF(o=>({...o,partenaires:e.target.value}))} /></div>
            <div class="field"><label>État</label>
              <select value=${f.statut} onChange=${e=>setF(o=>({...o,statut:e.target.value}))}>
                ${Object.entries(STATUT_PROJET).filter(([k])=>k!=='abandonne')
                  .map(([k,v]) => html`<option value=${k}>${v[0]}</option>`)}
              </select></div>
            <div><button class="btn">Créer</button></div>
          </div>
        </form>`}

      <div class="panneau">
        ${(c.projets||[]).length === 0
          ? html`<div class="vide">Aucun projet. C\u2019est peut-être le moment
              d\u2019en proposer un.</div>`
          : (c.projets||[]).map(pj => html`
            <div class="ligne" style="align-items:flex-start">
              <div style="flex:1;min-width:240px">
                <div class="row" style="gap:8px">
                  <strong>${pj.titre}</strong>
                  <span class=${'tag '+(STATUT_PROJET[pj.statut]||['',''])[1]}>
                    ${(STATUT_PROJET[pj.statut]||[pj.statut,''])[0]}</span>
                </div>
                ${pj.objet && html`<div class="small muted"
                  style="margin-top:4px;max-width:56ch">${pj.objet}</div>`}
                <div class="small muted" style="margin-top:4px">
                  <span class="mono">${pj.reference}</span>
                  ${pj.responsable ? ' · ' + pj.responsable : ''}
                  ${pj.lieu ? ' · ' + pj.lieu : ''}
                  ${pj.debut ? ' · ' + jour(pj.debut) : ''}
                  · ${pj.participants} participant${pj.participants>1?'s':''}
                </div>
                <div class="row" style="margin-top:10px;gap:10px;align-items:center">
                  <div class="jauge" style="flex:1;max-width:180px;margin:0">
                    <i style=${'width:'+pj.avancement+'%;background:var(--valide)'}></i></div>
                  ${c.je_pilote
                    ? html`<input type="range" min="0" max="100" step="10"
                        value=${pj.avancement} style="width:140px;padding:0;
                        accent-color:var(--valide)"
                        onChange=${e=>avancer(pj, e.target.value)} />`
                    : ''}
                  <span class="mono small">${pj.avancement} %</span>
                </div>
              </div>
              <button class=${'btn sm '+(pj.je_participe?'light':'')}
                onClick=${async ()=>{
                  await db.rpc('rejoindre_projet', { p_projet: pj.id, p_role: 'participant' });
                  recharger();
                }}>${pj.je_participe ? 'Je me retire' : 'Je participe'}</button>
            </div>`)}
      </div>
    </div>`;
}

function PropositionsComite({ c, recharger, setMsg }){
  const [ouvert, setOuvert] = useState(false);
  const [f, setF] = useState({titre:'', description:'', besoin:'', public:''});

  async function envoyer(e){
    e.preventDefault();
    const { data, error } = await db.rpc('proposer', {
      p_titre: f.titre, p_description: f.description,
      p_besoin: f.besoin || null, p_public: f.public || null
    });
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data.ok) return setMsg('Erreur : ' + data.message);
    setF({titre:'', description:'', besoin:'', public:''});
    setOuvert(false); setMsg('Proposition déposée. Votre responsable local vous répondra.');
    recharger();
  }

  async function soutenir(pr){
    await db.rpc('soutenir', { p_proposition: pr.id });
    recharger();
  }

  async function statuer(pr, statut){
    const reponse = prompt(statut === 'ecartee'
      ? 'Expliquez à l\u2019auteur pourquoi (obligatoire)'
      : 'Votre réponse à l\u2019auteur (obligatoire)');
    if (!reponse) return;
    const projet = statut === 'retenue'
      && confirm('Créer un projet à partir de cette proposition ?');
    const { data, error } = await db.rpc('statuer_proposition', {
      p_id: pr.id, p_statut: statut, p_reponse: reponse, p_creer_projet: projet
    });
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data.ok) return setMsg('Erreur : ' + data.message);
    setMsg(data.projet_id ? 'Proposition retenue et projet créé.' : 'Réponse enregistrée.');
    recharger();
  }

  async function remonter(pr){
    const motif = prompt(
      'Pourquoi cette idée mérite-t-elle d\u2019être généralisée ? (obligatoire)');
    if (!motif) return;
    const { data, error } = await db.rpc('faire_remonter', { p_id: pr.id, p_motif: motif });
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data.ok) return setMsg('Erreur : ' + data.message);
    setMsg('Proposition transmise au national.'); recharger();
  }

  const props = c.propositions || [];

  return html`
    <div>
      <div class="spread" style="margin-bottom:16px">
        <p class="small muted" style="margin:0;max-width:44ch">
          Une idée pour votre territoire ? Proposez-la. Votre responsable local
          vous répondra, et ce qui mérite d\u2019être généralisé remonte au national.
        </p>
        <button class="btn" onClick=${()=>setOuvert(o=>!o)}>
          ${ouvert ? 'Annuler' : 'Proposer une idée'}</button>
      </div>

      ${ouvert && html`
        <form onSubmit=${envoyer} class="panneau" style="margin-bottom:24px">
          <div class="corps stack">
            <div class="field"><label>Votre idée, en une ligne</label>
              <input required value=${f.titre}
                onInput=${e=>setF(o=>({...o,titre:e.target.value}))}
                placeholder="Un atelier d\u2019éducation aux médias au collège Voltaire" /></div>
            <div class="field"><label>Ce que vous proposez</label>
              <textarea required value=${f.description} style="min-height:110px"
                onInput=${e=>setF(o=>({...o,description:e.target.value}))} /></div>
            <div class="field"><label>À qui cela s\u2019adresse</label>
              <input value=${f.public}
                onInput=${e=>setF(o=>({...o,public:e.target.value}))} /></div>
            <div class="field"><label>Ce qu\u2019il faudrait</label>
              <textarea value=${f.besoin}
                onInput=${e=>setF(o=>({...o,besoin:e.target.value}))}
                placeholder="Des bénévoles, une salle, un partenariat…" /></div>
            <div><button class="btn">Déposer</button></div>
          </div>
        </form>`}

      <div class="panneau">
        ${props.length === 0
          ? html`<div class="vide">Aucune proposition. Lancez-vous.</div>`
          : props.map(pr => html`
            <div class="ligne" style="align-items:flex-start">
              <button class=${'btn sm '+(pr.je_soutiens?'':'light')}
                style="flex-direction:column;min-width:56px;padding:8px 6px"
                onClick=${()=>soutenir(pr)}>
                <span style="font-family:var(--titre);font-weight:900;font-size:17px;
                  display:block;line-height:1">${pr.soutiens}</span>
                <span style="font-size:9.5px;letter-spacing:.04em">
                  ${pr.je_soutiens ? 'soutenu' : 'soutenir'}</span>
              </button>

              <div style="flex:1;min-width:230px">
                <div class="row" style="gap:8px">
                  <strong>${pr.titre}</strong>
                  <span class=${'tag '+(STATUT_PROP[pr.statut]||['',''])[1]}>
                    ${(STATUT_PROP[pr.statut]||[pr.statut,''])[0]}</span>
                  ${pr.mienne && html`<span class="tag bleu">La vôtre</span>`}
                </div>
                <p class="small" style="margin:8px 0 0;max-width:58ch">${pr.description}</p>
                ${pr.besoin && html`<p class="small muted" style="margin:6px 0 0">
                  Il faudrait : ${pr.besoin}</p>`}
                <div class="small muted" style="margin-top:6px">
                  ${pr.auteur} · ${jour(pr.cree_le)}
                  · <span class="mono">${pr.reference}</span>
                </div>
                ${pr.reponse && html`
                  <div class="small" style="margin-top:10px;padding:10px;
                       background:var(--papier);border-radius:2px">
                    <strong>Réponse :</strong> ${pr.reponse}</div>`}
              </div>

              ${c.je_pilote && ['deposee','a_l_etude'].includes(pr.statut) && html`
                <div class="row" style="gap:6px">
                  <button class="btn sm" onClick=${()=>statuer(pr,'retenue')}>Retenir</button>
                  <button class="btn sm light" onClick=${()=>remonter(pr)}>
                    Faire remonter</button>
                  <button class="btn sm light" onClick=${()=>statuer(pr,'ecartee')}>
                    Écarter</button>
                </div>`}
            </div>`)}
      </div>
    </div>`;
}

/* =====================================================================
   BUDGET ET COMPTES
   Ce que la plateforme sait déjà, elle le compte. La direction ne
   saisit que ce qu'elle ignore : subventions, cotisations, dons.
   ===================================================================== */

const STATUT_EX = { prevision:['Prévision',''], vote:['Voté','bleu'],
  en_cours:['En cours','vert'], arrete:['Arrêté','or'], clos:['Clos',''] };

function Budget({ p }){
  const [exercices, setExercices] = useState([]);
  const [actif, setActif] = useState(null);
  const [b, setB] = useState(null);
  const [onglet, setOnglet] = useState('budget');
  const [sauv, setSauv] = useState(null);
  const [msg, setMsg] = useState('');

  const charger = useCallback(async () => {
    const [a, c] = await Promise.all([
      db.rpc('mes_exercices'), db.rpc('etat_sauvegardes')
    ]);
    setExercices(a.data||[]); setSauv(c.data);
    const id = actif || (a.data||[])[0]?.id;
    if (id){
      setActif(id);
      const { data } = await db.rpc('budget_exercice', { p_exercice: id });
      setB(data);
    }
  }, [actif]);
  useEffect(() => { charger(); }, [charger]);

  async function ouvrir(){
    const annee = prompt('Année de l\u2019exercice', new Date().getFullYear());
    if (!annee) return;
    const { data, error } = await db.rpc('ouvrir_exercice',
      { p_annee: Number(annee), p_territoire: null });
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data.ok) return setMsg('Erreur : ' + data.message);
    setActif(data.id); setMsg('Exercice ouvert.'); charger();
  }

  async function regler(ligne, champ, valeur){
    const { data, error } = await db.rpc('regler_ligne',
      { p_id: ligne.id, p_champ: champ, p_valeur: String(valeur) });
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data.ok) return setMsg('Erreur : ' + data.message);
    charger();
  }

  async function statut(st){
    const obs = st === 'arrete'
      ? prompt('Observations sur l\u2019arrêté des comptes (facultatif)') : null;
    const { data, error } = await db.rpc('changer_statut_exercice',
      { p_id: actif, p_statut: st, p_observations: obs });
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data.ok) return setMsg('Erreur : ' + data.message);
    setMsg('Exercice mis à jour.'); charger();
  }

  async function exporter(quoi){
    const fn = quoi === 'budget' ? 'export_budget' : 'export_depenses';
    const { data, error } = await db.rpc(fn, { p_exercice: actif });
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data || data.length === 0) return setMsg('Rien à exporter.');
    const cols = Object.keys(data[0]);
    const ech = v => {
      if (v === null || v === undefined) return '';
      const t = String(v).replace(/"/g,'""');
      return /[";\n]/.test(t) ? '"'+t+'"' : t;
    };
    const csv = '\ufeff' + cols.join(';') + '\n' +
      data.map(l => cols.map(c => ech(l[c])).join(';')).join('\n');
    const ex = exercices.find(x => x.id === actif);
    const nom = 'FFCE-' + (quoi === 'budget' ? 'budget' : 'depenses') +
      '-' + (ex ? ex.annee : '') + '.csv';
    const url = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
    const a = document.createElement('a'); a.href = url; a.download = nom; a.click();
    URL.revokeObjectURL(url);
    await db.rpc('tracer_export', { p_objet: nom, p_lignes: data.length });
    setMsg(data.length + ' ligne(s) exportées. Déposez le fichier sur le Drive.');
  }

  if (!b && exercices.length === 0) return html`
    <div>
      <div class="eyebrow">Budget et comptes</div>
      <h1 style="margin:6px 0 16px">Aucun exercice ouvert</h1>
      <p class="muted" style="max-width:56ch">
        Un exercice couvre une année civile. Une fois ouvert, les dépenses
        payées, les abandons de frais et le bénévolat valorisé s\u2019y inscrivent
        d\u2019eux-mêmes.
      </p>
      ${msg && html`<div class="alerte err" style="margin-top:16px">${msg}</div>`}
      <div style="margin-top:24px"><button class="btn" onClick=${ouvrir}>
        Ouvrir un exercice</button></div>
    </div>`;
  if (!b) return html`<div class="vide">Chargement…</div>`;

  const ex = b.exercice || {};
  const lignes = b.lignes || [];
  const produits = lignes.filter(l => l.sens === 'produit');
  const charges  = lignes.filter(l => l.sens === 'charge');
  const fige = ['arrete','clos'].includes(ex.statut);

  const bloc = (titre, liste) => {
    const cats = [...new Set(liste.map(l => l.categorie))];
    return html`
      <div class="panneau" style="margin-bottom:24px">
        <div class="tete"><h3 style="font-size:17px">${titre}</h3></div>
        <div style="overflow-x:auto">
          <table>
            <thead><tr>
              <th style="min-width:220px">Poste</th>
              <th style="text-align:right">Prévu</th>
              <th style="text-align:right">Réalisé</th>
              <th style="text-align:right">Écart</th>
              <th></th>
            </tr></thead>
            <tbody>
              ${cats.map(cat => html`
                <tr><td colspan="5" style="background:var(--papier);
                  font-family:var(--titre);font-weight:700;font-size:11px;
                  letter-spacing:.1em;text-transform:uppercase;color:var(--gris)">
                  ${cat}</td></tr>
                ${liste.filter(l => l.categorie === cat).map(l => {
                  const ecart = Number(l.realise||0) - Number(l.prevu||0);
                  return html`
                    <tr>
                      <td>
                        <div class="row" style="gap:8px">
                          <span class="mono muted">${l.poste}</span>
                          <span>${l.libelle}</span>
                          ${l.automatique && html`
                            <${Info} texte=${'Calculé automatiquement : ' + (l.source||'')} />`}
                        </div>
                        ${!fige && html`<input defaultValue=${l.intitule||''}
                          placeholder="Précision (facultatif)"
                          style="margin-top:6px;font-size:13px;padding:5px 8px"
                          onBlur=${e=>regler(l,'libelle',e.target.value)} />`}
                      </td>
                      <td style="text-align:right">
                        ${fige
                          ? html`<span class="mono">${EURO(l.prevu)}</span>`
                          : html`<input type="number" step="0.01" defaultValue=${l.prevu}
                              style="width:110px;text-align:right"
                              onBlur=${e=>regler(l,'prevu',e.target.value)} />`}
                      </td>
                      <td style="text-align:right">
                        ${l.automatique
                          ? html`<span class="mono" title="Calculé">${EURO(l.realise)}</span>`
                          : fige
                            ? html`<span class="mono">${EURO(l.realise)}</span>`
                            : html`<input type="number" step="0.01" defaultValue=${l.realise_saisi}
                                style="width:110px;text-align:right"
                                onBlur=${e=>regler(l,'realise',e.target.value)} />`}
                      </td>
                      <td style="text-align:right" class="mono"
                        style=${'text-align:right;color:'+(ecart<0?'var(--bordeaux)':'var(--gris)')}>
                        ${ecart === 0 ? '—' : EURO(ecart)}</td>
                      <td style="width:34px">
                        ${l.automatique && html`<span class="tag">auto</span>`}</td>
                    </tr>`;
                })}`)}
            </tbody>
          </table>
        </div>
      </div>`;
  };

  return html`
    <div>
      <div class="spread">
        <div>
          <div class="eyebrow">Budget et comptes</div>
          <h1 style="margin:6px 0 0">Exercice ${ex.annee || ''}</h1>
        </div>
        <div class="row">
          <select style="width:auto" value=${actif}
            onChange=${e=>{ setActif(e.target.value); setB(null); }}>
            ${exercices.map(x => html`<option value=${x.id}>
              ${x.annee}${x.territoire ? ' · '+x.territoire : ' · national'}</option>`)}
          </select>
          <button class="btn sm light" onClick=${ouvrir}>Nouvel exercice</button>
        </div>
      </div>
      ${msg && html`<div class=${'alerte '+(msg.startsWith('Erreur')?'err':'ok')}
        style="margin-top:16px">${msg}</div>`}

      ${sauv && !sauv.faite_ce_mois && html`
        <div class="alerte" style="margin-top:24px;border-left-color:var(--bordeaux)">
          <strong>Sauvegarde du mois non effectuée.</strong>
          ${sauv.derniere
            ? ' Dernière : ' + sauv.derniere.periode + ', il y a ' + sauv.jours_depuis + ' jours.'
            : ' Aucune sauvegarde n\u2019a jamais été déclarée.'}
          <button class="btn sm" style="margin-left:10px" onClick=${async ()=>{
            const ou = prompt('Où avez-vous déposé la sauvegarde ?',
              'Drive FFCE / Sauvegardes');
            if (!ou) return;
            const { data } = await db.rpc('declarer_sauvegarde',
              { p_portee: 'complete', p_emplacement: ou, p_observation: null });
            if (data?.ok){ setMsg('Sauvegarde enregistrée. Merci.'); charger(); }
          }}>C\u2019est fait</button>
        </div>`}

      <div class="chiffres" style="margin:24px 0">
        <div><div class="n" style="font-size:28px">${EURO(b.produits_realises)}</div>
          <div class="l">Produits réalisés</div></div>

            <div class="row">
              <button class="btn sm light" onClick=${()=>exporter('budget')}>

              <button class="btn sm light" onClick=${()=>exporter('depenses')}>
                Exporter les dépenses</button>
              ${!fige && html`
                <select style="width:auto" value=${ex.statut}

      ${onglet === 'synthese' && html`
        <div>
          <div class="panneau">

            <div class="ligne"><span class="muted">Total des charges</span>
              <span class="mono" style="font-size:15px">${EURO(b.charges_realisees)}</span></div>
            <div class="ligne" style="background:var(--papier)">
              <strong>Résultat de l\u2019exercice</strong>
              <span class="mono" style=${'font-size:17px;font-weight:700;color:'+
                (Number(b.resultat_realise)<0?'var(--bordeaux)':'var(--valide)')}>

            <div class="corps small muted" style="border-top:1px solid var(--filet)">
              Le bénévolat valorisé (${EURO(b.benevolat)}) figure en produit comme
              en charge, conformément au plan comptable associatif : il ne change
              pas le résultat, mais il montre le poids réel de l\u2019engagement —
              ce que tout financeur regarde.
            </div>
          </div>

          <div class="panneau" style="margin-top:24px">
            <div class="tete"><h3 style="font-size:17px">Exécution du budget</h3>
              ${b.execution !== null && html`<span class="mono">${b.execution} %</span>`}</div>
            <div class="corps">
              <div class="spread small"><span>Charges prévues</span>
                <span class="mono">${EURO(b.charges)}</span></div>
              <div class="jauge" style="margin-top:8px;height:8px">

              <div class="spread small muted" style="margin-top:6px">
                <span>Réalisé ${EURO(b.charges_realisees)}</span>
                <span>${(b.execution||0) > 100 ? 'Dépassement' : 'Dans l\u2019enveloppe'}</span>

      ${onglet === 'sauvegardes' && sauv && html`
        <div>

                <div class="ligne">
                  <div>
                    <div>${h.periode} — ${h.portee}</div>
                    <div class="small muted">${h.par} · ${jour(h.le)}
                      ${h.emplacement ? ' · ' + h.emplacement : ''}</div>
                  </div>
                  <span class="tag vert">Déclarée</span>

        </div>`}
    </div>`;
}

/* =====================================================================
   RAPPORT D'ACTIVITÉ
   Les chiffres se calculent, le récit se rédige.
   ===================================================================== */
function Rapport({ p }){
  const [annee, setAnnee] = useState(new Date().getFullYear() - 1);
  const [c, setC] = useState(null);
  const [r, setR] = useState({});
  const [edition, setEdition] = useState(false);
  const [msg, setMsg] = useState('');

  const peutRediger = p.niveau >= 60 || (p.postes||[]).length > 0;

  const charger = useCallback(async () => {
    const [a, b] = await Promise.all([
      db.rpc('chiffres_annee', { p_annee: annee, p_territoire: null }),
      db.from('rapports').select('*').eq('annee', annee).is('territoire_id', null).maybeSingle()
    ]);
    setC(a.data); setR(b.data || {annee});
  }, [annee]);
  useEffect(() => { charger(); }, [charger]);

  async function enregistrer(e, statut){
    if (e) e.preventDefault();
    const { data, error } = await db.rpc('enregistrer_rapport', {
      p_annee: annee, p_territoire: null, p_titre: r.titre || null,
      p_edito: r.edito || null, p_faits: r.faits_marquants || null,
      p_perspectives: r.perspectives || null, p_remerciements: r.remerciements || null,
      p_statut: statut || r.statut || 'brouillon'
    });
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data.ok) return setMsg('Erreur : ' + data.message);
    setEdition(false); setMsg('Rapport enregistré.'); charger();
  }

  async function exporter(){
    if (!c) return;
    const plat = [];
    const parcourir = (obj, prefixe) => {
      Object.entries(obj).forEach(([k,v]) => {
        if (v && typeof v === 'object' && !Array.isArray(v)) parcourir(v, prefixe + k + ' / ');
        else plat.push({ indicateur: prefixe + k, valeur: v });
      });
    };
    parcourir(c, '');
    const csv = '\ufeff' + 'indicateur;valeur\n' +
      plat.map(l => l.indicateur + ';' + l.valeur).join('\n');
    const url = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
    const a = document.createElement('a');
    a.href = url; a.download = 'FFCE-chiffres-' + annee + '.csv'; a.click();
    URL.revokeObjectURL(url);
    setMsg('Chiffres exportés.');
  }

  if (!c) return html`<div class="vide">Chargement…</div>`;

  const carte = (titre, entrees) => html`
    <div class="panneau" style="margin-bottom:20px">
      <div class="tete"><h3 style="font-size:17px">${titre}</h3></div>
      <div class="corps">
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:18px">
          ${entrees.map(([lab, val]) => html`
            <div>
              <div style="font-family:var(--titre);font-weight:900;font-size:26px;
                color:var(--framboise);line-height:1">${val ?? 0}</div>
              <div class="small muted" style="margin-top:4px">${lab}</div>
            </div>`)}
        </div>
      </div>
    </div>`;

  const champ = (cle, lab, aide) => html`
    <div class="field">
      <label>${lab}</label>
      <textarea value=${r[cle]||''} style="min-height:120px"
        onInput=${e=>setR(o=>({...o,[cle]:e.target.value}))} placeholder=${aide} />
    </div>`;

  return html`
    <div>
      <div class="spread">
        <div>
          <div class="eyebrow">Rapport d\u2019activité</div>
          <h1 style="margin:6px 0 0">${r.titre || 'Année ' + annee}</h1>
        </div>
        <div class="row">
          <select style="width:auto" value=${annee}
            onChange=${e=>setAnnee(Number(e.target.value))}>
            ${[0,1,2,3].map(n => {
              const a = new Date().getFullYear() - n;
              return html`<option value=${a}>${a}</option>`;
            })}
          </select>
          <button class="btn sm light" onClick=${exporter}>Exporter les chiffres</button>
          ${peutRediger && html`<button class="btn sm"
            onClick=${()=>setEdition(x=>!x)}>
            ${edition ? 'Annuler' : 'Rédiger'}</button>`}
        </div>
      </div>
      ${msg && html`<div class=${'alerte '+(msg.startsWith('Erreur')?'err':'ok')}
        style="margin-top:16px">${msg}</div>`}

      ${r.statut && html`<div style="margin-top:16px">
        <span class=${'tag '+(r.statut==='adopte'||r.statut==='publie'?'vert':'')}>
          ${r.statut}${r.adopte_le ? ' le ' + jour(r.adopte_le) : ''}</span></div>`}

      ${edition
        ? html`
          <form onSubmit=${e=>enregistrer(e)} class="panneau" style="margin-top:24px">
            <div class="corps stack">
              <div class="field"><label>Titre du rapport</label>
                <input value=${r.titre||''}
                  onInput=${e=>setR(o=>({...o,titre:e.target.value}))}
                  placeholder=${'Rapport d\u2019activité ' + annee} /></div>
              ${champ('edito','Éditorial',
                'Le mot d\u2019introduction — ce que cette année a représenté.')}
              ${champ('faits_marquants','Faits marquants',
                'Trois à cinq moments qui ont compté.')}
              ${champ('perspectives','Perspectives',
                'Ce que la fédération entend faire l\u2019an prochain.')}
              ${champ('remerciements','Remerciements',
                'Partenaires, financeurs, bénévoles.')}
              <div class="row">
                <button class="btn">Enregistrer</button>
                <button type="button" class="btn light"
                  onClick=${()=>enregistrer(null,'adopte')}>Enregistrer et adopter</button>
              </div>
              <p class="small muted">
                Un rapport adopté devient lisible de tous les membres.
              </p>
            </div>
          </form>`
        : html`
          <div style="margin-top:24px">
            ${r.edito && html`
              <div class="panneau" style="margin-bottom:20px">
                <div class="tete"><h3 style="font-size:17px">Éditorial</h3></div>
                <div class="corps" style="white-space:pre-wrap;max-width:66ch">
                  ${r.edito}</div>
              </div>`}

            ${carte('Les adhérents', [
              ['Membres actifs', c.adherents.total_fin_annee],
              ['Nouvelles adhésions', c.adherents.nouveaux]
            ])}
            ${carte('Le bénévolat', [
              ['Heures données', Number(c.benevolat.heures||0)],
              ['Bénévoles actifs', c.benevolat.benevoles_actifs]
            ])}
            ${carte('Les actions', [
              ['Missions organisées', c.actions.missions],
              ['Participations', c.actions.participations],
              ['Projets menés', c.actions.projets],
              ['Bénéficiaires', c.actions.beneficiaires]
            ])}
            ${carte('La formation', [
              ['Certifications délivrées', c.formation.certifications],
              ['Parcours disponibles', c.formation.formations_publiees]
            ])}
            ${carte('Le réseau', [
              ['Départements couverts', c.reseau.departements],
              ['Structures actives', c.reseau.structures_actives],
              ['Assemblées tenues', c.reseau.assemblees],
              ['Groupes de travail', c.reseau.groupes_travail]
            ])}
            ${carte('La vie démocratique', [
              ['Propositions déposées', c.vie_democratique.propositions],
              ['Propositions retenues', c.vie_democratique.propositions_retenues]
            ])}

            ${r.faits_marquants && html`
              <div class="panneau" style="margin-bottom:20px">
                <div class="tete"><h3 style="font-size:17px">Faits marquants</h3></div>
                <div class="corps" style="white-space:pre-wrap;max-width:66ch">
                  ${r.faits_marquants}</div>
              </div>`}
            ${r.perspectives && html`
              <div class="panneau" style="margin-bottom:20px">
                <div class="tete"><h3 style="font-size:17px">Perspectives</h3></div>
                <div class="corps" style="white-space:pre-wrap;max-width:66ch">
                  ${r.perspectives}</div>
              </div>`}
            ${r.remerciements && html`
              <div class="panneau">
                <div class="tete"><h3 style="font-size:17px">Remerciements</h3></div>
                <div class="corps" style="white-space:pre-wrap;max-width:66ch">
                  ${r.remerciements}</div>
              </div>`}
          </div>`}
    </div>`;
}

/* --- Direction générale : vérifications ------------------------------ */
function Validation({ p }){
  const [attente, setAttente] = useState([]);
  const [demandes, setDemandes] = useState([]);
  const [signalements, setSignalements] = useState([]);
  const [alertes, setAlertes] = useState([]);
  const [actes, setActes] = useState([]);
  const [encadrants, setEncadrants] = useState([]);
  const [msg, setMsg] = useState('');

  const charger = useCallback(async () => {
    // La table demandes pointe deux fois vers profils (profil_id et
    // traite_par). On lit donc les deux séparément plutôt que de laisser
    // PostgREST deviner de quel lien il s'agit.
    const [a, d, sg, al, ac] = await Promise.all([
      db.from('v_annuaire').select('*').eq('statut','en_attente').order('cree_le'),
      db.from('demandes').select('*').in('statut',['ouverte','en_cours']).order('cree_le'),
      db.rpc('signalements_a_traiter'),
      db.rpc('alertes_consultation'),
      db.rpc('actes_a_controler')
    ]);
    setActes(ac.data || []);
    setSignalements(sg.data || []);
    setAlertes(al.data || []);
    const { data: enc } = await db.from('v_annuaire')
      .select('id,prenom,nom,fonction_nom,niveau').eq('statut','actif').gte('niveau', 50)
      .order('niveau', { ascending: false });
    setEncadrants(enc || []);
    if (d.error) setMsg('Lecture des demandes impossible : ' + d.error.message);
    const dem = d.data || [];

    let auteurs = {};
    if (dem.length){
      const ids = [...new Set(dem.map(x => x.profil_id))];
      const { data: ps } = await db.from('v_annuaire')
        .select('id,prenom,nom,matricule,email,fonction_nom,territoire_nom').in('id', ids);
      auteurs = Object.fromEntries((ps||[]).map(x => [x.id, x]));
    }
    setAttente(a.data || []);
    setDemandes(dem.map(x => ({ ...x, auteur: auteurs[x.profil_id] || null })));
  }, []);
  useEffect(() => { charger(); }, [charger]);

  async function validerMembre(id, ok, forcer){
    const { data, error } = await db.rpc('valider_inscription',
      { p_profil: id, p_accepter: ok, p_forcer: !!forcer });
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data.ok){
      if (data.incomplet){
        if (confirm(data.message + '\n\nActiver quand même ? Le forçage sera inscrit au journal.'))
          return validerMembre(id, true, true);
        return setMsg(data.message);
      }
      return setMsg('Erreur : ' + data.message);
    }
    setMsg(ok ? 'Compte activé.' : 'Compte écarté.');
    charger();
  }

  async function controler(x, confirmer){
    const obs = confirmer ? null : prompt('Motif de l\u2019annulation (facultatif)');
    if (!confirmer && obs === null) return;
    const { data, error } = await db.rpc('controler_acte',
      { p_acte: x.id, p_confirmer: confirmer, p_observation: obs });
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data.ok) return setMsg('Erreur : ' + data.message);
    setMsg(confirmer ? 'Acte validé.' : 'Acte annulé, état antérieur rétabli.');
    charger();
  }

  const motifLisible = {
    propos_deplaces:'Propos déplacés', harcelement:'Harcèlement',
    securite:'Situation préoccupante', hors_sujet:'Usage hors mission', autre:'Autre'
  };

  async function confier(sg, a){
    const { data, error } = await db.rpc('confier_signalement',
      { p_sig: sg.id, p_a: a });
    if (error) return setMsg(error.message);
    if (!data.ok) return setMsg(data.message);
    setMsg(a ? 'Signalement confié. L\u2019encadrant a désormais accès à cette conversation.'
             : 'Signalement repris par la Direction générale.');
    charger();
  }

  // Export du registre des adhésions. Réservé au droit membres.exporter,
  // et tracé comme toute sortie massive de données personnelles.
  async function exporterAdhesions(){
    const { data, error } = await db.rpc('registre_adhesions');
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data || data.length === 0)
      return setMsg('Erreur : accès refusé ou registre vide.');
    const cols = Object.keys(data[0]);
    const ech = v => {
      if (v === null || v === undefined) return '';
      const t = String(v).replace(/"/g, '""');
      return /[";\n]/.test(t) ? '"' + t + '"' : t;
    };
    const csv = '\ufeff' + cols.join(';') + '\n' +
      data.map(l => cols.map(c => ech(l[c])).join(';')).join('\n');
    const nom = 'FFCE-registre-adhesions-' + new Date().toISOString().slice(0,10) + '.csv';
    const url = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
    const a = document.createElement('a');
    a.href = url; a.download = nom; a.click();
    URL.revokeObjectURL(url);
    await db.rpc('tracer_export', { p_objet: nom, p_lignes: data.length });
    setMsg(data.length + ' adhésion(s) extraites. Déposez le fichier sur le Drive.');
  }

  async function ouvrirDossier(sg){
    const cible = prompt(
      'Identifiant du membre mis en cause (copiez-le depuis l\u2019annuaire), ' +
      'ou laissez vide pour ouvrir le dossier sur l\u2019auteur du signalement.');
    const objet = prompt('Objet du dossier (obligatoire)');
    if (!objet) return;
    const { data, error } = await db.rpc('ouvrir_dossier', {
      p_profil: cible || sg.id, p_objet: objet,
      p_qualification: null, p_gravite: 'moyenne', p_signalement: sg.id
    });
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data.ok) return setMsg('Erreur : ' + data.message);
    setMsg('Dossier ouvert. Poursuivez dans Discipline et recours.');
    charger();
  }

  async function clore(sg, fonde){
    const decision = prompt(fonde
      ? 'Décision et suite donnée (obligatoire)'
      : 'Motif du classement sans suite (obligatoire)');
    if (!decision) return;
    const { data, error } = await db.rpc('clore_signalement',
      { p_sig: sg.id, p_fonde: fonde, p_decision: decision });
    if (error) return setMsg(error.message);
    if (!data.ok) return setMsg(data.message);
    setMsg('Signalement clos.');
    charger();
  }

  async function traiter(d, ok){
    const motif = prompt(ok ? "Motif de l'accord (facultatif)" : 'Motif du refus') ;
    if (!ok && motif === null) return;
    const { data:{ user } } = await db.auth.getUser();
    await db.from('demandes').update({
      statut: ok ? 'acceptee' : 'refusee',
      traite_par: user.id, traite_le: new Date().toISOString(),
      motif_reponse: motif || null
    }).eq('id', d.id);

    if (ok && d.type === 'acces_application' && d.cible){
      await db.from('acces_applications').upsert({
        profil_id: d.profil_id, application: d.cible,
        statut: 'accorde', accorde_par: user.id, motif: motif || null
      }, { onConflict: 'profil_id,application' });
    }
    setMsg('Demande traitée.');
    charger();
  }

  return html`
    <div>
      <div class="spread">
        <div>
          <div class="eyebrow">Direction générale</div>
          <h1 style="margin:6px 0 0">Vérifications</h1>
        </div>
        <button class="btn light" onClick=${exporterAdhesions}>
          Extraire le registre des adhésions</button>
      </div>
      <div style="height:32px"></div>
      ${msg && html`<div class="alerte ok" style="margin-bottom:24px">${msg}</div>`}

      <${AssistanceAdmin} setMsg=${setMsg} />

      ${actes.length > 0 && html`
        <div class="panneau" style="margin-bottom:24px;border-color:var(--brun)">
          <div class="tete" style="border-bottom-color:var(--brun)">
            <div class="row" style="gap:8px">
              <h3 style="font-size:17px">Actes à contrôler</h3>
              <${Info} texte="Ces actes ont déjà pris effet : on ne bloque pas le réseau en attendant une signature. Vous les confirmez, ou vous les annulez — et l'état antérieur est rétabli." />
            </div>
            <span class="tag or">${actes.length}</span>
          </div>
          <div style="overflow-x:auto">
            <table>
              <thead><tr><th>Quand</th><th>Qui</th><th>Sur qui</th>
                <th>Acte</th><th></th></tr></thead>
              <tbody>
                ${actes.map(x => html`
                  <tr>
                    <td class="small muted">${new Date(x.cree_le).toLocaleString('fr-FR',
                      {day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</td>
                    <td><div>${x.auteur}</div>
                      <div class="small muted">${x.auteur_fonction}</div></td>
                    <td><div>${x.cible || '—'}</div>
                      <div class="mono muted">${x.cible_matricule || ''}</div></td>
                    <td class="small">${x.libelle}</td>
                    <td>
                      <div class="row" style="justify-content:flex-end">
                        <button class="btn sm" onClick=${()=>controler(x, true)}>Valider</button>
