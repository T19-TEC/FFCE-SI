                    ${new Date(m.cree_le).toLocaleString('fr-FR',
                      {day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}
                  </div>
                  <div style=${'display:inline-block;text-align:left;max-width:80%;'+
                    'padding:10px 14px;border:1px solid var(--filet);border-radius:2px;'+
                    'white-space:pre-wrap;'+
                    (moi ? 'background:var(--bleu-clair);border-color:#C9D8EC' : 'background:#fff')}>
                    ${m.retire
                      ? html`<span class="muted"><em>Message retiré</em></span>`
                      : m.contenu}
                  </div>
                  ${!m.retire && (moi || p.echelon >= 6 || p.niveau >= 90) && html`
                    <div><button class="btn sm light" style="margin-top:6px;border:0;
                      background:transparent;padding:2px 0;font-size:12px"
                      onClick=${()=>retirer(m)}>Retirer</button></div>`}
                </div>`;
            })}
        </div>

        ${!superviseur && html`
          <form onSubmit=${envoyer} style="border-top:1px solid var(--filet);padding:16px 20px">
            <div class="field" style="margin:0">
              <textarea value=${texte} onInput=${e=>setTexte(e.target.value)}
                placeholder="Votre message" style="min-height:80px"
                onKeyDown=${e => { if (e.key==='Enter' && (e.metaKey||e.ctrlKey)) envoyer(e); }} />
            </div>
            <div class="spread" style="margin-top:12px">
              <span class="small muted">Ctrl + Entrée pour envoyer</span>
              <button class="btn" disabled=${envoi || !texte.trim()}>
                ${envoi ? 'Envoi…' : 'Envoyer'}</button>
            </div>
          </form>`}
      </div>
      ${msg && html`<div class=${'alerte '+(msg.startsWith('Signalement')?'ok':'err')}
        style="margin-top:16px">${msg}</div>`}

      ${!superviseur && html`
        <div style="margin-top:24px">
          ${signaler
            ? html`
              <form class="panneau" onSubmit=${envoyerSignalement}>
                <div class="tete"><h3 style="font-size:17px">Signaler cette conversation</h3></div>
                <div class="corps stack">
                  <div class="field"><label>Motif</label>
                    <select value=${motif} onChange=${e=>setMotif(e.target.value)}>
                      <option value="propos_deplaces">Propos déplacés</option>
                      <option value="harcelement">Harcèlement</option>
                      <option value="securite">Situation préoccupante</option>
                      <option value="hors_sujet">Usage hors mission</option>
                      <option value="autre">Autre</option>
                    </select></div>
                  <div class="field"><label>Ce que vous voulez dire</label>
                    <textarea required value=${details} onInput=${e=>setDetails(e.target.value)}
                      placeholder="Ce qui vous a alerté, en quelques lignes." /></div>
                  <div class="row">
                    <button class="btn">Transmettre à la direction</button>
                    <button type="button" class="btn light"
                      onClick=${()=>setSignaler(false)}>Annuler</button>
                  </div>
                  <p class="small muted">
                    Le signalement est examiné par la Direction générale, qui peut le
                    confier à un encadrant. Les personnes concernées n’en sont pas
                    averties automatiquement.
                  </p>
                </div>
              </form>`
            : html`<button class="btn light" style="border:0;background:transparent;
                padding:0;font-size:13px;color:var(--gris)"
                onClick=${()=>setSignaler(true)}>Signaler cette conversation</button>`}
        </div>`}
    </div>`;
}


/* =====================================================================
   5 quinquies. NOTES DE FRAIS ET DIRECTION FINANCIÈRE
   Circuit à trois temps : le membre dépose, son encadrement instruit,
   le trésorier valide puis paie.
   ===================================================================== */

const EURO = n => (Number(n)||0).toLocaleString('fr-FR',
  {style:'currency', currency:'EUR'});

const ETAT_NOTE = {
  brouillon: ['Brouillon', ''],
  deposee:   ['Déposée', 'bleu'],
  instruite: ['Avis favorable', 'bleu'],
  ordonnancee:['Ordonnancée', 'vert'],
  payee:     ['Payée', 'vert'],
  refusee:   ['Refusée', 'rouge']
};
const etatNote = st => {
  const [t, c] = ETAT_NOTE[st] || [st, ''];
  return html`<span class=${'tag '+c}>${t}</span>`;
};

const CATEGORIES = {
  transport:'Transport', kilometres:'Indemnité kilométrique', repas:'Repas',
  hebergement:'Hébergement', materiel:'Matériel', autre:'Autre'
};

function NotesFrais({ p }){
  const [notes, setNotes] = useState(null);
  const [param, setParam] = useState({});
  const [ouverte, setOuverte] = useState(null);
  const [creation, setCreation] = useState(false);
  const [objet, setObjet] = useState('');
  const [groupe, setGroupe] = useState('');
  const [mesGroupes, setMesGroupes] = useState([]);
  const [msg, setMsg] = useState('');

  const charger = useCallback(async () => {
    const [{ data: ns }, { data: ps }, { data: gm }] = await Promise.all([
      db.rpc('v_notes', { p_filtre: 'miennes' }),
      db.from('parametres_frais').select('*'),
      db.from('gt_membres').select('groupe_id').eq('profil_id', p.id).eq('statut','actif')
    ]);
    setNotes(ns || []);
    setParam(Object.fromEntries((ps||[]).map(x => [x.cle, Number(x.valeur)])));
    if (gm && gm.length){
      const { data: gs } = await db.from('v_groupes').select('id,nom')
        .in('id', gm.map(x => x.groupe_id));
      setMesGroupes(gs || []);
    }
  }, [p.id]);

  useEffect(() => { charger(); }, [charger]);

  async function creer(e){
    e.preventDefault(); setMsg('');
    const { data, error } = await db.from('notes_frais')
      .insert({ profil_id: p.id, objet, groupe_id: groupe || null })
      .select().single();
    if (error) return setMsg(error.message);
    setObjet(''); setGroupe(''); setCreation(false); setOuverte(data.id); charger();
  }

  if (!notes) return html`<div class="vide">Chargement…</div>`;
  if (ouverte) return html`<${NoteFrais} p=${p} id=${ouverte} param=${param}
    fermer=${() => { setOuverte(null); charger(); }} />`;

  const aRembourser = notes.filter(n => ['deposee','instruite','ordonnancee'].includes(n.statut))
                           .reduce((t,n) => t + Number(n.total||0), 0);

  return html`
    <div>
      <div class="spread">
        <div>
          <div class="eyebrow">Notes de frais</div>
          <h1 style="margin:6px 0 0">Mes dépenses</h1>
        </div>
        <button class="btn" onClick=${()=>setCreation(c=>!c)}>
          ${creation ? 'Annuler' : 'Nouvelle note'}</button>
      </div>
      <p class="muted" style="max-width:58ch;margin-top:12px">
        Indemnité kilométrique à ${EURO(param.taux_km||0)} du kilomètre.
        Plafond de ${EURO(param.plafond_note||0)} par note.
        Un justificatif est exigé pour chaque dépense réelle.
      </p>

      ${msg && html`<div class="alerte err" style="margin-top:16px">${msg}</div>`}

      ${aRembourser > 0 && html`
        <div class="alerte" style="margin-top:24px">
          ${EURO(aRembourser)} en cours de traitement.
        </div>`}

      ${creation && html`
        <form onSubmit=${creer} class="panneau" style="margin-top:24px">
          <div class="corps stack">
            <div class="field"><label>Objet</label>
              <input required value=${objet} onInput=${e=>setObjet(e.target.value)}
                placeholder="Déplacement au collège Jean-Moulin, 12 mars" /></div>
            ${mesGroupes.length > 0 && html`
              <div class="field"><label>Rattacher à un projet</label>
                <select value=${groupe} onChange=${e=>setGroupe(e.target.value)}>
                  <option value="">Aucun</option>
                  ${mesGroupes.map(g => html`<option value=${g.id}>${g.nom}</option>`)}
                </select></div>`}
            <div><button class="btn">Créer la note</button></div>
          </div>
        </form>`}

      <div class="panneau" style="margin-top:24px">
        ${notes.length === 0
          ? html`<div class="vide">Aucune note de frais. Créez-en une quand vous avancez des frais.</div>`
          : notes.map(n => html`
            <div class="ligne" style="cursor:pointer" onClick=${()=>setOuverte(n.id)}>
              <div style="flex:1;min-width:220px">
                <div>${n.objet}</div>
                <div class="small muted">
                  <span class="mono">${n.reference}</span> · ${n.nb_lignes} ligne${n.nb_lignes>1?'s':''}
                  ${n.groupe_nom ? ' · ' + n.groupe_nom : ''}
                  ${n.deposee_le ? ' · déposée le ' + jour(n.deposee_le) : ''}
                </div>
                ${n.motif_refus && html`<div class="small" style="color:var(--rouge);margin-top:4px">
                  ${n.motif_refus}</div>`}
              </div>
              <div class="row">
                <span class="mono">${EURO(n.total)}</span>
                ${etatNote(n.statut)}
              </div>
            </div>`)}
      </div>
    </div>`;
}

function NoteFrais({ p, id, param, fermer }){
  const [note, setNote] = useState(null);
  const [lignes, setLignes] = useState([]);
  const [f, setF] = useState({date_depense:'', categorie:'transport',
                              description:'', montant:'', kilometres:''});
  const [fichier, setFichier] = useState(null);
  const [msg, setMsg] = useState('');
  const [envoi, setEnvoi] = useState(false);

  const charger = useCallback(async () => {
    const { data: ns } = await db.rpc('v_notes', { p_filtre: 'miennes' });
    setNote((ns||[]).find(x => x.id === id) || null);
    const { data: ls } = await db.from('nf_lignes').select('*')
      .eq('note_id', id).order('date_depense');
    setLignes(ls || []);
  }, [id]);

  useEffect(() => { charger(); }, [charger]);

  if (!note) return html`<div class="vide">Note introuvable.</div>`;
  const modifiable = note.statut === 'brouillon';

  const montantDe = l => l.categorie === 'kilometres'
    ? (Number(l.kilometres||0) * (param.taux_km||0))
    : Number(l.montant||0);
  const total = lignes.reduce((t,l) => t + montantDe(l), 0);

  async function ajouter(e){
    e.preventDefault(); setMsg(''); setEnvoi(true);
    let chemin = null;
    try {
      if (fichier){
        if (fichier.size > 5 * 1024 * 1024)
          throw new Error('Le justificatif ne doit pas dépasser 5 Mo.');
        const ext = fichier.name.split('.').pop();
        chemin = p.id + '/' + id + '-' + Date.now() + '.' + ext;
        const { error: eUp } = await db.storage.from('justificatifs')
          .upload(chemin, fichier);
        if (eUp) throw eUp;
      }
      const { error } = await db.from('nf_lignes').insert({
        note_id: id, date_depense: f.date_depense, categorie: f.categorie,
        description: f.description,
        montant: f.categorie === 'kilometres' ? null : Number(f.montant||0),
        kilometres: f.categorie === 'kilometres' ? Number(f.kilometres||0) : null,
        justificatif: chemin
      });
      if (error) throw error;
      setF({date_depense:'', categorie:'transport', description:'', montant:'', kilometres:''});
      setFichier(null);
      const champ = document.getElementById('justif'); if (champ) champ.value = '';
      charger();
    } catch (err){
      setMsg(err.message || 'Ajout impossible.');
    }
    setEnvoi(false);
  }

  async function retirer(l){
    if (!confirm('Retirer cette dépense ?')) return;
    if (l.justificatif) await db.storage.from('justificatifs').remove([l.justificatif]);
    await db.from('nf_lignes').delete().eq('id', l.id);
    charger();
  }

  async function voirJustificatif(chemin){
    const { data, error } = await db.storage.from('justificatifs')
      .createSignedUrl(chemin, 120);
    if (error) return setMsg('Justificatif introuvable.');
    window.open(data.signedUrl, '_blank', 'noopener');
  }

  async function deposer(){
    setMsg(''); setEnvoi(true);
    const { data, error } = await db.rpc('deposer_note', { p_note: id });
    setEnvoi(false);
    if (error) return setMsg(error.message);
    if (!data.ok) return setMsg(data.message);
    charger();
  }

  async function supprimer(){
    if (!confirm('Supprimer définitivement cette note ?')) return;
    await db.from('notes_frais').delete().eq('id', id);
    fermer();
  }

  return html`
    <div>
      <a class="small" href="#" onClick=${e=>{e.preventDefault();fermer()}}>← Toutes mes notes</a>
      <div class="spread" style="margin-top:12px">
        <div>
          <h1 style="font-size:30px">${note.objet}</h1>
          <div class="small muted" style="margin-top:4px">
            <span class="mono">${note.reference}</span>
            ${note.groupe_nom ? ' · ' + note.groupe_nom : ''}
          </div>
        </div>
        ${etatNote(note.statut)}
      </div>

      ${note.avis && html`<div class="alerte" style="margin-top:16px">
        Avis de l\u2019encadrement : ${note.avis}</div>`}
      ${note.motif_refus && html`<div class="alerte err" style="margin-top:16px">
        ${note.motif_refus}</div>`}
      ${note.statut === 'payee' && html`<div class="alerte ok" style="margin-top:16px">
        ${note.mode_remboursement === 'abandon_creance'
          ? 'Créance abandonnée. Reçu fiscal ' + (note.recu_fiscal||'') + '.'
          : 'Payée' + (note.reference_paiement ? ' — référence ' + note.reference_paiement : '') + '.'}
        </div>`}
      ${note.statut === 'ordonnancee' && html`<div class="alerte" style="margin-top:16px">
        Dépense ordonnancée. Le paiement sera exécuté par la direction financière.</div>`}
      ${msg && html`<div class="alerte err" style="margin-top:16px">${msg}</div>`}

      <div class="panneau" style="margin-top:24px">
        <div class="tete">
          <h3 style="font-size:17px">Dépenses</h3>
          <span class="mono" style="font-size:16px">${EURO(total)}</span>
        </div>
        ${lignes.length === 0
          ? html`<div class="vide">Aucune dépense saisie.</div>`
          : lignes.map(l => html`
            <div class="ligne">
              <div style="flex:1;min-width:220px">
                <div>${l.description}</div>
                <div class="small muted">
                  ${CATEGORIES[l.categorie]} · ${jour(l.date_depense)}
                  ${l.categorie === 'kilometres' ? ' · ' + l.kilometres + ' km' : ''}
                </div>
              </div>
              <div class="row">
                ${l.justificatif
                  ? html`<button class="btn sm light"
                      onClick=${()=>voirJustificatif(l.justificatif)}>Justificatif</button>`
                  : (l.categorie !== 'kilometres'
                      ? html`<span class="tag rouge">Sans justificatif</span>` : null)}
                <span class="mono">${EURO(montantDe(l))}</span>
                ${modifiable && html`<button class="btn sm light"
                  onClick=${()=>retirer(l)}>Retirer</button>`}
              </div>
            </div>`)}
      </div>

      ${modifiable && html`
        <form onSubmit=${ajouter} class="panneau" style="margin-top:24px">
          <div class="tete"><h3 style="font-size:17px">Ajouter une dépense</h3></div>
          <div class="corps stack">
            <div class="row" style="gap:16px;align-items:flex-start">
              <div class="field" style="flex:1;min-width:150px;margin:0"><label>Date</label>
                <input type="date" required value=${f.date_depense}
                  onInput=${e=>setF(o=>({...o,date_depense:e.target.value}))} /></div>
              <div class="field" style="flex:1;min-width:180px;margin:0"><label>Nature</label>
                <select value=${f.categorie} onChange=${e=>setF(o=>({...o,categorie:e.target.value}))}>
                  ${Object.entries(CATEGORIES).map(([k,v]) => html`<option value=${k}>${v}</option>`)}
                </select></div>
            </div>
            <div class="field"><label>Description</label>
              <input required value=${f.description}
                onInput=${e=>setF(o=>({...o,description:e.target.value}))}
                placeholder="Aller-retour Foix – Pamiers" /></div>

            ${f.categorie === 'kilometres'
              ? html`
                <div class="field"><label>Distance parcourue (km)</label>
                  <input type="number" step="0.1" min="0" required value=${f.kilometres}
                    onInput=${e=>setF(o=>({...o,kilometres:e.target.value}))} />
                  <p class="small muted" style="margin:6px 0 0">
                    Soit ${EURO((Number(f.kilometres)||0) * (param.taux_km||0))}
                    au barème en vigueur. Aucun justificatif n\u2019est demandé.</p>
                </div>`
              : html`
                <div class="field"><label>Montant (€)</label>
                  <input type="number" step="0.01" min="0" required value=${f.montant}
                    onInput=${e=>setF(o=>({...o,montant:e.target.value}))} /></div>
                <div class="field"><label>Justificatif</label>
                  <input id="justif" type="file" accept="image/*,.pdf"
                    onChange=${e=>setFichier(e.target.files[0]||null)} />
                  <p class="small muted" style="margin:6px 0 0">
                    Photo ou PDF, 5 Mo maximum. Exigé pour déposer la note.</p>
                </div>`}

            <div><button class="btn" disabled=${envoi}>
              ${envoi ? 'Ajout…' : 'Ajouter la dépense'}</button></div>
          </div>
        </form>`}

      ${modifiable && html`
        <div class="panneau" style="margin-top:24px">
          <div class="tete"><h3 style="font-size:17px">Mode de remboursement</h3></div>
          <div class="corps stack">
            <div class="field" style="margin:0">
              <select value=${note.mode_remboursement||'virement'} onChange=${async e => {
                await db.from('notes_frais').update({ mode_remboursement: e.target.value })
                  .eq('id', id);
                charger();
              }}>
                <option value="virement">Virement sur mon compte</option>
                <option value="abandon_creance">J’abandonne la créance — reçu fiscal</option>
              </select>
            </div>
            <p class="small muted">
              L’abandon de créance vaut don à la fédération : vous renoncez au
              remboursement et recevez un reçu fiscal ouvrant droit à réduction
              d’impôt. Le virement exige des coordonnées bancaires enregistrées
              dans Mon compte.
            </p>
          </div>
        </div>

        <div class="row" style="margin-top:32px">
          <button class="btn" onClick=${deposer} disabled=${envoi || lignes.length===0}>
            Déposer la note</button>
          <button class="btn light" onClick=${supprimer}>Supprimer</button>
        </div>
        <p class="small muted" style="margin-top:12px">
          Une fois déposée, la note n\u2019est plus modifiable. Elle part à votre
          encadrement, qui donne un avis, puis à la direction financière.
        </p>`}
    </div>`;
}

/* --- Finances : instruction, ordonnancement, paiement ------------------
   Trois écrans distincts pour trois responsabilités distinctes. La
   séparation doit se voir, sinon elle ne sert à rien.
   --------------------------------------------------------------------- */
function Finances({ p, role }){
  // role : 'tresorerie' (instruire + payer) ou 'ordonnancement'
  const [onglet, setOnglet] = useState(role === 'ordonnancement' ? 'ordonnancer' : 'instruire');
  const [listes, setListes] = useState({});
  const [param, setParam] = useState([]);
  const [detail, setDetail] = useState(null);
  const [lignes, setLignes] = useState([]);
  const [rib, setRib] = useState(null);
  const [msg, setMsg] = useState('');

  const charger = useCallback(async () => {
    const filtres = ['avis','instruire','ordonnancer','payer','toutes'];
    const res = await Promise.all(filtres.map(f => db.rpc('v_notes', { p_filtre: f })));
    setListes(Object.fromEntries(filtres.map((f,i) => [f, res[i].data || []])));
    const { data: pr } = await db.from('parametres_frais').select('*').order('cle');
    setParam(pr || []);
  }, []);
  useEffect(() => { charger(); }, [charger]);

  async function ouvrir(n){
    setDetail(n); setMsg(''); setRib(null);
    const { data } = await db.from('nf_lignes').select('*')
      .eq('note_id', n.id).order('date_depense');
    setLignes(data || []);
  }

  async function justificatif(chemin){
    const { data, error } = await db.storage.from('justificatifs').createSignedUrl(chemin, 120);
    if (error) return setMsg('Justificatif introuvable.');
    window.open(data.signedUrl, '_blank', 'noopener');
  }

  async function voirRib(n){
    const { data, error } = await db.rpc('lire_rib', { p_note: n.id });
    if (error) return setMsg(error.message);
    if (!data.ok) return setMsg(data.message);
    setRib(data);
    setMsg('Consultation enregistrée : le membre en sera informé.');
  }

  const appel = async (fn, args, ok) => {
    const { data, error } = await db.rpc(fn, args);
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data.ok) return setMsg('Erreur : ' + data.message);
    setMsg(ok); setDetail(null); charger();
  };

  async function avis(n, favorable){
    const t = prompt(favorable ? 'Avis (facultatif)' : 'Motif de l\u2019avis défavorable');
    if (!favorable && !t) return;
    appel('donner_avis', { p_note: n.id, p_favorable: favorable, p_avis: t || '' },
      'Avis enregistré.');
  }
  async function instruire(n, ok){
    const t = prompt(ok ? 'Imputation budgétaire (facultatif)' : 'Motif du rejet (obligatoire)');
    if (!ok && !t) return;
    appel('instruire_note', { p_note: n.id, p_favorable: ok, p_avis: t || '' },
      ok ? 'Note instruite. Elle passe à l\u2019ordonnateur.' : 'Note rejetée.');
  }
  async function ordonnancer(n, ok){
    const t = ok ? null : prompt('Motif du refus (obligatoire)');
    if (!ok && !t) return;
    appel('ordonnancer_note', { p_note: n.id, p_ok: ok, p_motif: t },
      ok ? 'Dépense ordonnancée. Elle passe au paiement.' : 'Dépense refusée.');
  }
  async function payer(n){
    const ref = prompt('Référence du virement (facultatif)') || '';
    appel('payer_note', { p_note: n.id, p_reference: ref }, 'Note payée.');
  }
  async function majParam(cle, valeur){
    const { error } = await db.from('parametres_frais')
      .update({ valeur: Number(valeur) }).eq('cle', cle);
    setMsg(error ? 'Erreur : ' + error.message : 'Barème enregistré.');
    charger();
  }

  const taux = Number((param.find(x=>x.cle==='taux_km')||{}).valeur || 0);
  const montantDe = l => l.categorie === 'kilometres'
    ? Number(l.kilometres||0) * taux : Number(l.montant||0);

  const ligneNote = (n, actions) => html`
    <div class="ligne">
      <div style="flex:1;min-width:240px;cursor:pointer" onClick=${()=>ouvrir(n)}>
        <div>${n.objet}</div>
        <div class="small muted">
          ${n.deposant} <span class="mono">${n.matricule}</span>
          ${n.territoire_nom ? ' · ' + n.territoire_nom : ''}
          · <span class="mono">${n.reference}</span>
          ${n.deposee_le ? ' · ' + jour(n.deposee_le) : ''}
        </div>
        ${n.avis && html`<div class="small muted">Avis : ${n.avis}</div>`}
        ${n.mode_remboursement === 'abandon_creance' && html`
          <div style="margin-top:6px"><span class="tag vert">Abandon de créance</span></div>`}
        ${n.mode_remboursement === 'virement' && !n.a_un_rib && html`
          <div style="margin-top:6px"><span class="tag rouge">Sans coordonnées bancaires</span></div>`}
      </div>
      <div class="row">
        <span class="mono" style="font-size:15px">${EURO(n.total)}</span>
        ${etatNote(n.statut)}
        ${actions}
      </div>
    </div>`;

  if (detail) return html`
    <div>
      <a class="small" href="#" onClick=${e=>{e.preventDefault();setDetail(null)}}>← Retour</a>
      <div class="spread" style="margin-top:12px">
        <div>
          <h1 style="font-size:28px">${detail.objet}</h1>
          <div class="small muted" style="margin-top:4px">
            ${detail.deposant} <span class="mono">${detail.matricule}</span>
            ${detail.territoire_nom ? ' · ' + detail.territoire_nom : ''}
            · <span class="mono">${detail.reference}</span>
          </div>
        </div>
        ${etatNote(detail.statut)}
      </div>
      ${msg && html`<div class=${'alerte '+(msg.startsWith('Erreur')?'err':'ok')}
        style="margin-top:16px">${msg}</div>`}

      <div class="panneau" style="margin-top:24px">
        <div class="tete"><h3 style="font-size:17px">Suivi</h3></div>
        ${detail.avis_nom && html`<div class="ligne">
          <span class="muted">Avis hiérarchique</span>
          <span>${detail.avis_nom} — ${detail.avis||''}</span></div>`}
        ${detail.instruit_nom && html`<div class="ligne">
          <span class="muted">Instruite par</span>
          <span>${detail.instruit_nom}${detail.imputation ? ' · ' + detail.imputation : ''}</span></div>`}
        ${detail.ordonnance_nom && html`<div class="ligne">
          <span class="muted">Ordonnancée par</span><span>${detail.ordonnance_nom}</span></div>`}
        ${detail.paye_nom && html`<div class="ligne">
          <span class="muted">Payée par</span>
          <span>${detail.paye_nom}${detail.reference_paiement ? ' · ' + detail.reference_paiement : ''}</span></div>`}
        <div class="ligne"><span class="muted">Mode de remboursement</span>
          <span>${detail.mode_remboursement === 'abandon_creance'
            ? 'Abandon de créance — reçu fiscal'
            : 'Virement bancaire'}</span></div>
        ${detail.motif_refus && html`<div class="ligne">
          <span class="muted">Motif du refus</span>
          <span style="color:var(--rouge)">${detail.motif_refus}</span></div>`}
      </div>

      <div class="panneau" style="margin-top:24px">
        <div class="tete"><h3 style="font-size:17px">Dépenses</h3>
          <span class="mono" style="font-size:16px">${EURO(detail.total)}</span></div>
        ${lignes.map(l => html`
          <div class="ligne">
            <div style="flex:1;min-width:200px">
              <div>${l.description}</div>
              <div class="small muted">${CATEGORIES[l.categorie]} · ${jour(l.date_depense)}
                ${l.categorie === 'kilometres' ? ' · ' + l.kilometres + ' km' : ''}</div>
            </div>
            <div class="row">
              ${l.justificatif && html`<button class="btn sm light"
                onClick=${()=>justificatif(l.justificatif)}>Justificatif</button>`}
              <span class="mono">${EURO(montantDe(l))}</span>
            </div>
          </div>`)}
      </div>

      ${detail.statut === 'ordonnancee' && detail.mode_remboursement === 'virement' && html`
        <div class="panneau" style="margin-top:24px">
          <div class="tete"><h3 style="font-size:17px">Coordonnées bancaires</h3></div>
          <div class="corps">
            ${rib
              ? html`<div class="stack">
                  <div><span class="muted small">Titulaire</span><div>${rib.titulaire}</div></div>
                  <div><span class="muted small">IBAN</span>
                    <div class="mono" style="font-size:15px">${rib.iban}</div></div>
                  ${rib.bic && html`<div><span class="muted small">BIC</span>
                    <div class="mono">${rib.bic}</div></div>`}
                </div>`
              : html`<div>
                  <p class="small muted">La consultation est tracée et le membre en est informé.</p>
                  <button class="btn sm" onClick=${()=>voirRib(detail)}>Afficher l\u2019IBAN</button>
                </div>`}
          </div>
        </div>`}

      <div class="row" style="margin-top:32px">
        ${detail.statut === 'deposee' && a('avis') && html`
          <button class="btn light" onClick=${()=>avis(detail,true)}>Avis favorable</button>
          <button class="btn light" onClick=${()=>avis(detail,false)}>Avis défavorable</button>`}
        ${detail.statut === 'deposee' && role === 'tresorerie' && html`
          <button class="btn" onClick=${()=>instruire(detail,true)}>Instruire</button>
          <button class="btn light" onClick=${()=>instruire(detail,false)}>Rejeter</button>`}
        ${detail.statut === 'instruite' && role === 'ordonnancement' && html`
          <button class="btn" onClick=${()=>ordonnancer(detail,true)}>Ordonnancer</button>
          <button class="btn light" onClick=${()=>ordonnancer(detail,false)}>Refuser</button>`}
        ${detail.statut === 'ordonnancee' && role === 'tresorerie' && html`
          <button class="btn" onClick=${()=>payer(detail)}>Marquer comme payée</button>`}
      </div>
    </div>`;

  function a(k){ return (listes[k]||[]).length > 0; }
  const L = k => listes[k] || [];
  const paye = L('toutes').filter(n => n.statut === 'payee')
                          .reduce((t,n) => t + Number(n.total||0), 0);

  const onglets = role === 'ordonnancement'
    ? [['ordonnancer','À ordonnancer'],['toutes','Toutes']]
    : [['avis','Avis à donner'],['instruire','À instruire'],['payer','À payer'],
       ['toutes','Toutes'],['bareme','Barème']];

  return html`
    <div>
      <div class="eyebrow">${role === 'ordonnancement' ? 'Ordonnancement' : 'Direction financière'}</div>
      <h1 style="margin:6px 0 8px">
        ${role === 'ordonnancement' ? 'Engager les dépenses' : 'Instruire et payer'}</h1>
      <p class="muted" style="max-width:60ch">
        ${role === 'ordonnancement'
          ? 'Vous décidez d\u2019engager les dépenses instruites par la direction financière. Vous n\u2019exécutez pas les paiements.'
          : 'Vous contrôlez la forme des notes et exécutez les paiements ordonnancés. Vous ne décidez pas de l\u2019engagement.'}
      </p>
      ${msg && html`<div class=${'alerte '+(msg.startsWith('Erreur')?'err':'ok')}
        style="margin-top:16px">${msg}</div>`}

      <div class="chiffres" style="margin:24px 0">
        ${role === 'tresorerie' && html`
          <div><div class="n" style="font-size:32px">${L('instruire').length}</div>
            <div class="l">À instruire</div></div>`}
        <div><div class="n" style="font-size:32px">${L('ordonnancer').length}</div>
          <div class="l">À ordonnancer</div></div>
        ${role === 'tresorerie' && html`
          <div><div class="n" style="font-size:32px">${L('payer').length}</div>
            <div class="l">À payer</div></div>`}
        <div><div class="n" style="font-size:32px">${EURO(paye)}</div>
          <div class="l">Déjà remboursé</div></div>
      </div>

      <div class="row" style="margin:0 0 24px;gap:0;border-bottom:1px solid var(--filet)">
        ${onglets.map(([k,t]) => html`
          <button class="btn light" style=${'border:0;border-bottom:2px solid '+
            (onglet===k?'var(--encre)':'transparent')+';border-radius:0;background:transparent'}
            onClick=${()=>setOnglet(k)}>${t}</button>`)}
      </div>

      ${onglet !== 'bareme' && html`
        <div class="panneau">
          ${L(onglet).length === 0
            ? html`<div class="vide">Rien à traiter ici.</div>`
            : L(onglet).map(n => ligneNote(n, html`
                <button class="btn sm" onClick=${()=>ouvrir(n)}>Ouvrir</button>`))}
        </div>`}

      ${onglet === 'bareme' && html`
        <div class="panneau">
          <div class="tete"><h3 style="font-size:17px">Barème et plafonds</h3></div>
          <div class="corps stack">
            ${param.map(x => html`
              <div class="field">
                <label>${x.libelle} (${x.unite})</label>
                <input type="number" step="0.001" defaultValue=${x.valeur}
                  onBlur=${e=>majParam(x.cle, e.target.value)} />
              </div>`)}
            <p class="small muted">Enregistré à la sortie du champ.</p>
          </div>
        </div>`}
    </div>`;
}

/* --- Mes coordonnées bancaires ---------------------------------------- */
function MonRib(){
  const [r, setR] = useState(null);
  const [f, setF] = useState({titulaire:'', iban:'', bic:''});
  const [ouvert, setOuvert] = useState(false);
  const [msg, setMsg] = useState('');

  const charger = useCallback(async () => {
    const { data } = await db.rpc('mon_rib');
    setR(data);
  }, []);
  useEffect(() => { charger(); }, [charger]);

  async function enregistrer(e){
    e.preventDefault();
    const { data, error } = await db.rpc('enregistrer_rib',
      { p_titulaire: f.titulaire, p_iban: f.iban, p_bic: f.bic || null });
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data.ok) return setMsg('Erreur : ' + data.message);
    setF({titulaire:'', iban:'', bic:''}); setOuvert(false);
    setMsg('Coordonnées enregistrées.'); charger();
  }

  if (!r) return null;
  return html`
    <div class="panneau" style="margin-top:24px">
      <div class="tete">
        <h3 style="font-size:17px">Coordonnées bancaires</h3>
        <button class="btn sm light" onClick=${()=>setOuvert(o=>!o)}>
          ${ouvert ? 'Annuler' : (r.enregistre ? 'Modifier' : 'Enregistrer')}</button>
      </div>
      ${msg && html`<div class="corps"><div class=${'alerte '+(msg.startsWith('Erreur')?'err':'ok')}>
        ${msg}</div></div>`}
      ${r.enregistre && !ouvert && html`
        <div>
          <div class="ligne"><span class="muted">Titulaire</span><span>${r.titulaire}</span></div>
          <div class="ligne"><span class="muted">IBAN</span>
            <span class="mono">${r.iban_masque}</span></div>
          <div class="ligne"><span class="muted">Consultations par la trésorerie</span>
            <span class="mono">${r.consultations}</span></div>
        </div>`}
      ${!r.enregistre && !ouvert && html`
        <div class="corps small muted">
          Aucune coordonnée enregistrée. Elles sont nécessaires pour un
          remboursement par virement.
        </div>`}
      ${ouvert && html`
        <form onSubmit=${enregistrer} class="corps stack">
          <div class="field"><label>Titulaire du compte</label>
            <input required value=${f.titulaire}
              onInput=${e=>setF(o=>({...o,titulaire:e.target.value}))} /></div>
          <div class="field"><label>IBAN</label>
            <input required value=${f.iban} placeholder="FR76 ...."
              onInput=${e=>setF(o=>({...o,iban:e.target.value}))} /></div>
          <div class="field"><label>BIC (facultatif)</label>
            <input value=${f.bic} onInput=${e=>setF(o=>({...o,bic:e.target.value}))} /></div>
          <div><button class="btn">Enregistrer</button></div>
          <p class="small muted">
            Vos coordonnées sont conservées à part et ne sont lisibles que par la
            direction financière, au moment du paiement. Chaque consultation est
            enregistrée et vous pouvez la voir ici.
          </p>
        </form>`}
    </div>`;
}


/* =====================================================================
   5 sexies. HABILITATIONS
   Un droit ouvre une action. Un poste regroupe des droits. Une
   nomination confie un poste, avec un périmètre et un terme.
   ===================================================================== */

function Habilitations({ p }){
  const [onglet, setOnglet] = useState('nominations');
  const [postes, setPostes] = useState([]);
  const [droits, setDroits] = useState([]);
  const [liens, setLiens] = useState([]);
  const [noms, setNoms] = useState([]);
  const [gens, setGens] = useState([]);
  const [terr, setTerr] = useState([]);
  const [acces, setAcces] = useState([]);
  const [apps, setApps] = useState([]);
  const [msg, setMsg] = useState('');

  const charger = useCallback(async () => {
    const [a,b,c,d,e,f,g] = await Promise.all([
      db.from('postes').select('*').order('nom'),
      db.from('droits').select('*').order('ordre'),
      db.from('poste_droits').select('*'),
      db.from('nominations').select('*').order('cree_le', {ascending:false}),
      db.from('v_annuaire').select('id,prenom,nom,matricule,fonction_nom')
        .eq('statut','actif').order('nom'),
      db.from('territoires').select('id,nom,echelle').order('echelle').order('nom'),
      db.rpc('pilotage_acces')
    ]);
    setPostes(a.data||[]); setDroits(b.data||[]); setLiens(c.data||[]);
    setNoms(d.data||[]); setGens(e.data||[]); setTerr(f.data||[]);
    setAcces(g.data||[]);
    const { data: ap } = await db.from('applications').select('code,nom').eq('actif',true).order('ordre');
    setApps(ap||[]);
  }, []);
  useEffect(() => { charger(); }, [charger]);

  const nomDe = i => { const x = gens.find(y => y.id === i); return x ? nomComplet(x) : '—'; };
  const actif = n => !n.revoque_le &&
    (!n.fin || new Date(n.fin) >= new Date(new Date().toDateString()));

  return html`
    <div>
      <div class="eyebrow">Direction générale</div>
      <h1 style="margin:6px 0 8px">Habilitations</h1>
      <p class="muted" style="max-width:60ch">
        Un droit ouvre une action. Un poste regroupe des droits sous un nom.
        Une nomination confie un poste à quelqu\u2019un, pour un territoire et
        une durée. Ces trois notions restent séparées.
      </p>
      ${msg && html`<div class=${'alerte '+(msg.startsWith('Erreur')?'err':'ok')}
        style="margin-top:16px">${msg}</div>`}

      <div class="row" style="margin:32px 0 24px;gap:0;border-bottom:1px solid var(--filet)">
        ${[['nominations','Nominations'],['postes','Postes'],['acces','Accès applicatifs']]
          .map(([k,t]) => html`
          <button class="btn light" style=${'border:0;border-bottom:2px solid '+
            (onglet===k?'var(--encre)':'transparent')+';border-radius:0;background:transparent'}
            onClick=${()=>setOnglet(k)}>${t}</button>`)}
      </div>

      ${onglet === 'nominations' && html`<${Nominations} postes=${postes} noms=${noms}
        gens=${gens} terr=${terr} nomDe=${nomDe} actif=${actif}
        recharger=${charger} setMsg=${setMsg} />`}

      ${onglet === 'postes' && html`<${Postes} postes=${postes} droits=${droits}
        liens=${liens} recharger=${charger} setMsg=${setMsg} />`}

      ${onglet === 'acces' && html`<${PilotageAcces} acces=${acces} apps=${apps}
        gens=${gens} recharger=${charger} setMsg=${setMsg} />`}
    </div>`;
}

      p_territoire: f.territoire || null, p_fin: f.fin || null, p_motif: f.motif || null
    });
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data.ok) return setMsg('Erreur : ' + data.message);

function Postes({ postes, droits, liens, recharger, setMsg }){
  const [creation, setCreation] = useState(false);
  const [f, setF] = useState({code:'', nom:'', description:'', couleur:'neutre'});
  const [ouvert, setOuvert] = useState(null);

  async function creer(e){
    e.preventDefault();
    const code = f.code.trim().toLowerCase().replace(/[^a-z0-9_]/g,'_');
    const { error } = await db.from('postes').insert({
      code, nom: f.nom, description: f.description || null, couleur: f.couleur
    });
    if (error) return setMsg('Erreur : ' + error.message);
    setF({code:'', nom:'', description:'', couleur:'neutre'}); setCreation(false);
    setMsg('Poste créé. Cochez maintenant ses droits.'); recharger();
  }

  async function basculer(poste, droit, coche){
    if (coche)
      await db.from('poste_droits').insert({ poste, droit });
    else
      await db.from('poste_droits').delete().eq('poste', poste).eq('droit', droit);
    recharger();
  }

  async function desactiver(x){
    if (!confirm('Désactiver « ' + x.nom + ' » ? Les nominations en cours cessent de produire effet.')) return;
    await db.from('postes').update({ actif: !x.actif }).eq('code', x.code);
    recharger();
  }

  const categories = [...new Set(droits.map(d => d.categorie))];

  return html`
    <div>
      <div class="spread" style="margin-bottom:16px">
        <span class="small muted">${postes.length} poste${postes.length>1?'s':''}</span>
        <button class="btn sm" onClick=${()=>setCreation(c=>!c)}>
          ${creation ? 'Annuler' : 'Créer un poste'}</button>
      </div>

      ${creation && html`
        <form onSubmit=${creer} class="panneau" style="margin-bottom:24px">
          <div class="corps stack">
            <div class="row" style="gap:16px;align-items:flex-start">
              <div class="field" style="flex:1;min-width:200px;margin:0"><label>Nom</label>
                <input required value=${f.nom} onInput=${e=>setF(o=>({...o,nom:e.target.value}))}
                  placeholder="Référent laïcité" /></div>
              <div class="field" style="flex:1;min-width:160px;margin:0"><label>Identifiant</label>
                <input required value=${f.code} onInput=${e=>setF(o=>({...o,code:e.target.value}))}
                  placeholder="ref_laicite" /></div>
            </div>
            <div class="field"><label>À quoi sert ce poste</label>
              <textarea value=${f.description}
                onInput=${e=>setF(o=>({...o,description:e.target.value}))} /></div>
            <div class="field"><label>Couleur de l\u2019étiquette</label>
              <select value=${f.couleur} onChange=${e=>setF(o=>({...o,couleur:e.target.value}))}>
                <option value="neutre">Neutre</option><option value="or">Or</option>
                <option value="bleu">Bleu</option><option value="vert">Vert</option>
                <option value="rouge">Rouge</option>
              </select></div>
            <div><button class="btn">Créer</button></div>
          </div>
        </form>`}

      ${postes.map(x => {
        const siens = liens.filter(l => l.poste === x.code).map(l => l.droit);
        return html`
          <div class="panneau" style="margin-bottom:16px">
            <div class="tete">
              <div>
                <div class="row" style="gap:8px">
                  <h3 style="font-size:17px">${x.nom}</h3>
                  <span class=${'tag '+(x.couleur==='neutre'?'':x.couleur)}>${siens.length} droit${siens.length>1?'s':''}</span>
                  ${!x.actif && html`<span class="tag rouge">Désactivé</span>`}
                  ${x.systeme && html`<span class="tag">Fourni d\u2019origine</span>`}
                </div>
                ${x.description && html`<div class="small muted" style="margin-top:4px;max-width:60ch">
                  ${x.description}</div>`}
              </div>
              <div class="row">
                <button class="btn sm light" onClick=${()=>setOuvert(o => o===x.code?null:x.code)}>
                  ${ouvert===x.code ? 'Replier' : 'Droits'}</button>
                <button class="btn sm light" onClick=${()=>desactiver(x)}>
                  ${x.actif ? 'Désactiver' : 'Réactiver'}</button>
              </div>
            </div>
            ${ouvert === x.code && html`
              <div class="corps">
                ${categories.map(cat => html`
                  <div style="margin-bottom:20px">
                    <div class="eyebrow" style="margin-bottom:8px">${cat}</div>
                    ${droits.filter(d => d.categorie === cat).map(d => html`
                      <label class="row" style="text-transform:none;letter-spacing:0;
                          font-size:14px;color:var(--encre);padding:4px 0;margin:0;cursor:pointer">
                        <input type="checkbox" style="width:auto"
                          checked=${siens.includes(d.code)}
                          onChange=${e=>basculer(x.code, d.code, e.target.checked)} />
                        <span>${d.nom}</span>
                        ${d.sensible && html`<span class="tag or">Sensible</span>`}
                      </label>`)}
                  </div>`)}
              </div>`}
          </div>`;
      })}
    </div>`;
}

function PilotageAcces({ acces, apps, gens, recharger, setMsg }){
  const [f, setF] = useState({profil:'', app:'', motif:'', expire:''});
  const [filtre, setFiltre] = useState('actifs');

  async function accorder(e){
    e.preventDefault();
    const { data, error } = await db.rpc('accorder_acces', {
      p_profil: f.profil, p_app: f.app,
      p_motif: f.motif || null, p_expire: f.expire || null
    });
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data.ok) return setMsg('Erreur : ' + data.message);
    setF({profil:'', app:'', motif:'', expire:''});
    setMsg('Accès ouvert.'); recharger();
  }

  async function revoquer(a){
    const motif = prompt('Motif de la révocation (obligatoire)');
    if (!motif) return;
    const { data, error } = await db.rpc('revoquer_acces',
      { p_profil: a.profil_id, p_app: a.application, p_motif: motif });
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data.ok) return setMsg('Erreur : ' + data.message);

  const liste = acces.filter(a => filtre === 'tous' ? true : a.statut === 'Actif');

  return html`

                <option value="">Choisir…</option>
                ${apps.map(a => html`<option value=${a.code}>${a.nom}</option>`)}
              </select></div>
            <div class="field" style="flex:1;min-width:150px;margin:0"><label>Expire le</label>
              <input type="date" value=${f.expire}
                onInput=${e=>setF(o=>({...o,expire:e.target.value}))} /></div>
          </div>
          <div class="field"><label>Motif</label>
            <input value=${f.motif} onInput=${e=>setF(o=>({...o,motif:e.target.value}))}
              placeholder="Trésorier adjoint depuis mars" /></div>
          <div><button class="btn">Ouvrir</button></div>
        </div>
      </form>

      ${dormants.length > 0 && html`
        <div class="alerte" style="margin-bottom:24px;border-left-color:var(--laiton)">
          ${dormants.length} accès ouvert${dormants.length>1?'s':''} n\u2019
          ${dormants.length>1?'ont':'a'} jamais servi. Un accès inutilisé est un
          accès à retirer.
        </div>`}

      <div class="spread" style="margin-bottom:16px">
        <span class="small muted">${liste.length} ligne${liste.length>1?'s':''}</span>
        <select style="width:auto" value=${filtre} onChange=${e=>setFiltre(e.target.value)}>

          <option value="tous">Tout l\u2019historique</option>
        </select>
      </div>

      <div class="panneau" style="overflow-x:auto">
        ${liste.length === 0
          ? html`<div class="vide">Aucun accès nominatif ouvert.</div>`
          : html`
            <table>
              <thead><tr>

              </tr></thead>
              <tbody>
                ${liste.map(a => html`
                  <tr>
                    <td><div>${a.membre}</div>
                      <div class="mono muted">${a.matricule}</div></td>
                    <td>${a.app_nom}</td>
                    <td class="small">${jour(a.accorde_le)}
                      ${a.expire_le ? html`<div class="small muted">expire le ${jour(a.expire_le)}</div>` : ''}</td>
                    <td class="small">${a.derniere_utilisation

/* =====================================================================
   5 septies. DISCIPLINE, RECOURS ET ARCHIVES
   Aucune mesure ne produit d'effet sans avoir été notifiée, et aucune
   notification n'est valable sans voie de recours ouverte.
   ===================================================================== */

const MESURES = {
  classement:          'Classement sans suite',
  rappel_regles:       'Rappel des règles',
  avertissement:       'Avertissement',
  suivi_usages:        'Suivi des usages',
  retrait_habilitation:'Retrait des habilitations',
  suspension:          'Suspension du compte',
  radiation:           'Radiation'
};
const GRAVITE = { faible:['Faible',''], moyenne:['Moyenne','bleu'], elevee:['Élevée','rouge'] };
const ETAPES = ['ouvert','instruction','decision','notifie','recours','clos'];
const ETAPE_NOM = {
  ouvert:'Dossier ouvert', instruction:'Instruction en cours',
  decision:'Décision prise', notifie:'Décision notifiée',
  recours:'Recours en examen', clos:'Dossier clos'
};

/* --- Le fil du dossier, vu par l'intéressé ---------------------------- */

  return html`
    <div>
      <div class="row" style="gap:0;margin-bottom:16px;flex-wrap:nowrap;overflow-x:auto">

          <div style=${'flex:1;min-width:82px;padding-right:8px;'+
            (n <= i ? '' : 'opacity:.35')}>
            <div style=${'height:3px;background:'+(n <= i ? 'var(--encre)' : 'var(--filet)')}></div>
            <div class="small" style="margin-top:6px;line-height:1.3">${ETAPE_NOM[e]}</div>

/* --- Ce que voit un membre : bandeau, ou page entière si suspendu ----- */
function MonDossier({ p, entier }){
  const [d, setD] = useState(null);
  const [msg, setMsg] = useState('');
  const [obs, setObs] = useState({});
  const [rec, setRec] = useState({});
  const [doc, setDoc] = useState({});
  const [renonce, setRenonce] = useState({});

  const charger = useCallback(async () => {
    const { data } = await db.rpc('mon_dossier');
    setD(data || null);
  }, []);
  useEffect(() => { charger(); }, [charger]);

  if (!d) return null;
  const dossiers = d.dossiers || [];
  const ouverts = dossiers.filter(x => x.statut !== 'clos');
  if (!entier && ouverts.length === 0 && !d.sous_suivi) return null;

  async function accuser(m){
    const { data } = await db.rpc('accuser_reception', { p_mesure: m.id });
    if (!data.ok) return setMsg(data.message);
    setMsg('Réception accusée. Le délai de recours court à compter de ce jour.');
    charger();
  }

  async function deposerObs(dos, e){
    e.preventDefault();
    const texte = obs[dos.id] || '';
    const fichier = doc[dos.id];
    if (!texte.trim() && !fichier) return;
    let chemin = null;
    try {
      if (fichier){
        if (fichier.size > 10 * 1024 * 1024)
          throw new Error('Le document ne doit pas dépasser 10 Mo.');
        const ext = fichier.name.split('.').pop();
        chemin = p.id + '/' + dos.id + '-' + Date.now() + '.' + ext;
        const { error: eUp } = await db.storage.from('dossiers').upload(chemin, fichier);
        if (eUp) throw eUp;
      }
    } catch (err){ return setMsg(err.message || 'Téléversement impossible.'); }

    const { data, error } = await db.rpc('verser_piece', {
      p_dossier: dos.id, p_type: fichier ? 'piece_jointe' : 'observation',
      p_titre: fichier ? fichier.name : 'Observations',
      p_contenu: texte || null, p_fichier: chemin, p_communicable: true
    });
    if (error) return setMsg(error.message);
    if (!data.ok) return setMsg(data.message);
    setObs(o => ({...o, [dos.id]: ''}));
    setDoc(o => ({...o, [dos.id]: null}));
    setMsg('Vos observations sont versées au dossier.');
    charger();
  }

  async function renoncer(dos, e){
    e.preventDefault();
    const texte = renonce[dos.id] || '';
    if (!texte.trim()) return;
    if (!confirm('Cette renonciation est définitive. Confirmez-vous ?')) return;
    const { data, error } = await db.rpc('renoncer_gracieux',
      { p_dossier: dos.id, p_texte: texte });
    if (error) return setMsg(error.message);
    if (!data.ok) return setMsg(data.message);
    setRenonce(o => { const c = {...o}; delete c[dos.id]; return c; });
    setMsg('Renonciation enregistrée et versée au dossier.');
    charger();
  }

  async function ouvrirPiece(pc){
    if (!pc.fichier) return;
    const { data, error } = await db.storage.from('dossiers')
      .createSignedUrl(pc.fichier, 120);
    if (error) return setMsg('Document introuvable.');
    window.open(data.signedUrl, '_blank', 'noopener');
  }

  async function deposerRecours(m, e){
    e.preventDefault();
    const texte = rec[m.id] || '';
    if (!texte.trim()) return;
    const { data, error } = await db.rpc('deposer_recours',
      { p_mesure: m.id, p_contenu: texte, p_fichier: null });
    if (error) return setMsg(error.message);
    if (!data.ok) return setMsg(data.message);
    setRec(o => ({...o, [m.id]: ''}));
    setMsg('Recours déposé. Il sera examiné et la décision vous sera notifiée.');
    charger();
  }

  const bloc = (dos) => html`
    <div class="panneau" style="margin-bottom:24px">
      <div class="tete">
        <div>
          <h3 style="font-size:17px">${dos.objet}</h3>
          <div class="small muted"><span class="mono">${dos.reference}</span>
            · ouvert le ${jour(dos.ouvert_le)}</div>
        </div>
        <span class=${'tag '+(GRAVITE[dos.gravite]||['',''])[1]}>
          ${(GRAVITE[dos.gravite]||['',''])[0]}</span>
      </div>
      <div class="corps">
        <${FilDossier} d=${dos} />

        ${dos.conclusion && html`
          <div class="alerte" style="margin-top:16px">Conclusion : ${dos.conclusion}</div>`}

        ${(dos.mesures||[]).map(m => html`
          <div style="margin-top:24px;padding:16px;border:1px solid var(--filet);
               border-left:3px solid var(--encre);border-radius:2px">
            <div class="spread">
              <strong>${MESURES[m.type] || m.type}</strong>
              <span class=${'tag '+(m.statut==='annulee'?'vert':m.statut==='executee'?'rouge':'')}>
                ${m.statut}</span>
            </div>
            <p style="margin:8px 0 0">${m.motif}</p>
            ${m.texte && html`<p class="small" style="margin:8px 0 0;white-space:pre-wrap">${m.texte}</p>`}
            <div class="small muted" style="margin-top:8px">
              Effet au ${jour(m.date_effet)}${m.date_fin ? ' · jusqu\u2019au ' + jour(m.date_fin) : ''}
              ${m.notifiee_le ? ' · notifiée le ' + jour(m.notifiee_le) : ''}
            </div>

            ${!m.accusee_le && m.notifiee_le && html`
              <div style="margin-top:12px">
                <button class="btn sm" onClick=${()=>accuser(m)}>
                  J\u2019accuse réception de cette décision</button>
                <p class="small muted" style="margin:6px 0 0">
                  Le délai de recours de ${30} jours court à compter de votre accusé de
                  réception, ou à défaut quinze jours après la notification.</p>
              </div>`}

            ${m.recours_ouvert && m.limite_recours && html`
              <p class="small muted" style="margin-top:8px">
                Recours possible jusqu\u2019au ${jour(m.limite_recours)}
                — ${m.recours_restants} recours restant${m.recours_restants>1?'s':''}.</p>`}
            ${!m.recours_ouvert && m.motif_fermeture && html`
              <p class="small muted" style="margin-top:8px">${m.motif_fermeture}</p>`}
            ${m.renonce_le && html`
              <div style="margin-top:12px;padding:12px;background:var(--papier);
                   border:1px solid var(--filet);border-radius:2px">
                <div class="small muted">Renonciation du ${jour(m.renonce_le)}</div>
                <p class="small" style="margin:6px 0 0;white-space:pre-wrap">${m.renonce_texte}</p>
              </div>`}

            ${(m.recours||[]).map(r => html`
              <div style="margin-top:12px;padding:12px;background:var(--papier);
                   border:1px solid var(--filet);border-radius:2px">
                <div class="small muted">Recours déposé le ${jour(r.cree_le)}
                  · <span class="tag">${r.statut}</span></div>
                <p class="small" style="margin:8px 0 0;white-space:pre-wrap">${r.contenu}</p>
                ${r.decision && html`
                  <p class="small" style="margin:12px 0 0;padding-top:12px;
                     border-top:1px solid var(--filet)">
                    <strong>Décision du ${jour(r.decide_le)} :</strong> ${r.decision}</p>`}
              </div>`)}

            ${m.recours_ouvert && (m.recours||[]).filter(r =>
                ['depose','recevable'].includes(r.statut)).length === 0 && html`
              <form onSubmit=${e=>deposerRecours(m, e)} style="margin-top:16px">
                <div class="field">
                  <label>Déposer un recours gracieux</label>
                  <textarea value=${rec[m.id]||''} onInput=${e=>setRec(o=>({...o,[m.id]:e.target.value}))}
                    placeholder="Exposez les motifs pour lesquels vous contestez cette décision." />
                </div>
                <button class="btn sm" style="margin-top:8px">Déposer le recours</button>
              </form>`}
          </div>`)}

        ${(dos.pieces||[]).length > 0 && html`
          <div style="margin-top:24px">
            <div class="eyebrow" style="margin-bottom:12px">Pièces du dossier</div>
            ${dos.pieces.map(pc => html`
              <div style="padding:10px 0;border-bottom:1px solid var(--filet)">
                <div class="spread">
                  <span>${pc.fichier
                    ? html`<a href="#" onClick=${e=>{e.preventDefault();ouvrirPiece(pc)}}>
                        ${pc.titre} ↗</a>`
                    : pc.titre}</span>
                  <span class="small muted">${jour(pc.cree_le)}</span>
                </div>
                ${pc.contenu && html`<p class="small muted"
                  style="margin:6px 0 0;white-space:pre-wrap">${pc.contenu}</p>`}
              </div>`)}
            ${dos.pieces_non_communicables > 0 && html`
              <p class="small muted" style="margin-top:12px">
                ${dos.pieces_non_communicables} pièce${dos.pieces_non_communicables>1?'s':''}
                du dossier ${dos.pieces_non_communicables>1?'ne sont':'n\u2019est'} pas
                communicable${dos.pieces_non_communicables>1?'s':''}, afin de protéger
                l\u2019identité de personnes tierces.</p>`}
          </div>`}

        ${dos.scelle && html`
          <p class="small muted" style="margin-top:24px;padding-top:24px;
             border-top:1px solid var(--filet)">
            Ce dossier est clos et scellé. Plus aucune pièce ne peut y être versée.
          </p>`}

        ${!dos.scelle && html`
          <form onSubmit=${e=>deposerObs(dos, e)} style="margin-top:24px;
               padding-top:24px;border-top:1px solid var(--filet)">
            <div class="field">
              <label>Vos observations</label>
              <textarea value=${obs[dos.id]||''}
                onInput=${e=>setObs(o=>({...o,[dos.id]:e.target.value}))}
                placeholder="Tout ce que vous souhaitez porter à la connaissance de l\u2019instruction." />
            </div>
            <div class="field">
              <label>Joindre un document</label>
              <input type="file" accept="image/*,.pdf,.doc,.docx"
                onChange=${e=>setDoc(o=>({...o,[dos.id]:e.target.files[0]||null}))} />
              <p class="small muted" style="margin:6px 0 0">
                Photo, PDF ou document, 10 Mo maximum.</p>
            </div>
            <button class="btn sm" style="margin-top:8px">Verser au dossier</button>
          </form>

          ${dos.peut_renoncer && html`
            <div style="margin-top:24px;padding-top:24px;border-top:1px solid var(--filet)">
              ${renonce[dos.id] === undefined
                ? html`<button class="btn light" style="border:0;background:transparent;
                    padding:0;font-size:13px;color:var(--gris)"
                    onClick=${()=>setRenonce(o=>({...o,[dos.id]:''}))}>
                    Renoncer à mes voies de recours gracieux</button>`
                : html`
                  <form onSubmit=${e=>renoncer(dos, e)}>
                    <div class="alerte err" style="margin-bottom:16px">
                      La renonciation est définitive. Elle met fin aux recours en cours
                      et ferme la voie gracieuse pour toutes les décisions déjà notifiées
                      de ce dossier. Elle ne vous prive d\u2019aucun droit devant les
                      juridictions compétentes.
                    </div>
                    <div class="field">
                      <label>Écrivez votre renonciation</label>
                      <textarea required value=${renonce[dos.id]}
                        onInput=${e=>setRenonce(o=>({...o,[dos.id]:e.target.value}))}
                        placeholder="Je soussigné(e) …, renonce expressément aux voies de recours gracieux ouvertes contre les décisions du présent dossier." />
                    </div>
                    <div class="row" style="margin-top:12px">
                      <button class="btn danger">Je renonce</button>
                      <button type="button" class="btn light"
                        onClick=${()=>setRenonce(o=>{const c={...o};delete c[dos.id];return c})}>
                        Annuler</button>
                    </div>
                  </form>`}
            </div>`}`}
      </div>
    </div>`;

  // Bandeau, pour un compte actif.
  if (!entier) return html`
    <div style="margin-bottom:24px">
      ${d.sous_suivi && html`
        <p class="small" style="padding:10px 14px;border:1px solid var(--filet);
           border-left:3px solid var(--laiton);background:#fff;border-radius:2px">
          Votre compte fait l\u2019objet d\u2019une mesure de suivi des usages.
        </p>`}
      ${ouverts.length > 0 && html`
        <div class="alerte" style=${d.sous_suivi?'margin-top:8px':''}>
          ${ouverts.length === 1
            ? 'Un dossier vous concernant est en cours : ' + ETAPE_NOM[ouverts[0].statut].toLowerCase() + '.'
            : ouverts.length + ' dossiers vous concernant sont en cours.'}
          <a href="#/espace/mon-dossier">Consulter et répondre</a>
        </div>`}
    </div>`;

  // Page entière.
  return html`
    <div>
      <div class="eyebrow">Mon dossier</div>
      <h1 style="margin:6px 0 8px">Suivi et voies de recours</h1>
      <p class="muted" style="max-width:60ch">
        Vous trouvez ici l\u2019état de chaque dossier vous concernant, les pièces
        qui vous sont communicables, les décisions prises et les délais dont
        vous disposez pour les contester.
      </p>
      ${msg && html`<div class="alerte ok" style="margin:24px 0">${msg}</div>`}
      <div style="margin-top:24px">
        ${dossiers.length === 0
          ? html`<div class="panneau"><div class="vide">
              Aucun dossier ne vous concerne.</div></div>`
          : dossiers.map(bloc)}
      </div>
    </div>`;
}
