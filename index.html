    </div>`;
}

/* --- Direction générale : réseau et fonctions ------------------------ */
function ReseauAdmin(){
  const [membres, setMembres] = useState([]);
  const [fonctions, setFonctions] = useState([]);
  const [terr, setTerr] = useState([]);
  const [q, setQ] = useState('');
  const [msg, setMsg] = useState('');

  const charger = useCallback(async () => {
    const [m, f, t] = await Promise.all([
      db.from('v_annuaire').select('*').order('niveau',{ascending:false}).order('nom'),
      db.from('fonctions').select('*').order('niveau'),
      db.from('territoires').select('id,nom,echelle,code').order('echelle').order('nom')
    ]);
    setMembres(m.data||[]); setFonctions(f.data||[]); setTerr(t.data||[]);
  }, []);
  useEffect(() => { charger(); }, [charger]);

  async function modifier(id, champ, valeur){
    const { error } = await db.from('profils').update({ [champ]: valeur }).eq('id', id);
    setMsg(error ? error.message : 'Enregistré.');
    charger();
  }

  const filtre = membres.filter(m =>
    (nomComplet(m)+' '+(m.territoire_nom||'')).toLowerCase().includes(q.toLowerCase()));

  return html`
    <div>
      <p class="muted" style="max-width:60ch">
        Nommer, muter, faire progresser, protéger un dossier. Chaque
        modification est immédiate et inscrite au journal.
      </p>
      ${msg && html`<div class="alerte ok" style="margin:16px 0">${msg}</div>`}

      <div class="field" style="max-width:360px;margin:24px 0">
        <input placeholder="Rechercher…" value=${q} onInput=${e=>setQ(e.target.value)} />
      </div>

      <div class="panneau" style="overflow-x:auto">
        <table>
          <thead><tr><th>Membre</th><th>Fonction</th><th>Territoire</th><th>Échelon</th>
            <th>Statut</th><th title="Toute consultation déclenche une alerte">Protégé</th></tr></thead>
          <tbody>
            ${filtre.map(m => html`
              <tr>
                <td><div>${nomComplet(m)}</div><div class="mono muted">${m.matricule}</div></td>
                <td>
                  <select value=${m.fonction} onChange=${e=>modifier(m.id,'fonction',e.target.value)}>
                    ${fonctions.map(f => html`<option value=${f.code}>${f.nom}</option>`)}
                  </select>
                </td>
                <td>
                  <select value=${m.territoire_id||''} onChange=${e=>modifier(m.id,'territoire_id',e.target.value||null)}>
                    <option value="">—</option>
                    ${terr.map(t => html`<option value=${t.id}>${t.nom} (${t.echelle})</option>`)}
                  </select>
                </td>
                <td>
                  <select value=${m.echelon} onChange=${e=>modifier(m.id,'echelon',Number(e.target.value))}>
                    ${[1,2,3,4,5,6,7].map(n => html`<option value=${n}>${n}</option>`)}
                  </select>
                </td>
                <td>
                  <select value=${m.statut} onChange=${e=>modifier(m.id,'statut',e.target.value)}>
                    ${['en_attente','actif','suspendu','archive'].map(s =>
                      html`<option value=${s}>${s.replace('_',' ')}</option>`)}
                  </select>
                </td>
                <td style="text-align:center">
                  <input type="checkbox" style="width:auto" checked=${!!m.protege}
                    title="Protection renforcée : toute consultation déclenche une alerte"
                    onChange=${e=>modifier(m.id,'protege',e.target.checked)} />
                </td>
              </tr>`)}
          </tbody>
        </table>
      </div>
    </div>`;
}

function VitrineTextes({ setMsg }){

  async function enregistrer(cle, valeur){

    setMsg(error ? 'Erreur : ' + error.message : 'Texte publié.');

  const sections = [...new Set(c.map(x => x.section))];
  const titre = { accueil:'Page d\u2019accueil', apparence:'Apparence et blocs',
                  association:'La fédération', chiffres:'Chiffres-clés',
                  contact:'Contact et réseaux', legal:'Mentions légales', general:'Général' };

  return html`
    <div>
      ${sections.map(sec => html`
        <div class="panneau" style="margin-bottom:24px">
          <div class="tete"><h3 style="font-size:17px">${titre[sec]||sec}</h3></div>
          <div class="corps stack">
            ${c.filter(x => x.section === sec).map(x => html`
              <div class="field">
                <label>${x.libelle}</label>

                  ? html`<textarea defaultValue=${x.valeur}
                      onBlur=${e=>enregistrer(x.cle, e.target.value)} />`

}

function VitrineBlocs({ setMsg }){
  const [blocs, setBlocs] = useState([]);
  const [page, setPage] = useState('accueil');
  const [ouvert, setOuvert] = useState(false);
  const [f, setF] = useState({titre:'',contenu:'',type:'carte',lien:'',lien_texte:''});
  const [fichier, setFichier] = useState(null);

  const charger = useCallback(() =>
    db.from('blocs_vitrine').select('*').order('page').order('ordre')
      .then(({data}) => setBlocs(data||[])), []);
  useEffect(() => { charger(); }, [charger]);

  const PAGES = { accueil:'Accueil', association:'La fédération', actions:'Nos actions',
                  reseau:'Le réseau', rejoindre:'Nous rejoindre', contact:'Contact' };
  const TYPES = { carte:'Carte', chiffre:'Chiffre', citation:'Citation',
                  encart:'Encart', etape:'Étape' };

  async function ajouter(e){
    e.preventDefault();
    let image = null;
    try { image = fichier ? await deposerImage(fichier, 'vitrine') : null; }
    catch (err){ return setMsg('Erreur : ' + err.message); }
    const max = Math.max(0, ...blocs.filter(b => b.page === page).map(b => b.ordre));
    const { error } = await db.from('blocs_vitrine').insert({
      page, type: f.type, titre: f.titre, contenu: f.contenu || null,
      lien: f.lien || null, lien_texte: f.lien_texte || null,
      image, ordre: max + 10
    });
    if (error) return setMsg('Erreur : ' + error.message);
    setF({titre:'',contenu:'',type:'carte',lien:'',lien_texte:''});
    setFichier(null); setOuvert(false); setMsg('Bloc ajouté.'); charger();
  }

  async function modifier(b, champ, valeur){
    const { error } = await db.from('blocs_vitrine')
      .update({ [champ]: valeur, maj_le: new Date().toISOString() }).eq('id', b.id);
    setMsg(error ? 'Erreur : ' + error.message : 'Enregistré.');
    charger();
  }

  async function deplacer(b, sens){
    const memePage = blocs.filter(x => x.page === b.page).sort((a,c)=>a.ordre-c.ordre);
    const i = memePage.findIndex(x => x.id === b.id);
    const j = i + sens;
    if (j < 0 || j >= memePage.length) return;
    await db.from('blocs_vitrine').update({ ordre: memePage[j].ordre }).eq('id', b.id);
    await db.from('blocs_vitrine').update({ ordre: b.ordre }).eq('id', memePage[j].id);
    charger();
  }

  async function retirer(b){
    if (!confirm('Supprimer « ' + b.titre + ' » ?')) return;
    await db.from('blocs_vitrine').delete().eq('id', b.id);
    setMsg('Bloc supprimé.'); charger();
  }

  const liste = blocs.filter(b => b.page === page);

  return html`
    <div>
      <div class="spread" style="margin-bottom:20px">
        <div class="field" style="margin:0;max-width:260px">
          <label>Page</label>
          <select value=${page} onChange=${e=>setPage(e.target.value)}>
            ${Object.entries(PAGES).map(([k,v]) => html`<option value=${k}>${v}</option>`)}
          </select>
        </div>
        <button class="btn sm" onClick=${()=>setOuvert(o=>!o)}>
          ${ouvert ? 'Annuler' : 'Ajouter un bloc'}</button>
      </div>

      ${ouvert && html`
        <form onSubmit=${ajouter} class="panneau" style="margin-bottom:24px">
          <div class="corps stack">
            <div class="row" style="gap:16px;align-items:flex-start">
              <div class="field" style="flex:2;min-width:200px;margin:0"><label>Titre</label>
                <input required value=${f.titre}
                  onInput=${e=>setF(o=>({...o,titre:e.target.value}))} /></div>
              <div class="field" style="flex:1;min-width:140px;margin:0"><label>Type</label>
                <select value=${f.type} onChange=${e=>setF(o=>({...o,type:e.target.value}))}>
                  ${Object.entries(TYPES).map(([k,v]) => html`<option value=${k}>${v}</option>`)}
                </select></div>
            </div>
            <div class="field"><label>Contenu</label>
              <textarea value=${f.contenu}
                onInput=${e=>setF(o=>({...o,contenu:e.target.value}))} /></div>
            <div class="row" style="gap:16px;align-items:flex-start">
              <div class="field" style="flex:1;min-width:180px;margin:0"><label>Lien</label>
                <input value=${f.lien} placeholder="#/actions"
                  onInput=${e=>setF(o=>({...o,lien:e.target.value}))} /></div>
              <div class="field" style="flex:1;min-width:180px;margin:0"><label>Texte du lien</label>
                <input value=${f.lien_texte}
                  onInput=${e=>setF(o=>({...o,lien_texte:e.target.value}))} /></div>
            </div>
            <div class="field"><label>Image</label>
              <input type="file" accept="image/*"
                onChange=${e=>setFichier(e.target.files[0]||null)} /></div>
            <div><button class="btn">Ajouter</button></div>
          </div>
        </form>`}

      <div class="panneau">
        ${liste.length === 0
          ? html`<div class="vide">Aucun bloc sur cette page.</div>`
          : liste.map((b, i) => html`
            <div class="ligne" style="align-items:flex-start">
              ${b.image && html`<img src=${urlPublique(b.image)} alt=""
                style="width:56px;height:56px;object-fit:cover;flex:0 0 56px;
                       border:1px solid var(--filet);border-radius:2px" />`}
              <div style="flex:1;min-width:220px">
                <input defaultValue=${b.titre} style="font-weight:700"
                  onBlur=${e=>modifier(b,'titre',e.target.value)} />
                <textarea defaultValue=${b.contenu||''} style="min-height:64px;margin-top:8px"
                  onBlur=${e=>modifier(b,'contenu',e.target.value)} />
                <div class="row" style="margin-top:8px;gap:6px">
                  <span class="tag">${TYPES[b.type]||b.type}</span>
                  <span class="mono muted">ordre ${b.ordre}</span>
                </div>
              </div>
              <div class="row">
                <button class="btn sm light" onClick=${()=>deplacer(b,-1)}
                  disabled=${i===0}>↑</button>
                <button class="btn sm light" onClick=${()=>deplacer(b,1)}
                  disabled=${i===liste.length-1}>↓</button>
                <button class="btn sm light"
                  onClick=${()=>modifier(b,'publie',!b.publie)}>
                  ${b.publie ? 'Masquer' : 'Publier'}</button>
                <button class="btn sm light" onClick=${()=>retirer(b)}>Supprimer</button>
              </div>
            </div>`)}
      </div>
    </div>`;
}

function VitrineArticles({ setMsg }){
  const [liste, setListe] = useState([]);
  const [edition, setEdition] = useState(null);
  const [f, setF] = useState({titre:'',chapo:'',contenu:'',categorie:'Actualité',
                              publie:false, image:''});
  const [fichier, setFichier] = useState(null);

  const charger = useCallback(() =>
    db.from('articles').select('*').order('cree_le', {ascending:false})
      .then(({data}) => setListe(data||[])), []);
  useEffect(() => { charger(); }, [charger]);

  function ouvrir(a){
    setEdition(a || {nouveau:true});
    setF(a ? {titre:a.titre, chapo:a.chapo||'', contenu:a.contenu||'',
              categorie:a.categorie||'Actualité', publie:a.publie, image:a.image||''}
           : {titre:'',chapo:'',contenu:'',categorie:'Actualité',publie:false,image:''});
    setFichier(null);
  }

  async function enregistrer(e){
    e.preventDefault();
    let image = f.image;
    try { if (fichier) image = await deposerImage(fichier, 'articles'); }
    catch (err){ return setMsg('Erreur : ' + err.message); }
    const { data, error } = await db.rpc('enregistrer_article', {
      p_id: edition.nouveau ? null : edition.id,
      p_titre: f.titre, p_chapo: f.chapo || null, p_contenu: f.contenu || null,
      p_image: image || null, p_categorie: f.categorie, p_publie: f.publie
    });
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data.ok) return setMsg('Erreur : ' + data.message);
    setEdition(null); setMsg('Article enregistré.'); charger();
  }

  async function retirer(a){
    if (!confirm('Supprimer « ' + a.titre + ' » ?')) return;
    await db.from('articles').delete().eq('id', a.id);
    setMsg('Article supprimé.'); charger();
  }

  if (edition) return html`
    <div>
      <button class="lien-discret" onClick=${()=>setEdition(null)}>← Toutes les actualités</button>
      <form onSubmit=${enregistrer} class="panneau" style="margin-top:16px">
        <div class="corps stack">
          <div class="field"><label>Titre</label>
            <input required value=${f.titre}
              onInput=${e=>setF(o=>({...o,titre:e.target.value}))} /></div>
          <div class="field"><label>Chapô</label>
            <textarea value=${f.chapo} style="min-height:70px"
              onInput=${e=>setF(o=>({...o,chapo:e.target.value}))} /></div>
          <div class="field"><label>Texte</label>
            <textarea value=${f.contenu} style="min-height:260px"
              onInput=${e=>setF(o=>({...o,contenu:e.target.value}))} /></div>
          <div class="field"><label>Catégorie</label>
            <input value=${f.categorie}
              onInput=${e=>setF(o=>({...o,categorie:e.target.value}))} /></div>
          <div class="field"><label>Image</label>
            ${f.image && html`<img src=${urlPublique(f.image)} alt=""
              style="max-width:260px;display:block;margin-bottom:10px;
                     border:1px solid var(--filet);border-radius:2px" />`}
            <input type="file" accept="image/*"
              onChange=${e=>setFichier(e.target.files[0]||null)} /></div>
          <label class="row" style="text-transform:none;letter-spacing:0;font-size:14px;
              color:var(--nuit);margin:0;cursor:pointer">
            <input type="checkbox" style="width:auto" checked=${f.publie}
              onChange=${e=>setF(o=>({...o,publie:e.target.checked}))} />
            <span>Publier sur le site</span>
          </label>
          <div><button class="btn">Enregistrer</button></div>
        </div>
      </form>
    </div>`;

  return html`
    <div>
      <div class="spread" style="margin-bottom:16px">
        <span class="small muted">${liste.length} article${liste.length>1?'s':''}</span>
        <button class="btn sm" onClick=${()=>ouvrir(null)}>Nouvel article</button>
      </div>
      <div class="panneau">
        ${liste.length === 0
          ? html`<div class="vide">Aucun article.</div>`
          : liste.map(a => html`
            <div class="ligne">
              ${a.image && html`<img src=${urlPublique(a.image)} alt=""
                style="width:56px;height:56px;object-fit:cover;flex:0 0 56px;
                       border:1px solid var(--filet);border-radius:2px" />`}
              <div style="flex:1;min-width:220px">
                <div>${a.titre}</div>
                <div class="small muted">${a.categorie}
                  ${a.publie_le ? ' · ' + jour(a.publie_le) : ' · non publié'}
                  · <span class="mono">/${a.slug}</span></div>
              </div>
              <div class="row">
                ${a.publie
                  ? html`<span class="tag vert">En ligne</span>`
                  : html`<span class="tag">Brouillon</span>`}
                <button class="btn sm light" onClick=${()=>ouvrir(a)}>Ouvrir</button>
                <button class="btn sm light" onClick=${()=>retirer(a)}>Supprimer</button>
              </div>
            </div>`)}
      </div>
    </div>`;
}

/* --- Coquille de l'espace membre ------------------------------------- */
function EnAttente({ p }){
  return html`
    <section class="bloc blanc">
      <div class="wrap" style="max-width:560px">
        <div class="eyebrow">Espace membre</div>
        <h1 style="margin:8px 0 24px">Votre dossier est en cours de vérification</h1>
        <div class="alerte">
          La Direction générale vérifie votre inscription avant d'ouvrir vos accès.
          Vous recevrez un message dès qu'elle sera validée.
        </div>
        <div style="margin-top:32px">
          <${CarteFederale} p=${p} />
        </div>
        <p style="margin-top:32px">
          <a href="#/" onClick=${()=>db.auth.signOut()}>Se déconnecter</a>
        </p>
      </div>
    </section>`;
}

function Espace({ session, sous }){
  const [p, setP] = useState(null);
  const [apps, setApps] = useState([]);
  const [demandes, setDemandes] = useState([]);
  const [chemin, setChemin] = useState('');
  const [blocage, setBlocage] = useState(null);
  const [directions, setDirections] = useState([]);
  const [pret, setPret] = useState(false);

  const charger = useCallback(async () => {
    const { data: profil } = await db.from('v_annuaire').select('*')
      .eq('id', session.user.id).maybeSingle();
    if (!profil){ setPret(true); return; }
    setP(profil);

    // La matrice décide de ce qui s'affiche, de ce qui est grisé, et de
    // ce qui n'apparaît pas du tout. Elle se règle dans Habilitations.
    const [{ data: liste }, { data: mesDem }, { data: dirs }] = await Promise.all([
      db.rpc('mes_applications'),
      db.from('demandes').select('*').eq('profil_id', session.user.id)
        .order('cree_le',{ascending:false}),
      db.rpc('mes_directions')
    ]);
    setApps((liste||[]).map(a => ({ ...a, actif: true })));
    setDirections(dirs || []);
    setDemandes(mesDem || []);

    // Les postes occupés : ils ouvrent des droits que la fonction ne
    // donne pas — référent RGPD, ordonnateur, conseil de discipline…
    const { data: mp } = await db.rpc('mes_postes');
    profil.postes = mp || [];
    setP({ ...profil });

    // Un dossier incomplet retient le membre sur son compte : la
    // fédération ne peut pas travailler avec des fiches à trous.
    const { data: comp } = await db.rpc('completude_bloquante');
    setBlocage(comp && comp.bloquant ? comp.manques : null);

    if (profil.territoire_id){
      const { data } = await db.rpc('chemin_territoire', { cible: profil.territoire_id });
      setChemin(data || '');
    }
    setPret(true);
  }, [session.user.id]);

  useEffect(() => { charger(); }, [charger]);

  if (!pret) return html`<div class="vide" style="padding:120px">Chargement…</div>`;
  if (!p) return html`<div class="vide" style="padding:120px">
    Profil introuvable. <a href="#/" onClick=${()=>db.auth.signOut()}>Se déconnecter</a></div>`;
  if (p.statut === 'suspendu') return html`<${EspaceSuspendu} p=${p} />`;
  if (blocage && sous !== 'compte') return html`
    <div class="app">
      <${Flanc} p=${p} apps=${apps} directions=${directions} page="compte" />
      <main class="contenu"><${DossierIncomplet} p=${p} manques=${blocage} /></main>
    </div>`;
  if (p.statut !== 'actif') return html`<${EnAttente} p=${p} />`;

  const admin = p.niveau >= 90;
  const acces = c => apps.find(a => a.code === c && a.ouvert);
  const refus = html`<div class="alerte err">Cette application ne vous est pas ouverte.
    <a href="#/espace/demandes">Déposer une demande</a></div>`;

  let vue;
  if (sous.startsWith('groupe/')){
    const idG = sous.slice('groupe/'.length);
    return html`
      <div class="app">
        <${Flanc} p=${p} apps=${apps} directions=${directions} page="groupes" />
        <main class="contenu">
          ${acces('groupes') ? html`<${Groupe} p=${p} id=${idG} />` : refus}
        </main>
      </div>`;
  }
  if (sous.startsWith('formation/')){
    const idF = sous.slice('formation/'.length);
    return html`
      <div class="app">
        <${Flanc} p=${p} apps=${apps} directions=${directions} page="formations" />
        <main class="contenu">
          ${acces('formations') ? html`<${Formation} p=${p} id=${idF} />` : refus}
        </main>
      </div>`;
  }
  switch (sous){
    case '':           vue = html`<${TableauDeBord} p=${p} apps=${apps} chemin=${chemin} demandes=${demandes} />`; break;
    case 'compte':     vue = html`<${MonCompte} p=${p} recharger=${charger} />`; break;
    case 'mon-dossier':vue = html`<${MonDossier} p=${p} entier=${true} />`; break;
    case 'referentiel':vue = html`<${Referentiel} />`; break;
    case 'engagement': vue = acces('engagement') ? html`<${Engagement} p=${p} />` : refus; break;
    case 'comite':     vue = acces('comite') ? html`<${MonComite} p=${p} />` : refus; break;
    case 'budget':     vue = acces('budget') ? html`<${Budget} p=${p} />` : refus; break;
    case 'rapport':    vue = acces('rapport') ? html`<${Rapport} p=${p} />` : refus; break;
    case 'conformite': vue = html`<${Conformite} p=${p} />`; break;
    case 'parcours':   vue = acces('parcours')
                          ? html`<${ParcoursAdherent} p=${p} />` : refus; break;
    case 'pilotage':   vue = acces('pilotage')
                          ? html`<${Pilotage} p=${p} />` : refus; break;
    case 'assemblees': vue = acces('assemblees')
                          ? html`<${Assemblees} p=${p} />` : refus; break;
    case 'chancellerie': vue = acces('chancellerie')
                          ? html`<${Chancellerie} p=${p} />` : refus; break;
    case 'communication': vue = acces('communication')
                          ? html`<${Communication} p=${p} />` : refus; break;
    case 'discipline': vue = acces('discipline') ? html`<${Discipline} p=${p} />` : refus; break;
    case 'demandes':   vue = html`<${MesDemandes} p=${p} apps=${apps} demandes=${demandes} recharger=${charger} />`; break;
    case 'annuaire':   vue = acces('annuaire') ? html`<${Annuaire} p=${p} />` : refus; break;
    case 'validation': vue = admin ? html`<${Validation} p=${p} />` : refus; break;
    case 'reseau':     vue = admin ? html`<${Habilitations} p=${p} />` : refus; break;
    case 'vitrine':    vue = admin ? html`<${VitrineAdmin} />` : refus; break;
    case 'habilitations': vue = (admin || p.droits?.includes('habilitations.gerer'))
                          ? html`<${Habilitations} p=${p} />` : refus; break;
    case 'formations': vue = acces('formations') ? html`<${Formations} p=${p} />` : refus; break;
    case 'groupes':    vue = acces('groupes') ? html`<${Groupes} p=${p} />` : refus; break;
    case 'messagerie': vue = acces('messagerie') ? html`<${Messagerie} p=${p} />` : refus; break;
    case 'notes_frais':vue = acces('notes_frais') ? html`<${NotesFrais} p=${p} />` : refus; break;
    case 'tresorerie': vue = acces('tresorerie')
                       ? html`<${Finances} p=${p} role="tresorerie" />` : refus; break;
    case 'ordonnancement': vue = acces('ordonnancement')
                       ? html`<${Finances} p=${p} role="ordonnancement" />` : refus; break;
    default:           vue = html`<div class="vide">Page inconnue.</div>`;
  }

  return html`
    <div class="app">
      <${Flanc} p=${p} apps=${apps} directions=${directions} page=${sous} />
      <main class="contenu">${vue}</main>
    </div>`;
}

/* =====================================================================
   6. RACINE
   ===================================================================== */
function Site(){
  const route = useRoute();
  const [session, setSession] = useState(undefined);
  const [txt, setTxt] = useState(null);

  useEffect(() => {
    db.auth.getSession().then(({data}) => setSession(data.session));
    const { data:{ subscription } } = db.auth.onAuthStateChange((_e,s) => setSession(s));
    return () => subscription.unsubscribe();
  }, []);

  useEffect(() => {
    db.from('contenus').select('cle,valeur').then(({data}) =>
      setTxt(Object.fromEntries((data||[]).map(c => [c.cle, c.valeur]))));
  }, []);

  if (session === undefined || txt === null)
    return html`<div class="vide" style="padding:140px">Chargement…</div>`;

  // Espace membre : mise en page propre, sans l'entête publique.
  if (route.startsWith('/espace')){
    if (!session) return html`
      <${EntetePublique} route=${route} session=${session} />
      <${Connexion} />
      <${Pied} txt=${txt} />`;
    const sous = route.replace('/espace','').replace(/^\//,'');
    return html`<${Espace} session=${session} sous=${sous} />`;
  }

  if (route.startsWith('/appel/')){
    return html`
      <${EntetePublique} route=${route} session=${session} />
      <${AppelPublic} token=${route.slice('/appel/'.length)} />
      <${Pied} txt=${txt} />`;
  }

  if (route.startsWith('/actualite/')){
    return html`
      <${EntetePublique} route=${route} session=${session} />
      <${PageArticle} slug=${route.slice('/actualite/'.length)} />
      <${Pied} txt=${txt} />`;
  }

  let page;
  switch (route){
    case '/':                 page = html`<${Accueil} txt=${txt} />`; break;
    case '/association':      page = html`<${Association} txt=${txt} />`; break;
    case '/actions':          page = html`<${Actions} />`; break;
    case '/reseau':           page = html`<${Reseau} />`; break;
    case '/rejoindre':        page = html`<${Rejoindre} />`; break;
    case '/contact':          page = html`<${Contact} txt=${txt} />`; break;
    case '/actualites':       page = html`<${PageActualites} />`; break;
    case '/inscription':      page = session ? html`<${Accueil} txt=${txt} />` : html`<${Inscription} />`; break;
    case '/mentions':         page = html`<${PageTexte} titre="Mentions légales" corps=${txt.mentions} />`; break;
    case '/confidentialite':  page = html`<${PageTexte} titre="Politique de confidentialité" corps=${txt.confidentialite} />`; break;
    default:                  page = html`<${PageTexte} titre="Page introuvable"
                                  corps="Le lien que vous avez suivi ne mène nulle part." />`;
  }

  return html`
    <${EntetePublique} route=${route} session=${session} />
    ${page}
    <${Pied} txt=${txt} />`;
}

render(html`<${Site} />`, document.getElementById('racine'));
</script>
