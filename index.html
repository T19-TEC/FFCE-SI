<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FFCE — Fédération Française pour la Citoyenneté et l'Égalité des Chances</title>
<meta name="description" content="La FFCE fédère des bénévoles dans toute la France pour l'éducation à la citoyenneté, la transmission des valeurs de la République et l'égalité des chances.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
/* =====================================================================
   CHARTE FFCE
   Palette réduite, deux familles, filets d'un pixel, aucune ombre,
   aucun dégradé, une seule échelle d'espacement (multiples de 4 px).
   ===================================================================== */
:root{
  --encre:#0B1B33;      /* bleu nuit — titres, texte fort            */
  --bleu:#1B4B8F;       /* bleu République — liens, actions           */
  --bleu-clair:#EAF0F8;
  --papier:#FBFAF8;     /* fond, très légèrement crème                */
  --blanc:#FFFFFF;
  --gris:#5C6579;       /* texte secondaire                           */
  --filet:#E2DFD8;      /* toutes les bordures                        */
  --laiton:#8A6A24;     /* échelons, certifications, distinctions     */
  --laiton-clair:#F6F0E2;
  --vert:#166E4B;
  --vert-clair:#E6F1EC;
  --rouge:#A32A2A;
  --rouge-clair:#F7EAEA;

  --serif:'Spectral', Georgia, 'Times New Roman', serif;
  --sans:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;

  --max:1120px;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--papier);color:var(--encre);
  font-family:var(--sans);font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--bleu);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--bleu);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

h1,h2,h3{font-family:var(--serif);font-weight:400;color:var(--encre);margin:0;line-height:1.2}
h1{font-size:44px;letter-spacing:-.01em}
h2{font-size:30px}
h3{font-size:20px}
p{margin:0 0 16px}

.wrap{max-width:var(--max);margin:0 auto;padding:0 24px}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.04em}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gris)}
.muted{color:var(--gris)}
.small{font-size:13px}
.center{text-align:center}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.stack>*+*{margin-top:16px}
.grid{display:grid;gap:1px;background:var(--filet)}
.hr{height:1px;background:var(--filet);border:0;margin:32px 0}

/* --- Boutons -------------------------------------------------------- */
.btn{
  display:inline-block;padding:11px 20px;border:1px solid var(--encre);
  background:var(--encre);color:#fff;font-size:14px;letter-spacing:.01em;
  border-radius:2px;transition:opacity .15s;
}
.btn:hover{opacity:.85;text-decoration:none}
.btn.ghost{background:transparent;color:var(--encre)}
.btn.ghost:hover{background:var(--encre);color:#fff;opacity:1}
.btn.light{background:#fff;color:var(--encre);border-color:var(--filet)}
.btn.light:hover{border-color:var(--encre);background:#fff;opacity:1}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.danger{background:var(--rouge);border-color:var(--rouge)}
.btn[disabled]{opacity:.4;cursor:not-allowed}

/* --- Champs --------------------------------------------------------- */
label{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--gris);margin-bottom:6px}
input,select,textarea{
  width:100%;padding:10px 12px;border:1px solid var(--filet);background:#fff;
  border-radius:2px;font-family:var(--sans);font-size:15px;color:var(--encre);
}
input:focus,select:focus,textarea:focus{border-color:var(--bleu);outline:none}
textarea{min-height:110px;resize:vertical}
.field+.field{margin-top:16px}

/* --- Étiquettes ----------------------------------------------------- */
.tag{display:inline-block;padding:2px 8px;border:1px solid var(--filet);
  border-radius:2px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--gris);background:#fff;white-space:nowrap}
.tag.or{color:var(--laiton);border-color:#E4D8BC;background:var(--laiton-clair)}
.tag.vert{color:var(--vert);border-color:#C6E0D3;background:var(--vert-clair)}
.tag.rouge{color:var(--rouge);border-color:#E8CACA;background:var(--rouge-clair)}
.tag.bleu{color:var(--bleu);border-color:#C9D8EC;background:var(--bleu-clair)}

/* =====================================================================
   SIGNATURE — la carte fédérale
   Une plaque institutionnelle : matricule, fonction, périmètre, échelon.
   C'est l'objet qui identifie un membre partout dans le système.
   ===================================================================== */
.carte{
  border:1px solid var(--encre);background:#fff;border-radius:2px;
  padding:16px 18px;position:relative;
}
.carte::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--encre);
}
.carte .matricule{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--gris)}
.carte .nom{font-family:var(--serif);font-size:21px;margin:2px 0 4px}
.carte .poste{font-size:14px}
.carte .lieu{font-size:13px;color:var(--gris);margin-top:2px}
.carte .ech{margin-top:12px;padding-top:10px;border-top:1px solid var(--filet);
  display:flex;justify-content:space-between;align-items:center;gap:8px}

/* --- Entête publique ------------------------------------------------ */
.entete{border-bottom:1px solid var(--filet);background:var(--papier);
  position:sticky;top:0;z-index:50}
.entete .wrap{display:flex;align-items:center;justify-content:space-between;
  gap:24px;height:72px}
.logo{display:flex;align-items:baseline;gap:10px;color:var(--encre)}
.logo:hover{text-decoration:none}
.logo b{font-family:var(--serif);font-size:26px;font-weight:600;letter-spacing:.02em}
.logo span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gris)}
.nav{display:flex;gap:24px;align-items:center}
.nav a{color:var(--encre);font-size:14px}
.nav a.on{border-bottom:1px solid var(--encre)}
@media(max-width:860px){.nav{display:none}}

/* --- Héros ---------------------------------------------------------- */
.heros{border-bottom:1px solid var(--filet);background:var(--blanc);
  position:relative;overflow:hidden}
.heros .wrap{padding:88px 24px 80px;position:relative;z-index:2}
.heros h1{font-size:clamp(34px,5.2vw,60px);max-width:16ch;font-weight:300}
.heros h1 em{font-style:italic;color:var(--bleu)}
.heros p{max-width:52ch;font-size:17px;color:var(--gris);margin-top:24px}
.maillage{position:absolute;inset:0;z-index:1;opacity:.5;pointer-events:none}

/* --- Blocs ---------------------------------------------------------- */
.bloc{padding:72px 0;border-bottom:1px solid var(--filet)}
.bloc.blanc{background:var(--blanc)}
.bloc h2{margin-bottom:8px}
.intro{max-width:60ch;color:var(--gris);font-size:16px}

.cartes{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:1px;background:var(--filet);border:1px solid var(--filet);margin-top:40px}
.cartes>div{background:var(--blanc);padding:28px}
.cartes h3{margin-bottom:8px}
.cartes p{color:var(--gris);font-size:14px;margin:0}

.chiffres{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:1px;background:var(--filet);border:1px solid var(--filet);margin-top:40px}
.chiffres>div{background:var(--blanc);padding:32px 24px}
.chiffres .n{font-family:var(--serif);font-size:46px;line-height:1;color:var(--bleu)}
.chiffres .l{font-size:13px;color:var(--gris);margin-top:8px}

.pied{padding:56px 0 40px;color:var(--gris);font-size:13px}
.pied .cols{display:grid;grid-template-columns:2fr 1fr 1fr;gap:40px}
@media(max-width:700px){.pied .cols{grid-template-columns:1fr}}
.pied a{color:var(--gris);display:block;padding:3px 0}

/* =====================================================================
   ESPACE MEMBRE
   ===================================================================== */
.app{display:grid;grid-template-columns:246px 1fr;min-height:100vh}
@media(max-width:900px){.app{grid-template-columns:1fr}}
.flanc{border-right:1px solid var(--filet);background:var(--blanc);
  padding:24px 0;position:sticky;top:0;height:100vh;overflow-y:auto}
@media(max-width:900px){.flanc{position:static;height:auto;border-right:0;
  border-bottom:1px solid var(--filet)}}
.flanc .titre{padding:0 20px 20px;border-bottom:1px solid var(--filet);margin-bottom:12px}
.flanc nav{display:flex;flex-direction:column}
.flanc nav a{padding:9px 20px;color:var(--encre);font-size:14px;
  border-left:2px solid transparent}
.flanc nav a:hover{background:var(--papier);text-decoration:none}
.flanc nav a.on{border-left-color:var(--encre);background:var(--papier);font-weight:500}
.flanc .groupe{padding:20px 20px 6px;font-family:var(--mono);font-size:10px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--gris)}
.contenu{padding:40px;max-width:900px}
@media(max-width:600px){.contenu{padding:24px 16px}}

.panneau{border:1px solid var(--filet);background:var(--blanc);border-radius:2px}
.panneau>.tete{padding:16px 20px;border-bottom:1px solid var(--filet);
  display:flex;justify-content:space-between;align-items:center;gap:12px}
.panneau>.corps{padding:20px}
.ligne{padding:16px 20px;border-bottom:1px solid var(--filet);
  display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.ligne:last-child{border-bottom:0}

.tuiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  gap:1px;background:var(--filet);border:1px solid var(--filet)}
.tuile{background:var(--blanc);padding:22px;display:block;color:var(--encre);
  min-height:132px;transition:background .12s}
.tuile:hover{background:var(--papier);text-decoration:none}
.tuile h3{font-size:17px;margin-bottom:6px}
.tuile p{font-size:13px;color:var(--gris);margin:0}
.tuile.bloquee{opacity:.55}

.jauge{height:3px;background:var(--filet);margin-top:10px}
.jauge>i{display:block;height:100%;background:var(--laiton)}

.alerte{padding:14px 18px;border:1px solid var(--filet);border-left:3px solid var(--bleu);
  background:var(--blanc);font-size:14px;border-radius:2px}
.alerte.err{border-left-color:var(--rouge);background:var(--rouge-clair)}
.alerte.ok{border-left-color:var(--vert);background:var(--vert-clair)}

.vide{padding:48px 20px;text-align:center;color:var(--gris);font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--gris);font-weight:400;padding:10px 12px;border-bottom:1px solid var(--filet)}
td{padding:12px;border-bottom:1px solid var(--filet);vertical-align:middle}
tr:last-child td{border-bottom:0}
</style>
</head>
<body>
<div id="racine"></div>

<script type="module">
import { h, render } from 'https://esm.sh/preact@10.19.3';
import { useState, useEffect, useCallback } from 'https://esm.sh/preact@10.19.3/hooks';
import htm from 'https://esm.sh/htm@3.1.1';
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.39.3';

const html = htm.bind(h);

/* =====================================================================
   1. CONNEXION À LA BASE
   Ces deux valeurs sont publiques par conception : elles sont faites
   pour vivre dans le navigateur. La clé « secret » ne quitte jamais
   le tableau de bord Supabase.
   ===================================================================== */
const SUPABASE_URL = 'https://ibxydmtqdyynteiopjiv.supabase.co';
const SUPABASE_KEY = 'sb_publishable_A-2UHxGyxQ1--eEnsULBlQ_eyebc9dh';

const db = createClient(SUPABASE_URL, SUPABASE_KEY);

/* Liens externes de la fédération -------------------------------------- */
const EXTERNE = {
  webmail:   'https://mail.google.com/a/ffce-asso.fr',
  drive:     'https://drive.google.com/drive/u/0/',
  agenda:    'https://calendar.google.com/',
  adhesion:  ''   // adresse de la campagne HelloAsso, à coller ici
};

/* =====================================================================
   2. PETITS OUTILS
   ===================================================================== */
const jour = d => d ? new Date(d).toLocaleDateString('fr-FR',
  {day:'numeric',month:'long',year:'numeric'}) : '—';
const initiales = p => ((p?.prenom?.[0]||'') + (p?.nom?.[0]||'')).toUpperCase() || '?';
const nomComplet = p => [p?.prenom, p?.nom].filter(Boolean).join(' ') || p?.email || 'Sans nom';

function useRoute(){
  const [route, setRoute] = useState(location.hash.slice(1) || '/');
  useEffect(() => {
    const f = () => { setRoute(location.hash.slice(1) || '/'); window.scrollTo(0,0); };
    addEventListener('hashchange', f);
    return () => removeEventListener('hashchange', f);
  }, []);
  return route;
}
const aller = r => { location.hash = r; };

/* =====================================================================
   3. VITRINE PUBLIQUE
   ===================================================================== */

/* Le maillage : la fédération est un réseau de territoires. Le motif du
   héros le dit littéralement — des points reliés, densité variable. */
function Maillage(){
  const pts = [];
  for(let i=0;i<44;i++){
    pts.push({ x: (i*137.5)%100, y: ((i*61.8)%100), r: i%7===0 ? 3 : 1.6 });
  }
  return html`
    <svg class="maillage" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      ${pts.map((p,i)=> i<pts.length-1 && html`
        <line x1=${p.x} y1=${p.y} x2=${pts[i+1].x} y2=${pts[i+1].y}
              stroke="#E2DFD8" stroke-width=".14" />`)}
      ${pts.map(p=> html`<circle cx=${p.x} cy=${p.y} r=${p.r/8}
              fill=${p.r>2 ? '#1B4B8F' : '#CFCBC2'} />`)}
    </svg>`;
}

function EntetePublique({ route, session }){
  const liens = [
    ['/', 'Accueil'], ['/association','La fédération'], ['/actions','Nos actions'],
    ['/reseau','Le réseau'], ['/rejoindre','Nous rejoindre'], ['/contact','Contact']
  ];
  return html`
    <header class="entete">
      <div class="wrap">
        <a class="logo" href="#/">
          <b>FFCE</b><span>Citoyenneté & Égalité des chances</span>
        </a>
        <nav class="nav">
          ${liens.map(([r,t]) => html`
            <a href=${'#'+r} class=${route===r?'on':''}>${t}</a>`)}
        </nav>
        <a class="btn ghost sm" href="#/espace">
          ${session ? 'Mon espace' : 'Se connecter'}
        </a>
      </div>
    </header>`;
}

function Pied({ txt }){
  return html`
    <footer class="pied">
      <div class="wrap">
        <div class="cols">
          <div>
            <div class="logo" style="margin-bottom:12px">
              <b>FFCE</b>
            </div>
            <p style="max-width:34ch">${txt.nom_legal}</p>
            <p class="mono">${txt.siege}</p>
            <p class="mono">RNA ${txt.rna} · SIREN ${txt.siren}</p>
          </div>
          <div>
            <div class="eyebrow" style="margin-bottom:8px">La fédération</div>
            <a href="#/association">Qui nous sommes</a>
            <a href="#/actions">Nos actions</a>
            <a href="#/reseau">Le réseau</a>
          </div>
          <div>
            <div class="eyebrow" style="margin-bottom:8px">Pratique</div>
            <a href="#/rejoindre">Nous rejoindre</a>
            <a href="#/contact">Contact</a>
            <a href="#/espace">Espace membre</a>
            <a href="#/mentions">Mentions légales</a>
            <a href="#/confidentialite">Confidentialité</a>
          </div>
        </div>
      </div>
    </footer>`;
}

function Accueil({ txt }){
  return html`
    <section class="heros">
      <${Maillage} />
      <div class="wrap">
        <div class="eyebrow" style="margin-bottom:24px">Association déclarée · depuis 2020</div>
        <h1>${txt.accroche}</h1>
        <p>${txt.sous_accroche}</p>
        <div class="row" style="margin-top:36px">
          <a class="btn" href="#/rejoindre">Rejoindre la fédération</a>
          <a class="btn ghost" href="#/actions">Voir nos actions</a>
        </div>
      </div>
    </section>

    <section class="bloc blanc">
      <div class="wrap">
        <div class="eyebrow">Ce que nous faisons</div>
        <h2>Quatre terrains d'engagement</h2>
        <p class="intro">Nous intervenons en milieu scolaire, périscolaire et
        extra-scolaire, aux côtés des établissements, des collectivités et des
        acteurs de terrain.</p>
        <div class="cartes">
          <div>
            <h3>Éducation à la citoyenneté</h3>
            <p>Ateliers d'éducation civique et de culture démocratique, du collège
            au lycée.</p>
          </div>
          <div>
            <h3>Mémoire et transmission</h3>
            <p>Transmission de l'histoire de la Résistance et du devoir de mémoire
            auprès des jeunes générations.</p>
          </div>
          <div>
            <h3>Égalité des chances</h3>
            <p>Lutte contre les discriminations et le harcèlement, égalité entre
            les femmes et les hommes.</p>
          </div>
          <div>
            <h3>Éducation aux médias</h3>
            <p>Comprendre l'information, ses circuits et ses pièges, pour exercer
            un esprit critique.</p>
          </div>
        </div>
      </div>
    </section>

    <section class="bloc">
      <div class="wrap">
        <div class="eyebrow">Le réseau en chiffres</div>
        <h2>Une fédération de terrain</h2>
        <div class="chiffres">
          <div><div class="n">${txt.nb_benevoles}</div><div class="l">Bénévoles engagés</div></div>
          <div><div class="n">${txt.nb_departements}</div><div class="l">Départements couverts</div></div>
          <div><div class="n">${txt.nb_actions}</div><div class="l">Actions menées</div></div>
          <div><div class="n">${txt.nb_jeunes}</div><div class="l">Jeunes touchés</div></div>
        </div>
      </div>
    </section>

    <section class="bloc blanc">
      <div class="wrap spread">
        <div>
          <h2>Un engagement se construit, il ne s'impose pas.</h2>
          <p class="intro" style="margin-top:12px">Il n'y a ni parcours attendu,
          ni profil imposé. Les rôles se construisent avec chacun, selon les
          disponibilités et les envies.</p>
        </div>
        <a class="btn" href="#/rejoindre">Commencer</a>
      </div>
    </section>`;
}

function Association({ txt }){
  return html`
    <section class="bloc blanc">
      <div class="wrap">
        <div class="eyebrow">La fédération</div>
        <h1 style="margin:8px 0 32px">Notre raison d'être</h1>
        <div style="max-width:62ch;font-size:17px">
          <p>${txt.mission}</p>
          <p>${txt.histoire}</p>
        </div>
        <hr class="hr" />
        <div class="cartes" style="margin-top:0">
          <div><h3>Fédérer</h3><p>Réunir des bénévoles autour d'un projet commun,
            partout sur le territoire, sans condition de diplôme ou d'expérience.</p></div>
          <div><h3>Former</h3><p>Donner à chacun les repères et les outils pour

          <div><h3>Agir</h3><p>Mener des actions concrètes, mesurables, avec les
            établissements et les collectivités.</p></div>
        </div>
      </div>
    </section>`;
}

function Actions(){
  const items = [
    ['Quartiers d\'été', 'Un relais local dans chaque département, pour faire vivre l\'été des quartiers populaires.'],
    ['Interventions scolaires', 'Ateliers citoyenneté, valeurs de la République et lutte contre le harcèlement.'],
    ['Mémoire vivante', 'Rencontres, visites et travaux d\'élèves autour de l\'histoire de la Résistance.'],

    <section class="bloc blanc">
      <div class="wrap">
        <div class="eyebrow">Nos actions</div>

        <p class="intro">Chaque action est portée par une équipe locale et
        soutenue par l'équipe nationale.</p>
        <div class="cartes">
          ${items.map(([t,d]) => html`<div><h3>${t}</h3><p>${d}</p></div>`)}
        </div>
      </div>
    </section>`;
}

function Reseau(){
  const [terr, setTerr] = useState([]);
  useEffect(() => {
    db.from('territoires').select('id,nom,echelle,code,parent_id')
      .in('echelle',['region','departement']).order('nom')
      .then(({data}) => setTerr(data || []));
  }, []);
  const regions = terr.filter(t => t.echelle === 'region');
  return html`
    <section class="bloc blanc">
      <div class="wrap">
        <div class="eyebrow">Le réseau</div>
        <h1 style="margin:8px 0 16px">Une organisation à quatre échelles</h1>
        <p class="intro">La fédération est structurée du national au local.

function Connexion(){
  const [email, setEmail] = useState('');
  const [mdp, setMdp] = useState('');
  const [err, setErr] = useState('');
  const [envoi, setEnvoi] = useState(false);

  async function entrer(e){
    e.preventDefault(); setErr(''); setEnvoi(true);
    const { error } = await db.auth.signInWithPassword({ email, password: mdp });
    setEnvoi(false);
    if (error) setErr("Adresse ou mot de passe incorrect.");
    else aller('/espace');
  }

  return html`
    <section class="bloc blanc">
      <div class="wrap" style="max-width:440px">
        <div class="eyebrow">Espace membre</div>
        <h1 style="margin:8px 0 32px">Se connecter</h1>
        <form onSubmit=${entrer} class="stack">
          <div class="field">
            <label for="e">Adresse électronique</label>
            <input id="e" type="email" required value=${email}
              onInput=${e=>setEmail(e.target.value)} autocomplete="email" />
          </div>
          <div class="field">
            <label for="m">Mot de passe</label>
            <input id="m" type="password" required value=${mdp}
              onInput=${e=>setMdp(e.target.value)} autocomplete="current-password" />
          </div>
          ${err && html`<div class="alerte err">${err}</div>`}
          <button class="btn" style="width:100%" disabled=${envoi}>

        </p>
      </div>
    </section>`;
}

function Inscription(){
  const [f, setF] = useState({prenom:'',nom:'',email:'',mdp:'',territoire:''});
  const [terr, setTerr] = useState([]);
  const [err, setErr] = useState('');
  const [fait, setFait] = useState(false);
  const [envoi, setEnvoi] = useState(false);
  const maj = (k,v) => setF(o => ({...o, [k]:v}));

  useEffect(() => {
    db.from('territoires').select('id,nom,echelle').eq('echelle','departement')
      .order('code').then(({data}) => setTerr(data || []));
  }, []);

  async function creer(e){
    e.preventDefault(); setErr(''); setEnvoi(true);
    const { data, error } = await db.auth.signUp({
      email: f.email, password: f.mdp,
      options: { data: { prenom: f.prenom, nom: f.nom } }
    });
    if (error){ setErr(error.message); setEnvoi(false); return; }
    if (f.territoire && data.user){
      await db.from('profils').update({ territoire_id: f.territoire }).eq('id', data.user.id);
    }
    setEnvoi(false); setFait(true);
  }

  if (fait) return html`
    <section class="bloc blanc">
      <div class="wrap" style="max-width:520px">
        <h1 style="margin-bottom:16px">Votre demande est enregistrée</h1>
        <div class="alerte ok">
          La Direction générale vérifie votre inscription. Vous recevrez un
          message dès l'ouverture de vos accès. En attendant, vous pouvez déjà
          vous connecter : votre espace affichera l'état de votre dossier.
        </div>
        <p style="margin-top:24px"><a class="btn" href="#/espace">Aller à mon espace</a></p>
      </div>
    </section>`;

  return html`
    <section class="bloc blanc">
      <div class="wrap" style="max-width:520px">
        <div class="eyebrow">Nous rejoindre</div>
        <h1 style="margin:8px 0 32px">Créer mon compte</h1>
        <form onSubmit=${creer} class="stack">
          <div class="row" style="gap:16px">
            <div class="field" style="flex:1;min-width:140px">
              <label for="p">Prénom</label>
              <input id="p" required value=${f.prenom} onInput=${e=>maj('prenom',e.target.value)} />
            </div>
            <div class="field" style="flex:1;min-width:140px;margin-top:0">
              <label for="n">Nom</label>
              <input id="n" required value=${f.nom} onInput=${e=>maj('nom',e.target.value)} />
            </div>
          </div>
          <div class="field">
            <label for="ie">Adresse électronique</label>
            <input id="ie" type="email" required value=${f.email}
              onInput=${e=>maj('email',e.target.value)} autocomplete="email" />
          </div>
          <div class="field">
            <label for="im">Mot de passe</label>
            <input id="im" type="password" required minlength="8" value=${f.mdp}
              onInput=${e=>maj('mdp',e.target.value)} autocomplete="new-password" />
            <p class="small muted" style="margin:6px 0 0">Huit caractères minimum.</p>
          </div>
          <div class="field">
            <label for="it">Département de rattachement</label>
            <select id="it" required value=${f.territoire} onChange=${e=>maj('territoire',e.target.value)}>
              <option value="">Choisir…</option>
              ${terr.map(t => html`<option value=${t.id}>${t.nom}</option>`)}
            </select>
          </div>
          ${err && html`<div class="alerte err">${err}</div>`}
          <button class="btn" style="width:100%" disabled=${envoi}>
            ${envoi ? 'Envoi…' : 'Créer mon compte'}</button>
          <p class="small muted">
            En créant un compte, vous acceptez la
            <a href="#/confidentialite">politique de confidentialité</a>.
          </p>
        </form>
      </div>
    </section>`;
}

function MesDemandes({ p, apps, demandes, recharger }){
  const [type, setType] = useState('acces_application');
  const [cible, setCible] = useState('');
  const [objet, setObjet] = useState('');
  const [message, setMessage] = useState('');
  const [msg, setMsg] = useState('');

  const fermees = apps.filter(a => !a.ouvert && a.actif);

  async function envoyer(e){
    e.preventDefault(); setMsg('');
    const app = apps.find(a => a.code === cible);
    const { error } = await db.from('demandes').insert({
      profil_id: p.id, type,
      objet: objet || (app ? 'Accès à « '+app.nom+' »' : 'Demande'),
      cible: cible || null, message
    });
    if (error) return setMsg('Envoi impossible : ' + error.message);
    setObjet(''); setMessage(''); setCible(''); setMsg('Demande transmise à la Direction générale.');
    recharger();
  }

  const etiquette = s => ({
    ouverte:  html`<span class="tag bleu">En attente</span>`,
    en_cours: html`<span class="tag bleu">En cours</span>`,
    acceptee: html`<span class="tag vert">Accordée</span>`,
    refusee:  html`<span class="tag rouge">Refusée</span>`
  })[s];

  return html`
    <div>
      <div class="eyebrow">Mes demandes</div>
      <h1 style="margin:6px 0 32px">Guichet</h1>

      <form onSubmit=${envoyer} class="panneau">

                <option value="">Choisir…</option>
                ${fermees.map(a => html`<option value=${a.code}>${a.nom}</option>`)}
              </select>
            </div>`}
          ${type !== 'acces_application' && html`
            <div class="field">
              <label>Objet</label>
              <input required value=${objet} onInput=${e=>setObjet(e.target.value)}
                placeholder="En une ligne" />

          <div class="field">
            <label>Motif</label>

          ${msg && html`<div class=${'alerte '+(msg.startsWith('Demande')?'ok':'err')}>${msg}</div>`}
          <div><button class="btn">Transmettre</button></div>
        </div>
      </form>

      <div class="panneau" style="margin-top:24px">
        <div class="tete"><h3 style="font-size:17px">Suivi</h3></div>
        ${demandes.length === 0
          ? html`<div class="vide">Aucune demande déposée à ce jour.</div>`

            <div class="ligne">
              <div>

              </div>
              ${etiquette(d.statut)}

function Formations({ p }){
  const [liste, setListe] = useState(null);
  const [certifs, setCertifs] = useState([]);

  useEffect(() => { (async () => {
    const { data: fs } = await db.from('formations').select('*')
      .eq('publiee', true).order('ordre');
    const avec = await Promise.all((fs||[]).map(async f => {
      const { data } = await db.rpc('avancement', { p_formation: f.id });
      const a = Array.isArray(data) ? data[0] : data;
      return { ...f, ...(a || {total:0, faites:0, pourcent:0}) };
    }));
    setListe(avec);
    const { data: c } = await db.from('certifications_obtenues')
      .select('*, certifications(nom, description)').eq('profil_id', p.id);
    setCertifs(c || []);
  })(); }, [p.id]);

  if (!liste) return html`<div class="vide">Chargement…</div>`;

  return html`
    <div>
      <div class="eyebrow">Formations</div>
      <h1 style="margin:6px 0 8px">Se former</h1>
      <p class="muted" style="max-width:56ch">
        Chaque parcours achevé délivre une certification inscrite à votre
        compte. Certains projets et groupes de travail l'exigeront.
      </p>

      ${certifs.length > 0 && html`
        <div class="panneau" style="margin-top:32px">
          <div class="tete"><h3 style="font-size:17px">Mes certifications</h3></div>
          ${certifs.map(c => html`
            <div class="ligne">
              <div>
                <div>${c.certifications?.nom || c.code}</div>
                <div class="small muted">
                  Délivrée le ${jour(c.obtenue_le)}
                  ${c.expire_le ? ' · valable jusqu\u2019au ' + jour(c.expire_le) : ''}
                </div>
              </div>
              <span class="mono muted">${c.numero}</span>
            </div>`)}
        </div>`}

      <div class="tuiles" style="margin-top:32px">
        ${liste.map(f => html`
          <a class="tuile" href=${'#/espace/formation/'+f.id}>
            <h3>${f.titre}</h3>
            <p>${f.resume || ''}</p>
            <div class="jauge" style="margin-top:14px">
              <i style=${'width:'+(f.pourcent||0)+'%'}></i></div>
            <div class="small muted" style="margin-top:8px">
              ${f.faites}/${f.total} leçons
              ${f.duree_min ? ' · ' + f.duree_min + ' min' : ''}
              ${f.pourcent === 100 ? ' · achevé' : ''}
            </div>
          </a>`)}
      </div>
      ${liste.length === 0 && html`<div class="vide">Aucune formation publiée pour l\u2019instant.</div>`}
    </div>`;
}

function Formation({ p, id }){
  const [f, setF] = useState(null);
  const [parcours, setParcours] = useState([]);
  const [faites, setFaites] = useState({});
  const [ouverte, setOuverte] = useState(null);   // leçon affichée

  const charger = useCallback(async () => {
    const { data: form } = await db.from('formations').select('*').eq('id', id).maybeSingle();
    setF(form);
    const { data: par } = await db.from('v_parcours').select('*')
      .eq('formation_id', id).order('rang');
    setParcours(par || []);
    const { data: pr } = await db.from('progression').select('lecon_id,score')
      .eq('profil_id', p.id);
    setFaites(Object.fromEntries((pr||[]).map(x => [x.lecon_id, x.score])));
  }, [id, p.id]);

  useEffect(() => { charger(); }, [charger]);

  if (!f) return html`<div class="vide">Chargement…</div>`;

  const total = parcours.length;
  const nbFaites = parcours.filter(l => l.lecon_id in faites).length;
  const pct = total ? Math.round(nbFaites / total * 100) : 0;

  // Une leçon est ouverte si la précédente est achevée.
  const estOuverte = i => i === 0 || (parcours[i-1] && parcours[i-1].lecon_id in faites);

  if (ouverte){
    const i = parcours.findIndex(l => l.lecon_id === ouverte);
    return html`<${Lecon} lecon=${parcours[i]} suivante=${parcours[i+1]}
      dejaFaite=${ouverte in faites}
      fermer=${() => { setOuverte(null); charger(); }}
      allerSuivante=${() => { setOuverte(parcours[i+1]?.lecon_id || null); charger(); }} />`;
  }

  const modules = [];
  parcours.forEach(l => {
    let m = modules.find(x => x.id === l.module_id);
    if (!m){ m = { id: l.module_id, titre: l.module_titre, lecons: [] }; modules.push(m); }
    m.lecons.push(l);
  });

  const picto = { lecture:'Lecture', video:'Vidéo', document:'Document', quiz:'Quiz' };

  return html`
    <div>
      <a class="small" href="#/espace/formations">← Toutes les formations</a>
      <h1 style="margin:12px 0 8px">${f.titre}</h1>
      <p class="muted" style="max-width:60ch">${f.description || f.resume || ''}</p>

      <div class="panneau" style="margin-top:24px">
        <div class="corps">
          <div class="spread">
            <span class="small">${nbFaites} leçon${nbFaites>1?'s':''} sur ${total}</span>
            <span class="mono">${pct} %</span>
          </div>
          <div class="jauge" style="margin-top:10px"><i style=${'width:'+pct+'%'}></i></div>
          ${pct === 100 && html`<div class="alerte ok" style="margin-top:16px">
            Parcours achevé. Votre certification est inscrite à votre compte.</div>`}
        </div>
      </div>

      ${modules.map(m => html`
        <div class="panneau" style="margin-top:24px">
          <div class="tete"><h3 style="font-size:17px">${m.titre}</h3></div>
          ${m.lecons.map(l => {
            const i = parcours.findIndex(x => x.lecon_id === l.lecon_id);
            const faite = l.lecon_id in faites;
            const ok = estOuverte(i);
            return html`
              <div class="ligne">
                <div>
                  <div style=${ok ? '' : 'opacity:.5'}>${l.lecon_titre}</div>
                  <div class="small muted">
                    ${picto[l.type]}${l.duree_min ? ' · ' + l.duree_min + ' min' : ''}
                    ${faite && faites[l.lecon_id] != null ? ' · ' + faites[l.lecon_id] + ' %' : ''}
                  </div>
                </div>
                ${faite
                  ? html`<div class="row"><span class="tag vert">Achevée</span>
                      <button class="btn sm light" onClick=${()=>setOuverte(l.lecon_id)}>Revoir</button></div>`
                  : ok
                    ? html`<button class="btn sm" onClick=${()=>setOuverte(l.lecon_id)}>Commencer</button>`
                    : html`<span class="tag">Verrouillée</span>`}
              </div>`;
          })}
        </div>`)}
    </div>`;
}

function Lecon({ lecon, suivante, dejaFaite, fermer, allerSuivante }){
  const [detail, setDetail] = useState(null);
  const [questions, setQuestions] = useState([]);
  const [choix, setChoix] = useState({});      // question_id → Set d'id de réponses
  const [resultat, setResultat] = useState(null);
  const [msg, setMsg] = useState('');
  const [envoi, setEnvoi] = useState(false);

  useEffect(() => { (async () => {
    const { data: l } = await db.from('lecons').select('*').eq('id', lecon.lecon_id).maybeSingle();
    setDetail(l);
    if (l && l.type === 'quiz'){
      const { data: qs } = await db.from('questions').select('*')
        .eq('lecon_id', l.id).order('ordre');
      const avec = await Promise.all((qs||[]).map(async q => {
        const { data: rs } = await db.from('v_choix').select('id,texte,ordre')
          .eq('question_id', q.id).order('ordre');
        return { ...q, choix: rs || [] };
      }));
      setQuestions(avec);
    }
  })(); }, [lecon.lecon_id]);

  if (!detail) return html`<div class="vide">Chargement…</div>`;

  function cocher(qid, rid){
    setChoix(c => {
      const s = new Set(c[qid] || []);
      s.has(rid) ? s.delete(rid) : s.add(rid);
      return { ...c, [qid]: s };
    });
  }

  async function achever(){
    setEnvoi(true); setMsg('');
    const { data, error } = await db.rpc('terminer_lecon', { p_lecon: detail.id });
    setEnvoi(false);
    if (error) return setMsg(error.message);
    if (!data.ok) return setMsg(data.message);
    suivante ? allerSuivante() : fermer();
  }

  async function corriger(){
    setEnvoi(true); setMsg('');
    const tous = Object.values(choix).flatMap(s => [...s]);
    const { data, error } = await db.rpc('valider_quiz',
      { p_lecon: detail.id, p_choix: tous });
    setEnvoi(false);
    if (error) return setMsg(error.message);
    if (!data.ok) return setMsg(data.message);
    setResultat(data);
  }

  return html`
    <div>
      <a class="small" href="#" onClick=${e=>{e.preventDefault();fermer()}}>← Retour au parcours</a>
      <div class="eyebrow" style="margin-top:16px">${lecon.module_titre}</div>
      <h1 style="margin:6px 0 24px">${detail.titre}</h1>

      ${detail.type === 'lecture' && html`
        <div class="panneau"><div class="corps"
          style="white-space:pre-wrap;font-size:16px;max-width:62ch">${detail.contenu||''}</div></div>`}

      ${detail.type === 'video' && html`
        <div class="panneau"><div class="corps">
          <p><a class="btn" href=${detail.url} target="_blank" rel="noopener">Ouvrir la vidéo ↗</a></p>
          ${detail.contenu && html`<div style="white-space:pre-wrap;margin-top:16px">${detail.contenu}</div>`}
        </div></div>`}

      ${detail.type === 'document' && html`
        <div class="panneau"><div class="corps">
          <p><a class="btn" href=${detail.url} target="_blank" rel="noopener">Ouvrir le document ↗</a></p>
          ${detail.contenu && html`<div style="white-space:pre-wrap;margin-top:16px">${detail.contenu}</div>`}
        </div></div>`}

      ${detail.type === 'quiz' && html`
        <div>
          ${resultat && html`
            <div class=${'alerte ' + (resultat.reussi ? 'ok' : 'err')} style="margin-bottom:24px">
              ${resultat.justes} bonne${resultat.justes>1?'s':''} réponse${resultat.justes>1?'s':''}
              sur ${resultat.total} — ${resultat.score} %.
              ${resultat.reussi
                ? ' Quiz validé.'
                : ' Il en faut ' + resultat.seuil + ' % pour valider. Reprenez vos réponses.'}
            </div>`}

          ${questions.map((q, n) => html`
            <div class="panneau" style="margin-bottom:16px">
              <div class="corps">
                <div class="mono muted">Question ${n+1} sur ${questions.length}</div>
                <div style="font-size:16px;margin:8px 0 16px">${q.enonce}</div>
                ${q.choix.map(r => html`
                  <label class="row" style="text-transform:none;letter-spacing:0;
                      font-size:15px;color:var(--encre);padding:6px 0;margin:0;cursor:pointer">
                    <input type="checkbox" style="width:auto"
                      checked=${(choix[q.id]||new Set()).has(r.id)}
                      onChange=${()=>cocher(q.id, r.id)} />
                    <span>${r.texte}</span>
                  </label>`)}
                ${q.aide && html`<p class="small muted" style="margin:12px 0 0">${q.aide}</p>`}
              </div>
            </div>`)}
          <p class="small muted">Une question peut appeler plusieurs réponses.</p>
        </div>`}

      ${msg && html`<div class="alerte err" style="margin-top:24px">${msg}</div>`}

      <div class="row" style="margin-top:32px">
        ${detail.type === 'quiz'
          ? (resultat && resultat.reussi
              ? (suivante
                  ? html`<button class="btn" onClick=${allerSuivante}>Leçon suivante</button>`
                  : html`<button class="btn" onClick=${fermer}>Terminer le parcours</button>`)
              : html`<button class="btn" onClick=${corriger} disabled=${envoi}>
                  ${envoi ? 'Correction…' : (resultat ? 'Corriger à nouveau' : 'Valider mes réponses')}</button>`)
          : (dejaFaite
              ? (suivante
                  ? html`<button class="btn" onClick=${allerSuivante}>Leçon suivante</button>`
                  : html`<button class="btn" onClick=${fermer}>Retour au parcours</button>`)
              : html`<button class="btn" onClick=${achever} disabled=${envoi}>
                  ${envoi ? 'Enregistrement…' : 'J\u2019ai terminé cette leçon'}</button>`)}
        <button class="btn light" onClick=${fermer}>Revenir au parcours</button>
      </div>
    </div>`;
}


/* =====================================================================
   5 ter. GROUPES DE TRAVAIL
   Le catalogue, l'entrée dans un groupe, les documents, les tâches.
   Un groupe peut exiger une certification : la formation conditionne
   alors l'accès au projet.
   ===================================================================== */

function Groupes({ p }){
  const [liste, setListe] = useState(null);
  const [miens, setMiens] = useState({});
  const [certifs, setCertifs] = useState([]);
  const [terr, setTerr] = useState([]);
  const [creer, setCreer] = useState(false);
  const [f, setF] = useState({nom:'',objet:'',territoire:'',certification:'',niveau:'10',ouvert:'true'});
  const [msg, setMsg] = useState('');

  const peutCreer = p.echelon >= 3 || p.niveau >= 50;

  const charger = useCallback(async () => {
    const [{ data: gs }, { data: ms }, { data: cs }, { data: ts }] = await Promise.all([
      db.from('v_groupes').select('*').eq('statut','actif').order('nom'),
      db.from('gt_membres').select('groupe_id,role,statut').eq('profil_id', p.id),
      db.from('certifications').select('code,nom').eq('actif', true).order('nom'),
      db.from('territoires').select('id,nom,echelle').order('echelle').order('nom')
    ]);
    setListe(gs || []);
    setMiens(Object.fromEntries((ms||[]).map(m => [m.groupe_id, m])));
    setCertifs(cs || []); setTerr(ts || []);
  }, [p.id]);

  useEffect(() => { charger(); }, [charger]);

  async function rejoindre(id){
    setMsg('');
    const { data, error } = await db.rpc('rejoindre_groupe', { p_groupe: id });
    if (error) return setMsg(error.message);
    if (!data.ok) return setMsg(data.message);
    charger();
  }

  async function repondre(id, oui){
    await db.rpc('repondre_invitation', { p_groupe: id, p_accepte: oui });
    charger();
  }

  async function envoyerCreation(e){
    e.preventDefault(); setMsg('');
    const { data, error } = await db.rpc('creer_groupe', {
      p_nom: f.nom, p_objet: f.objet,
      p_territoire: f.territoire || null,
      p_certification: f.certification || null,
      p_niveau_min: Number(f.niveau),
      p_ouvert: f.ouvert === 'true'
    });
    if (error) return setMsg(error.message);
    if (!data.ok) return setMsg(data.message);
    setCreer(false); setF({nom:'',objet:'',territoire:'',certification:'',niveau:'10',ouvert:'true'});
    aller('/espace/groupe/' + data.id);
  }

  if (!liste) return html`<div class="vide">Chargement…</div>`;

  const invitations = liste.filter(g => miens[g.id]?.statut === 'invite');
  const mesGroupes  = liste.filter(g => miens[g.id]?.statut === 'actif');
  const autres      = liste.filter(g => !miens[g.id] || miens[g.id].statut === 'parti');

  const carteGroupe = (g, action) => html`
    <div class="ligne">
      <div style="flex:1;min-width:220px">
        <div>${g.nom}</div>
        <div class="small muted">${g.objet || ''}</div>
        <div class="row" style="margin-top:8px;gap:6px">
          <span class="tag">${g.nb_membres} membre${g.nb_membres>1?'s':''}</span>
          ${g.territoire_nom && html`<span class="tag">${g.territoire_nom}</span>`}
          ${g.certification_nom && html`<span class="tag or">${g.certification_nom} requis</span>`}
          ${!g.ouvert && html`<span class="tag">Sur invitation</span>`}
        </div>
      </div>
      ${action}
    </div>`;

  return html`
    <div>
      <div class="spread">
        <div>
          <div class="eyebrow">Groupes de travail</div>
          <h1 style="margin:6px 0 0">Projets et chantiers</h1>
        </div>
        ${peutCreer && html`<button class="btn" onClick=${()=>setCreer(c=>!c)}>
          ${creer ? 'Annuler' : 'Créer un groupe'}</button>`}
      </div>
      <p class="muted" style="max-width:58ch;margin-top:12px">
        Certains groupes exigent une certification. Vous l\u2019obtenez en
        achevant la formation correspondante.
      </p>

      ${msg && html`<div class="alerte err" style="margin-top:24px">${msg}</div>`}

      ${creer && html`
        <form onSubmit=${envoyerCreation} class="panneau" style="margin-top:24px">
          <div class="tete"><h3 style="font-size:17px">Nouveau groupe</h3></div>
          <div class="corps stack">
            <div class="field"><label>Nom</label>
              <input required value=${f.nom} onInput=${e=>setF(o=>({...o,nom:e.target.value}))} /></div>
            <div class="field"><label>Objet</label>
              <textarea required value=${f.objet}
                onInput=${e=>setF(o=>({...o,objet:e.target.value}))}
                placeholder="À quoi sert ce groupe, en deux phrases."></textarea></div>
            <div class="field"><label>Périmètre</label>
              <select value=${f.territoire} onChange=${e=>setF(o=>({...o,territoire:e.target.value}))}>
                <option value="">National — ouvert à tous</option>
                ${terr.map(t => html`<option value=${t.id}>${t.nom} (${t.echelle})</option>`)}
              </select></div>
            <div class="field"><label>Certification exigée</label>
              <select value=${f.certification} onChange=${e=>setF(o=>({...o,certification:e.target.value}))}>
                <option value="">Aucune</option>
                ${certifs.map(c => html`<option value=${c.code}>${c.nom}</option>`)}
              </select></div>
            <div class="field"><label>Entrée</label>
              <select value=${f.ouvert} onChange=${e=>setF(o=>({...o,ouvert:e.target.value}))}>
                <option value="true">Libre — on rejoint seul</option>
                <option value="false">Sur invitation du responsable</option>
              </select></div>
            <div><button class="btn">Créer le groupe</button></div>
            <p class="small muted">Vous en serez le responsable.</p>
          </div>
        </form>`}

      ${invitations.length > 0 && html`
        <div class="panneau" style="margin-top:24px">
          <div class="tete"><h3 style="font-size:17px">Invitations reçues</h3>
            <span class="tag bleu">${invitations.length}</span></div>
          ${invitations.map(g => carteGroupe(g, html`
            <div class="row">
              <button class="btn sm" onClick=${()=>repondre(g.id,true)}>Accepter</button>
              <button class="btn sm light" onClick=${()=>repondre(g.id,false)}>Décliner</button>
            </div>`))}
        </div>`}

      <div class="panneau" style="margin-top:24px">
        <div class="tete"><h3 style="font-size:17px">Mes groupes</h3>
          <span class="tag">${mesGroupes.length}</span></div>
        ${mesGroupes.length === 0
          ? html`<div class="vide">Vous ne participez à aucun groupe pour l\u2019instant.</div>`
          : mesGroupes.map(g => carteGroupe(g, html`
              <div class="row">
                ${miens[g.id]?.role === 'responsable' && html`<span class="tag or">Responsable</span>`}
                <a class="btn sm" href=${'#/espace/groupe/'+g.id}>Ouvrir</a>
              </div>`))}
      </div>

      <div class="panneau" style="margin-top:24px">
        <div class="tete"><h3 style="font-size:17px">Autres groupes</h3></div>
        ${autres.length === 0
          ? html`<div class="vide">Rien d\u2019autre à rejoindre.</div>`
          : autres.map(g => carteGroupe(g,
              g.ouvert
                ? html`<button class="btn sm light" onClick=${()=>rejoindre(g.id)}>Rejoindre</button>`
                : html`<span class="tag">Sur invitation</span>`))}
      </div>
    </div>`;
}

function Groupe({ p, id }){
  const [g, setG] = useState(null);
  const [onglet, setOnglet] = useState('taches');
  const [membres, setMembres] = useState([]);
  const [docs, setDocs] = useState([]);
  const [taches, setTaches] = useState([]);
  const [gens, setGens] = useState({});     // id → profil, pour les noms
  const [msg, setMsg] = useState('');
  const [refuse, setRefuse] = useState('');

  const charger = useCallback(async () => {
    const { data: gr } = await db.from('v_groupes').select('*').eq('id', id).maybeSingle();
    setG(gr);
    if (!gr) return;

    const { data: ms } = await db.from('gt_membres').select('*').eq('groupe_id', id);
    setMembres(ms || []);

    const [{ data: ds }, { data: ts }] = await Promise.all([
      db.from('gt_documents').select('*').eq('groupe_id', id).order('cree_le', {ascending:false}),
      db.from('gt_taches').select('*').eq('groupe_id', id).order('echeance', {nullsFirst:false})
    ]);
    setDocs(ds || []); setTaches(ts || []);

    // gt_taches pointe deux fois vers profils : on lit les noms à part.
    const ids = [...new Set([
      ...(ms||[]).map(m => m.profil_id),
      ...(ts||[]).map(t => t.assigne_a).filter(Boolean),
      ...(ds||[]).map(d => d.depose_par).filter(Boolean)
    ])];
    if (ids.length){
      const { data: ps } = await db.from('v_annuaire')
        .select('id,prenom,nom,matricule,fonction_nom,echelon').in('id', ids);
      setGens(Object.fromEntries((ps||[]).map(x => [x.id, x])));
    }
  }, [id]);

  useEffect(() => { charger(); }, [charger]);

  useEffect(() => { (async () => {
    const { data } = await db.rpc('obstacle_groupe', { p_groupe: id });
    setRefuse(data || '');
  })(); }, [id]);

  if (!g) return html`<div class="vide">Groupe introuvable ou fermé.</div>`;

  const moi = membres.find(m => m.profil_id === p.id && m.statut === 'actif');
  const responsable = moi?.role === 'responsable' || p.niveau >= 90;

  if (!moi) return html`
    <div>
      <a class="small" href="#/espace/groupes">← Tous les groupes</a>
      <h1 style="margin:12px 0 8px">${g.nom}</h1>
      <p class="muted" style="max-width:58ch">${g.objet||''}</p>
      <div class="alerte" style="margin-top:24px">
        ${refuse
          ? refuse
          : (g.ouvert
              ? 'Vous ne participez pas encore à ce groupe.'
              : 'Ce groupe se rejoint sur invitation de son responsable.')}
      </div>
      ${!refuse && g.ouvert && html`
        <div style="margin-top:24px">
          <button class="btn" onClick=${async ()=>{
            const { data } = await db.rpc('rejoindre_groupe', { p_groupe: id });
            if (data?.ok) charger(); else setMsg(data?.message||'');
          }}>Rejoindre ce groupe</button>
        </div>`}
      ${msg && html`<div class="alerte err" style="margin-top:16px">${msg}</div>`}
    </div>`;

  return html`
    <div>
      <a class="small" href="#/espace/groupes">← Tous les groupes</a>
      <div class="spread" style="margin-top:12px">
        <div>
          <h1>${g.nom}</h1>
          <div class="row" style="margin-top:8px;gap:6px">
            <span class="tag">${g.nb_membres} membre${g.nb_membres>1?'s':''}</span>

function GtTaches({ p, groupe, taches, membres, gens, responsable, recharger }){
  const [ouvrir, setOuvrir] = useState(false);
  const [f, setF] = useState({titre:'',description:'',assigne:'',echeance:'',priorite:'normale'});
  const [msg, setMsg] = useState('');

  const actifs = membres.filter(m => m.statut === 'actif');

  async function ajouter(e){
    e.preventDefault(); setMsg('');
    const { error } = await db.from('gt_taches').insert({
      groupe_id: groupe.id, titre: f.titre, description: f.description || null,
      assigne_a: f.assigne || null, echeance: f.echeance || null,
      priorite: f.priorite, cree_par: p.id
    });
    if (error) return setMsg(error.message);
    setF({titre:'',description:'',assigne:'',echeance:'',priorite:'normale'});
    setOuvrir(false); recharger();
  }

  async function changer(t, statut){
    const { error } = await db.from('gt_taches').update({
      statut, faite_le: statut === 'faite' ? new Date().toISOString() : null
    }).eq('id', t.id);
    if (error) setMsg(error.message);
    recharger();
  }

  const enCours = taches.filter(t => t.statut === 'a_faire' || t.statut === 'en_cours');
  const closes  = taches.filter(t => t.statut === 'faite' || t.statut === 'abandonnee');
  const retard  = t => t.echeance && new Date(t.echeance) < new Date() && t.statut !== 'faite';

  const ligneTache = t => html`
    <div class="ligne">
      <div style="flex:1;min-width:220px">
        <div style=${t.statut==='faite'||t.statut==='abandonnee' ? 'opacity:.55' : ''}>${t.titre}</div>
        ${t.description && html`<div class="small muted">${t.description}</div>`}
        <div class="row" style="margin-top:8px;gap:6px">
          ${t.assigne_a
            ? html`<span class="tag bleu">${nomComplet(gens[t.assigne_a]||{})}</span>`
            : html`<span class="tag">Non assignée</span>`}
          ${t.echeance && html`<span class=${'tag'+(retard(t)?' rouge':'')}>
            ${retard(t)?'En retard · ':''}${jour(t.echeance)}</span>`}
          ${t.priorite === 'haute' && html`<span class="tag rouge">Prioritaire</span>`}
        </div>
      </div>
      <div class="row">
        ${t.statut === 'a_faire' && html`
          <button class="btn sm light" onClick=${()=>changer(t,'en_cours')}>Commencer</button>`}
        ${(t.statut === 'a_faire' || t.statut === 'en_cours') && html`
          <button class="btn sm" onClick=${()=>changer(t,'faite')}>Terminer</button>`}
        ${(t.statut === 'faite' || t.statut === 'abandonnee') && html`
          <button class="btn sm light" onClick=${()=>changer(t,'a_faire')}>Rouvrir</button>`}
      </div>
    </div>`;

  return html`
    <div>
      <div class="spread" style="margin-bottom:16px">
        <span class="small muted">${enCours.length} tâche${enCours.length>1?'s':''} en cours</span>
        <button class="btn sm" onClick=${()=>setOuvrir(o=>!o)}>
          ${ouvrir ? 'Annuler' : 'Ajouter une tâche'}</button>
      </div>
      ${msg && html`<div class="alerte err" style="margin-bottom:16px">${msg}</div>`}

      ${ouvrir && html`
        <form onSubmit=${ajouter} class="panneau" style="margin-bottom:24px">
          <div class="corps stack">
            <div class="field"><label>Intitulé</label>
              <input required value=${f.titre} onInput=${e=>setF(o=>({...o,titre:e.target.value}))} /></div>
            <div class="field"><label>Précisions</label>
              <textarea value=${f.description} onInput=${e=>setF(o=>({...o,description:e.target.value}))} /></div>
            <div class="row" style="gap:16px;align-items:flex-start">
              <div class="field" style="flex:1;min-width:180px"><label>Assignée à</label>
                <select value=${f.assigne} onChange=${e=>setF(o=>({...o,assigne:e.target.value}))}>
                  <option value="">Personne</option>
                  ${actifs.map(m => html`<option value=${m.profil_id}>
                    ${nomComplet(gens[m.profil_id]||{})}</option>`)}
                </select></div>
              <div class="field" style="flex:1;min-width:140px;margin-top:0"><label>Échéance</label>
                <input type="date" value=${f.echeance}
                  onInput=${e=>setF(o=>({...o,echeance:e.target.value}))} /></div>
              <div class="field" style="flex:1;min-width:140px;margin-top:0"><label>Priorité</label>
                <select value=${f.priorite} onChange=${e=>setF(o=>({...o,priorite:e.target.value}))}>
                  <option value="basse">Basse</option>
                  <option value="normale">Normale</option>
                  <option value="haute">Haute</option>
                </select></div>
            </div>
            <div><button class="btn">Ajouter</button></div>
          </div>
        </form>`}

      <div class="panneau">
        <div class="tete"><h3 style="font-size:17px">À faire</h3></div>
        ${enCours.length === 0
          ? html`<div class="vide">Rien en cours. C\u2019est peut-être le moment d\u2019ajouter une tâche.</div>`
          : enCours.map(ligneTache)}
      </div>

      ${closes.length > 0 && html`
        <div class="panneau" style="margin-top:24px">
          <div class="tete"><h3 style="font-size:17px">Terminées</h3>
            <span class="tag">${closes.length}</span></div>
          ${closes.map(ligneTache)}
        </div>`}
    </div>`;
}

function GtMembres({ p, groupe, membres, gens, responsable, recharger }){
  const [candidats, setCandidats] = useState([]);
  const [choix, setChoix] = useState('');
  const [msg, setMsg] = useState('');

  useEffect(() => { (async () => {
    if (!responsable) return;
    const { data } = await db.from('v_annuaire').select('id,prenom,nom,matricule,fonction_nom')
      .eq('statut','actif').order('nom');
    setCandidats(data || []);
  })(); }, [responsable]);

  async function inviter(e){
    e.preventDefault(); setMsg('');
    const { data, error } = await db.rpc('inviter_au_groupe',
      { p_groupe: groupe.id, p_profil: choix });
    if (error) return setMsg(error.message);
    if (!data.ok) return setMsg(data.message);
    setChoix(''); setMsg('Invitation envoyée.'); recharger();
  }

  async function changerRole(m, role){
    await db.from('gt_membres').update({ role }).eq('id', m.id);
    recharger();
  }

  async function retirer(m){
    if (!confirm('Retirer ce membre du groupe ?')) return;
    await db.from('gt_membres').update({ statut: 'parti' }).eq('id', m.id);
    recharger();
  }

  async function partir(){
    const { data } = await db.rpc('quitter_groupe', { p_groupe: groupe.id });
    if (!data.ok) return setMsg(data.message);
    aller('/espace/groupes');
  }

  const dejaLa = new Set(membres.map(m => m.profil_id));
  const actifs = membres.filter(m => m.statut === 'actif');
  const invites = membres.filter(m => m.statut === 'invite');

  return html`
    <div>
      ${msg && html`<div class=${'alerte '+(msg.startsWith('Invitation')?'ok':'err')}
        style="margin-bottom:16px">${msg}</div>`}

      ${responsable && html`
        <form onSubmit=${inviter} class="panneau" style="margin-bottom:24px">
          <div class="tete"><h3 style="font-size:17px">Inviter un membre</h3></div>
          <div class="corps row" style="align-items:flex-end;gap:12px">
            <div class="field" style="flex:1;min-width:220px;margin:0">
              <label>Membre</label>
              <select required value=${choix} onChange=${e=>setChoix(e.target.value)}>
                <option value="">Choisir…</option>
                ${candidats.filter(c => !dejaLa.has(c.id)).map(c => html`
                  <option value=${c.id}>${nomComplet(c)} — ${c.fonction_nom}</option>`)}
              </select>
            </div>
            <button class="btn">Inviter</button>
          </div>
        </form>`}

      <div class="panneau">
        <div class="tete"><h3 style="font-size:17px">Membres</h3>
          <span class="tag">${actifs.length}</span></div>
        ${actifs.map(m => {
          const g = gens[m.profil_id] || {};
          return html`
            <div class="ligne">
              <div>
                <div>${nomComplet(g)}
                  ${m.role === 'responsable' && html`<span class="tag or"
                    style="margin-left:8px">Responsable</span>`}</div>
                <div class="small muted">${g.fonction_nom||''}
                  <span class="mono">${g.matricule||''}</span></div>
              </div>
              ${responsable && m.profil_id !== p.id && html`
                <div class="row">
                  ${m.role === 'membre'
                    ? html`<button class="btn sm light"
                        onClick=${()=>changerRole(m,'responsable')}>Nommer responsable</button>`
                    : html`<button class="btn sm light"
                        onClick=${()=>changerRole(m,'membre')}>Retirer la responsabilité</button>`}
                  <button class="btn sm light" onClick=${()=>retirer(m)}>Retirer</button>
                </div>`}
            </div>`;
        })}
      </div>

      ${invites.length > 0 && html`
        <div class="panneau" style="margin-top:24px">
          <div class="tete"><h3 style="font-size:17px">Invitations en attente</h3></div>
          ${invites.map(m => html`
            <div class="ligne">
              <div>${nomComplet(gens[m.profil_id]||{})}</div>
              <span class="tag bleu">Invité</span>
            </div>`)}
        </div>`}

      <div style="margin-top:32px">
        <button class="btn light" onClick=${partir}>Quitter ce groupe</button>
      </div>
    </div>`;
}

/* --- Direction générale : vérifications ------------------------------ */
function Validation(){
  const [attente, setAttente] = useState([]);
  const [demandes, setDemandes] = useState([]);
  const [msg, setMsg] = useState('');

  const charger = useCallback(async () => {
    // La table demandes pointe deux fois vers profils (profil_id et
    // traite_par). On lit donc les deux séparément plutôt que de laisser
    // PostgREST deviner de quel lien il s'agit.
    const [a, d] = await Promise.all([
      db.from('v_annuaire').select('*').eq('statut','en_attente').order('cree_le'),
      db.from('demandes').select('*').in('statut',['ouverte','en_cours']).order('cree_le')
    ]);
    if (d.error) setMsg('Lecture des demandes impossible : ' + d.error.message);
    const dem = d.data || [];

    let auteurs = {};
    if (dem.length){
      const ids = [...new Set(dem.map(x => x.profil_id))];
      const { data: ps } = await db.from('v_annuaire')
        .select('id,prenom,nom,matricule,email,fonction_nom,territoire_nom').in('id', ids);
      auteurs = Object.fromEntries((ps||[]).map(x => [x.id, x]));
    }
    setAttente(a.data || []);
    setDemandes(dem.map(x => ({ ...x, auteur: auteurs[x.profil_id] || null })));
  }, []);
  useEffect(() => { charger(); }, [charger]);

  async function validerMembre(id, ok){
    const { error } = await db.from('profils')
      .update({ statut: ok ? 'actif' : 'suspendu',
                date_adhesion: ok ? new Date().toISOString().slice(0,10) : null })
      .eq('id', id);
    setMsg(error ? error.message : (ok ? 'Compte activé.' : 'Compte suspendu.'));
    charger();
  }

  async function traiter(d, ok){
    const motif = prompt(ok ? "Motif de l'accord (facultatif)" : 'Motif du refus') ;
    if (!ok && motif === null) return;
    const { data:{ user } } = await db.auth.getUser();
    await db.from('demandes').update({
      statut: ok ? 'acceptee' : 'refusee',
      traite_par: user.id, traite_le: new Date().toISOString(),
      motif_reponse: motif || null
    }).eq('id', d.id);

    if (ok && d.type === 'acces_application' && d.cible){
      await db.from('acces_applications').upsert({
        profil_id: d.profil_id, application: d.cible,
        statut: 'accorde', accorde_par: user.id, motif: motif || null
      }, { onConflict: 'profil_id,application' });
    }
    setMsg('Demande traitée.');
    charger();
  }

  return html`
    <div>
      <div class="eyebrow">Direction générale</div>
      <h1 style="margin:6px 0 32px">Vérifications</h1>
      ${msg && html`<div class="alerte ok" style="margin-bottom:24px">${msg}</div>`}

      <div class="panneau">
        <div class="tete">
          <h3 style="font-size:17px">Inscriptions à vérifier</h3>
          <span class="tag">${attente.length}</span>
        </div>
        ${attente.length === 0
          ? html`<div class="vide">Aucune inscription en attente.</div>`
          : attente.map(m => html`
            <div class="ligne">
              <div>
                <div>${nomComplet(m)} <span class="mono muted">${m.matricule}</span></div>
                <div class="small muted">${m.email} · ${m.territoire_nom || 'sans territoire'}
                  · inscrit le ${jour(m.cree_le)}</div>
              </div>
              <div class="row">
                <button class="btn sm" onClick=${()=>validerMembre(m.id,true)}>Activer</button>
                <button class="btn sm light" onClick=${()=>validerMembre(m.id,false)}>Écarter</button>
              </div>
            </div>`)}
      </div>

      <div class="panneau" style="margin-top:24px">
        <div class="tete">
          <h3 style="font-size:17px">Demandes d'accès</h3>
          <span class="tag">${demandes.length}</span>
        </div>
        ${demandes.length === 0
          ? html`<div class="vide">Aucune demande en instance.</div>`
          : demandes.map(d => html`
            <div class="ligne">
              <div>
                <div>${d.objet}</div>
                <div class="small muted">
                  ${d.auteur ? nomComplet(d.auteur) : 'Membre inconnu'}
                  <span class="mono">${d.auteur?.matricule||''}</span>
                  ${d.auteur?.territoire_nom ? ' · ' + d.auteur.territoire_nom : ''}
                  · ${jour(d.cree_le)}
                </div>
                ${d.message && html`<div class="small" style="margin-top:6px;max-width:56ch">
                  « ${d.message} »</div>`}
              </div>
              <div class="row">
                <button class="btn sm" onClick=${()=>traiter(d,true)}>Accorder</button>
                <button class="btn sm light" onClick=${()=>traiter(d,false)}>Refuser</button>
              </div>
            </div>`)}
      </div>
    </div>`;
}

function ReseauAdmin(){
  const [membres, setMembres] = useState([]);
  const [fonctions, setFonctions] = useState([]);
  const [terr, setTerr] = useState([]);
  const [q, setQ] = useState('');
  const [msg, setMsg] = useState('');

  const charger = useCallback(async () => {
    const [m, f, t] = await Promise.all([
      db.from('v_annuaire').select('*').order('niveau',{ascending:false}).order('nom'),
      db.from('fonctions').select('*').order('niveau'),
      db.from('territoires').select('id,nom,echelle,code').order('echelle').order('nom')
    ]);
    setMembres(m.data||[]); setFonctions(f.data||[]); setTerr(t.data||[]);
  }, []);
  useEffect(() => { charger(); }, [charger]);

  async function modifier(id, champ, valeur){
    const { error } = await db.from('profils').update({ [champ]: valeur }).eq('id', id);
    setMsg(error ? error.message : 'Enregistré.');
    charger();
  }

  const filtre = membres.filter(m =>
    (nomComplet(m)+' '+(m.territoire_nom||'')).toLowerCase().includes(q.toLowerCase()));

  return html`
    <div>
      <div class="eyebrow">Direction générale</div>
      <h1 style="margin:6px 0 8px">Réseau et fonctions</h1>
      <p class="muted">Nommer, muter, faire progresser. Chaque modification est immédiate.</p>
      ${msg && html`<div class="alerte ok" style="margin:16px 0">${msg}</div>`}

      <div class="field" style="max-width:360px;margin:24px 0">
        <input placeholder="Rechercher…" value=${q} onInput=${e=>setQ(e.target.value)} />
      </div>

      <div class="panneau" style="overflow-x:auto">
        <table>
          <thead><tr><th>Membre</th><th>Fonction</th><th>Territoire</th><th>Échelon</th><th>Statut</th></tr></thead>
          <tbody>
            ${filtre.map(m => html`
              <tr>
                <td><div>${nomComplet(m)}</div><div class="mono muted">${m.matricule}</div></td>
                <td>
                  <select value=${m.fonction} onChange=${e=>modifier(m.id,'fonction',e.target.value)}>
                    ${fonctions.map(f => html`<option value=${f.code}>${f.nom}</option>`)}
                  </select>
                </td>
                <td>
                  <select value=${m.territoire_id||''} onChange=${e=>modifier(m.id,'territoire_id',e.target.value||null)}>
                    <option value="">—</option>
                    ${terr.map(t => html`<option value=${t.id}>${t.nom} (${t.echelle})</option>`)}
                  </select>
                </td>
                <td>
                  <select value=${m.echelon} onChange=${e=>modifier(m.id,'echelon',Number(e.target.value))}>
                    ${[1,2,3,4,5,6,7].map(n => html`<option value=${n}>${n}</option>`)}
                  </select>
                </td>
                <td>
                  <select value=${m.statut} onChange=${e=>modifier(m.id,'statut',e.target.value)}>
                    ${['en_attente','actif','suspendu','archive'].map(s =>
                      html`<option value=${s}>${s.replace('_',' ')}</option>`)}
                  </select>
                </td>
              </tr>`)}
          </tbody>
        </table>
      </div>
    </div>`;
}

function VitrineAdmin(){

  const [msg, setMsg] = useState('');
  const charger = useCallback(() =>
    db.from('contenus').select('*').order('section').order('ordre')
      .then(({data}) => setC(data||[])), []);
  useEffect(() => { charger(); }, [charger]);

  async function enregistrer(cle, valeur){
    const { error } = await db.from('contenus').update({ valeur }).eq('cle', cle);
    setMsg(error ? error.message : 'Texte publié.');
  }

  const sections = [...new Set(c.map(x => x.section))];
  return html`
    <div>
      <div class="eyebrow">Direction générale</div>
      <h1 style="margin:6px 0 8px">Site public</h1>
      <p class="muted">Aucun texte public n'est écrit dans le code. Tout se modifie ici.</p>
      ${msg && html`<div class="alerte ok" style="margin:16px 0">${msg}</div>`}

      ${sections.map(s => html`
        <div class="panneau" style="margin-top:24px">
          <div class="tete"><h3 style="font-size:17px;text-transform:capitalize">${s}</h3></div>
          <div class="corps stack">
            ${c.filter(x => x.section === s).map(x => html`
              <div class="field">
                <label>${x.libelle}</label>
                ${x.format === 'long'
                  ? html`<textarea value=${x.valeur} onBlur=${e=>enregistrer(x.cle,e.target.value)} />`
                  : html`<input value=${x.valeur} onBlur=${e=>enregistrer(x.cle,e.target.value)} />`}
              </div>`)}
            <p class="small muted">Les modifications sont enregistrées lorsque vous
            quittez le champ.</p>
          </div>
        </div>`)}
    </div>`;
}

/* --- Coquille de l'espace membre ------------------------------------- */
function EnAttente({ p }){
  return html`
    <section class="bloc blanc">
      <div class="wrap" style="max-width:560px">
        <div class="eyebrow">Espace membre</div>
        <h1 style="margin:8px 0 24px">Votre dossier est en cours de vérification</h1>
        <div class="alerte">
          La Direction générale vérifie votre inscription avant d'ouvrir vos accès.
          Vous recevrez un message dès qu'elle sera validée.
        </div>
        <div style="margin-top:32px">
          <${CarteFederale} p=${p} />
        </div>
        <p style="margin-top:32px">
          <a href="#/" onClick=${()=>db.auth.signOut()}>Se déconnecter</a>
        </p>
      </div>
    </section>`;
}

function Espace({ session, sous }){
  const [p, setP] = useState(null);
  const [apps, setApps] = useState([]);
  const [demandes, setDemandes] = useState([]);
  const [chemin, setChemin] = useState('');
  const [pret, setPret] = useState(false);

  const charger = useCallback(async () => {
    const { data: profil } = await db.from('v_annuaire').select('*')
      .eq('id', session.user.id).maybeSingle();
    if (!profil){ setPret(true); return; }
    setP(profil);

    const [{ data: liste }, { data: mesAcces }, { data: mesDem }] = await Promise.all([
      db.from('applications').select('*').eq('actif',true).order('ordre'),
      db.from('acces_applications').select('application,statut').eq('profil_id', session.user.id),
      db.from('demandes').select('*').eq('profil_id', session.user.id).order('cree_le',{ascending:false})
    ]);
    const accordes = new Set((mesAcces||[]).filter(a=>a.statut==='accorde').map(a=>a.application));
    setApps((liste||[]).map(a => ({
      ...a,
      ouvert: profil.statut === 'actif' &&
              ((!a.sur_demande && profil.niveau >= a.niveau_min) || accordes.has(a.code))
    })));
    setDemandes(mesDem || []);

    if (profil.territoire_id){
      const { data } = await db.rpc('chemin_territoire', { cible: profil.territoire_id });
      setChemin(data || '');
    }
    setPret(true);
  }, [session.user.id]);

  useEffect(() => { charger(); }, [charger]);

  if (!pret) return html`<div class="vide" style="padding:120px">Chargement…</div>`;
  if (!p) return html`<div class="vide" style="padding:120px">
    Profil introuvable. <a href="#/" onClick=${()=>db.auth.signOut()}>Se déconnecter</a></div>`;
  if (p.statut !== 'actif') return html`<${EnAttente} p=${p} />`;

  const admin = p.niveau >= 90;
  const acces = c => apps.find(a => a.code === c && a.ouvert);
  const refus = html`<div class="alerte err">Cette application ne vous est pas ouverte.
    <a href="#/espace/demandes">Déposer une demande</a></div>`;
  const bientot = t => html`
    <div><div class="eyebrow">Espace membre</div>
      <h1 style="margin:6px 0 24px">${t}</h1>
      <div class="alerte">Ce module arrive dans une prochaine mise en ligne.</div></div>`;

  let vue;
  if (sous.startsWith('groupe/')){
    const idG = sous.slice('groupe/'.length);
    return html`
      <div class="app">
        <${Flanc} p=${p} apps=${apps} page="groupes" />
        <main class="contenu">
          ${acces('groupes') ? html`<${Groupe} p=${p} id=${idG} />` : refus}
        </main>
      </div>`;
  }
  if (sous.startsWith('formation/')){
    const idF = sous.slice('formation/'.length);
    return html`
      <div class="app">
        <${Flanc} p=${p} apps=${apps} page="formations" />
        <main class="contenu">
          ${acces('formations') ? html`<${Formation} p=${p} id=${idF} />` : refus}
        </main>
      </div>`;
  }
  switch (sous){
    case '':           vue = html`<${TableauDeBord} p=${p} apps=${apps} chemin=${chemin} demandes=${demandes} />`; break;
    case 'compte':     vue = html`<${MonCompte} p=${p} recharger=${charger} />`; break;
    case 'demandes':   vue = html`<${MesDemandes} p=${p} apps=${apps} demandes=${demandes} recharger=${charger} />`; break;
    case 'annuaire':   vue = acces('annuaire') ? html`<${Annuaire} p=${p} />` : refus; break;
    case 'validation': vue = admin ? html`<${Validation} />` : refus; break;
    case 'reseau':     vue = admin ? html`<${ReseauAdmin} />` : refus; break;
    case 'vitrine':    vue = admin ? html`<${VitrineAdmin} />` : refus; break;
    case 'formations': vue = acces('formations') ? html`<${Formations} p=${p} />` : refus; break;
    case 'groupes':    vue = acces('groupes') ? html`<${Groupes} p=${p} />` : refus; break;
    case 'messagerie': vue = acces('messagerie') ? bientot('Messagerie interne') : refus; break;
    case 'notes_frais':vue = acces('notes_frais')? bientot('Notes de frais') : refus; break;
    case 'tresorerie': vue = acces('tresorerie') ? bientot('Direction financière') : refus; break;
    default:           vue = html`<div class="vide">Page inconnue.</div>`;
  }

  return html`
    <div class="app">
      <${Flanc} p=${p} apps=${apps} page=${sous} />
      <main class="contenu">${vue}</main>
    </div>`;
}

/* =====================================================================
   6. RACINE
   ===================================================================== */
function Site(){
  const route = useRoute();
  const [session, setSession] = useState(undefined);
  const [txt, setTxt] = useState(null);

  useEffect(() => {
    db.auth.getSession().then(({data}) => setSession(data.session));
    const { data:{ subscription } } = db.auth.onAuthStateChange((_e,s) => setSession(s));
    return () => subscription.unsubscribe();
  }, []);

  useEffect(() => {
    db.from('contenus').select('cle,valeur').then(({data}) =>
      setTxt(Object.fromEntries((data||[]).map(c => [c.cle, c.valeur]))));
  }, []);

  if (session === undefined || txt === null)
    return html`<div class="vide" style="padding:140px">Chargement…</div>`;

  // Espace membre : mise en page propre, sans l'entête publique.
  if (route.startsWith('/espace')){
    if (!session) return html`
      <${EntetePublique} route=${route} session=${session} />
      <${Connexion} />
      <${Pied} txt=${txt} />`;
    const sous = route.replace('/espace','').replace(/^\//,'');
    return html`<${Espace} session=${session} sous=${sous} />`;
  }

  let page;
  switch (route){
    case '/':                 page = html`<${Accueil} txt=${txt} />`; break;
    case '/association':      page = html`<${Association} txt=${txt} />`; break;
    case '/actions':          page = html`<${Actions} />`; break;
    case '/reseau':           page = html`<${Reseau} />`; break;
    case '/rejoindre':        page = html`<${Rejoindre} />`; break;
    case '/contact':          page = html`<${Contact} txt=${txt} />`; break;
    case '/inscription':      page = session ? html`<${Accueil} txt=${txt} />` : html`<${Inscription} />`; break;
    case '/mentions':         page = html`<${PageTexte} titre="Mentions légales" corps=${txt.mentions} />`; break;
    case '/confidentialite':  page = html`<${PageTexte} titre="Politique de confidentialité" corps=${txt.confidentialite} />`; break;
    default:                  page = html`<${PageTexte} titre="Page introuvable"
                                  corps="Le lien que vous avez suivi ne mène nulle part." />`;
  }

  return html`
    <${EntetePublique} route=${route} session=${session} />
    ${page}
    <${Pied} txt=${txt} />`;
}

render(html`<${Site} />`, document.getElementById('racine'));
</script>
</body>
