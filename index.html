<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FFCE — Fédération Française pour la Citoyenneté et l'Égalité des Chances</title>
<meta name="description" content="La FFCE fédère des bénévoles dans toute la France pour l'éducation à la citoyenneté, la transmission des valeurs de la République et l'égalité des chances.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@600;700;800;900&family=Carlito:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
/* =====================================================================
   CHARTE GRAPHIQUE FFCE — DIRCOM, été 2025
   Appliquée à la lettre.

   Couleurs maîtresses : bleu profond #00325B, rouge bordeaux #A5053C.
   Neutres : bleu nuit #1E2A38, gris bleutés, gris clairs, blanc cassé.
   Accents secondaires, avec parcimonie : bleu vif #0045D1 pour l'action,
   rose framboise #E80855 pour les chiffres-clés, brun chaud #6B4C3B.

   Typographie : Raleway pour affirmer, titrer, structurer.
                 Calibri pour expliquer, informer, dialoguer.
   Les deux ne se mélangent jamais dans un même bloc de texte.

   Interlignage numérique : 145 %. Aucune ombre, aucun contour
   décoratif, marges claires et mise en page aérée.
   ===================================================================== */
:root{
  /* — Palette principale — */
  --bleu:#00325B;        /* bleu profond : identité, titres, filets forts */
  --bordeaux:#A5053C;    /* rouge bordeaux : engagement, fraternité       */
  --nuit:#1E2A38;        /* bleu nuit : texte courant, fonds sombres      */
  --gris:#4B4F56;        /* gris anthracite : texte secondaire            */
  --gris-bleu:#A0A8B5;   /* gris bleuté : métadonnées                     */
  --filet:#E5E7EB;       /* toutes les bordures, un pixel                 */
  --papier:#F4F5F7;      /* fond de page                                  */
  --creme:#F5F5F5;       /* blanc cassé                                   */
  --blanc:#FFFFFF;

  /* — Palette secondaire, avec parcimonie — */
  --action:#0045D1;      /* bleu vif : liens, boutons, éléments cliquables */
  --framboise:#E80855;   /* chiffres-clés, appels à mobilisation           */
  --ciel:#DDE6F0;        /* fonds subtils, encadrés discrets               */
  --brun:#6B4C3B;        /* chaleur : échelons, certifications             */
  --brun-clair:#F0EAE5;
  --taupe:#7A6350;

  /* — Couleurs fonctionnelles, hors charte, réservées aux états — */
  --valide:#2E6B4F;
  --valide-clair:#E7F0EB;
  --alerte:#A5053C;
  --alerte-clair:#F9E9EE;
  --action-clair:#E6EDFB;

  /* — Alias conservés pour la compatibilité du code — */
  --encre:#1E2A38;
  --rouge:#A5053C;
  --rouge-clair:#F9E9EE;
  --vert:#2E6B4F;
  --vert-clair:#E7F0EB;
  --bleu-clair:#E6EDFB;
  --laiton:#6B4C3B;
  --laiton-clair:#F0EAE5;

  --titre:'Raleway', 'Segoe UI', sans-serif;
  --serif:'Raleway', 'Segoe UI', sans-serif;   /* alias : familles de titre */
  --sans:Calibri, 'Carlito', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;

  --max:1120px;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--papier);color:var(--nuit);
  font-family:var(--sans);font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--action);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--action);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Raleway pour affirmer, titrer, structurer. Black pour les titres
   principaux, Bold pour les sous-titres, encadrés et citations. */
h1,h2,h3{font-family:var(--titre);color:var(--bleu);margin:0;line-height:1.15}
h1{font-size:42px;font-weight:900;letter-spacing:-.015em}
h2{font-size:29px;font-weight:800;letter-spacing:-.01em}
h3{font-size:19px;font-weight:700}
p{margin:0 0 16px}

.wrap{max-width:var(--max);margin:0 auto;padding:0 24px}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.03em}
.eyebrow{font-family:var(--titre);font-weight:700;font-size:11px;
  letter-spacing:.18em;text-transform:uppercase;color:var(--gris-bleu)}
.muted{color:var(--gris)}
.small{font-size:13.5px}
.center{text-align:center}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.stack>*+*{margin-top:16px}
.grid{display:grid;gap:1px;background:var(--filet)}
.hr{height:1px;background:var(--filet);border:0;margin:32px 0}

/* Le filet bicolore : bleu puis bordeaux, comme le drapeau du logo.
   C'est la seule signature graphique du site, et elle ne sert qu'à
   marquer les seuils. */
.bicolore{height:3px;border:0;margin:0;
  background:linear-gradient(90deg,var(--bleu) 0 55%,var(--bordeaux) 55% 100%)}

/* --- Boutons -------------------------------------------------------- */
.btn{
  display:inline-block;padding:11px 22px;border:1px solid var(--bleu);
  background:var(--bleu);color:#fff;font-family:var(--titre);font-weight:700;
  font-size:14px;letter-spacing:.02em;border-radius:2px;transition:background .15s;
}
.btn:hover{background:var(--action);border-color:var(--action);text-decoration:none}
.btn.ghost{background:transparent;color:var(--bleu)}
.btn.ghost:hover{background:var(--bleu);color:#fff;border-color:var(--bleu)}
.btn.light{background:#fff;color:var(--bleu);border-color:var(--filet)}
.btn.light:hover{background:#fff;border-color:var(--bleu);color:var(--bleu)}
.btn.sm{padding:6px 13px;font-size:13px}
.btn.danger{background:var(--bordeaux);border-color:var(--bordeaux)}
.btn.danger:hover{background:var(--framboise);border-color:var(--framboise)}
.btn[disabled]{opacity:.4;cursor:not-allowed}

/* --- Champs --------------------------------------------------------- */
label{display:block;font-family:var(--titre);font-weight:700;font-size:11px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--gris);margin-bottom:6px}
input,select,textarea{
  width:100%;padding:10px 12px;border:1px solid var(--filet);background:#fff;
  border-radius:2px;font-family:var(--sans);font-size:15px;color:var(--nuit);
}
input:focus,select:focus,textarea:focus{border-color:var(--action);outline:none}
textarea{min-height:110px;resize:vertical;line-height:1.45}
.field+.field{margin-top:16px}

/* --- Étiquettes ----------------------------------------------------- */
.tag{display:inline-block;padding:2px 9px;border:1px solid var(--filet);
  border-radius:2px;font-family:var(--titre);font-weight:700;font-size:10.5px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--gris);
  background:#fff;white-space:nowrap}
.tag.or{color:var(--brun);border-color:#E0D5CC;background:var(--brun-clair)}
.tag.vert{color:var(--valide);border-color:#C8DED3;background:var(--valide-clair)}
.tag.rouge{color:var(--bordeaux);border-color:#EBCBD6;background:var(--alerte-clair)}
.tag.bleu{color:var(--action);border-color:#C7D6F4;background:var(--action-clair)}

/* =====================================================================
   SIGNATURE — la carte fédérale
   Une plaque institutionnelle. Son filet gauche reprend le bleu et le
   bordeaux du logo : la République qui se mêle au réel.
   ===================================================================== */
.carte{border:1px solid var(--filet);background:#fff;border-radius:2px;
  padding:20px 22px;position:relative;overflow:hidden}
.carte::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;
  background:linear-gradient(180deg,var(--bleu) 0 55%,var(--bordeaux) 55% 100%)}
.carte .matricule{font-family:var(--mono);font-size:11px;letter-spacing:.14em;
  color:var(--gris-bleu)}
.carte .nom{font-family:var(--titre);font-weight:900;font-size:23px;
  color:var(--bleu);margin:3px 0 5px;line-height:1.1}
.carte .poste{font-size:15px}
.carte .lieu{font-size:13.5px;color:var(--gris);margin-top:2px}
.carte .ech{margin-top:14px;padding-top:12px;border-top:1px solid var(--filet);
  display:flex;justify-content:space-between;align-items:center;gap:8px}

/* --- Entête publique ------------------------------------------------ */
.entete{border-bottom:1px solid var(--filet);background:var(--blanc);
  position:sticky;top:0;z-index:50}
.entete .wrap{display:flex;align-items:center;justify-content:space-between;
  gap:24px;height:112px}
/* Zone de protection du logo : la largeur du E de FFCE tout autour. */
.logo{display:flex;align-items:center;gap:12px;color:var(--bleu);padding:10px 0}
.logo:hover{text-decoration:none}
.logo img{height:74px;width:auto;display:block}
.flanc .logo{width:100%;justify-content:center}
.flanc .logo img{height:auto;width:100%;max-width:186px}
.pied .logo img{height:64px}
@media(max-width:600px){.logo img{height:52px}}
.logo .sigle{font-family:var(--titre);font-size:27px;font-weight:900;
  letter-spacing:.01em;color:#000;line-height:1}
.logo .baseline{font-size:10px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--gris);line-height:1.25;max-width:19ch;
  border-top:1px solid var(--nuit);padding-top:3px;margin-top:3px}
.nav{display:flex;gap:26px;align-items:center}
.nav a{color:var(--nuit);font-size:14.5px}
.nav a.on{color:var(--bleu);border-bottom:2px solid var(--bordeaux);padding-bottom:2px}
@media(max-width:900px){.nav{display:none}.logo .baseline{display:none}}

/* --- Héros ---------------------------------------------------------- */
.heros{border-bottom:1px solid var(--filet);background:var(--blanc);
  position:relative;overflow:hidden}
.heros .wrap{padding:96px 24px 88px;position:relative;z-index:2}
.heros h1{font-size:clamp(34px,5.4vw,62px);max-width:17ch;font-weight:900;
  letter-spacing:-.02em;line-height:1.05}
.heros h1 em{font-style:normal;color:var(--bordeaux)}
.heros p{max-width:54ch;font-size:17.5px;color:var(--gris);margin-top:26px}
.maillage{position:absolute;inset:0;z-index:1;opacity:.55;pointer-events:none}

/* --- Blocs ---------------------------------------------------------- */
.bloc{padding:76px 0;border-bottom:1px solid var(--filet)}
.bloc.blanc{background:var(--blanc)}
.bloc.nuit{background:var(--nuit);border-bottom:0}
.bloc.nuit h2,.bloc.nuit h1{color:#fff}
.bloc.nuit .intro,.bloc.nuit p{color:var(--gris-bleu)}
.bloc h2{margin-bottom:10px}
.intro{max-width:62ch;color:var(--gris);font-size:16.5px}

.cartes{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:1px;background:var(--filet);border:1px solid var(--filet);margin-top:40px}
.cartes>div{background:var(--blanc);padding:30px}
.cartes h3{margin-bottom:10px}
.cartes p{color:var(--gris);font-size:14.5px;margin:0}

.chiffres{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:1px;background:var(--filet);border:1px solid var(--filet);margin-top:40px}
.chiffres>div{background:var(--blanc);padding:34px 24px}
/* Le rose framboise souligne les chiffres-clés. C'est son seul emploi. */
.chiffres .n{font-family:var(--titre);font-weight:900;font-size:48px;line-height:1;
  color:var(--framboise);letter-spacing:-.02em}
.chiffres .l{font-size:13.5px;color:var(--gris);margin-top:10px}

.pied{padding:60px 0 44px;background:var(--nuit);color:var(--gris-bleu);font-size:13.5px}
.pied h2,.pied h3{color:#fff}
.pied .cols{display:grid;grid-template-columns:2fr 1fr 1fr;gap:44px}
@media(max-width:700px){.pied .cols{grid-template-columns:1fr}}
.pied a{color:var(--gris-bleu);display:block;padding:3px 0}
.pied a:hover{color:#fff}
.pied .logo{color:#fff;padding:0}
.pied .logo .sigle{color:#fff}
.pied .logo .baseline{color:var(--gris-bleu);border-top-color:var(--gris-bleu)}
.pied .eyebrow{color:var(--gris-bleu)}

/* =====================================================================
   ESPACE MEMBRE
   ===================================================================== */
.app{display:grid;grid-template-columns:252px 1fr;min-height:100vh}
@media(max-width:900px){.app{grid-template-columns:1fr}}
.flanc{border-right:1px solid var(--filet);background:var(--blanc);
  padding:18px 0 24px;position:sticky;top:0;height:100vh;overflow-y:auto}
@media(max-width:900px){.flanc{position:static;height:auto;border-right:0;
  border-bottom:1px solid var(--filet)}}
.entete-flanc{padding:4px 18px 20px;border-bottom:1px solid var(--filet)}
.entete-flanc .logo{padding:0}
.flanc .titre{padding:0 20px 20px;border-bottom:1px solid var(--filet);margin-bottom:12px}

/* Le bloc « moi » : détaché du reste, c'est le point d'entrée du
   compte et de ses réglages. */
.moi{display:flex;align-items:center;gap:12px;padding:16px 18px;
  border-bottom:1px solid var(--filet);color:var(--nuit);
  border-left:3px solid transparent}
.moi:hover{background:var(--papier);text-decoration:none}
.moi.on{border-left-color:var(--bordeaux);background:var(--papier)}
.moi-nom{display:block;font-family:var(--titre);font-weight:700;font-size:14.5px;
  color:var(--bleu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.moi-role{display:block;font-size:12px;color:var(--gris);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.insigne{display:inline-flex;align-items:center;justify-content:center;
  width:17px;height:17px;border-radius:50%;background:var(--bleu);color:#fff;
  font-family:var(--titre);font-weight:700;font-size:9.5px;flex:0 0 17px}

.pastille{display:inline-block;min-width:19px;padding:1px 6px;border-radius:10px;
  background:var(--bordeaux);color:#fff;font-family:var(--titre);font-weight:700;
  font-size:10.5px;text-align:center;line-height:1.5}

.lien-discret{border:0;background:transparent;padding:0;font-size:13px;
  color:var(--action);font-family:var(--sans);text-align:left}
.lien-discret:hover{text-decoration:underline}
.flanc nav{display:flex;flex-direction:column}
.flanc nav a{padding:9px 20px;color:var(--nuit);font-size:14.5px;
  border-left:3px solid transparent}

/* La table de contrôle est le point de retour : elle se distingue
   même quand elle n'est pas la page courante. */
.flanc nav a.pivot{margin:4px 14px 10px;padding:11px 16px;border-left:0;
  border:1px solid var(--filet);border-radius:2px;background:var(--ciel);
  font-family:var(--titre);font-weight:700;color:var(--bleu);
  display:flex;align-items:center;gap:9px}
.flanc nav a.pivot::before{content:'';width:7px;height:7px;border-radius:50%;
  background:var(--bordeaux);flex:0 0 7px}
.flanc nav a.pivot:hover{background:var(--action-clair);border-color:var(--action)}
.flanc nav a.pivot.on{background:var(--bleu);border-color:var(--bleu);color:#fff}
.flanc nav a.pivot.on::before{background:#fff}
.flanc nav a:hover{background:var(--papier);text-decoration:none}
.flanc nav a.on{border-left-color:var(--bordeaux);background:var(--papier);
  color:var(--bleu);font-weight:700}
.flanc .groupe{padding:22px 20px 6px;font-family:var(--titre);font-weight:700;
  font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gris-bleu)}

/* Une direction se distingue d'un simple groupe : filet de couleur à
   gauche, comme une cote de dossier. */
.flanc .groupe.direction{padding-left:17px;border-left:3px solid var(--gris-bleu);
  margin-top:18px;color:var(--nuit)}
.flanc .groupe.direction.bleu{border-left-color:var(--bleu)}
.flanc .groupe.direction.nuit{border-left-color:var(--nuit)}
.flanc .groupe.direction.brun{border-left-color:var(--brun)}
.flanc .groupe.direction.framboise{border-left-color:var(--framboise)}
.flanc .groupe.direction.action{border-left-color:var(--action)}
.flanc .groupe.direction.or{border-left-color:var(--brun)}
.flanc .mandat{padding:0 20px 6px;font-size:11px;color:var(--gris);
  font-style:italic;line-height:1.35}
.contenu{padding:44px;max-width:920px}
@media(max-width:600px){.contenu{padding:24px 16px}}

.panneau{border:1px solid var(--filet);background:var(--blanc);border-radius:2px}
.panneau>.tete{padding:16px 20px;border-bottom:1px solid var(--filet);
  display:flex;justify-content:space-between;align-items:center;gap:12px}
.panneau>.corps{padding:20px}
.ligne{padding:16px 20px;border-bottom:1px solid var(--filet);
  display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.ligne:last-child{border-bottom:0}

.tuiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));
  gap:1px;background:var(--filet);border:1px solid var(--filet)}
.tuile{background:var(--blanc);padding:22px;display:block;color:var(--nuit);
  min-height:136px;transition:background .12s}
.tuile:hover{background:var(--ciel);text-decoration:none}
.tuile h3{font-size:17px;margin-bottom:7px}
.tuile p{font-size:13.5px;color:var(--gris);margin:0}
.tuile.bloquee{opacity:.5}
.tuile.bloquee:hover{background:var(--blanc)}

.jauge{height:4px;background:var(--filet);margin-top:10px}
.jauge>i{display:block;height:100%;background:var(--brun)}

.alerte{padding:14px 18px;border:1px solid var(--filet);border-left:3px solid var(--action);
  background:var(--blanc);font-size:14.5px;border-radius:2px}
.alerte.err{border-left-color:var(--bordeaux);background:var(--alerte-clair)}
.alerte.ok{border-left-color:var(--valide);background:var(--valide-clair)}

.vide{padding:52px 20px;text-align:center;color:var(--gris-bleu);font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-family:var(--titre);font-weight:700;font-size:10.5px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--gris);
  padding:11px 12px;border-bottom:1px solid var(--filet)}
td{padding:12px;border-bottom:1px solid var(--filet);vertical-align:middle}
tr:last-child td{border-bottom:0}
</style>

<script type="module">
import { h, render } from 'https://esm.sh/preact@10.19.3';
import { useState, useEffect, useCallback } from 'https://esm.sh/preact@10.19.3/hooks';
import htm from 'https://esm.sh/htm@3.1.1';
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.39.3';

const html = htm.bind(h);

/* =====================================================================
   1. CONNEXION À LA BASE
   Ces deux valeurs sont publiques par conception : elles sont faites
   pour vivre dans le navigateur. La clé « secret » ne quitte jamais
   le tableau de bord Supabase.
   ===================================================================== */
const SUPABASE_URL = 'https://ibxydmtqdyynteiopjiv.supabase.co';
const SUPABASE_KEY = 'sb_publishable_A-2UHxGyxQ1--eEnsULBlQ_eyebc9dh';

const db = createClient(SUPABASE_URL, SUPABASE_KEY);

/* Liens externes de la fédération -------------------------------------- */
const EXTERNE = {
  webmail:   'https://mail.google.com/a/ffce-asso.fr',

  agenda:    'https://calendar.google.com/',
  adhesion:  ''   // adresse de la campagne HelloAsso, à coller ici
};

/* =====================================================================
   2. PETITS OUTILS
   ===================================================================== */
const jour = d => d ? new Date(d).toLocaleDateString('fr-FR',
  {day:'numeric',month:'long',year:'numeric'}) : '—';
const initiales = p => ((p?.prenom?.[0]||'') + (p?.nom?.[0]||'')).toUpperCase() || '?';
const nomComplet = p => [p?.prenom, p?.nom].filter(Boolean).join(' ') || p?.email || 'Sans nom';

function useRoute(){
  const [route, setRoute] = useState(location.hash.slice(1) || '/');
  useEffect(() => {
    const f = () => { setRoute(location.hash.slice(1) || '/'); window.scrollTo(0,0); };
    addEventListener('hashchange', f);
    return () => removeEventListener('hashchange', f);
  }, []);
  return route;
}
const aller = r => { location.hash = r; };

/* =====================================================================
   3. VITRINE PUBLIQUE
   ===================================================================== */

/* Le maillage : la fédération est un réseau de territoires. Le motif du
   héros le dit littéralement — des points reliés, densité variable. */
function Maillage(){
  const pts = [];
  for(let i=0;i<44;i++){
    pts.push({ x: (i*137.5)%100, y: ((i*61.8)%100), r: i%7===0 ? 3 : 1.6 });
  }
  return html`
    <svg class="maillage" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      ${pts.map((p,i)=> i<pts.length-1 && html`
        <line x1=${p.x} y1=${p.y} x2=${pts[i+1].x} y2=${pts[i+1].y}
              stroke="#E5E7EB" stroke-width=".14" />`)}
      ${pts.map((p,i)=> html`<circle cx=${p.x} cy=${p.y} r=${p.r/8}
              fill=${p.r>2 ? (i%3===0 ? '#A5053C' : '#00325B') : '#B0B8C1'} />`)}
    </svg>`;

/* --- Logo -------------------------------------------------------------
   La charte interdit toute modification du logo. On affiche donc le
   fichier officiel (logo.png, à déposer à la racine du dépôt). S'il est
   absent, repli sur le sigle composé en Raleway Black — jamais sur une
   imitation du symbole.
   --------------------------------------------------------------------- */
function Logo({ href = '#/', baseline = true, clair = false }){
  const [image, setImage] = useState(true);
  // Le logo porte déjà le sigle et la dénomination : rien ne doit
  // l'accompagner. Le texte n'apparaît que si le fichier est absent.
  if (image) return html`
    <a class="logo" href=${href}>
      <img src=${clair ? 'logo-blanc.png' : 'logo.png'} alt="FFCE — Fédération française pour la citoyenneté et l\u2019égalité des chances"
        onError=${() => setImage(false)} />
    </a>`;
  return html`
    <a class="logo" href=${href}>
      <span>
        <span class="sigle">FFCE</span>
        ${baseline && html`<span class="baseline">
          Fédération française pour la citoyenneté<br/>et l\u2019égalité des chances
        </span>`}
      </span>
    </a>`;
}

function Connexion(){
  const [email, setEmail] = useState('');
  const [mdp, setMdp] = useState('');
  const [err, setErr] = useState('');
  const [envoi, setEnvoi] = useState(false);

  async function entrer(e){
    e.preventDefault(); setErr(''); setEnvoi(true);
    const { error } = await db.auth.signInWithPassword({ email, password: mdp });
    setEnvoi(false);
    if (error) setErr("Adresse ou mot de passe incorrect.");
    else aller('/espace');
  }

  return html`
    <section class="bloc blanc">
      <div class="wrap" style="max-width:440px">
        <div class="eyebrow">Espace membre</div>
        <h1 style="margin:8px 0 32px">Se connecter</h1>
        <form onSubmit=${entrer} class="stack">
          <div class="field">
            <label for="e">Adresse électronique</label>
            <input id="e" type="email" required value=${email}
              onInput=${e=>setEmail(e.target.value)} autocomplete="email" />
          </div>
          <div class="field">
            <label for="m">Mot de passe</label>
            <input id="m" type="password" required value=${mdp}
              onInput=${e=>setMdp(e.target.value)} autocomplete="current-password" />
          </div>
          ${err && html`<div class="alerte err">${err}</div>`}
          <button class="btn" style="width:100%" disabled=${envoi}>
            ${envoi ? 'Connexion…' : 'Entrer'}</button>
        </form>
        <p class="small muted" style="margin-top:24px">
          Pas encore de compte ? <a href="#/inscription">Créer un compte</a>
        </p>
      </div>
    </section>`;
}

function Inscription(){
  const [f, setF] = useState({prenom:'',nom:'',email:'',mdp:'',territoire:''});
  const [terr, setTerr] = useState([]);
  const [err, setErr] = useState('');
  const [fait, setFait] = useState(false);
  const [envoi, setEnvoi] = useState(false);
  const maj = (k,v) => setF(o => ({...o, [k]:v}));

  useEffect(() => {
    db.from('territoires').select('id,nom,echelle').eq('echelle','departement')
      .order('code').then(({data}) => setTerr(data || []));
  }, []);

  async function creer(e){
    e.preventDefault(); setErr(''); setEnvoi(true);
    const { data, error } = await db.auth.signUp({
      email: f.email, password: f.mdp,
      options: { data: { prenom: f.prenom, nom: f.nom } }
    });
    if (error){ setErr(error.message); setEnvoi(false); return; }
    if (f.territoire && data.user){
      await db.from('profils').update({ territoire_id: f.territoire }).eq('id', data.user.id);
    }
    setEnvoi(false); setFait(true);
  }

  if (fait) return html`
    <section class="bloc blanc">
      <div class="wrap" style="max-width:520px">
        <h1 style="margin-bottom:16px">Votre demande est enregistrée</h1>
        <div class="alerte ok">
          La Direction générale vérifie votre inscription. Vous recevrez un
          message dès l'ouverture de vos accès. En attendant, connectez-vous et
          complétez votre dossier d'adhésion dans Mon compte : c'est ce qui
          permettra de vous proposer des missions qui vous correspondent.
        </div>
        <p style="margin-top:24px"><a class="btn" href="#/espace">Aller à mon espace</a></p>
      </div>
    </section>`;

  return html`
    <section class="bloc blanc">
      <div class="wrap" style="max-width:520px">
        <div class="eyebrow">Nous rejoindre</div>
        <h1 style="margin:8px 0 32px">Créer mon compte</h1>
        <form onSubmit=${creer} class="stack">
          <div class="row" style="gap:16px">
            <div class="field" style="flex:1;min-width:140px">
              <label for="p">Prénom</label>
              <input id="p" required value=${f.prenom} onInput=${e=>maj('prenom',e.target.value)} />
            </div>
            <div class="field" style="flex:1;min-width:140px;margin-top:0">
              <label for="n">Nom</label>
              <input id="n" required value=${f.nom} onInput=${e=>maj('nom',e.target.value)} />
            </div>
          </div>
          <div class="field">
            <label for="ie">Adresse électronique</label>
            <input id="ie" type="email" required value=${f.email}
              onInput=${e=>maj('email',e.target.value)} autocomplete="email" />
          </div>
          <div class="field">
            <label for="im">Mot de passe</label>
            <input id="im" type="password" required minlength="8" value=${f.mdp}
              onInput=${e=>maj('mdp',e.target.value)} autocomplete="new-password" />
            <p class="small muted" style="margin:6px 0 0">Huit caractères minimum.</p>
          </div>
          <div class="field">
            <label for="it">Département de rattachement</label>
            <select id="it" required value=${f.territoire} onChange=${e=>maj('territoire',e.target.value)}>
              <option value="">Choisir…</option>
              ${terr.map(t => html`<option value=${t.id}>${t.nom}</option>`)}
            </select>
          </div>
          ${err && html`<div class="alerte err">${err}</div>`}
          <button class="btn" style="width:100%" disabled=${envoi}>
            ${envoi ? 'Envoi…' : 'Créer mon compte'}</button>
          <p class="small muted">
            En créant un compte, vous acceptez la
            <a href="#/confidentialite">politique de confidentialité</a>.
          </p>
        </form>
      </div>
    </section>`;
}

/* --- Portrait ----------------------------------------------------------
   Les portraits vivent dans un dépôt privé : on signe une adresse
   temporaire plutôt que de les rendre publics.
   --------------------------------------------------------------------- */
function Portrait({ chemin, nom, taille = 40 }){
  const [url, setUrl] = useState(null);
  useEffect(() => { (async () => {
    if (!chemin) return;
    const { data } = await db.storage.from('portraits').createSignedUrl(chemin, 3600);
    if (data) setUrl(data.signedUrl);
  })(); }, [chemin]);

  const style = `width:${taille}px;height:${taille}px;border-radius:50%;
    flex:0 0 ${taille}px;object-fit:cover;display:block;border:1px solid var(--filet)`;

  if (url) return html`<img src=${url} alt="" style=${style} />`;
  return html`
    <span style=${style + `;background:var(--bleu);color:#fff;display:flex;
      align-items:center;justify-content:center;font-family:var(--titre);
      font-weight:900;font-size:${Math.round(taille*0.38)}px;letter-spacing:.02em`}>
      ${initiales({prenom: (nom||'').split(' ')[0], nom: (nom||'').split(' ')[1]})}
    </span>`;
}

   Trois blocs et pas un de plus : qui je suis, ce que je fais, ce que
   j'administre. Le guichet et le référentiel ne sont plus des onglets
   permanents — on y accède au moment où on en a besoin.
   --------------------------------------------------------------------- */
/* --- Menu latéral ------------------------------------------------------
   Le menu suit l'organigramme, pas la liste des tables. Trois strates :
   qui je suis, mon activité de membre, puis les directions dont je
   relève — chacune avec ses outils. C'est ainsi que s'organisent les
   grandes fédérations : on n'appartient pas à « des responsabilités »
   en vrac, on appartient à une direction.
   --------------------------------------------------------------------- */
function Flanc({ p, apps, page, directions }){
  const item = (r, t, marque, pivot) => html`
    <a href=${'#/espace/'+r}
       class=${(pivot?'pivot ':'') + (page===r?'on':'')}>
      <span class="spread" style="gap:8px">
        <span>${t}</span>
        ${marque > 0 && html`<span class="pastille">${marque}</span>`}
      </span>
    </a>`;

  const ouvertes = (apps||[]).filter(a => a.ouvert);
  const perso = ouvertes.filter(a => a.personnelle);
  const dirs = (directions||[]).map(d => ({
    ...d, apps: ouvertes.filter(a => a.direction === d.code)
  })).filter(d => d.apps.length > 0);

  const nom = a => a.nom_court || a.nom;

  return html`
    <aside class="flanc">
      <div class="entete-flanc">
        <${Logo} baseline=${false} />
      </div>

      <a class=${'moi'+(page==='compte'?' on':'')} href="#/espace/compte">
        <${Portrait} chemin=${p.photo_url} nom=${nomComplet(p)} taille=${42} />
        <span style="min-width:0">
          <span class="moi-nom">${nomComplet(p)}</span>
          <span class="moi-role">${p.fonction_nom} · échelon ${p.echelon}</span>
        </span>
      </a>

      <nav>
        ${item('', 'Table de contrôle', 0, true)}

        <div class="groupe">Mon activité</div>
        ${perso.map(a => item(a.code, nom(a)))}

        ${dirs.map(d => html`
          <div class=${'groupe direction '+d.couleur}>${d.nom_court || d.nom}</div>
          ${d.par_poste && d.postes.length > 0 && html`
            <div class="mandat">${d.postes.join(' · ')}</div>`}
          ${d.apps.map(a => item(a.code, nom(a)))}`)}

        <div class="groupe">Ailleurs</div>
        <a href=${EXTERNE.drive} target="_blank" rel="noopener">Drive ↗</a>
        <a href=${EXTERNE.agenda} target="_blank" rel="noopener">Agenda ↗</a>
        ${p.webmail && html`<a href=${EXTERNE.webmail} target="_blank" rel="noopener">Webmail ↗</a>`}
        <a href="#/" onClick=${()=>db.auth.signOut()}>Se déconnecter</a>
      </nav>
    </aside>`;
}

/* --- Progression : les points d'échelon ------------------------------- */
function Progression(){
  const [x, setX] = useState(null);
  const [ouvert, setOuvert] = useState(false);
  useEffect(() => { db.rpc('points_membre').then(({data}) => setX(data)); }, []);
  if (!x) return null;

  const socle = Number(x.palier_actuel || 0);
  const cible = x.prochain ? Number(x.prochain.points) : null;
  const pct = cible ? Math.min(Math.round((x.total - socle) / (cible - socle) * 100), 100) : 100;

  return html`
    <div class="panneau">
      <div class="tete">
        <div class="row" style="gap:8px">
          <h3 style="font-size:17px">Échelon ${x.echelon} · ${x.echelon_nom}</h3>
          <${Info} texte="Les points se calculent à la lecture, jamais stockés : ils sont donc toujours justes. Atteindre un palier ne promeut pas automatiquement — la Direction générale décide, et doit motiver." />
        </div>
        <span style="font-family:var(--titre);font-weight:900;font-size:26px;
                     color:var(--bordeaux);line-height:1">${x.total}
          <span style="font-size:13px;color:var(--gris);font-weight:700"> pts</span></span>
      </div>
      <div class="corps">
        ${x.prochain
          ? html`
            <div class="spread small">
              <span class="muted">Vers ${x.prochain.nom}</span>
              <span class="mono">${x.total} / ${cible}</span>
            </div>
            <div class="jauge" style="margin-top:8px;height:6px">
              <i style=${'width:'+pct+'%;background:var(--bordeaux)'}></i></div>
            ${x.prochain.ouvre && html`<p class="small muted" style="margin:10px 0 0">
              Cet échelon ouvre : ${x.prochain.ouvre}</p>`}
            ${x.atteint_le_palier && html`<div class="alerte ok" style="margin-top:12px">
              Vous avez atteint le palier. La Direction générale examinera votre
              progression.</div>`}`
          : html`<p class="small muted" style="margin:0">
              Vous occupez le dernier échelon de la fédération.</p>`}

        <button class="lien-discret" style="margin-top:14px"
          onClick=${()=>setOuvert(o=>!o)}>
          ${ouvert ? 'Masquer le détail' : 'D\u2019où viennent mes points ?'}</button>
        ${ouvert && html`
          <div style="margin-top:12px">
            ${Object.entries(x.detail).map(([k,v]) => html`
              <div class="spread small" style="padding:4px 0">
                <span class="muted">${k}</span><span class="mono">${v}</span>
              </div>`)}
          </div>`}
      </div>
    </div>`;
}


/* --- Ce qui attend : la file de travail personnelle -------------------
   Les alertes se perdaient au fond des onglets. Elles remontent ici,
   en tête du tableau de bord, triées par urgence.

function CeQuiAttend(){
  const [items, setItems] = useState([]);
  useEffect(() => {
    db.rpc('ce_qui_attend').then(({data}) => setItems(data || []));
  }, []);
  if (items.length === 0) return null;

  const urgents = items.filter(x => x.urgence === 'haute');
  const normaux = items.filter(x => x.urgence !== 'haute');

  const carte = (x, haute) => html`
    <a href=${x.lien} style=${'display:block;background:var(--blanc);padding:18px 20px;'+
        'color:var(--encre);border-left:3px solid '+(haute?'var(--rouge)':'var(--bleu)')}>
      <div class="row" style="gap:10px;align-items:baseline">
        <span style=${'font-family:var(--serif);font-size:30px;line-height:1;color:'+
          (haute?'var(--rouge)':'var(--bleu)')}>${x.nombre}</span>
        <span class="small">${x.libelle}</span>
      </div>
    </a>`;

  return html`
    <div>
      <div class="spread" style="margin-bottom:12px">
        <div class="eyebrow">Ce qui attend</div>
        ${urgents.length > 0 && html`
          <span class="tag rouge">${urgents.reduce((n,x)=>n+x.nombre,0)} à traiter sans délai</span>`}
      </div>
      <div class="tuiles" style="grid-template-columns:repeat(auto-fill,minmax(230px,1fr))">
        ${urgents.map(x => carte(x, true))}

    </div>`;
}

/* --- Mon portrait ------------------------------------------------------
   Deux mégaoctets, dépôt privé, dossier nommé par l'identifiant : nul
   ne peut déposer chez un autre.
   --------------------------------------------------------------------- */
function MonPortrait({ p, recharger }){
  const [msg, setMsg] = useState('');
  const [envoi, setEnvoi] = useState(false);

  async function deposer(e){
    const fichier = e.target.files[0];
    if (!fichier) return;
    setEnvoi(true); setMsg('');
    try {
      if (fichier.size > 2 * 1024 * 1024)
        throw new Error('Le portrait ne doit pas dépasser 2 Mo.');
      const ext = fichier.name.split('.').pop();
      const chemin = p.id + '/portrait-' + Date.now() + '.' + ext;
      const { error: eUp } = await db.storage.from('portraits').upload(chemin, fichier);
      if (eUp) throw eUp;
      const { error } = await db.from('profils').update({ photo_url: chemin }).eq('id', p.id);
      if (error) throw error;
      setMsg('Portrait mis à jour.');
      recharger();
    } catch (err){ setMsg(err.message || 'Dépôt impossible.'); }
    setEnvoi(false);
  }

  async function retirer(){
    await db.from('profils').update({ photo_url: null }).eq('id', p.id);
    setMsg('Portrait retiré.'); recharger();
  }

  return html`
    <div class="panneau" style="margin-top:24px">
      <div class="corps row" style="gap:20px">
        <${Portrait} chemin=${p.photo_url} nom=${nomComplet(p)} taille=${88} />
        <div style="flex:1;min-width:220px">
          <div style="font-family:var(--titre);font-weight:700;font-size:16px;
                      color:var(--bleu)">${nomComplet(p)}</div>
          <div class="small muted">${p.fonction_nom} · ${p.territoire_nom || 'sans rattachement'}</div>
          ${p.devise && html`<div class="small" style="margin-top:6px;font-style:italic">
            « ${p.devise} »</div>`}
          <div class="row" style="margin-top:12px;gap:10px">
            <label class="btn sm light" style="margin:0;text-transform:none;
                letter-spacing:.02em;cursor:pointer;display:inline-block">
              ${envoi ? 'Envoi…' : (p.photo_url ? 'Changer' : 'Ajouter un portrait')}
              <input type="file" accept="image/*" style="display:none" onChange=${deposer} />
            </label>
            ${p.photo_url && html`<button class="btn sm light" onClick=${retirer}>Retirer</button>`}
          </div>
          ${msg && html`<p class="small" style="margin:10px 0 0;color:var(--gris)">${msg}</p>`}
        </div>
      </div>
    </div>`;
}

    e.preventDefault(); setMsg('');
    const app = apps.find(a => a.code === cible);

      objet: objet || (app ? 'Accès à « '+app.nom+' »' : 'Demande'),

                ${fermees.map(a => html`<option value=${a.code}>${a.nom}</option>`)}

            <label>Motif</label>
            <textarea required value=${message} onInput=${e=>setMessage(e.target.value)}
              placeholder="À quoi cet accès va-t-il servir ?"></textarea>
          </div>
          ${msg && html`<div class=${'alerte '+(msg.startsWith('Demande')?'ok':'err')}>${msg}</div>`}
          <div><button class="btn">Transmettre</button></div>
        </div>
      </form>

      <div class="panneau" style="margin-top:24px">
        <div class="tete"><h3 style="font-size:17px">Suivi</h3></div>
        ${demandes.length === 0
          ? html`<div class="vide">Aucune demande déposée à ce jour.</div>`
          : demandes.map(d => html`
            <div class="ligne">
              <div>
                <div>${d.objet}</div>
                <div class="small muted">Déposée le ${jour(d.cree_le)}
                  ${d.motif_reponse ? ' · ' + d.motif_reponse : ''}</div>
              </div>
              ${etiquette(d.statut)}
            </div>`)}
      </div>
    </div>`;
}

function Annuaire({ p }){
  const [membres, setMembres] = useState(null);
  const [q, setQ] = useState('');
  const [fiche, setFiche] = useState(null);
  useEffect(() => {
    db.from('v_annuaire').select('*').neq('statut','archive')
      .order('niveau', {ascending:false}).order('nom')
      .then(({data}) => setMembres(data || []));
  }, []);

  if (fiche) return html`<${FicheMembre} id=${fiche} fermer=${()=>setFiche(null)} />`;
  if (!membres) return html`<div class="vide">Chargement…</div>`;
  const filtre = membres.filter(m => {
    const s = (nomComplet(m)+' '+(m.territoire_nom||'')+' '+m.fonction_nom).toLowerCase();
    return s.includes(q.toLowerCase());
  });

  return html`
    <div>
      <div class="eyebrow">Annuaire fédéral</div>
      <h1 style="margin:6px 0 8px">Mon périmètre</h1>
      <p class="muted" style="max-width:58ch">
        Vous voyez les membres rattachés à votre territoire et à tous ceux qui
        en dépendent. Cette limite est appliquée par la base de données.
        Ouvrez une fiche pour en savoir plus : les coordonnées ne s\u2019affichent
        que sur demande, et cette demande est enregistrée.
      </p>

      <div class="field" style="max-width:360px;margin:24px 0">
        <input placeholder="Rechercher un nom, un territoire…"
          value=${q} onInput=${e=>setQ(e.target.value)} />
      </div>

      <div class="panneau">
        <div class="tete">
          <span class="small muted">${filtre.length} membre${filtre.length>1?'s':''}</span>
        </div>
        <div style="overflow-x:auto">
          <table>
            <thead><tr>
              <th>Membre</th><th>Fonction</th><th>Territoire</th><th>Échelon</th><th>Statut</th>
            </tr></thead>
            <tbody>
              ${filtre.map(m => html`
                <tr style="cursor:pointer" onClick=${()=>setFiche(m.id)}>
                  <td>
                    <div><a href="#" onClick=${e=>e.preventDefault()}>${nomComplet(m)}</a></div>
                    <div class="mono muted">${m.matricule}</div>
                  </td>
                  <td>${m.fonction_nom}</td>
                  <td>${m.territoire_nom || '—'}</td>
                  <td><span class="tag or">${m.echelon}</span></td>
                  <td>${m.statut === 'actif'
                    ? html`<span class="tag vert">Actif</span>`
                    : html`<span class="tag">${m.statut.replace('_',' ')}</span>`}</td>
                </tr>`)}
            </tbody>
          </table>
        </div>
        ${filtre.length === 0 && html`<div class="vide">Aucun résultat.</div>`}
      </div>
    </div>`;
}


/* =====================================================================
   5 bis. FORMATIONS
   Le catalogue, le parcours, la leçon, le quiz. Les bonnes réponses
   ne descendent jamais dans le navigateur : la correction se fait en base.
   ===================================================================== */

function Formations({ p }){
  const [liste, setListe] = useState(null);
  const [certifs, setCertifs] = useState([]);

  useEffect(() => { (async () => {
    const { data: fs } = await db.from('formations').select('*')
      .eq('publiee', true).order('ordre');
    const avec = await Promise.all((fs||[]).map(async f => {
      const { data } = await db.rpc('avancement', { p_formation: f.id });
      const a = Array.isArray(data) ? data[0] : data;
      return { ...f, ...(a || {total:0, faites:0, pourcent:0}) };
    }));
    setListe(avec);
    const { data: c } = await db.from('certifications_obtenues')
      .select('*, certifications(nom, description)').eq('profil_id', p.id);
    setCertifs(c || []);
  })(); }, [p.id]);

  if (!liste) return html`<div class="vide">Chargement…</div>`;

  return html`
    <div>
      <div class="eyebrow">Formations</div>
      <h1 style="margin:6px 0 8px">Se former</h1>
      <p class="muted" style="max-width:56ch">
        Chaque parcours achevé délivre une certification inscrite à votre
        compte. Certains projets et groupes de travail l'exigeront.
      </p>

      ${certifs.length > 0 && html`
        <div class="panneau" style="margin-top:32px">
          <div class="tete"><h3 style="font-size:17px">Mes certifications</h3></div>
          ${certifs.map(c => html`
            <div class="ligne">
              <div>
                <div>${c.certifications?.nom || c.code}</div>
                <div class="small muted">
                  Délivrée le ${jour(c.obtenue_le)}
                  ${c.expire_le ? ' · valable jusqu\u2019au ' + jour(c.expire_le) : ''}
                </div>
              </div>
              <span class="mono muted">${c.numero}</span>
            </div>`)}
        </div>`}

      <div class="tuiles" style="margin-top:32px">
        ${liste.map(f => html`
          <a class="tuile" href=${'#/espace/formation/'+f.id}>
            <h3>${f.titre}</h3>
            <p>${f.resume || ''}</p>
            <div class="jauge" style="margin-top:14px">
              <i style=${'width:'+(f.pourcent||0)+'%'}></i></div>
            <div class="small muted" style="margin-top:8px">
              ${f.faites}/${f.total} leçons
              ${f.duree_min ? ' · ' + f.duree_min + ' min' : ''}
              ${f.pourcent === 100 ? ' · achevé' : ''}
            </div>
          </a>`)}
      </div>
      ${liste.length === 0 && html`<div class="vide">Aucune formation publiée pour l\u2019instant.</div>`}
    </div>`;
}

function Formation({ p, id }){
  const [f, setF] = useState(null);
  const [parcours, setParcours] = useState([]);
  const [faites, setFaites] = useState({});
  const [ouverte, setOuverte] = useState(null);   // leçon affichée

  const charger = useCallback(async () => {
    const { data: form } = await db.from('formations').select('*').eq('id', id).maybeSingle();
    setF(form);
    const { data: par } = await db.from('v_parcours').select('*')
      .eq('formation_id', id).order('rang');
    setParcours(par || []);
    const { data: pr } = await db.from('progression').select('lecon_id,score')
      .eq('profil_id', p.id);
    setFaites(Object.fromEntries((pr||[]).map(x => [x.lecon_id, x.score])));
  }, [id, p.id]);

  useEffect(() => { charger(); }, [charger]);

  if (!f) return html`<div class="vide">Chargement…</div>`;

  const total = parcours.length;
  const nbFaites = parcours.filter(l => l.lecon_id in faites).length;
  const pct = total ? Math.round(nbFaites / total * 100) : 0;

  // Une leçon est ouverte si la précédente est achevée.
  const estOuverte = i => i === 0 || (parcours[i-1] && parcours[i-1].lecon_id in faites);

  if (ouverte){
    const i = parcours.findIndex(l => l.lecon_id === ouverte);
    return html`<${Lecon} lecon=${parcours[i]} suivante=${parcours[i+1]}
      dejaFaite=${ouverte in faites}
      fermer=${() => { setOuverte(null); charger(); }}
      allerSuivante=${() => { setOuverte(parcours[i+1]?.lecon_id || null); charger(); }} />`;
  }

  const modules = [];
  parcours.forEach(l => {
    let m = modules.find(x => x.id === l.module_id);
    if (!m){ m = { id: l.module_id, titre: l.module_titre, lecons: [] }; modules.push(m); }
    m.lecons.push(l);
  });

  const picto = { lecture:'Lecture', video:'Vidéo', document:'Document', quiz:'Quiz' };

  return html`
    <div>
      <a class="small" href="#/espace/formations">← Toutes les formations</a>
      <h1 style="margin:12px 0 8px">${f.titre}</h1>
      <p class="muted" style="max-width:60ch">${f.description || f.resume || ''}</p>

      <div class="panneau" style="margin-top:24px">
        <div class="corps">
          <div class="spread">
            <span class="small">${nbFaites} leçon${nbFaites>1?'s':''} sur ${total}</span>
            <span class="mono">${pct} %</span>
          </div>
          <div class="jauge" style="margin-top:10px"><i style=${'width:'+pct+'%'}></i></div>
          ${pct === 100 && html`<div class="alerte ok" style="margin-top:16px">
            Parcours achevé. Votre certification est inscrite à votre compte.</div>`}
        </div>
      </div>

      ${modules.map(m => html`
        <div class="panneau" style="margin-top:24px">
          <div class="tete"><h3 style="font-size:17px">${m.titre}</h3></div>
          ${m.lecons.map(l => {
            const i = parcours.findIndex(x => x.lecon_id === l.lecon_id);
            const faite = l.lecon_id in faites;
            const ok = estOuverte(i);
            return html`
              <div class="ligne">
                <div>
                  <div style=${ok ? '' : 'opacity:.5'}>${l.lecon_titre}</div>
                  <div class="small muted">
                    ${picto[l.type]}${l.duree_min ? ' · ' + l.duree_min + ' min' : ''}
                    ${faite && faites[l.lecon_id] != null ? ' · ' + faites[l.lecon_id] + ' %' : ''}
                  </div>
                </div>
                ${faite
                  ? html`<div class="row"><span class="tag vert">Achevée</span>
                      <button class="btn sm light" onClick=${()=>setOuverte(l.lecon_id)}>Revoir</button></div>`
                  : ok
                    ? html`<button class="btn sm" onClick=${()=>setOuverte(l.lecon_id)}>Commencer</button>`
                    : html`<span class="tag">Verrouillée</span>`}
              </div>`;
          })}
        </div>`)}
    </div>`;
}

function Lecon({ lecon, suivante, dejaFaite, fermer, allerSuivante }){
  const [detail, setDetail] = useState(null);
  const [questions, setQuestions] = useState([]);
  const [choix, setChoix] = useState({});      // question_id → Set d'id de réponses
  const [resultat, setResultat] = useState(null);
  const [msg, setMsg] = useState('');
  const [envoi, setEnvoi] = useState(false);

  useEffect(() => { (async () => {
    const { data: l } = await db.from('lecons').select('*').eq('id', lecon.lecon_id).maybeSingle();
    setDetail(l);
    if (l && l.type === 'quiz'){
      const { data: qs } = await db.from('questions').select('*')
        .eq('lecon_id', l.id).order('ordre');
      const avec = await Promise.all((qs||[]).map(async q => {
        const { data: rs } = await db.from('v_choix').select('id,texte,ordre')
          .eq('question_id', q.id).order('ordre');
        return { ...q, choix: rs || [] };
      }));
      setQuestions(avec);
    }
  })(); }, [lecon.lecon_id]);

  if (!detail) return html`<div class="vide">Chargement…</div>`;

  function cocher(qid, rid){
    setChoix(c => {
      const s = new Set(c[qid] || []);
      s.has(rid) ? s.delete(rid) : s.add(rid);
      return { ...c, [qid]: s };
    });
  }

  async function achever(){
    setEnvoi(true); setMsg('');
    const { data, error } = await db.rpc('terminer_lecon', { p_lecon: detail.id });
    setEnvoi(false);
    if (error) return setMsg(error.message);
    if (!data.ok) return setMsg(data.message);
    suivante ? allerSuivante() : fermer();
  }

  async function corriger(){
    setEnvoi(true); setMsg('');
    const tous = Object.values(choix).flatMap(s => [...s]);
    const { data, error } = await db.rpc('valider_quiz',
      { p_lecon: detail.id, p_choix: tous });
    setEnvoi(false);
    if (error) return setMsg(error.message);
    if (!data.ok) return setMsg(data.message);
    setResultat(data);
  }

  return html`
    <div>
      <a class="small" href="#" onClick=${e=>{e.preventDefault();fermer()}}>← Retour au parcours</a>
      <div class="eyebrow" style="margin-top:16px">${lecon.module_titre}</div>
      <h1 style="margin:6px 0 24px">${detail.titre}</h1>

      ${detail.type === 'lecture' && html`
        <div class="panneau"><div class="corps"
          style="white-space:pre-wrap;font-size:16px;max-width:62ch">${detail.contenu||''}</div></div>`}

      ${detail.type === 'video' && html`
        <div class="panneau"><div class="corps">
          <p><a class="btn" href=${detail.url} target="_blank" rel="noopener">Ouvrir la vidéo ↗</a></p>
          ${detail.contenu && html`<div style="white-space:pre-wrap;margin-top:16px">${detail.contenu}</div>`}
        </div></div>`}

      ${detail.type === 'document' && html`
        <div class="panneau"><div class="corps">
          <p><a class="btn" href=${detail.url} target="_blank" rel="noopener">Ouvrir le document ↗</a></p>
          ${detail.contenu && html`<div style="white-space:pre-wrap;margin-top:16px">${detail.contenu}</div>`}
        </div></div>`}

      ${detail.type === 'quiz' && html`
        <div>
          ${resultat && html`
            <div class=${'alerte ' + (resultat.reussi ? 'ok' : 'err')} style="margin-bottom:24px">
              ${resultat.justes} bonne${resultat.justes>1?'s':''} réponse${resultat.justes>1?'s':''}
              sur ${resultat.total} — ${resultat.score} %.
              ${resultat.reussi
                ? ' Quiz validé.'
                : ' Il en faut ' + resultat.seuil + ' % pour valider. Reprenez vos réponses.'}
            </div>`}

          ${questions.map((q, n) => html`
            <div class="panneau" style="margin-bottom:16px">
              <div class="corps">
                <div class="mono muted">Question ${n+1} sur ${questions.length}</div>
                <div style="font-size:16px;margin:8px 0 16px">${q.enonce}</div>
                ${q.choix.map(r => html`
                  <label class="row" style="text-transform:none;letter-spacing:0;
                      font-size:15px;color:var(--encre);padding:6px 0;margin:0;cursor:pointer">
                    <input type="checkbox" style="width:auto"
                      checked=${(choix[q.id]||new Set()).has(r.id)}
                      onChange=${()=>cocher(q.id, r.id)} />
                    <span>${r.texte}</span>
                  </label>`)}
                ${q.aide && html`<p class="small muted" style="margin:12px 0 0">${q.aide}</p>`}
              </div>
            </div>`)}
          <p class="small muted">Une question peut appeler plusieurs réponses.</p>
        </div>`}

      ${msg && html`<div class="alerte err" style="margin-top:24px">${msg}</div>`}

      <div class="row" style="margin-top:32px">
        ${detail.type === 'quiz'
          ? (resultat && resultat.reussi
              ? (suivante
                  ? html`<button class="btn" onClick=${allerSuivante}>Leçon suivante</button>`
                  : html`<button class="btn" onClick=${fermer}>Terminer le parcours</button>`)
              : html`<button class="btn" onClick=${corriger} disabled=${envoi}>
                  ${envoi ? 'Correction…' : (resultat ? 'Corriger à nouveau' : 'Valider mes réponses')}</button>`)
          : (dejaFaite
              ? (suivante
                  ? html`<button class="btn" onClick=${allerSuivante}>Leçon suivante</button>`
                  : html`<button class="btn" onClick=${fermer}>Retour au parcours</button>`)
              : html`<button class="btn" onClick=${achever} disabled=${envoi}>
                  ${envoi ? 'Enregistrement…' : 'J\u2019ai terminé cette leçon'}</button>`)}
        <button class="btn light" onClick=${fermer}>Revenir au parcours</button>
      </div>
    </div>`;
}


/* =====================================================================
   5 ter. GROUPES DE TRAVAIL
   Le catalogue, l'entrée dans un groupe, les documents, les tâches.
   Un groupe peut exiger une certification : la formation conditionne
   alors l'accès au projet.
   ===================================================================== */

function Groupes({ p }){
  const [liste, setListe] = useState(null);
  const [miens, setMiens] = useState({});
  const [certifs, setCertifs] = useState([]);
  const [terr, setTerr] = useState([]);
  const [creer, setCreer] = useState(false);
  const [f, setF] = useState({nom:'',objet:'',territoire:'',certification:'',niveau:'10',ouvert:'true'});
  const [msg, setMsg] = useState('');

  const peutCreer = p.echelon >= 3 || p.niveau >= 50;

  const charger = useCallback(async () => {
    const [{ data: gs }, { data: ms }, { data: cs }, { data: ts }] = await Promise.all([
      db.from('v_groupes').select('*').eq('statut','actif').order('nom'),
      db.from('gt_membres').select('groupe_id,role,statut').eq('profil_id', p.id),
      db.from('certifications').select('code,nom').eq('actif', true).order('nom'),
      db.from('territoires').select('id,nom,echelle').order('echelle').order('nom')
    ]);
    setListe(gs || []);
    setMiens(Object.fromEntries((ms||[]).map(m => [m.groupe_id, m])));
    setCertifs(cs || []); setTerr(ts || []);
  }, [p.id]);

  useEffect(() => { charger(); }, [charger]);

  async function rejoindre(id){
    setMsg('');
    const { data, error } = await db.rpc('rejoindre_groupe', { p_groupe: id });
    if (error) return setMsg(error.message);
    if (!data.ok) return setMsg(data.message);
    charger();
  }

  async function repondre(id, oui){
    await db.rpc('repondre_invitation', { p_groupe: id, p_accepte: oui });
    charger();
  }

  async function envoyerCreation(e){
    e.preventDefault(); setMsg('');
    const { data, error } = await db.rpc('creer_groupe', {
      p_nom: f.nom, p_objet: f.objet,
      p_territoire: f.territoire || null,
      p_certification: f.certification || null,
      p_niveau_min: Number(f.niveau),
      p_ouvert: f.ouvert === 'true'
    });
    if (error) return setMsg(error.message);
    if (!data.ok) return setMsg(data.message);
    setCreer(false); setF({nom:'',objet:'',territoire:'',certification:'',niveau:'10',ouvert:'true'});
    aller('/espace/groupe/' + data.id);
  }

  if (!liste) return html`<div class="vide">Chargement…</div>`;

  const invitations = liste.filter(g => miens[g.id]?.statut === 'invite');
  const mesGroupes  = liste.filter(g => miens[g.id]?.statut === 'actif');
  const autres      = liste.filter(g => !miens[g.id] || miens[g.id].statut === 'parti');

  const carteGroupe = (g, action) => html`
    <div class="ligne">
      <div style="flex:1;min-width:220px">
        <div>${g.nom}</div>
        <div class="small muted">${g.objet || ''}</div>
        <div class="row" style="margin-top:8px;gap:6px">
          <span class="tag">${g.nb_membres} membre${g.nb_membres>1?'s':''}</span>
          ${g.territoire_nom && html`<span class="tag">${g.territoire_nom}</span>`}
          ${g.certification_nom && html`<span class="tag or">${g.certification_nom} requis</span>`}
          ${!g.ouvert && html`<span class="tag">Sur invitation</span>`}
        </div>
      </div>
      ${action}
    </div>`;

  return html`
    <div>
      <div class="spread">
        <div>
          <div class="eyebrow">Groupes de travail</div>
          <h1 style="margin:6px 0 0">Projets et chantiers</h1>
        </div>
        ${peutCreer && html`<button class="btn" onClick=${()=>setCreer(c=>!c)}>
          ${creer ? 'Annuler' : 'Créer un groupe'}</button>`}
      </div>
      <p class="muted" style="max-width:58ch;margin-top:12px">
        Certains groupes exigent une certification. Vous l\u2019obtenez en
        achevant la formation correspondante.
      </p>

      ${msg && html`<div class="alerte err" style="margin-top:24px">${msg}</div>`}

      ${creer && html`
        <form onSubmit=${envoyerCreation} class="panneau" style="margin-top:24px">
          <div class="tete"><h3 style="font-size:17px">Nouveau groupe</h3></div>
          <div class="corps stack">
            <div class="field"><label>Nom</label>
              <input required value=${f.nom} onInput=${e=>setF(o=>({...o,nom:e.target.value}))} /></div>
            <div class="field"><label>Objet</label>
              <textarea required value=${f.objet}
                onInput=${e=>setF(o=>({...o,objet:e.target.value}))}
                placeholder="À quoi sert ce groupe, en deux phrases."></textarea></div>
            <div class="field"><label>Périmètre</label>
              <select value=${f.territoire} onChange=${e=>setF(o=>({...o,territoire:e.target.value}))}>
                <option value="">National — ouvert à tous</option>
                ${terr.map(t => html`<option value=${t.id}>${t.nom} (${t.echelle})</option>`)}
              </select></div>
            <div class="field"><label>Certification exigée</label>
              <select value=${f.certification} onChange=${e=>setF(o=>({...o,certification:e.target.value}))}>
                <option value="">Aucune</option>
                ${certifs.map(c => html`<option value=${c.code}>${c.nom}</option>`)}
              </select></div>
            <div class="field"><label>Entrée</label>
              <select value=${f.ouvert} onChange=${e=>setF(o=>({...o,ouvert:e.target.value}))}>
                <option value="true">Libre — on rejoint seul</option>
                <option value="false">Sur invitation du responsable</option>
              </select></div>
            <div><button class="btn">Créer le groupe</button></div>
            <p class="small muted">Vous en serez le responsable.</p>
          </div>
        </form>`}

      ${invitations.length > 0 && html`
        <div class="panneau" style="margin-top:24px">
          <div class="tete"><h3 style="font-size:17px">Invitations reçues</h3>
            <span class="tag bleu">${invitations.length}</span></div>
          ${invitations.map(g => carteGroupe(g, html`
            <div class="row">
              <button class="btn sm" onClick=${()=>repondre(g.id,true)}>Accepter</button>
              <button class="btn sm light" onClick=${()=>repondre(g.id,false)}>Décliner</button>
            </div>`))}
        </div>`}

      <div class="panneau" style="margin-top:24px">
        <div class="tete"><h3 style="font-size:17px">Mes groupes</h3>
          <span class="tag">${mesGroupes.length}</span></div>
        ${mesGroupes.length === 0
          ? html`<div class="vide">Vous ne participez à aucun groupe pour l\u2019instant.</div>`
          : mesGroupes.map(g => carteGroupe(g, html`
              <div class="row">
                ${miens[g.id]?.role === 'responsable' && html`<span class="tag or">Responsable</span>`}
                <a class="btn sm" href=${'#/espace/groupe/'+g.id}>Ouvrir</a>
              </div>`))}
      </div>

      <div class="panneau" style="margin-top:24px">
        <div class="tete"><h3 style="font-size:17px">Autres groupes</h3></div>
        ${autres.length === 0
          ? html`<div class="vide">Rien d\u2019autre à rejoindre.</div>`
          : autres.map(g => carteGroupe(g,
              g.ouvert
                ? html`<button class="btn sm light" onClick=${()=>rejoindre(g.id)}>Rejoindre</button>`
                : html`<span class="tag">Sur invitation</span>`))}
      </div>
    </div>`;
}

function Groupe({ p, id }){
  const [g, setG] = useState(null);
  const [onglet, setOnglet] = useState('taches');
  const [membres, setMembres] = useState([]);
  const [docs, setDocs] = useState([]);
  const [taches, setTaches] = useState([]);
  const [gens, setGens] = useState({});     // id → profil, pour les noms
  const [msg, setMsg] = useState('');
  const [refuse, setRefuse] = useState('');

  const charger = useCallback(async () => {
    const { data: gr } = await db.from('v_groupes').select('*').eq('id', id).maybeSingle();
    setG(gr);
    if (!gr) return;

    const { data: ms } = await db.from('gt_membres').select('*').eq('groupe_id', id);
    setMembres(ms || []);

    const [{ data: ds }, { data: ts }] = await Promise.all([
      db.from('gt_documents').select('*').eq('groupe_id', id).order('cree_le', {ascending:false}),
      db.from('gt_taches').select('*').eq('groupe_id', id).order('echeance', {nullsFirst:false})
    ]);
    setDocs(ds || []); setTaches(ts || []);

    // gt_taches pointe deux fois vers profils : on lit les noms à part.
    const ids = [...new Set([
      ...(ms||[]).map(m => m.profil_id),
      ...(ts||[]).map(t => t.assigne_a).filter(Boolean),
      ...(ds||[]).map(d => d.depose_par).filter(Boolean)
    ])];
    if (ids.length){
      const { data: ps } = await db.from('v_annuaire')
        .select('id,prenom,nom,matricule,fonction_nom,echelon').in('id', ids);
      setGens(Object.fromEntries((ps||[]).map(x => [x.id, x])));
    }
  }, [id]);

  useEffect(() => { charger(); }, [charger]);

  useEffect(() => { (async () => {
    const { data } = await db.rpc('obstacle_groupe', { p_groupe: id });
    setRefuse(data || '');
  })(); }, [id]);

  if (!g) return html`<div class="vide">Groupe introuvable ou fermé.</div>`;

  const moi = membres.find(m => m.profil_id === p.id && m.statut === 'actif');
  const responsable = moi?.role === 'responsable' || p.niveau >= 90;

  if (!moi) return html`
    <div>
      <a class="small" href="#/espace/groupes">← Tous les groupes</a>
      <h1 style="margin:12px 0 8px">${g.nom}</h1>
      <p class="muted" style="max-width:58ch">${g.objet||''}</p>
      <div class="alerte" style="margin-top:24px">
        ${refuse
          ? refuse
          : (g.ouvert
              ? 'Vous ne participez pas encore à ce groupe.'
              : 'Ce groupe se rejoint sur invitation de son responsable.')}
      </div>
      ${!refuse && g.ouvert && html`
        <div style="margin-top:24px">
          <button class="btn" onClick=${async ()=>{
            const { data } = await db.rpc('rejoindre_groupe', { p_groupe: id });
            if (data?.ok) charger(); else setMsg(data?.message||'');
          }}>Rejoindre ce groupe</button>
        </div>`}
      ${msg && html`<div class="alerte err" style="margin-top:16px">${msg}</div>`}
    </div>`;

  return html`
    <div>
      <a class="small" href="#/espace/groupes">← Tous les groupes</a>
      <div class="spread" style="margin-top:12px">
        <div>
          <h1>${g.nom}</h1>
          <div class="row" style="margin-top:8px;gap:6px">
            <span class="tag">${g.nb_membres} membre${g.nb_membres>1?'s':''}</span>
            ${g.territoire_nom && html`<span class="tag">${g.territoire_nom}</span>`}
            ${g.certification_nom && html`<span class="tag or">${g.certification_nom}</span>`}
            ${responsable && html`<span class="tag or">Vous êtes responsable</span>`}
          </div>
        </div>
      </div>
      <p class="muted" style="max-width:60ch;margin-top:16px">${g.objet||''}</p>

      <div style="margin-top:24px">
        <button class="btn light" onClick=${async ()=>{
          const { data } = await db.rpc('conversation_groupe', { p_groupe: id });
          if (data?.ok) aller('/espace/messagerie'); else setMsg(data?.message||'');
        }}>Ouvrir la discussion du groupe</button>
      </div>

      <div class="row" style="margin:32px 0 24px;gap:0;border-bottom:1px solid var(--filet)">
        ${[['taches','Tâches'],['documents','Documents'],['membres','Membres']].map(([k,t]) => html`
          <button class="btn light" style=${'border:0;border-bottom:2px solid '+
            (onglet===k?'var(--encre)':'transparent')+';border-radius:0;background:transparent'}
            onClick=${()=>setOnglet(k)}>${t}</button>`)}
      </div>

      ${msg && html`<div class="alerte err" style="margin-bottom:16px">${msg}</div>`}

      ${onglet === 'taches' && html`<${GtTaches} p=${p} groupe=${g} taches=${taches}
        membres=${membres} gens=${gens} responsable=${responsable} recharger=${charger} />`}
      ${onglet === 'documents' && html`<${GtDocuments} p=${p} groupe=${g} docs=${docs}
        gens=${gens} responsable=${responsable} recharger=${charger} />`}
      ${onglet === 'membres' && html`<${GtMembres} p=${p} groupe=${g} membres=${membres}
        gens=${gens} responsable=${responsable} recharger=${charger} />`}
    </div>`;
}

function GtTaches({ p, groupe, taches, membres, gens, responsable, recharger }){
  const [ouvrir, setOuvrir] = useState(false);
  const [f, setF] = useState({titre:'',description:'',assigne:'',echeance:'',priorite:'normale'});
  const [msg, setMsg] = useState('');

  const actifs = membres.filter(m => m.statut === 'actif');

  async function ajouter(e){
    e.preventDefault(); setMsg('');
    const { error } = await db.from('gt_taches').insert({
      groupe_id: groupe.id, titre: f.titre, description: f.description || null,
      assigne_a: f.assigne || null, echeance: f.echeance || null,
      priorite: f.priorite, cree_par: p.id
    });
    if (error) return setMsg(error.message);
    setF({titre:'',description:'',assigne:'',echeance:'',priorite:'normale'});
    setOuvrir(false); recharger();
  }

  async function changer(t, statut){
    const { error } = await db.from('gt_taches').update({
      statut, faite_le: statut === 'faite' ? new Date().toISOString() : null
    }).eq('id', t.id);
    if (error) setMsg(error.message);
    recharger();
  }

  const enCours = taches.filter(t => t.statut === 'a_faire' || t.statut === 'en_cours');
  const closes  = taches.filter(t => t.statut === 'faite' || t.statut === 'abandonnee');
  const retard  = t => t.echeance && new Date(t.echeance) < new Date() && t.statut !== 'faite';

  const ligneTache = t => html`
    <div class="ligne">
      <div style="flex:1;min-width:220px">
        <div style=${t.statut==='faite'||t.statut==='abandonnee' ? 'opacity:.55' : ''}>${t.titre}</div>
        ${t.description && html`<div class="small muted">${t.description}</div>`}
        <div class="row" style="margin-top:8px;gap:6px">
          ${t.assigne_a
            ? html`<span class="tag bleu">${nomComplet(gens[t.assigne_a]||{})}</span>`
            : html`<span class="tag">Non assignée</span>`}
          ${t.echeance && html`<span class=${'tag'+(retard(t)?' rouge':'')}>
            ${retard(t)?'En retard · ':''}${jour(t.echeance)}</span>`}
          ${t.priorite === 'haute' && html`<span class="tag rouge">Prioritaire</span>`}
        </div>
      </div>
      <div class="row">
        ${t.statut === 'a_faire' && html`
          <button class="btn sm light" onClick=${()=>changer(t,'en_cours')}>Commencer</button>`}
        ${(t.statut === 'a_faire' || t.statut === 'en_cours') && html`
          <button class="btn sm" onClick=${()=>changer(t,'faite')}>Terminer</button>`}
        ${(t.statut === 'faite' || t.statut === 'abandonnee') && html`
          <button class="btn sm light" onClick=${()=>changer(t,'a_faire')}>Rouvrir</button>`}
      </div>
    </div>`;

  return html`
    <div>
      <div class="spread" style="margin-bottom:16px">
        <span class="small muted">${enCours.length} tâche${enCours.length>1?'s':''} en cours</span>
        <button class="btn sm" onClick=${()=>setOuvrir(o=>!o)}>
          ${ouvrir ? 'Annuler' : 'Ajouter une tâche'}</button>
      </div>
      ${msg && html`<div class="alerte err" style="margin-bottom:16px">${msg}</div>`}

      ${ouvrir && html`
        <form onSubmit=${ajouter} class="panneau" style="margin-bottom:24px">
          <div class="corps stack">
            <div class="field"><label>Intitulé</label>
              <input required value=${f.titre} onInput=${e=>setF(o=>({...o,titre:e.target.value}))} /></div>
            <div class="field"><label>Précisions</label>
              <textarea value=${f.description} onInput=${e=>setF(o=>({...o,description:e.target.value}))} /></div>
            <div class="row" style="gap:16px;align-items:flex-start">
              <div class="field" style="flex:1;min-width:180px"><label>Assignée à</label>
                <select value=${f.assigne} onChange=${e=>setF(o=>({...o,assigne:e.target.value}))}>
                  <option value="">Personne</option>
                  ${actifs.map(m => html`<option value=${m.profil_id}>
                    ${nomComplet(gens[m.profil_id]||{})}</option>`)}
                </select></div>
              <div class="field" style="flex:1;min-width:140px;margin-top:0"><label>Échéance</label>
                <input type="date" value=${f.echeance}
                  onInput=${e=>setF(o=>({...o,echeance:e.target.value}))} /></div>
              <div class="field" style="flex:1;min-width:140px;margin-top:0"><label>Priorité</label>
                <select value=${f.priorite} onChange=${e=>setF(o=>({...o,priorite:e.target.value}))}>
                  <option value="basse">Basse</option>
                  <option value="normale">Normale</option>
                  <option value="haute">Haute</option>
                </select></div>
            </div>
            <div><button class="btn">Ajouter</button></div>
          </div>
        </form>`}

      <div class="panneau">
        <div class="tete"><h3 style="font-size:17px">À faire</h3></div>
        ${enCours.length === 0
          ? html`<div class="vide">Rien en cours. C\u2019est peut-être le moment d\u2019ajouter une tâche.</div>`
          : enCours.map(ligneTache)}
      </div>

      ${closes.length > 0 && html`
        <div class="panneau" style="margin-top:24px">
          <div class="tete"><h3 style="font-size:17px">Terminées</h3>
            <span class="tag">${closes.length}</span></div>
          ${closes.map(ligneTache)}
        </div>`}
    </div>`;
}

function GtDocuments({ p, groupe, docs, gens, responsable, recharger }){
  const [ouvrir, setOuvrir] = useState(false);
  const [f, setF] = useState({titre:'',type:'drive',url:'',description:''});
  const [msg, setMsg] = useState('');

  const libelle = { lien:'Lien', drive:'Drive', docs:'Document', sheets:'Tableur',
                    agenda:'Agenda', note:'Note' };

  async function ajouter(e){
    e.preventDefault(); setMsg('');
    const { error } = await db.from('gt_documents').insert({
      groupe_id: groupe.id, titre: f.titre, type: f.type,
      url: f.url || null, description: f.description || null, depose_par: p.id
    });
    if (error) return setMsg(error.message);
    setF({titre:'',type:'drive',url:'',description:''}); setOuvrir(false); recharger();
  }

  async function retirer(d){
    if (!confirm('Retirer « ' + d.titre + ' » de ce groupe ?')) return;

    recharger();
  }

  return html`
    <div>
      <div class="spread" style="margin-bottom:16px">
        <span class="small muted">
          Les fichiers restent sur le Drive de la fédération. On n\u2019en garde ici que le lien.
        </span>
        <button class="btn sm" onClick=${()=>setOuvrir(o=>!o)}>
          ${ouvrir ? 'Annuler' : 'Ajouter un document'}</button>
      </div>
      ${msg && html`<div class="alerte err" style="margin-bottom:16px">${msg}</div>`}

      ${ouvrir && html`
        <form onSubmit=${ajouter} class="panneau" style="margin-bottom:24px">
          <div class="corps stack">

              <input required value=${f.titre} onInput=${e=>setF(o=>({...o,titre:e.target.value}))} /></div>
            <div class="field"><label>Nature</label>
              <select value=${f.type} onChange=${e=>setF(o=>({...o,type:e.target.value}))}>
