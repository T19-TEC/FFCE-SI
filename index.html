}

/* =====================================================================
   RAPPORT D'ACTIVITÉ
   Les chiffres se calculent, le récit se rédige.
   ===================================================================== */
function Rapport({ p }){
  const [annee, setAnnee] = useState(new Date().getFullYear() - 1);
  const [c, setC] = useState(null);
  const [r, setR] = useState({});
  const [edition, setEdition] = useState(false);
  const [msg, setMsg] = useState('');

  const peutRediger = p.niveau >= 60 || (p.postes||[]).length > 0;

  const charger = useCallback(async () => {
    const [a, b] = await Promise.all([
      db.rpc('chiffres_annee', { p_annee: annee, p_territoire: null }),
      db.from('rapports').select('*').eq('annee', annee).is('territoire_id', null).maybeSingle()
    ]);
    setC(a.data); setR(b.data || {annee});
  }, [annee]);
  useEffect(() => { charger(); }, [charger]);

  async function enregistrer(e, statut){
    if (e) e.preventDefault();
    const { data, error } = await db.rpc('enregistrer_rapport', {
      p_annee: annee, p_territoire: null, p_titre: r.titre || null,
      p_edito: r.edito || null, p_faits: r.faits_marquants || null,
      p_perspectives: r.perspectives || null, p_remerciements: r.remerciements || null,
      p_statut: statut || r.statut || 'brouillon'
    });
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data.ok) return setMsg('Erreur : ' + data.message);
    setEdition(false); setMsg('Rapport enregistré.'); charger();
  }

  async function exporter(){
    if (!c) return;
    const plat = [];
    const parcourir = (obj, prefixe) => {
      Object.entries(obj).forEach(([k,v]) => {
        if (v && typeof v === 'object' && !Array.isArray(v)) parcourir(v, prefixe + k + ' / ');
        else plat.push({ indicateur: prefixe + k, valeur: v });
      });
    };
    parcourir(c, '');
    const csv = '\ufeff' + 'indicateur;valeur\n' +
      plat.map(l => l.indicateur + ';' + l.valeur).join('\n');
    const url = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
    const a = document.createElement('a');
    a.href = url; a.download = 'FFCE-chiffres-' + annee + '.csv'; a.click();
    URL.revokeObjectURL(url);
    setMsg('Chiffres exportés.');
  }

  if (!c) return html`<div class="vide">Chargement…</div>`;

  const carte = (titre, entrees) => html`
    <div class="panneau" style="margin-bottom:20px">
      <div class="tete"><h3 style="font-size:17px">${titre}</h3></div>
      <div class="corps">
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:18px">
          ${entrees.map(([lab, val]) => html`
            <div>
              <div style="font-family:var(--titre);font-weight:900;font-size:26px;
                color:var(--framboise);line-height:1">${val ?? 0}</div>
              <div class="small muted" style="margin-top:4px">${lab}</div>
            </div>`)}
        </div>
      </div>
    </div>`;

  const champ = (cle, lab, aide) => html`
    <div class="field">
      <label>${lab}</label>
      <textarea value=${r[cle]||''} style="min-height:120px"
        onInput=${e=>setR(o=>({...o,[cle]:e.target.value}))} placeholder=${aide} />
    </div>`;

  return html`
    <div>
      <div class="spread">
        <div>
          <div class="eyebrow">Rapport d\u2019activité</div>
          <h1 style="margin:6px 0 0">${r.titre || 'Année ' + annee}</h1>
        </div>
        <div class="row">
          <select style="width:auto" value=${annee}
            onChange=${e=>setAnnee(Number(e.target.value))}>
            ${[0,1,2,3].map(n => {
              const a = new Date().getFullYear() - n;
              return html`<option value=${a}>${a}</option>`;
            })}
          </select>
          <button class="btn sm light" onClick=${exporter}>Exporter les chiffres</button>
          ${peutRediger && html`<button class="btn sm"
            onClick=${()=>setEdition(x=>!x)}>
            ${edition ? 'Annuler' : 'Rédiger'}</button>`}
        </div>
      </div>
      ${msg && html`<div class=${'alerte '+(msg.startsWith('Erreur')?'err':'ok')}
        style="margin-top:16px">${msg}</div>`}

      ${r.statut && html`<div style="margin-top:16px">
        <span class=${'tag '+(r.statut==='adopte'||r.statut==='publie'?'vert':'')}>
          ${r.statut}${r.adopte_le ? ' le ' + jour(r.adopte_le) : ''}</span></div>`}

      ${edition
        ? html`
          <form onSubmit=${e=>enregistrer(e)} class="panneau" style="margin-top:24px">
            <div class="corps stack">
              <div class="field"><label>Titre du rapport</label>
                <input value=${r.titre||''}
                  onInput=${e=>setR(o=>({...o,titre:e.target.value}))}
                  placeholder=${'Rapport d\u2019activité ' + annee} /></div>
              ${champ('edito','Éditorial',
                'Le mot d\u2019introduction — ce que cette année a représenté.')}
              ${champ('faits_marquants','Faits marquants',
                'Trois à cinq moments qui ont compté.')}
              ${champ('perspectives','Perspectives',
                'Ce que la fédération entend faire l\u2019an prochain.')}
              ${champ('remerciements','Remerciements',
                'Partenaires, financeurs, bénévoles.')}
              <div class="row">
                <button class="btn">Enregistrer</button>
                <button type="button" class="btn light"
                  onClick=${()=>enregistrer(null,'adopte')}>Enregistrer et adopter</button>
              </div>
              <p class="small muted">
                Un rapport adopté devient lisible de tous les membres.
              </p>
            </div>
          </form>`
        : html`
          <div style="margin-top:24px">
            ${r.edito && html`
              <div class="panneau" style="margin-bottom:20px">
                <div class="tete"><h3 style="font-size:17px">Éditorial</h3></div>
                <div class="corps" style="white-space:pre-wrap;max-width:66ch">
                  ${r.edito}</div>
              </div>`}

            ${carte('Les adhérents', [
              ['Membres actifs', c.adherents.total_fin_annee],
              ['Nouvelles adhésions', c.adherents.nouveaux]
            ])}
            ${carte('Le bénévolat', [
              ['Heures données', Number(c.benevolat.heures||0)],
              ['Bénévoles actifs', c.benevolat.benevoles_actifs]
            ])}
            ${carte('Les actions', [
              ['Missions organisées', c.actions.missions],
              ['Participations', c.actions.participations],
              ['Projets menés', c.actions.projets],
              ['Bénéficiaires', c.actions.beneficiaires]
            ])}
            ${carte('La formation', [
              ['Certifications délivrées', c.formation.certifications],
              ['Parcours disponibles', c.formation.formations_publiees]
            ])}
            ${carte('Le réseau', [
              ['Départements couverts', c.reseau.departements],
              ['Structures actives', c.reseau.structures_actives],
              ['Assemblées tenues', c.reseau.assemblees],
              ['Groupes de travail', c.reseau.groupes_travail]
            ])}
            ${carte('La vie démocratique', [
              ['Propositions déposées', c.vie_democratique.propositions],
              ['Propositions retenues', c.vie_democratique.propositions_retenues]
            ])}

            ${r.faits_marquants && html`
              <div class="panneau" style="margin-bottom:20px">
                <div class="tete"><h3 style="font-size:17px">Faits marquants</h3></div>
                <div class="corps" style="white-space:pre-wrap;max-width:66ch">
                  ${r.faits_marquants}</div>
              </div>`}
            ${r.perspectives && html`
              <div class="panneau" style="margin-bottom:20px">
                <div class="tete"><h3 style="font-size:17px">Perspectives</h3></div>
                <div class="corps" style="white-space:pre-wrap;max-width:66ch">
                  ${r.perspectives}</div>
              </div>`}
            ${r.remerciements && html`
              <div class="panneau">
                <div class="tete"><h3 style="font-size:17px">Remerciements</h3></div>
                <div class="corps" style="white-space:pre-wrap;max-width:66ch">
                  ${r.remerciements}</div>
              </div>`}
          </div>`}
    </div>`;
}


/* =====================================================================
   PUBLIER LOCALEMENT
   Le national prépare, le local adapte et publie. Les [crochets] sont
   délibérés : une publication identique partout sonne faux, une
   publication entièrement libre dérive.
   ===================================================================== */

const RESEAUX = {
  instagram:['Instagram','https://www.instagram.com/'],
  facebook:['Facebook','https://www.facebook.com/'],
  linkedin:['LinkedIn','https://www.linkedin.com/'],
  x:['X','https://x.com/compose/post'],
  presse:['Presse',''], newsletter:['Infolettre','']
};

function Publier({ p }){
  const [liste, setListe] = useState([]);
  const [outils, setOutils] = useState([]);
  const [ouverte, setOuverte] = useState(null);
  const [msg, setMsg] = useState('');

  const charger = useCallback(async () => {
    const [a,b] = await Promise.all([
      db.rpc('suggestions_disponibles'),
      db.from('outils_com').select('*').eq('actif',true).order('ordre')
    ]);
    setListe(a.data||[]); setOutils(b.data||[]);
  }, []);
  useEffect(() => { charger(); }, [charger]);

  if (ouverte) return html`<${Suggestion} s=${ouverte} outils=${outils}
    fermer=${()=>{ setOuverte(null); charger(); }} />`;

  const urgentes = liste.filter(x => x.priorite === 'urgente');
  const cats = [...new Set(outils.map(o => o.categorie))];
  const nomCat = { creation:'Créer', ressources:'Ressources', juridique:'Cadre juridique' };

  return html`
    <div>
      <div class="eyebrow">Publier localement</div>
      <h1 style="margin:6px 0 8px">Faire connaître nos actions</h1>
      <p class="muted" style="max-width:60ch">
        La direction de la communication prépare des publications prêtes à
        adapter. Remplissez les <span class="mono">[crochets]</span> avec ce qui
        s\u2019est passé chez vous, et publiez sur vos réseaux.
      </p>
      ${msg && html`<div class="alerte ok" style="margin-top:16px">${msg}</div>`}

      ${urgentes.length > 0 && html`
        <div class="alerte" style="margin-top:24px;border-left-color:var(--bordeaux)">
          ${urgentes.length} publication${urgentes.length>1?'s':''} à relayer sans délai.
        </div>`}

      <div class="tuiles" style="margin-top:24px">
        ${liste.length === 0
          ? html`<div class="tuile"><div class="vide">
              Aucune publication proposée pour l\u2019instant.</div></div>`
          : liste.map(x => html`
            <div class="tuile" style=${'min-height:auto;cursor:pointer;border-top:3px solid '+
                (x.priorite==='urgente'?'var(--bordeaux)':
                 x.priorite==='importante'?'var(--brun)':'var(--framboise)')}
              onClick=${()=>setOuverte(x)}>
              ${x.visuel && html`<img src=${urlPublique(x.visuel)} alt=""
                style="width:100%;height:120px;object-fit:cover;margin-bottom:12px;
                       border:1px solid var(--filet)" />`}
              <h3>${x.titre}</h3>
              ${x.contexte && html`<p style="margin-top:6px">${x.contexte}</p>`}
              <div class="row" style="margin-top:12px;gap:6px">
                ${(x.canaux||[]).map(c => html`
                  <span class="tag">${(RESEAUX[c]||[c])[0]}</span>`)}
              </div>
              <div class="small muted" style="margin-top:10px">
                ${x.a_publier_le ? 'À publier vers le ' + jour(x.a_publier_le) : ''}
                ${x.reprises > 0 ? ' · repris ' + x.reprises + ' fois' : ''}
              </div>
              ${x.je_lai_reprise && html`<div style="margin-top:8px">
                <span class="tag vert">Vous l\u2019avez publiée</span></div>`}
            </div>`)}
      </div>

      <h2 style="font-size:22px;margin:40px 0 16px">Vos outils</h2>
      ${cats.map(cat => html`
        <div class="panneau" style="margin-bottom:16px">
          <div class="tete"><h3 style="font-size:17px">${nomCat[cat]||cat}</h3></div>
          ${outils.filter(o => o.categorie === cat).map(o => html`
            <a class="ligne" href=${o.url}
              target=${o.url.startsWith('#') ? null : '_blank'} rel="noopener"
              style="color:var(--nuit)">
              <div>
                <div>${o.nom}${o.url.startsWith('#') ? '' : ' ↗'}</div>
                <div class="small muted">${o.description||''}</div>
              </div>
            </a>`)}
        </div>`)}
    </div>`;
}

function Suggestion({ s, outils, fermer }){
  const [texte, setTexte] = useState(s.texte);
  const [msg, setMsg] = useState('');
  const [copie, setCopie] = useState(false);

  // Les crochets restants : ce qui n'a pas encore été personnalisé.
  const restants = (texte.match(/\[[^\]]+\]/g) || []);

  function copier(){
    navigator.clipboard.writeText(
      texte + (s.hashtags ? '\n\n' + s.hashtags : ''));
    setCopie(true);
    setTimeout(() => setCopie(false), 2500);
  }

  async function publier(canal){
    copier();
    const url = (RESEAUX[canal]||[])[1];
    if (url) window.open(url, '_blank', 'noopener');
    const { error } = await db.rpc('declarer_reprise', {
      p_suggestion: s.id, p_canal: canal, p_lien: null, p_observation: null });
    if (error) return setMsg('Erreur : ' + error.message);
    setMsg('Texte copié et publication enregistrée. Collez-le sur ' +
           (RESEAUX[canal]||[canal])[0] + '.');
  }

  const canva = s.lien_canva || (outils.find(o => o.nom.includes('Canva'))||{}).url;

  return html`
    <div>
      <button class="lien-discret" onClick=${fermer}>← Toutes les publications</button>
      <div class="spread" style="margin-top:12px">
        <div>
          <h1 style="font-size:28px">${s.titre}</h1>
          <div class="small muted" style="margin-top:4px">
            <span class="mono">${s.reference}</span>
            ${s.auteur ? ' · ' + s.auteur : ''}
            ${s.a_publier_le ? ' · à publier vers le ' + jour(s.a_publier_le) : ''}
            ${s.reprises > 0 ? ' · repris ' + s.reprises + ' fois' : ''}
          </div>
        </div>
        ${s.priorite !== 'normale' && html`
          <span class=${'tag '+(s.priorite==='urgente'?'rouge':'or')}>
            ${s.priorite === 'urgente' ? 'Sans délai' : 'Important'}</span>`}
      </div>

      ${s.contexte && html`<div class="alerte" style="margin-top:20px">${s.contexte}</div>`}
      ${msg && html`<div class=${'alerte '+(msg.startsWith('Erreur')?'err':'ok')}
        style="margin-top:16px">${msg}</div>`}

      ${s.visuel && html`
        <div class="panneau" style="margin-top:24px">
          <div class="tete"><h3 style="font-size:17px">Le visuel</h3>
            <a class="btn sm light" href=${urlPublique(s.visuel)}
              download target="_blank" rel="noopener">Télécharger</a></div>
          <div class="corps">
            <img src=${urlPublique(s.visuel)} alt=""
              style="max-width:100%;border:1px solid var(--filet)" />
          </div>
        </div>`}

      <div class="panneau" style="margin-top:24px">
        <div class="tete">
          <div class="row" style="gap:8px">
            <h3 style="font-size:17px">Le texte, à adapter</h3>
            <${Info} texte="Remplacez chaque [crochet] par ce qui s'est passé chez vous. Une publication identique partout sonne faux ; celle qui parle de votre territoire touche vos voisins." />
          </div>
          ${restants.length > 0
            ? html`<span class="tag or">${restants.length} à remplir</span>`
            : html`<span class="tag vert">Prêt</span>`}
        </div>
        <div class="corps">
          <textarea value=${texte} style="min-height:230px;font-size:15px"
            onInput=${e=>setTexte(e.target.value)} />
          <div class="spread" style="margin-top:10px">
            <span class="small muted">
              ${texte.length} signes
              ${restants.length > 0
                ? ' · reste : ' + restants.slice(0,3).join(' ') +
                  (restants.length > 3 ? '…' : '')
                : ''}
            </span>
            <button class="btn sm light" onClick=${copier}>
              ${copie ? 'Copié' : 'Copier le texte'}</button>
          </div>
          ${s.hashtags && html`
            <div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--filet)">
              <div class="eyebrow" style="margin-bottom:6px">Mots-clics</div>
              <div class="small mono">${s.hashtags}</div>
            </div>`}
        </div>
      </div>

      ${s.consignes && html`
        <div class="panneau" style="margin-top:24px;border-left:3px solid var(--bordeaux)">
          <div class="tete"><h3 style="font-size:17px">À ne pas oublier</h3></div>
          <div class="corps" style="white-space:pre-wrap">${s.consignes}</div>
        </div>`}

      <div class="panneau" style="margin-top:24px">
        <div class="tete"><h3 style="font-size:17px">Publier</h3></div>
        <div class="corps">
          ${restants.length > 0 && html`
            <div class="alerte" style="margin-bottom:16px">
              Il reste ${restants.length} passage${restants.length>1?'s':''} entre
              crochets. Complétez-les avant de publier.
            </div>`}
          <div class="row" style="gap:10px">
            ${(s.canaux||[]).map(c => html`
              <button class="btn" onClick=${()=>publier(c)}>
                ${(RESEAUX[c]||[c])[0]}</button>`)}
          </div>
          <p class="small muted" style="margin:14px 0 0">
            Le texte est copié dans votre presse-papiers et le réseau s\u2019ouvre :
            il ne reste qu\u2019à coller. Votre publication est comptée, ce qui permet
            à la direction de savoir ce qui vit.
          </p>
          ${canva && html`
            <div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--filet)">
              <a class="btn light" href=${canva} target="_blank" rel="noopener">
                Créer un visuel sur Canva ↗</a>
            </div>`}
        </div>
      </div>
    </div>`;
}

/* --- Suggestions, côté direction -------------------------------------- */
function SuggestionsAdmin({ setMsg }){
  const [liste, setListe] = useState([]);
  const [ouvert, setOuvert] = useState(false);
  const [f, setF] = useState({titre:'', contexte:'', texte:'', hashtags:'',
    consignes:'', priorite:'normale', publier_le:'', expire_le:'',
    canaux:['instagram','facebook','linkedin'], canva:''});
  const [fichier, setFichier] = useState(null);

  const charger = useCallback(() =>
    db.rpc('suivi_suggestions').then(({data}) => setListe(data||[])), []);
  useEffect(() => { charger(); }, [charger]);

  function basculerCanal(c){
    setF(o => ({...o, canaux: o.canaux.includes(c)
      ? o.canaux.filter(x => x !== c) : [...o.canaux, c]}));
  }

  async function creer(e){
    e.preventDefault();
    let visuel = null;
    try { if (fichier) visuel = await deposerImage(fichier, 'suggestions'); }
    catch (err){ return setMsg('Erreur : ' + err.message); }
    const { data, error } = await db.rpc('creer_suggestion', {
      p_titre: f.titre, p_contexte: f.contexte || null, p_texte: f.texte,
      p_canaux: f.canaux, p_visuel: visuel, p_canva: f.canva || null,
      p_hashtags: f.hashtags || null,
      p_publier_le: f.publier_le || null, p_expire_le: f.expire_le || null,
      p_consignes: f.consignes || null, p_priorite: f.priorite, p_territoire: null
    });
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data.ok) return setMsg('Erreur : ' + data.message);
    setF({titre:'', contexte:'', texte:'', hashtags:'', consignes:'',
      priorite:'normale', publier_le:'', expire_le:'',
      canaux:['instagram','facebook','linkedin'], canva:''});
    setFichier(null); setOuvert(false);
    setMsg('Suggestion publiée auprès des équipes locales.'); charger();
  }

  return html`
    <div>
      <div class="spread" style="margin-bottom:16px">
        <p class="small muted" style="margin:0;max-width:46ch">
          Préparez une publication ; chaque équipe locale l\u2019adaptera à son
          territoire. Écrivez entre <span class="mono">[crochets]</span> ce
          qu\u2019elle devra compléter.
        </p>
        <button class="btn" onClick=${()=>setOuvert(o=>!o)}>
          ${ouvert ? 'Annuler' : 'Nouvelle suggestion'}</button>
      </div>

      ${ouvert && html`
        <form onSubmit=${creer} class="panneau" style="margin-bottom:24px">
          <div class="corps stack">
            <div class="field"><label>Titre</label>
              <input required value=${f.titre}
                onInput=${e=>setF(o=>({...o,titre:e.target.value}))}
                placeholder="Journée nationale de la laïcité" /></div>
            <div class="field"><label>Pourquoi maintenant</label>
              <input value=${f.contexte}
                onInput=${e=>setF(o=>({...o,contexte:e.target.value}))}
                placeholder="Une ligne pour situer l\u2019enjeu." /></div>
            <div class="field"><label>Le texte</label>
              <textarea required value=${f.texte} style="min-height:180px"
                onInput=${e=>setF(o=>({...o,texte:e.target.value}))}
                placeholder=${'Le [date], la FFCE [territoire] était à [lieu]...'} /></div>
            <div class="field"><label>Mots-clics</label>
              <input value=${f.hashtags}
                onInput=${e=>setF(o=>({...o,hashtags:e.target.value}))}
                placeholder="#FFCE #Citoyenneté #ÉgalitéDesChances" /></div>
            <div class="field"><label>Canaux</label>
              <div class="row" style="gap:8px">
                ${Object.entries(RESEAUX).map(([k,v]) => html`
                  <button type="button"
                    class=${'btn sm '+(f.canaux.includes(k)?'':'light')}
                    onClick=${()=>basculerCanal(k)}>${v[0]}</button>`)}
              </div></div>
            <div class="row" style="gap:16px;align-items:flex-start">
              <div class="field" style="flex:1;min-width:150px;margin:0">
                <label>À publier vers le</label>
                <input type="date" value=${f.publier_le}
                  onInput=${e=>setF(o=>({...o,publier_le:e.target.value}))} /></div>
              <div class="field" style="flex:1;min-width:150px;margin:0">
                <label>Ne plus proposer après</label>
                <input type="date" value=${f.expire_le}
                  onInput=${e=>setF(o=>({...o,expire_le:e.target.value}))} /></div>
              <div class="field" style="flex:1;min-width:140px;margin:0">
                <label>Priorité</label>
                <select value=${f.priorite}
                  onChange=${e=>setF(o=>({...o,priorite:e.target.value}))}>
                  <option value="normale">Normale</option>
                  <option value="importante">Importante</option>
                  <option value="urgente">Sans délai</option>
                </select></div>
            </div>
            <div class="field"><label>Modèle Canva</label>
              <input type="url" value=${f.canva}
                onInput=${e=>setF(o=>({...o,canva:e.target.value}))}
                placeholder="https://www.canva.com/design/…" /></div>
            <div class="field"><label>Visuel</label>
              <input type="file" accept="image/*"
                onChange=${e=>setFichier(e.target.files[0]||null)} /></div>
            <div class="field"><label>À ne pas oublier</label>
              <textarea value=${f.consignes}
                onInput=${e=>setF(o=>({...o,consignes:e.target.value}))}
                placeholder="Aucun visage de mineur sans autorisation écrite. Ne pas modifier le logo." /></div>
            <div><button class="btn">Publier auprès des équipes</button></div>
          </div>
        </form>`}

      <div class="panneau">
        <div class="tete"><h3 style="font-size:17px">Ce qui circule</h3>
          <span class="tag">${liste.length}</span></div>
        ${liste.length === 0
          ? html`<div class="vide">Aucune suggestion.</div>`
          : liste.map(x => html`
            <div class="ligne">
              <div style="flex:1;min-width:220px">
                <div class="row" style="gap:8px">
                  <span>${x.titre}</span>
                  ${x.priorite !== 'normale' && html`
                    <span class=${'tag '+(x.priorite==='urgente'?'rouge':'or')}>
                      ${x.priorite}</span>`}
                </div>
                <div class="small muted">
                  <span class="mono">${x.reference}</span> · ${jour(x.cree_le)}
                  ${x.a_publier_le ? ' · pour le ' + jour(x.a_publier_le) : ''}
                </div>
                ${x.territoires && html`<div class="small muted" style="margin-top:4px">
                  Repris par : ${x.territoires}
                  ${x.canaux_utilises ? ' — ' + x.canaux_utilises : ''}</div>`}
              </div>
              <div class="row">
                <span class=${'tag '+(x.reprises>0?'vert':'')}>
                  ${x.reprises} reprise${x.reprises>1?'s':''}</span>
                <span class="tag">${x.statut}</span>
              </div>
            </div>`)}
      </div>
    </div>`;
}


/* =====================================================================
   ÉDITEUR DE FORMATIONS
   Une formation en cours de rédaction ne doit jamais casser le
   parcours de quelqu'un : supprimer une leçon achevée est refusé,
   déplacer échange les rangs sans toucher à la progression acquise.
   ===================================================================== */

const TYPES_LECON = { lecture:'Texte', video:'Vidéo',
                      document:'Document', quiz:'Quiz' };

function EditeurFormations({ p }){
  const [liste, setListe] = useState([]);
  const [ouverte, setOuverte] = useState(null);
  const [creation, setCreation] = useState(false);
  const [f, setF] = useState({titre:'', resume:'', description:'',
    niveau_min:'10', duree:'', seuil:'80'});
  const [msg, setMsg] = useState('');

  const charger = useCallback(() =>
    db.from('formations').select('*').order('ordre')
      .then(({data}) => setListe(data||[])), []);
  useEffect(() => { charger(); }, [charger]);

  async function creer(e){
    e.preventDefault();
    const { data, error } = await db.rpc('enregistrer_formation', {
      p_id: null, p_code: null, p_titre: f.titre, p_resume: f.resume || null,
      p_description: f.description || null, p_niveau_min: Number(f.niveau_min),
      p_duree: f.duree ? Number(f.duree) : null, p_seuil: Number(f.seuil||80),
      p_publiee: false, p_ordre: 100, p_image: null, p_prerequis: null
    });
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data.ok) return setMsg('Erreur : ' + data.message);
    setF({titre:'', resume:'', description:'', niveau_min:'10', duree:'', seuil:'80'});
    setCreation(false); setOuverte(data.id); charger();
  }

  if (ouverte) return html`<${EditeurParcours} id=${ouverte}
    fermer=${()=>{ setOuverte(null); charger(); }} />`;

  return html`
    <div>
      <div class="spread">
        <div>
          <div class="eyebrow">Formations</div>
          <h1 style="margin:6px 0 0">Rédiger les parcours</h1>
        </div>
        <button class="btn" onClick=${()=>setCreation(c=>!c)}>
          ${creation ? 'Annuler' : 'Nouvelle formation'}</button>
      </div>
      ${msg && html`<div class="alerte err" style="margin-top:16px">${msg}</div>`}

      ${creation && html`
        <form onSubmit=${creer} class="panneau" style="margin-top:24px">
          <div class="corps stack">
            <div class="field"><label>Titre</label>
              <input required value=${f.titre}
                onInput=${e=>setF(o=>({...o,titre:e.target.value}))} /></div>
            <div class="field"><label>Résumé</label>
              <input value=${f.resume} onInput=${e=>setF(o=>({...o,resume:e.target.value}))}
                placeholder="Une ligne, affichée sur la tuile." /></div>
            <div class="field"><label>Description</label>
              <textarea value=${f.description}
                onInput=${e=>setF(o=>({...o,description:e.target.value}))} /></div>
            <div class="row" style="gap:16px;align-items:flex-start">
              <div class="field" style="flex:1;min-width:150px;margin:0">
                <label>Ouverte à partir de</label>
                <select value=${f.niveau_min}
                  onChange=${e=>setF(o=>({...o,niveau_min:e.target.value}))}>
                  <option value="10">Tous les adhérents</option>
                  <option value="40">Animateurs locaux</option>
                  <option value="60">Référents départementaux</option>
                  <option value="80">Direction</option>
                </select></div>
              <div class="field" style="flex:1;min-width:120px;margin:0">
                <label>Durée (min)</label>
                <input type="number" value=${f.duree}
                  onInput=${e=>setF(o=>({...o,duree:e.target.value}))} /></div>
              <div class="field" style="flex:1;min-width:120px;margin:0">
                <label>Seuil des quiz (%)</label>
                <input type="number" min="50" max="100" value=${f.seuil}
                  onInput=${e=>setF(o=>({...o,seuil:e.target.value}))} /></div>
            </div>
            <div><button class="btn">Créer et rédiger</button></div>
          </div>
        </form>`}

      <div class="panneau" style="margin-top:24px">
        ${liste.length === 0
          ? html`<div class="vide">Aucune formation.</div>`
          : liste.map(x => html`
            <div class="ligne" style="cursor:pointer" onClick=${()=>setOuverte(x.id)}>
              <div style="flex:1;min-width:220px">
                <div class="row" style="gap:8px">
                  <span>${x.titre}</span>
                  ${x.publiee
                    ? html`<span class="tag vert">Publiée</span>`
                    : html`<span class="tag">Brouillon</span>`}
                </div>
                <div class="small muted">${x.resume || ''}
                  ${x.duree_min ? ' · ' + x.duree_min + ' min' : ''}
                  · <span class="mono">${x.code}</span></div>
              </div>
              <button class="btn sm light">Rédiger</button>
            </div>`)}
      </div>
    </div>`;
}

function EditeurParcours({ id, fermer }){
  const [f, setF] = useState(null);
  const [onglet, setOnglet] = useState('contenu');
  const [verif, setVerif] = useState(null);
  const [suivi, setSuivi] = useState([]);
  const [lecon, setLecon] = useState(null);
  const [msg, setMsg] = useState('');

  const charger = useCallback(async () => {
    const [a,b,c] = await Promise.all([
      db.rpc('formation_complete', { p_formation: id }),
      db.rpc('verifier_formation', { p_formation: id }),
      db.rpc('suivi_formation', { p_formation: id })
    ]);
    setF(a.data); setVerif(b.data); setSuivi(c.data||[]);
  }, [id]);
  useEffect(() => { charger(); }, [charger]);

  const appel = async (fn, args, ok) => {
    const { data, error } = await db.rpc(fn, args);
    if (error){ setMsg('Erreur : ' + error.message); return false; }
    if (!data.ok){ setMsg('Erreur : ' + data.message); return false; }
    if (ok) setMsg(ok);
    charger(); return data;
  };

  if (!f) return html`<div class="vide">Chargement…</div>`;
  if (f.erreur) return html`<div class="alerte err">${f.erreur}</div>`;
  const fo = f.formation;

  if (lecon) return html`<${EditeurLecon} lecon=${lecon}
    fermer=${()=>{ setLecon(null); charger(); }} />`;

  async function publier(){
    if (!verif.publiable && !fo.publiee){
      return setMsg('Erreur : corrigez d\u2019abord les points signalés.');
    }
    await appel('enregistrer_formation', {
      p_id: id, p_code: fo.code, p_titre: fo.titre, p_resume: fo.resume,
      p_description: fo.description, p_niveau_min: fo.niveau_min,
      p_duree: fo.duree_min, p_seuil: fo.seuil_quiz, p_publiee: !fo.publiee,
      p_ordre: fo.ordre, p_image: null, p_prerequis: fo.prerequis
    }, fo.publiee ? 'Formation dépubliée.' : 'Formation publiée.');
  }

  return html`
    <div>
      <button class="lien-discret" onClick=${fermer}>← Toutes les formations</button>
      <div class="spread" style="margin-top:12px">
        <div>
          <h1 style="font-size:28px">${fo.titre}</h1>
          <div class="small muted" style="margin-top:4px">
            <span class="mono">${fo.code}</span>
            · ${f.inscrits} membre${f.inscrits>1?'s':''} engagé${f.inscrits>1?'s':''}
          </div>
        </div>
        <div class="row">
          ${fo.publiee
            ? html`<span class="tag vert">Publiée</span>`
            : html`<span class="tag">Brouillon</span>`}
          <button class=${'btn sm '+(fo.publiee?'light':'')} onClick=${publier}>
            ${fo.publiee ? 'Dépublier' : 'Publier'}</button>
        </div>
      </div>
      ${msg && html`<div class=${'alerte '+(msg.startsWith('Erreur')?'err':'ok')}
        style="margin-top:16px">${msg}</div>`}

      ${verif && !verif.publiable && html`
        <div class="alerte err" style="margin-top:20px">
          <strong>À corriger avant publication :</strong>
          <ul style="margin:8px 0 0;padding-left:18px">
            ${(verif.soucis||[]).map(x => html`<li class="small">${x}</li>`)}
          </ul>
        </div>`}

      <div class="row" style="margin:28px 0 24px;gap:0;border-bottom:1px solid var(--filet)">
        ${[['contenu','Contenu'],['reglages','Réglages'],
           ['suivi','Qui suit ('+suivi.length+')']].map(([k,t]) => html`
          <button class="btn light" style=${'border:0;border-bottom:2px solid '+
            (onglet===k?'var(--bordeaux)':'transparent')+';border-radius:0;background:transparent'}
            onClick=${()=>setOnglet(k)}>${t}</button>`)}
      </div>

      ${onglet === 'contenu' && html`
        <div>
          ${(f.modules||[]).map((m, im) => html`
            <div class="panneau" style="margin-bottom:16px">
              <div class="tete">
                <div style="flex:1">
                  <input defaultValue=${m.titre} style="font-family:var(--titre);
                    font-weight:700;font-size:16px;border-color:transparent;padding:4px 6px"
                    onBlur=${e=>appel('enregistrer_module',
                      { p_id: m.id, p_formation: id, p_titre: e.target.value,
                        p_resume: m.resume })} />
                  <input defaultValue=${m.resume||''} placeholder="Résumé du module"
                    style="font-size:13px;border-color:transparent;padding:2px 6px;
                           color:var(--gris)"
                    onBlur=${e=>appel('enregistrer_module',
                      { p_id: m.id, p_formation: id, p_titre: m.titre,
                        p_resume: e.target.value })} />
                </div>
                <div class="row" style="gap:4px">
                  <button class="btn sm light" disabled=${im===0}
                    onClick=${()=>appel('deplacer',{p_table:'module',p_id:m.id,p_sens:-1})}>↑</button>
                  <button class="btn sm light" disabled=${im===(f.modules||[]).length-1}

                  <button class="btn sm light" onClick=${()=>{
                    if (confirm('Supprimer « ' + m.titre + ' » ?'))

                    <div class="row" style="gap:8px">

                    <button class="btn sm light" disabled=${il===0}

                    <button class="btn sm light" disabled=${il===(m.lecons||[]).length-1}
                      onClick=${()=>appel('deplacer',{p_table:'lecon',p_id:l.id,p_sens:1})}>↓</button>
                    <button class="btn sm light" onClick=${()=>setLecon(l)}>Ouvrir</button>
                    <button class="btn sm light" onClick=${()=>{
                      if (confirm('Supprimer « ' + l.titre + ' » ?'))
                        appel('supprimer_element',{p_table:'lecon',p_id:l.id},'Leçon supprimée.');
                    }}>×</button>
                  </div>
                </div>`)}

              <div class="corps" style="border-top:1px solid var(--filet)">
                <div class="row" style="gap:8px">
                  ${Object.entries(TYPES_LECON).map(([k,v]) => html`
                    <button class="btn sm light" onClick=${async ()=>{
                      const t = prompt('Titre de la leçon');
                      if (!t) return;
                      const r = await appel('enregistrer_lecon',
                        { p_id:null, p_module:m.id, p_titre:t, p_type:k,
                          p_contenu:null, p_url:null, p_duree:null });
                      if (r) setMsg('Leçon ajoutée.');
                    }}>+ ${v}</button>`)}
                </div>
              </div>
            </div>`)}

          <button class="btn" onClick=${async ()=>{
            const t = prompt('Titre du module');
            if (!t) return;
            appel('enregistrer_module', { p_id:null, p_formation:id,
              p_titre:t, p_resume:null }, 'Module ajouté.');
          }}>Ajouter un module</button>
        </div>`}

      ${onglet === 'reglages' && html`
        <div class="panneau">
          <div class="corps stack">
            <div class="field"><label>Titre</label>
              <input defaultValue=${fo.titre}
                onBlur=${e=>appel('enregistrer_formation',
                  {p_id:id, p_code:fo.code, p_titre:e.target.value, p_resume:fo.resume,
                   p_description:fo.description, p_niveau_min:fo.niveau_min,
                   p_duree:fo.duree_min, p_seuil:fo.seuil_quiz, p_publiee:fo.publiee,
                   p_ordre:fo.ordre, p_image:null, p_prerequis:fo.prerequis},
                  'Enregistré.')} /></div>
            <div class="field"><label>Résumé</label>
              <input defaultValue=${fo.resume||''}
                onBlur=${e=>appel('enregistrer_formation',
                  {p_id:id, p_code:fo.code, p_titre:fo.titre, p_resume:e.target.value,
                   p_description:fo.description, p_niveau_min:fo.niveau_min,
                   p_duree:fo.duree_min, p_seuil:fo.seuil_quiz, p_publiee:fo.publiee,
                   p_ordre:fo.ordre, p_image:null, p_prerequis:fo.prerequis},
                  'Enregistré.')} /></div>
            <div class="field"><label>Description</label>
              <textarea defaultValue=${fo.description||''}
                onBlur=${e=>appel('enregistrer_formation',
                  {p_id:id, p_code:fo.code, p_titre:fo.titre, p_resume:fo.resume,
                   p_description:e.target.value, p_niveau_min:fo.niveau_min,
                   p_duree:fo.duree_min, p_seuil:fo.seuil_quiz, p_publiee:fo.publiee,
                   p_ordre:fo.ordre, p_image:null, p_prerequis:fo.prerequis},
                  'Enregistré.')} /></div>
            <div class="row" style="gap:16px;align-items:flex-start">
              <div class="field" style="flex:1;min-width:130px;margin:0">
                <label>Durée (min)</label>
                <input type="number" defaultValue=${fo.duree_min||''}
                  onBlur=${e=>appel('enregistrer_formation',
                    {p_id:id, p_code:fo.code, p_titre:fo.titre, p_resume:fo.resume,
                     p_description:fo.description, p_niveau_min:fo.niveau_min,
                     p_duree:Number(e.target.value)||null, p_seuil:fo.seuil_quiz,
                     p_publiee:fo.publiee, p_ordre:fo.ordre, p_image:null,
                     p_prerequis:fo.prerequis}, 'Enregistré.')} /></div>
              <div class="field" style="flex:1;min-width:130px;margin:0">
                <label>Seuil des quiz (%)</label>
                <input type="number" min="50" max="100" defaultValue=${fo.seuil_quiz}
                  onBlur=${e=>appel('enregistrer_formation',
                    {p_id:id, p_code:fo.code, p_titre:fo.titre, p_resume:fo.resume,
                     p_description:fo.description, p_niveau_min:fo.niveau_min,

                     p_publiee:fo.publiee, p_ordre:fo.ordre, p_image:null,
                     p_prerequis:fo.prerequis}, 'Enregistré.')} /></div>
            </div>

                    const nom = prompt('Nom de la certification', fo.titre);

                    appel('enregistrer_certification',

                        p_formation:id, p_validite: v ? Number(v) : null },

            </div>
          </div>

      ${onglet === 'suivi' && html`
        <div class="panneau" style="overflow-x:auto">
          ${suivi.length === 0
            ? html`<div class="vide">Personne n\u2019a encore commencé.</div>`

                <thead><tr><th>Membre</th><th>Territoire</th>
                  <th>Avancement</th><th>Dernière activité</th><th></th></tr></thead>
                <tbody>
                  ${suivi.map(x => html`
                    <tr>
                      <td>${x.membre}</td>
                      <td class="small muted">${x.territoire||'—'}</td>

    </div>`;
}

function EditeurLecon({ lecon, fermer }){
  const [l, setL] = useState(lecon);
  const [msg, setMsg] = useState('');

  const appel = async (fn, args, ok) => {
    const { data, error } = await db.rpc(fn, args);
    if (error){ setMsg('Erreur : ' + error.message); return false; }
    if (!data.ok){ setMsg('Erreur : ' + data.message); return false; }
    if (ok) setMsg(ok);
    return data;
  };

  async function recharger(){
    const { data } = await db.from('lecons').select('*').eq('id', l.id).maybeSingle();
    if (!data) return;
    if (data.type === 'quiz'){
      const { data: qs } = await db.from('questions').select('*')
        .eq('lecon_id', l.id).order('ordre');
      const avec = await Promise.all((qs||[]).map(async q => {
        const { data: rs } = await db.from('reponses').select('*')
          .eq('question_id', q.id).order('ordre');
        return { ...q, reponses: rs||[] };
      }));
      setL({ ...data, questions: avec });
    } else setL(data);
  }
  useEffect(() => { recharger(); }, []);

  async function enregistrer(champ, valeur){
    await appel('enregistrer_lecon', {
      p_id: l.id, p_module: l.module_id, p_titre: champ==='titre'?valeur:l.titre,
      p_type: l.type, p_contenu: champ==='contenu'?valeur:l.contenu,
      p_url: champ==='url'?valeur:l.url,
      p_duree: champ==='duree'?(Number(valeur)||null):l.duree_min
    }, 'Enregistré.');
    recharger();
  }

  return html`
    <div>
      <button class="lien-discret" onClick=${fermer}>← Retour au parcours</button>
      <div class="spread" style="margin-top:12px">
        <h1 style="font-size:26px">${l.titre}</h1>
        <span class="tag">${TYPES_LECON[l.type]||l.type}</span>
      </div>
      ${msg && html`<div class=${'alerte '+(msg.startsWith('Erreur')?'err':'ok')}
        style="margin-top:16px">${msg}</div>`}

      <div class="panneau" style="margin-top:24px">
        <div class="corps stack">
          <div class="field"><label>Titre</label>
            <input defaultValue=${l.titre}
              onBlur=${e=>enregistrer('titre', e.target.value)} /></div>
          <div class="field"><label>Durée indicative (min)</label>
            <input type="number" defaultValue=${l.duree_min||''}
              onBlur=${e=>enregistrer('duree', e.target.value)} /></div>

          ${l.type === 'lecture' && html`
            <div class="field"><label>Texte de la leçon</label>
              <textarea defaultValue=${l.contenu||''} style="min-height:320px;font-size:15px"
                onBlur=${e=>enregistrer('contenu', e.target.value)} />
              <p class="small muted" style="margin:6px 0 0">
                Une ligne vide sépare deux paragraphes. Écrivez court : on lit mal
                à l\u2019écran.</p>
            </div>`}

          ${(l.type === 'video' || l.type === 'document') && html`
            <div class="field"><label>Adresse</label>
              <input type="url" defaultValue=${l.url||''}
                onBlur=${e=>enregistrer('url', e.target.value)}
                placeholder=${l.type==='video'?'https://…':'https://drive.google.com/…'} />
            </div>
            <div class="field"><label>Introduction</label>
              <textarea defaultValue=${l.contenu||''}
                onBlur=${e=>enregistrer('contenu', e.target.value)} /></div>`}
        </div>
      </div>

      ${l.type === 'quiz' && html`
        <div style="margin-top:24px">
          ${(l.questions||[]).map((q, iq) => html`
            <div class="panneau" style="margin-bottom:16px">
              <div class="tete">
                <div style="flex:1">
                  <textarea defaultValue=${q.enonce} style="min-height:52px;
                    border-color:transparent;font-size:15px;padding:6px"
                    onBlur=${async e=>{
                      await appel('enregistrer_question',
                        { p_id:q.id, p_lecon:l.id, p_enonce:e.target.value, p_aide:q.aide });
                      recharger();
                    }} />
                </div>
                <div class="row" style="gap:4px">
                  <button class="btn sm light" disabled=${iq===0}
                    onClick=${async ()=>{ await appel('deplacer',
                      {p_table:'question',p_id:q.id,p_sens:-1}); recharger(); }}>↑</button>
                  <button class="btn sm light"
                    disabled=${iq===(l.questions||[]).length-1}
                    onClick=${async ()=>{ await appel('deplacer',
                      {p_table:'question',p_id:q.id,p_sens:1}); recharger(); }}>↓</button>
                  <button class="btn sm light" onClick=${async ()=>{
                    if (!confirm('Supprimer cette question ?')) return;
                    await appel('supprimer_element',{p_table:'question',p_id:q.id});
                    recharger();
                  }}>×</button>
                </div>
              </div>
              <div class="corps">
                ${(q.reponses||[]).map(r => html`
                  <div class="row" style="gap:10px;padding:5px 0">
                    <input type="checkbox" style="width:auto" checked=${r.correcte}
                      title="Bonne réponse"
                      onChange=${async e=>{
                        await appel('enregistrer_reponse',
                          { p_id:r.id, p_question:q.id, p_texte:r.texte,
                            p_correcte:e.target.checked });
                        recharger();
                      }} />
                    <input defaultValue=${r.texte} style="flex:1"
                      onBlur=${async e=>{
                        await appel('enregistrer_reponse',
                          { p_id:r.id, p_question:q.id, p_texte:e.target.value,
                            p_correcte:r.correcte });
                        recharger();
                      }} />
                    <button class="btn sm light" onClick=${async ()=>{
                      await appel('supprimer_element',{p_table:'reponse',p_id:r.id});
                      recharger();
                    }}>×</button>
                  </div>`)}
                <button class="btn sm light" style="margin-top:8px"
                  onClick=${async ()=>{
                    await appel('enregistrer_reponse',
                      { p_id:null, p_question:q.id, p_texte:'Nouvelle proposition',
                        p_correcte:false });
                    recharger();
                  }}>+ Proposition</button>
                <p class="small muted" style="margin:10px 0 0">
                  Cochez chaque bonne réponse. Une question peut en avoir plusieurs.
                </p>
              </div>
            </div>`)}

          <button class="btn" onClick=${async ()=>{
            const e = prompt('Énoncé de la question');
            if (!e) return;
            await appel('enregistrer_question',
              { p_id:null, p_lecon:l.id, p_enonce:e, p_aide:null }, 'Question ajoutée.');
            recharger();
          }}>Ajouter une question</button>
        </div>`}
    </div>`;
}

const MERITES = { a_progresser:['À consolider',''], satisfaisant:['Satisfaisant','bleu'],

    db.rpc('passeport', { p_profil: profil || null }).then(({data}) => setD(data));

  if (!d) return html`<div class="vide">Chargement…</div>`;
  if (d.erreur) return html`<div class="alerte err">${d.erreur}</div>`;

  function imprimer(){ window.print(); }

  return html`
    <div>
      <div class="spread">

              <div style="flex:1;min-width:240px">
                <div class="row" style="gap:8px">
                  <strong>${m.titre}</strong>

                  ${m.lieu ? m.lieu + ' · ' : ''}

        qui l\u2019a encadrée.
      </p>
    </div>`;
}

/* --- Bilans de mission à rédiger --------------------------------------- */
function BilansMission({ setMsg }){
  const [liste, setListe] = useState([]);
  const [ouvert, setOuvert] = useState(null);
  const [f, setF] = useState({heures:'', realise:'', competences:'',
                              appreciation:'', merite:''});

  const charger = useCallback(() =>
    db.rpc('bilans_a_rediger').then(({data}) => setListe(data||[])), []);
  useEffect(() => { charger(); }, [charger]);

  async function enregistrer(e, x){
    e.preventDefault();
    const comp = f.competences.split(',').map(c=>c.trim()).filter(Boolean);
    const { data, error } = await db.rpc('rediger_bilan', {
      p_mission: x.mission_id, p_profil: x.profil_id,
      p_heures: Number(f.heures), p_realise: f.realise,
      p_competences: comp.length ? comp : null,
      p_appreciation: f.appreciation || null, p_merite: f.merite || null
    });
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data.ok) return setMsg('Erreur : ' + data.message);
    setF({heures:'', realise:'', competences:'', appreciation:'', merite:''});
    setOuvert(null); setMsg('Bilan enregistré. Les heures sont portées au compte du bénévole.');
    charger();
  }

  return html`
    <div>
      <p class="small muted" style="margin-bottom:16px;max-width:62ch">
        Après chaque mission, dites ce qui a été fait et combien d\u2019heures ont été
        données. C\u2019est ce qui alimente le passeport d\u2019engagement du bénévole —
        et ce qu\u2019il présentera un jour à un employeur.
      </p>
      <div class="panneau">
        ${liste.length === 0
          ? html`<div class="vide">Aucun bilan en attente.</div>`
          : liste.map(x => html`
            <div style="border-bottom:1px solid var(--filet)">
              <div class="ligne" style="border:0">
                <div style="flex:1;min-width:230px">
                  <div class="row" style="gap:8px">
                    <strong>${x.membre}</strong>
                    ${x.jours_depuis > 14 && html`
                      <span class="tag rouge">${x.jours_depuis} jours</span>`}
                  </div>
                  <div class="small muted">
                    ${x.mission}${x.lieu ? ' · ' + x.lieu : ''}
                    ${x.fin ? ' · terminée le ' + jour(x.fin) : ''}
                  </div>
                </div>
                <button class="btn sm" onClick=${()=>setOuvert(
                  ouvert===x.mission_id+x.profil_id ? null : x.mission_id+x.profil_id)}>
                  ${ouvert===x.mission_id+x.profil_id ? 'Fermer' : 'Rédiger'}</button>
              </div>

              ${ouvert === x.mission_id+x.profil_id && html`
                <form onSubmit=${e=>enregistrer(e, x)} class="corps stack"
                  style="background:var(--papier)">
                  <div class="field"><label>Heures effectuées</label>
                    <input type="number" step="0.5" min="0.5" required value=${f.heures}
                      onInput=${e=>setF(o=>({...o,heures:e.target.value}))}
                      style="max-width:140px" /></div>
                  <div class="field"><label>Ce qui a été fait</label>
                    <textarea required value=${f.realise} style="min-height:90px"
                      onInput=${e=>setF(o=>({...o,realise:e.target.value}))}
                      placeholder="Animation d\u2019un atelier citoyenneté auprès de deux classes de 4e." /></div>
                  <div class="field"><label>Compétences exercées</label>
                    <input value=${f.competences}
                      onInput=${e=>setF(o=>({...o,competences:e.target.value}))}
                      placeholder="Animation de groupe, prise de parole, médiation" />
                    <p class="small muted" style="margin:6px 0 0">Séparées par des virgules.</p>
                  </div>
                  <div class="field"><label>Appréciation</label>
                    <textarea value=${f.appreciation}
                      onInput=${e=>setF(o=>({...o,appreciation:e.target.value}))}
                      placeholder="Elle figurera dans son passeport : écrivez ce que vous diriez de lui." /></div>
                  <div class="field"><label>Mérite</label>
                    <select value=${f.merite}
                      onChange=${e=>setF(o=>({...o,merite:e.target.value}))}>
                      <option value="">Non renseigné</option>
                      ${Object.entries(MERITES).map(([k,v]) =>
                        html`<option value=${k}>${v[0]}</option>`)}
                    </select></div>
                  <div><button class="btn">Enregistrer le bilan</button></div>
                </form>`}
            </div>`)}
      </div>
    </div>`;
}

/* --- Répartition des nouveaux adhérents -------------------------------- */
function RepartirNouveaux({ setMsg }){
  const [liste, setListe] = useState([]);
  const [gens, setGens] = useState([]);
  const charger = useCallback(async () => {
    await db.rpc('rafraichir_jalons');
    const [a,b] = await Promise.all([
      db.rpc('nouveaux_a_repartir'),
      db.from('v_annuaire').select('id,prenom,nom,fonction_nom,territoire_nom')
        .eq('statut','actif').order('nom')
    ]);
    setListe(a.data||[]); setGens(b.data||[]);
  }, []);
  useEffect(() => { charger(); }, [charger]);

  async function affecter(x, id){
    const { data, error } = await db.rpc('affecter_accompagnant',
      { p_profil: x.profil_id, p_accompagnant: id, p_motif: null });
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data.ok) return setMsg('Erreur : ' + data.message);
    setMsg('Accompagnant désigné.'); charger();
  }

  const orphelins = liste.filter(x => x.priorite === 1);

  return html`
    <div>
      ${orphelins.length > 0 && html`
        <div class="alerte err" style="margin-bottom:16px">
          <strong>${orphelins.length} adhérent${orphelins.length>1?'s':''} sans bureau local
          ni accompagnant.</strong> C\u2019est là qu\u2019on perd les gens : désignez
          quelqu\u2019un, même hors du département.
        </div>`}

      <div class="panneau">
        ${liste.length === 0
          ? html`<div class="vide">Tout le monde est accompagné.</div>`
          : liste.map(x => html`
            <div class="ligne" style=${x.priorite===1
              ? 'border-left:3px solid var(--bordeaux)' : ''}>
              <div style="flex:1;min-width:230px">
                <div class="row" style="gap:8px">
                  <strong>${x.membre}</strong>
                  ${!x.bureau_local && html`<span class="tag rouge">Sans bureau local</span>`}
                  ${x.jours > 14 && html`<span class="tag or">${x.jours} jours</span>`}
                </div>
                <div class="small muted">
                  <span class="mono">${x.matricule}</span>
                  · ${x.territoire || 'sans territoire'}
                  · inscrit le ${jour(x.inscrit_le)}
                </div>
              </div>
              <div style="min-width:220px">
                <select value=${x.accompagnant_id||''}
                  onChange=${e=>e.target.value && affecter(x, e.target.value)}>
                  <option value="">Désigner un accompagnant…</option>
                  ${gens.map(g => html`<option value=${g.id}>
                    ${nomComplet(g)}${g.territoire_nom ? ' · '+g.territoire_nom : ''}</option>`)}
                </select>
              </div>
            </div>`)}
      </div>
    </div>`;
}

              <span class="tag">${x.echelle}</span>
            </div>
            <div class="row" style="margin-top:6px;gap:6px">
              ${(x.responsables||[]).map(r => html`
                <span class="tag or">${r.nom} — ${r.poste}</span>`)}
              ${(x.encadrants||[]).slice(0,3).map(e => html`
                <span class="tag">${e.nom} — ${e.fonction}</span>`)}
              ${(x.responsables||[]).length === 0 && (x.encadrants||[]).length === 0 && html`
                <span class="small muted">Personne à cet échelon</span>`}
            </div>
          </div>
        </div>`)}
      ${(c.dont_je_reponds||[]).length > 0 && html`
        <div class="corps" style="border-top:1px solid var(--filet)">
          <div class="eyebrow" style="margin-bottom:8px">
            ${c.dont_je_reponds.length} personne(s) dans mon périmètre</div>
          <div class="row" style="gap:6px">
            ${c.dont_je_reponds.slice(0,12).map(x => html`
              <span class="tag">${x.nom}</span>`)}
          </div>

}

/* --- Direction générale : vérifications ------------------------------ */
function Validation({ p }){
  const [attente, setAttente] = useState([]);
  const [demandes, setDemandes] = useState([]);
  const [signalements, setSignalements] = useState([]);
  const [alertes, setAlertes] = useState([]);
  const [actes, setActes] = useState([]);
  const [encadrants, setEncadrants] = useState([]);
  const [journal, setJournal] = useState(false);
  const [msg, setMsg] = useState('');

  useEffect(() => {
    db.rpc('puis_je_lire_journal_pieces').then(({data}) => setJournal(!!data));
  }, []);

  const charger = useCallback(async () => {
    // La table demandes pointe deux fois vers profils (profil_id et
    // traite_par). On lit donc les deux séparément plutôt que de laisser
    // PostgREST deviner de quel lien il s'agit.
    const [a, d, sg, al, ac] = await Promise.all([
      db.from('v_annuaire').select('*').eq('statut','en_attente').order('cree_le'),
      db.from('demandes').select('*').in('statut',['ouverte','en_cours']).order('cree_le'),
      db.rpc('signalements_a_traiter'),
      db.rpc('alertes_consultation'),
      db.rpc('actes_a_controler')
    ]);
    setActes(ac.data || []);
    setSignalements(sg.data || []);
    setAlertes(al.data || []);
    const { data: enc } = await db.from('v_annuaire')
      .select('id,prenom,nom,fonction_nom,niveau').eq('statut','actif').gte('niveau', 50)
      .order('niveau', { ascending: false });
    setEncadrants(enc || []);
    if (d.error) setMsg('Lecture des demandes impossible : ' + d.error.message);
    const dem = d.data || [];

    let auteurs = {};
    if (dem.length){
      const ids = [...new Set(dem.map(x => x.profil_id))];
      const { data: ps } = await db.from('v_annuaire')
        .select('id,prenom,nom,matricule,email,fonction_nom,territoire_nom').in('id', ids);
      auteurs = Object.fromEntries((ps||[]).map(x => [x.id, x]));
    }
    setAttente(a.data || []);
    setDemandes(dem.map(x => ({ ...x, auteur: auteurs[x.profil_id] || null })));
  }, []);
  useEffect(() => { charger(); }, [charger]);

  async function validerMembre(id, ok, forcer){
    const { data, error } = await db.rpc('valider_inscription',
      { p_profil: id, p_accepter: ok, p_forcer: !!forcer });
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data.ok){
      if (data.incomplet){
        if (confirm(data.message + '\n\nActiver quand même ? Le forçage sera inscrit au journal.'))
          return validerMembre(id, true, true);
        return setMsg(data.message);
      }
      return setMsg('Erreur : ' + data.message);
    }
    setMsg(ok ? 'Compte activé.' : 'Compte écarté.');
    charger();
  }

  async function controler(x, confirmer){
    const obs = confirmer ? null : prompt('Motif de l\u2019annulation (facultatif)');
    if (!confirmer && obs === null) return;
    const { data, error } = await db.rpc('controler_acte',
      { p_acte: x.id, p_confirmer: confirmer, p_observation: obs });
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data.ok) return setMsg('Erreur : ' + data.message);
    setMsg(confirmer ? 'Acte validé.' : 'Acte annulé, état antérieur rétabli.');
    charger();
  }

  const motifLisible = {
    propos_deplaces:'Propos déplacés', harcelement:'Harcèlement',
    securite:'Situation préoccupante', hors_sujet:'Usage hors mission', autre:'Autre'
  };

  async function confier(sg, a){
    const { data, error } = await db.rpc('confier_signalement',
      { p_sig: sg.id, p_a: a });
    if (error) return setMsg(error.message);
    if (!data.ok) return setMsg(data.message);
    setMsg(a ? 'Signalement confié. L\u2019encadrant a désormais accès à cette conversation.'
             : 'Signalement repris par la Direction générale.');
    charger();
  }

  // Export du registre des adhésions. Réservé au droit membres.exporter,
  // et tracé comme toute sortie massive de données personnelles.
  async function exporterAdhesions(){
    const { data, error } = await db.rpc('registre_adhesions');
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data || data.length === 0)
      return setMsg('Erreur : accès refusé ou registre vide.');
    const cols = Object.keys(data[0]);
    const ech = v => {
      if (v === null || v === undefined) return '';
      const t = String(v).replace(/"/g, '""');
      return /[";\n]/.test(t) ? '"' + t + '"' : t;
    };
    const csv = '\ufeff' + cols.join(';') + '\n' +
      data.map(l => cols.map(c => ech(l[c])).join(';')).join('\n');
    const nom = 'FFCE-registre-adhesions-' + new Date().toISOString().slice(0,10) + '.csv';
    const url = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
    const a = document.createElement('a');
    a.href = url; a.download = nom; a.click();
    URL.revokeObjectURL(url);
    await db.rpc('tracer_export', { p_objet: nom, p_lignes: data.length });
    setMsg(data.length + ' adhésion(s) extraites. Déposez le fichier sur le Drive.');
  }

  async function ouvrirDossier(sg){
    const cible = prompt(
      'Identifiant du membre mis en cause (copiez-le depuis l\u2019annuaire), ' +
      'ou laissez vide pour ouvrir le dossier sur l\u2019auteur du signalement.');
    const objet = prompt('Objet du dossier (obligatoire)');
    if (!objet) return;
    const { data, error } = await db.rpc('ouvrir_dossier', {
      p_profil: cible || sg.id, p_objet: objet,
      p_qualification: null, p_gravite: 'moyenne', p_signalement: sg.id
    });
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data.ok) return setMsg('Erreur : ' + data.message);
    setMsg('Dossier ouvert. Poursuivez dans Discipline et recours.');
    charger();
  }

  async function clore(sg, fonde){
    const decision = prompt(fonde
      ? 'Décision et suite donnée (obligatoire)'
      : 'Motif du classement sans suite (obligatoire)');
    if (!decision) return;
    const { data, error } = await db.rpc('clore_signalement',
      { p_sig: sg.id, p_fonde: fonde, p_decision: decision });
    if (error) return setMsg(error.message);
    if (!data.ok) return setMsg(data.message);
    setMsg('Signalement clos.');
    charger();
  }

  async function traiter(d, ok){
    const motif = prompt(ok ? "Motif de l'accord (facultatif)" : 'Motif du refus') ;
    if (!ok && motif === null) return;
    const { data:{ user } } = await db.auth.getUser();
    await db.from('demandes').update({
      statut: ok ? 'acceptee' : 'refusee',
      traite_par: user.id, traite_le: new Date().toISOString(),
      motif_reponse: motif || null
    }).eq('id', d.id);

    if (ok && d.type === 'acces_application' && d.cible){
      await db.from('acces_applications').upsert({
        profil_id: d.profil_id, application: d.cible,
        statut: 'accorde', accorde_par: user.id, motif: motif || null
      }, { onConflict: 'profil_id,application' });
    }
    setMsg('Demande traitée.');
    charger();
  }

  return html`
    <div>
      <div class="spread">
        <div>
          <div class="eyebrow">Direction générale</div>
          <h1 style="margin:6px 0 0">Vérifications</h1>
        </div>
        <button class="btn light" onClick=${exporterAdhesions}>
          Extraire le registre des adhésions</button>
      </div>
      <div style="height:32px"></div>
      ${msg && html`<div class="alerte ok" style="margin-bottom:24px">${msg}</div>`}

      <${AssistanceAdmin} setMsg=${setMsg} />

      ${journal && html`<div style="margin-bottom:24px">
        <${JournalPieces} setMsg=${setMsg} /></div>`}

      ${actes.length > 0 && html`
        <div class="panneau" style="margin-bottom:24px;border-color:var(--brun)">
          <div class="tete" style="border-bottom-color:var(--brun)">
            <div class="row" style="gap:8px">
              <h3 style="font-size:17px">Actes à contrôler</h3>
              <${Info} texte="Ces actes ont déjà pris effet : on ne bloque pas le réseau en attendant une signature. Vous les confirmez, ou vous les annulez — et l'état antérieur est rétabli." />
            </div>
            <span class="tag or">${actes.length}</span>
          </div>
          <div style="overflow-x:auto">
            <table>
              <thead><tr><th>Quand</th><th>Qui</th><th>Sur qui</th>
                <th>Acte</th><th></th></tr></thead>
              <tbody>
                ${actes.map(x => html`
                  <tr>
                    <td class="small muted">${new Date(x.cree_le).toLocaleString('fr-FR',
                      {day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</td>
                    <td><div>${x.auteur}</div>
                      <div class="small muted">${x.auteur_fonction}</div></td>
                    <td><div>${x.cible || '—'}</div>
                      <div class="mono muted">${x.cible_matricule || ''}</div></td>
                    <td class="small">${x.libelle}</td>
                    <td>
                      <div class="row" style="justify-content:flex-end">
                        <button class="btn sm" onClick=${()=>controler(x, true)}>Valider</button>
                        ${x.reversible
                          ? html`<button class="btn sm light"
                              onClick=${()=>controler(x, false)}>Annuler l\u2019acte</button>`
                          : html`<span class="tag">Non réversible</span>`}
                      </div>
                    </td>
                  </tr>`)}
              </tbody>
            </table>
          </div>
        </div>`}

      ${alertes.length > 0 && html`
        <div class="panneau" style="margin-bottom:24px;border-color:var(--laiton)">
          <div class="tete" style="border-bottom-color:var(--laiton)">
            <h3 style="font-size:17px">Consultations de dossiers protégés</h3>
            <span class="tag or">${alertes.length}</span>
          </div>
          ${alertes.map(al => html`
            <div class="ligne">
              <div style="flex:1;min-width:240px">
                <div>${al.observateur_nom} a consulté le dossier de ${al.observe_nom}</div>
                <div class="small muted">
                  ${al.observateur_fonction}
                  · <span class="mono">${al.observe_matricule}</span>
                  · ${new Date(al.cree_le).toLocaleString('fr-FR',
                      {day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}
                  ${al.contexte ? ' · ' + al.contexte : ''}
                </div>
              </div>
              <button class="btn sm light" onClick=${async ()=>{
                await db.rpc('marquer_alerte_vue', { p_id: al.id });
                charger();
              }}>Pris connaissance</button>
            </div>`)}
        </div>`}

      ${signalements.length > 0 && html`
        <div class="panneau" style="margin-bottom:24px;border-color:var(--laiton)">
          <div class="tete" style="border-bottom-color:var(--laiton)">
            <h3 style="font-size:17px">Signalements</h3>
            <span class="tag or">${signalements.length}</span>
          </div>
          ${signalements.map(sg => html`
            <div class="ligne" style="align-items:flex-start">
              <div style="flex:1;min-width:240px">
                <div>${motifLisible[sg.motif] || sg.motif}</div>
                <div class="small muted" style="margin-top:4px">
                  Signalé par ${sg.auteur_nom} <span class="mono">${sg.auteur_matricule}</span>
                  · ${jour(sg.cree_le)}
                </div>
                <div class="small muted">
                  Conversation entre ${sg.participants} · ${sg.nb_messages} message${sg.nb_messages>1?'s':''}
                </div>
                ${sg.details && html`<div class="small" style="margin-top:8px;max-width:56ch">
                  « ${sg.details} »</div>`}
                ${sg.assigne_nom && html`<div style="margin-top:8px">
                  <span class="tag bleu">Confié à ${sg.assigne_nom}</span></div>`}
              </div>
              <div class="stack" style="min-width:220px">
                <div class="field" style="margin:0">
                  <label>Confier à</label>
                  <select value=${sg.assigne_a || ''}
                    onChange=${e => confier(sg, e.target.value || null)}>
                    <option value="">Direction générale</option>
                    ${encadrants.map(x => html`<option value=${x.id}>
                      ${nomComplet(x)} — ${x.fonction_nom}</option>`)}
                  </select>
                </div>
                <div class="row">
                  <a class="btn sm light" href="#/espace/messagerie">Lire l'échange</a>
                  <button class="btn sm" onClick=${()=>ouvrirDossier(sg)}>Ouvrir un dossier</button>
                  <button class="btn sm light" onClick=${()=>clore(sg, true)}>Fondé</button>
                  <button class="btn sm light" onClick=${()=>clore(sg, false)}>Non fondé</button>
                </div>
              </div>
            </div>`)}
        </div>`}

      <div class="panneau">
        <div class="tete">
          <h3 style="font-size:17px">Inscriptions à vérifier</h3>
          <span class="tag">${attente.length}</span>
        </div>
        ${attente.length === 0
          ? html`<div class="vide">Aucune inscription en attente.</div>`
          : attente.map(m => html`
            <div class="ligne" style="align-items:flex-start">
              <div style="flex:1;min-width:240px">
                <div>${nomComplet(m)} <span class="mono muted">${m.matricule}</span></div>
                <div class="small muted">${m.email} · ${m.territoire_nom || 'sans territoire'}
                  · inscrit le ${jour(m.cree_le)}</div>
                <${Completude} id=${m.id} />
                <${ApercuAdhesion} id=${m.id} />
              </div>
              <div class="row">
                <button class="btn sm" onClick=${()=>validerMembre(m.id,true)}>Activer</button>
                <button class="btn sm light" onClick=${()=>validerMembre(m.id,false)}>Écarter</button>
              </div>
            </div>`)}
      </div>

      <div class="panneau" style="margin-top:24px">
        <div class="tete">
          <h3 style="font-size:17px">Demandes d'accès</h3>
          <span class="tag">${demandes.length}</span>
        </div>
        ${demandes.length === 0
          ? html`<div class="vide">Aucune demande en instance.</div>`
          : demandes.map(d => html`
            <div class="ligne">
              <div>
                <div>${d.objet}</div>
                <div class="small muted">
                  ${d.auteur ? nomComplet(d.auteur) : 'Membre inconnu'}
                  <span class="mono">${d.auteur?.matricule||''}</span>
                  ${d.auteur?.territoire_nom ? ' · ' + d.auteur.territoire_nom : ''}
                  · ${jour(d.cree_le)}
                </div>
                ${d.message && html`<div class="small" style="margin-top:6px;max-width:56ch">
                  « ${d.message} »</div>`}
              </div>
              <div class="row">
                <button class="btn sm" onClick=${()=>traiter(d,true)}>Accorder</button>
                <button class="btn sm light" onClick=${()=>traiter(d,false)}>Refuser</button>
              </div>
            </div>`)}
      </div>
    </div>`;
}

/* --- Direction générale : réseau et fonctions ------------------------ */
function ReseauAdmin(){
  const [membres, setMembres] = useState([]);
  const [fonctions, setFonctions] = useState([]);
  const [terr, setTerr] = useState([]);
  const [q, setQ] = useState('');
  const [msg, setMsg] = useState('');

  const charger = useCallback(async () => {
    const [m, f, t] = await Promise.all([
      db.from('v_annuaire').select('*').order('niveau',{ascending:false}).order('nom'),
      db.from('fonctions').select('*').order('niveau'),
      db.from('territoires').select('id,nom,echelle,code').order('echelle').order('nom')
    ]);
    setMembres(m.data||[]); setFonctions(f.data||[]); setTerr(t.data||[]);
  }, []);
  useEffect(() => { charger(); }, [charger]);

  async function modifier(id, champ, valeur){
    const { error } = await db.from('profils').update({ [champ]: valeur }).eq('id', id);
    setMsg(error ? error.message : 'Enregistré.');
    charger();
  }

  const filtre = membres.filter(m =>
    (nomComplet(m)+' '+(m.territoire_nom||'')).toLowerCase().includes(q.toLowerCase()));

  return html`
    <div>
      <p class="muted" style="max-width:60ch">
        Nommer, muter, faire progresser, protéger un dossier. Chaque
        modification est immédiate et inscrite au journal.
      </p>
      ${msg && html`<div class="alerte ok" style="margin:16px 0">${msg}</div>`}

      <div class="field" style="max-width:360px;margin:24px 0">
        <input placeholder="Rechercher…" value=${q} onInput=${e=>setQ(e.target.value)} />
      </div>

      <div class="panneau" style="overflow-x:auto">
        <table>
          <thead><tr><th>Membre</th><th>Fonction</th><th>Territoire</th><th>Échelon</th>
            <th>Statut</th><th title="Toute consultation déclenche une alerte">Protégé</th></tr></thead>
          <tbody>
            ${filtre.map(m => html`
              <tr>
                <td><div>${nomComplet(m)}</div><div class="mono muted">${m.matricule}</div></td>
                <td>
                  <select value=${m.fonction} onChange=${e=>modifier(m.id,'fonction',e.target.value)}>
                    ${fonctions.map(f => html`<option value=${f.code}>${f.nom}</option>`)}
                  </select>
                </td>
                <td>
                  <select value=${m.territoire_id||''} onChange=${e=>modifier(m.id,'territoire_id',e.target.value||null)}>
                    <option value="">—</option>
                    ${terr.map(t => html`<option value=${t.id}>${t.nom} (${t.echelle})</option>`)}
                  </select>
                </td>
                <td>
                  <select value=${m.echelon} onChange=${e=>modifier(m.id,'echelon',Number(e.target.value))}>
                    ${[1,2,3,4,5,6,7].map(n => html`<option value=${n}>${n}</option>`)}
                  </select>
                </td>
                <td>
                  <select value=${m.statut} onChange=${e=>modifier(m.id,'statut',e.target.value)}>
                    ${['en_attente','actif','suspendu','archive'].map(s =>
                      html`<option value=${s}>${s.replace('_',' ')}</option>`)}
                  </select>
                </td>
                <td style="text-align:center">
                  <input type="checkbox" style="width:auto" checked=${!!m.protege}
                    title="Protection renforcée : toute consultation déclenche une alerte"
                    onChange=${e=>modifier(m.id,'protege',e.target.checked)} />
                </td>
              </tr>`)}
          </tbody>
        </table>
      </div>
    </div>`;
}

function VitrineTextes({ setMsg }){
  const [c, setC] = useState([]);
  const charger = useCallback(() =>
    db.from('contenus').select('*').order('section').order('ordre')
      .then(({data}) => setC(data||[])), []);
  useEffect(() => { charger(); }, [charger]);

  async function enregistrer(cle, valeur){

    setMsg(error ? 'Erreur : ' + error.message : 'Texte publié.');
