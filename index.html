/* --- L'application Discipline ---------------------------------------- */
function Discipline({ p }){
  const [onglet, setOnglet] = useState('ouverts');
  const [dossiers, setDossiers] = useState([]);
  const [archives, setArchives] = useState([]);
  const [alertes, setAlertes] = useState([]);
  const [gens, setGens] = useState([]);
  const [detail, setDetail] = useState(null);
  const [creation, setCreation] = useState(false);
  const [f, setF] = useState({profil:'', objet:'', qualification:'', gravite:'moyenne'});
  const [msg, setMsg] = useState('');

  const charger = useCallback(async () => {
    const [a,b,c,d] = await Promise.all([
      db.rpc('dossiers_discipline', { p_filtre: 'ouverts' }),
      db.rpc('dossiers_discipline', { p_filtre: 'archives' }),
      db.from('alertes_suivi').select('*').is('vue_le', null).order('cree_le',{ascending:false}),
      db.from('v_annuaire').select('id,prenom,nom,matricule,fonction_nom,territoire_nom')
        .order('nom')
    ]);
    setDossiers(a.data||[]); setArchives(b.data||[]);
    setAlertes(c.data||[]); setGens(d.data||[]);
    if (detail){
      const maj = [...(a.data||[]), ...(b.data||[])].find(x => x.id === detail.id);
      if (maj) setDetail(maj);
    }
  }, [detail]);
  useEffect(() => { charger(); }, []);

  // Extraction du registre : la DAJ a dans sa mission de tenir une
  // sauvegarde à jour. Chaque extraction est tracée au journal.
  async function exporter(){
    const { data, error } = await db.rpc('registre_discipline');
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data || data.length === 0) return setMsg('Erreur : registre vide ou accès refusé.');

    const colonnes = Object.keys(data[0]);
    const echappe = v => {
      if (v === null || v === undefined) return '';
      const t = String(v).replace(/"/g, '""');
      return /[";\n]/.test(t) ? '"' + t + '"' : t;
    };
    const csv = '\ufeff' + colonnes.join(';') + '\n' +
      data.map(l => colonnes.map(c => echappe(l[c])).join(';')).join('\n');

    const nom = 'FFCE-registre-discipline-' +
      new Date().toISOString().slice(0,10) + '.csv';
    const url = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
    const a = document.createElement('a');
    a.href = url; a.download = nom; a.click();
    URL.revokeObjectURL(url);

    await db.rpc('tracer_export', { p_objet: nom, p_lignes: data.length });
    setMsg(data.length + ' ligne(s) extraites. Déposez le fichier sur le Drive de la fédération.');
  }

  async function ouvrir(e){
    e.preventDefault();
    const { data, error } = await db.rpc('ouvrir_dossier', {
      p_profil: f.profil, p_objet: f.objet,
      p_qualification: f.qualification || null, p_gravite: f.gravite, p_signalement: null
    });
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data.ok) return setMsg('Erreur : ' + data.message);
    setF({profil:'', objet:'', qualification:'', gravite:'moyenne'}); setCreation(false);
    setMsg('Dossier ouvert. L\u2019intéressé est placé sous protection renforcée.');
    charger();
  }

  if (detail) return html`<${DossierDetail} p=${p} d=${detail} gens=${gens}
    fermer=${()=>{ setDetail(null); charger(); }} />`;

  const ligne = d => html`
    <div class="ligne" style="cursor:pointer" onClick=${()=>setDetail(d)}>
      <div style="flex:1;min-width:240px">
        <div>${d.objet}</div>
        <div class="small muted">
          <span class="mono">${d.reference}</span> · ${d.concerne}
          <span class="mono">${d.matricule}</span>
          ${d.territoire_nom ? ' · ' + d.territoire_nom : ''}
          · ${d.nb_pieces} pièce${d.nb_pieces>1?'s':''}
        </div>
        ${d.qualification && html`<div class="small muted">${d.qualification}</div>`}
      </div>
      <div class="row">
        ${d.recours_en_attente > 0 && html`
          <span class="tag or">${d.recours_en_attente} recours</span>`}
        <span class=${'tag '+(GRAVITE[d.gravite]||['',''])[1]}>
          ${(GRAVITE[d.gravite]||['',''])[0]}</span>
        <span class="tag">${ETAPE_NOM[d.statut]}</span>
      </div>
    </div>`;

  return html`
    <div>
      <div class="spread">
        <div>
          <div class="eyebrow">Discipline et recours</div>
          <h1 style="margin:6px 0 0">Dossiers</h1>
        </div>
        <button class="btn" onClick=${()=>setCreation(c=>!c)}>
          ${creation ? 'Annuler' : 'Ouvrir un dossier'}</button>
      </div>
      ${msg && html`<div class=${'alerte '+(msg.startsWith('Erreur')?'err':'ok')}
        style="margin-top:16px">${msg}</div>`}

      ${creation && html`
        <form onSubmit=${ouvrir} class="panneau" style="margin-top:24px">
          <div class="corps stack">
            <div class="field"><label>Membre concerné</label>
              <select required value=${f.profil} onChange=${e=>setF(o=>({...o,profil:e.target.value}))}>
                <option value="">Choisir…</option>
                ${gens.map(g => html`<option value=${g.id}>
                  ${nomComplet(g)} — ${g.fonction_nom}${g.territoire_nom?' · '+g.territoire_nom:''}
                </option>`)}
              </select></div>
            <div class="field"><label>Objet</label>
              <input required value=${f.objet} onInput=${e=>setF(o=>({...o,objet:e.target.value}))}
                placeholder="Manquement au cadre d\u2019intervention du 12 mars" /></div>
            <div class="field"><label>Qualification retenue</label>
              <input value=${f.qualification}
                onInput=${e=>setF(o=>({...o,qualification:e.target.value}))}
                placeholder="Article 8 du règlement intérieur" /></div>
            <div class="field"><label>Gravité</label>
              <select value=${f.gravite} onChange=${e=>setF(o=>({...o,gravite:e.target.value}))}>
                <option value="faible">Faible</option>
                <option value="moyenne">Moyenne</option>
                <option value="elevee">Élevée</option>
              </select></div>
            <div><button class="btn">Ouvrir le dossier</button></div>
            <p class="small muted">
              L\u2019ouverture place l\u2019intéressé sous protection renforcée : toute
              consultation de son profil sera tracée et signalée.
            </p>
          </div>
        </form>`}

      <div class="spread" style="margin-top:24px">
        <span class="small muted">
          ${dossiers.length} dossier${dossiers.length>1?'s':''} en cours
          · ${archives.length} archivé${archives.length>1?'s':''}
        </span>
        <button class="btn light" onClick=${exporter}>Extraire le registre</button>
      </div>

      <div class="row" style="margin:24px 0;gap:0;border-bottom:1px solid var(--filet)">
        ${[['ouverts','En cours'],['alertes','Alertes de suivi'],['archives','Archives']]
          .map(([k,t]) => html`
          <button class="btn light" style=${'border:0;border-bottom:2px solid '+
            (onglet===k?'var(--encre)':'transparent')+';border-radius:0;background:transparent'}
            onClick=${()=>setOnglet(k)}>${t}${k==='alertes'&&alertes.length?' ('+alertes.length+')':''}</button>`)}
      </div>

      ${onglet === 'ouverts' && html`
        <div class="panneau">
          ${dossiers.length === 0
            ? html`<div class="vide">Aucun dossier en cours.</div>`
            : dossiers.map(ligne)}
        </div>`}

      ${onglet === 'archives' && html`
        <div class="panneau">
          ${archives.length === 0
            ? html`<div class="vide">Aucun dossier archivé.</div>`
            : archives.map(ligne)}
        </div>`}

      ${onglet === 'alertes' && html`
        <div class="panneau">
          <div class="tete"><h3 style="font-size:17px">Comptes sous suivi des usages</h3></div>
          ${alertes.length === 0
            ? html`<div class="vide">Aucune alerte en attente.</div>`
            : alertes.map(al => {
              const g = gens.find(x => x.id === al.profil_id);
              return html`
                <div class="ligne">
                  <div>
                    <div>${g ? nomComplet(g) : 'Membre'} — ${al.application || 'activité'}</div>
                    <div class="small muted">${al.detail} ·
                      ${new Date(al.cree_le).toLocaleString('fr-FR',
                        {day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</div>
                  </div>
                  <button class="btn sm light" onClick=${async ()=>{
                    await db.from('alertes_suivi').update({
                      vue_par: p.id, vue_le: new Date().toISOString() }).eq('id', al.id);
                    charger();
                  }}>Pris connaissance</button>
                </div>`;
            })}
        </div>`}
    </div>`;
}

function DossierDetail({ p, d, gens, fermer }){
  const [pieces, setPieces] = useState([]);
  const [mesures, setMesures] = useState([]);
  const [recours, setRecours] = useState([]);
  const [piece, setPiece] = useState({type:'note_instruction', titre:'', contenu:'', communicable:false});
  const [fichier, setFichier] = useState(null);
  const [mes, setMes] = useState({type:'avertissement', motif:'', texte:'', effet:'', fin:''});
  const [msg, setMsg] = useState('');

  const charger = useCallback(async () => {
    const [a,b] = await Promise.all([
      db.from('dossier_pieces').select('*').eq('dossier_id', d.id).order('cree_le'),
      db.from('mesures').select('*').eq('dossier_id', d.id).order('prise_le', {ascending:false})
    ]);
    setPieces(a.data||[]); setMesures(b.data||[]);
    if (b.data && b.data.length){
      const { data: r } = await db.from('recours').select('*')
        .in('mesure_id', b.data.map(x => x.id)).order('cree_le',{ascending:false});
      setRecours(r||[]);
    }
  }, [d.id]);
  useEffect(() => { charger(); }, [charger]);

  const nomDe = i => { const g = gens.find(x => x.id === i); return g ? nomComplet(g) : '—'; };

  async function verser(e){
    e.preventDefault();
    let chemin = null;
    try {
      if (fichier){
        if (fichier.size > 10 * 1024 * 1024)
          throw new Error('Le document ne doit pas dépasser 10 Mo.');
        const ext = fichier.name.split('.').pop();
        chemin = p.id + '/' + d.id + '-' + Date.now() + '.' + ext;
        const { error: eUp } = await db.storage.from('dossiers').upload(chemin, fichier);
        if (eUp) throw eUp;
      }
    } catch (err){ return setMsg('Erreur : ' + (err.message||'téléversement impossible')); }

    const { data, error } = await db.rpc('verser_piece', {
      p_dossier: d.id, p_type: piece.type, p_titre: piece.titre,
      p_contenu: piece.contenu || null, p_fichier: chemin,
      p_communicable: piece.communicable
    });
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data.ok) return setMsg('Erreur : ' + data.message);
    setPiece({type:'note_instruction', titre:'', contenu:'', communicable:false});
    setFichier(null);
    setMsg('Pièce versée au dossier.'); charger();
  }

  async function ouvrirFichier(pc){
    const { data, error } = await db.storage.from('dossiers')
      .createSignedUrl(pc.fichier, 120);
    if (error) return setMsg('Document introuvable.');
    window.open(data.signedUrl, '_blank', 'noopener');
  }

  async function prononcer(e){
    e.preventDefault();
    const { data, error } = await db.rpc('prononcer_mesure', {
      p_dossier: d.id, p_type: mes.type, p_motif: mes.motif,
      p_texte: mes.texte || null, p_effet: mes.effet || null, p_fin: mes.fin || null
    });
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data.ok) return setMsg('Erreur : ' + data.message);
    setMes({type:'avertissement', motif:'', texte:'', effet:'', fin:''});
    setMsg('Mesure prononcée. Elle ne produira effet qu\u2019une fois notifiée.');
    charger();
  }

  async function notifier(m){
    if (!confirm('Notifier cette décision ? Elle deviendra exécutoire et le délai de recours s\u2019ouvrira.')) return;
    const { data, error } = await db.rpc('notifier_mesure', { p_mesure: m.id });
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data.ok) return setMsg('Erreur : ' + data.message);
    setMsg('Décision notifiée.'); charger();
  }

  async function statuer(r, issue){
    const decision = prompt('Décision motivée (obligatoire)');
    if (!decision) return;
    const { data, error } = await db.rpc('statuer_recours', {
      p_recours: r.id, p_issue: issue, p_decision: decision, p_suspensif: false
    });
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data.ok) return setMsg('Erreur : ' + data.message);
    setMsg('Recours tranché.'); charger();
  }

  async function clore(){
    const conclusion = prompt('Conclusion du dossier (obligatoire)');
    if (!conclusion) return;
    const { data, error } = await db.rpc('clore_dossier',
      { p_dossier: d.id, p_conclusion: conclusion });
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data.ok) return setMsg('Erreur : ' + data.message);
    fermer();
  }

  return html`
    <div>
      <a class="small" href="#" onClick=${e=>{e.preventDefault();fermer()}}>← Tous les dossiers</a>
      <div class="spread" style="margin-top:12px">
        <div>
          <h1 style="font-size:28px">${d.objet}</h1>
          <div class="small muted" style="margin-top:4px">
            <span class="mono">${d.reference}</span> · ${d.concerne}
            <span class="mono">${d.matricule}</span>
            ${d.territoire_nom ? ' · ' + d.territoire_nom : ''}
            · ouvert le ${jour(d.ouvert_le)}
          </div>
        </div>
        <span class=${'tag '+(GRAVITE[d.gravite]||['',''])[1]}>
          ${(GRAVITE[d.gravite]||['',''])[0]}</span>
      </div>

      <div class="panneau" style="margin-top:24px"><div class="corps">
        <${FilDossier} d=${d} />
      </div></div>

      ${msg && html`<div class=${'alerte '+(msg.startsWith('Erreur')?'err':'ok')}
        style="margin-top:16px">${msg}</div>`}

      <div class="panneau" style="margin-top:24px">
        <div class="tete"><h3 style="font-size:17px">Mesures</h3>
          <span class="tag">${mesures.length}</span></div>
        ${mesures.length === 0
          ? html`<div class="vide">Aucune mesure prononcée.</div>`
          : mesures.map(m => {
            const rs = recours.filter(r => r.mesure_id === m.id);
            return html`
              <div class="ligne" style="align-items:flex-start">
                <div style="flex:1;min-width:240px">
                  <div><strong>${MESURES[m.type]||m.type}</strong></div>
                  <div class="small" style="margin-top:4px">${m.motif}</div>
                  <div class="small muted" style="margin-top:4px">
                    Prononcée le ${jour(m.prise_le)} par ${nomDe(m.prise_par)}
                    · effet au ${jour(m.date_effet)}
                    ${m.date_fin ? ' · fin le ' + jour(m.date_fin) : ''}
                    ${m.notifiee_le ? ' · notifiée le ' + jour(m.notifiee_le) : ''}
                    ${m.accusee_le ? ' · réception accusée le ' + jour(m.accusee_le) : ''}
                  </div>
                  ${rs.map(r => html`
                    <div style="margin-top:12px;padding:12px;background:var(--papier);
                         border:1px solid var(--filet);border-radius:2px">
                      <div class="spread">
                        <span class="small"><strong>Recours du ${jour(r.cree_le)}</strong></span>
                        <span class="tag">${r.statut}</span>
                      </div>
                      <p class="small" style="margin:8px 0 0;white-space:pre-wrap">${r.contenu}</p>
                      ${r.decision
                        ? html`<p class="small muted" style="margin:8px 0 0">
                            Décision : ${r.decision}</p>`
                        : html`<div class="row" style="margin-top:12px">
                            <button class="btn sm" onClick=${()=>statuer(r,'accepte')}>Accueillir</button>
                            <button class="btn sm light" onClick=${()=>statuer(r,'rejete')}>Rejeter</button>
                            <button class="btn sm light" onClick=${()=>statuer(r,'irrecevable')}>Irrecevable</button>
                          </div>`}
                    </div>`)}
                </div>
                <div class="row">
                  <span class=${'tag '+(m.statut==='executee'?'rouge':m.statut==='annulee'?'vert':'')}>
                    ${m.statut}</span>
                  ${!m.notifiee_le && html`
                    <button class="btn sm" onClick=${()=>notifier(m)}>Notifier</button>`}
                </div>
              </div>`;
          })}
      </div>

      ${d.statut === 'clos' && html`
        <div class="alerte" style="margin-top:24px;border-left-color:var(--laiton)">
          Ce dossier est clos et scellé le ${jour(d.clos_le)}. Aucune pièce, mesure
          ou recours ne peut plus y être versé.
          ${d.conclusion ? ' Conclusion : ' + d.conclusion : ''}
        </div>`}

      ${d.statut !== 'clos' && html`
      <form onSubmit=${prononcer} class="panneau" style="margin-top:24px">
        <div class="tete"><h3 style="font-size:17px">Prononcer une mesure</h3></div>
        <div class="corps stack">
          <div class="field"><label>Nature</label>
            <select value=${mes.type} onChange=${e=>setMes(o=>({...o,type:e.target.value}))}>
              ${Object.entries(MESURES).map(([k,v]) => html`<option value=${k}>${v}</option>`)}
            </select></div>
          <div class="field"><label>Motif</label>
            <textarea required value=${mes.motif}
              onInput=${e=>setMes(o=>({...o,motif:e.target.value}))}
              placeholder="Les faits reprochés, les éléments retenus, la règle appliquée." /></div>
          <div class="field"><label>Texte complémentaire</label>
            <textarea value=${mes.texte} onInput=${e=>setMes(o=>({...o,texte:e.target.value}))} /></div>
          <div class="row" style="gap:16px;align-items:flex-start">
            <div class="field" style="flex:1;min-width:150px;margin:0"><label>Date d\u2019effet</label>
              <input type="date" value=${mes.effet}
                onInput=${e=>setMes(o=>({...o,effet:e.target.value}))} /></div>
            <div class="field" style="flex:1;min-width:150px;margin:0"><label>Fin (facultatif)</label>
              <input type="date" value=${mes.fin}
                onInput=${e=>setMes(o=>({...o,fin:e.target.value}))} /></div>
          </div>
          <div><button class="btn">Prononcer</button></div>
          <p class="small muted">
            Une mesure prononcée ne produit aucun effet tant qu\u2019elle n\u2019a pas été
            notifiée. La notification ouvre le délai de recours.
          </p>
        </div>
      </form>`}

      <div class="panneau" style="margin-top:24px">
        <div class="tete"><h3 style="font-size:17px">Pièces</h3>
          <span class="tag">${pieces.length}</span></div>
        ${pieces.map(pc => html`
          <div class="ligne">
            <div style="flex:1;min-width:240px">
              <div>${pc.fichier
                ? html`<a href="#" onClick=${e=>{e.preventDefault();ouvrirFichier(pc)}}>
                    ${pc.titre} ↗</a>`
                : pc.titre}</div>
              ${pc.contenu && html`<div class="small muted"
                style="margin-top:4px;white-space:pre-wrap;max-width:60ch">${pc.contenu}</div>`}
              <div class="small muted" style="margin-top:4px">
                ${pc.type} · ${nomDe(pc.auteur_id)} · ${jour(pc.cree_le)}</div>
            </div>
            ${pc.communicable
              ? html`<span class="tag vert">Communicable</span>`
              : html`<span class="tag or">Non communicable</span>`}
          </div>`)}
      </div>

      ${d.statut !== 'clos' && html`
      <form onSubmit=${verser} class="panneau" style="margin-top:24px">
        <div class="tete"><h3 style="font-size:17px">Verser une pièce</h3></div>
        <div class="corps stack">
          <div class="row" style="gap:16px;align-items:flex-start">
            <div class="field" style="flex:1;min-width:180px;margin:0"><label>Nature</label>
              <select value=${piece.type} onChange=${e=>setPiece(o=>({...o,type:e.target.value}))}>
                <option value="note_instruction">Note d\u2019instruction</option>
                <option value="temoignage">Témoignage</option>
                <option value="piece_jointe">Pièce</option>
                <option value="convocation">Convocation</option>
              </select></div>
            <div class="field" style="flex:1;min-width:200px;margin:0"><label>Titre</label>
              <input required value=${piece.titre}
                onInput=${e=>setPiece(o=>({...o,titre:e.target.value}))} /></div>
          </div>
          <div class="field"><label>Contenu</label>
            <textarea value=${piece.contenu}
              onInput=${e=>setPiece(o=>({...o,contenu:e.target.value}))} /></div>
          <label class="row" style="text-transform:none;letter-spacing:0;
              font-size:14px;color:var(--encre);margin:0;cursor:pointer">
            <input type="checkbox" style="width:auto" checked=${piece.communicable}
              onChange=${e=>setPiece(o=>({...o,communicable:e.target.checked}))} />
            <span>Communicable à l\u2019intéressé</span>
          </label>
          <p class="small muted">
            Une pièce non communicable existe et reste datée au dossier, mais son
            contenu n\u2019est pas ouvert — cela protège l\u2019identité d\u2019un témoin.
            Le contradictoire suppose que ce soit l\u2019exception.
          </p>
          <div class="field">
            <label>Document</label>
            <input type="file" accept="image/*,.pdf,.doc,.docx"
              onChange=${e=>setFichier(e.target.files[0]||null)} />
          </div>
          <div><button class="btn">Verser</button></div>
        </div>
      </form>`}

      ${d.statut !== 'clos' && html`
        <div style="margin-top:32px">
          <button class="btn light" onClick=${clore}>Clore le dossier</button>
          <p class="small muted" style="margin-top:8px">
            La clôture scelle le dossier. Tous les recours doivent avoir été
            tranchés au préalable.
          </p>
        </div>`}
    </div>`;
}

/* --- Direction générale : vérifications ------------------------------ */
function Validation(){
  const [attente, setAttente] = useState([]);
  const [demandes, setDemandes] = useState([]);
  const [signalements, setSignalements] = useState([]);
  const [alertes, setAlertes] = useState([]);
  const [encadrants, setEncadrants] = useState([]);
  const [msg, setMsg] = useState('');

  const charger = useCallback(async () => {
    // La table demandes pointe deux fois vers profils (profil_id et
    // traite_par). On lit donc les deux séparément plutôt que de laisser
    // PostgREST deviner de quel lien il s'agit.
    const [a, d, sg, al] = await Promise.all([
      db.from('v_annuaire').select('*').eq('statut','en_attente').order('cree_le'),
      db.from('demandes').select('*').in('statut',['ouverte','en_cours']).order('cree_le'),
      db.rpc('signalements_a_traiter'),
      db.rpc('alertes_consultation')
    ]);
    setSignalements(sg.data || []);
    setAlertes(al.data || []);
    const { data: enc } = await db.from('v_annuaire')
      .select('id,prenom,nom,fonction_nom,niveau').eq('statut','actif').gte('niveau', 50)
      .order('niveau', { ascending: false });
    setEncadrants(enc || []);
    if (d.error) setMsg('Lecture des demandes impossible : ' + d.error.message);
    const dem = d.data || [];

    let auteurs = {};
    if (dem.length){
      const ids = [...new Set(dem.map(x => x.profil_id))];
      const { data: ps } = await db.from('v_annuaire')
        .select('id,prenom,nom,matricule,email,fonction_nom,territoire_nom').in('id', ids);
      auteurs = Object.fromEntries((ps||[]).map(x => [x.id, x]));
    }
    setAttente(a.data || []);
    setDemandes(dem.map(x => ({ ...x, auteur: auteurs[x.profil_id] || null })));
  }, []);
  useEffect(() => { charger(); }, [charger]);

  async function validerMembre(id, ok){
    const { error } = await db.from('profils')
      .update({ statut: ok ? 'actif' : 'suspendu',
                date_adhesion: ok ? new Date().toISOString().slice(0,10) : null })
      .eq('id', id);
    setMsg(error ? error.message : (ok ? 'Compte activé.' : 'Compte suspendu.'));
    charger();
  }

  const motifLisible = {
    propos_deplaces:'Propos déplacés', harcelement:'Harcèlement',
    securite:'Situation préoccupante', hors_sujet:'Usage hors mission', autre:'Autre'
  };

  async function confier(sg, a){
    const { data, error } = await db.rpc('confier_signalement',
      { p_sig: sg.id, p_a: a });
    if (error) return setMsg(error.message);
    if (!data.ok) return setMsg(data.message);
    setMsg(a ? 'Signalement confié. L\u2019encadrant a désormais accès à cette conversation.'
             : 'Signalement repris par la Direction générale.');
    charger();
  }

  async function ouvrirDossier(sg){
    const cible = prompt(
      'Identifiant du membre mis en cause (copiez-le depuis l\u2019annuaire), ' +
      'ou laissez vide pour ouvrir le dossier sur l\u2019auteur du signalement.');
    const objet = prompt('Objet du dossier (obligatoire)');
    if (!objet) return;
    const { data, error } = await db.rpc('ouvrir_dossier', {
      p_profil: cible || sg.id, p_objet: objet,
      p_qualification: null, p_gravite: 'moyenne', p_signalement: sg.id
    });
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data.ok) return setMsg('Erreur : ' + data.message);
    setMsg('Dossier ouvert. Poursuivez dans Discipline et recours.');
    charger();
  }

  async function clore(sg, fonde){
    const decision = prompt(fonde
      ? 'Décision et suite donnée (obligatoire)'
      : 'Motif du classement sans suite (obligatoire)');
    if (!decision) return;
    const { data, error } = await db.rpc('clore_signalement',
      { p_sig: sg.id, p_fonde: fonde, p_decision: decision });
    if (error) return setMsg(error.message);
    if (!data.ok) return setMsg(data.message);
    setMsg('Signalement clos.');
    charger();
  }

  async function traiter(d, ok){
    const motif = prompt(ok ? "Motif de l'accord (facultatif)" : 'Motif du refus') ;
    if (!ok && motif === null) return;
    const { data:{ user } } = await db.auth.getUser();
    await db.from('demandes').update({
      statut: ok ? 'acceptee' : 'refusee',
      traite_par: user.id, traite_le: new Date().toISOString(),
      motif_reponse: motif || null
    }).eq('id', d.id);

    if (ok && d.type === 'acces_application' && d.cible){
      await db.from('acces_applications').upsert({
        profil_id: d.profil_id, application: d.cible,
        statut: 'accorde', accorde_par: user.id, motif: motif || null
      }, { onConflict: 'profil_id,application' });
    }
    setMsg('Demande traitée.');
    charger();
  }

  return html`
    <div>
      <div class="eyebrow">Direction générale</div>
      <h1 style="margin:6px 0 32px">Vérifications</h1>
      ${msg && html`<div class="alerte ok" style="margin-bottom:24px">${msg}</div>`}

      ${alertes.length > 0 && html`
        <div class="panneau" style="margin-bottom:24px;border-color:var(--laiton)">
          <div class="tete" style="border-bottom-color:var(--laiton)">
            <h3 style="font-size:17px">Consultations de dossiers protégés</h3>
            <span class="tag or">${alertes.length}</span>
          </div>
          ${alertes.map(al => html`
            <div class="ligne">
              <div style="flex:1;min-width:240px">
                <div>${al.observateur_nom} a consulté le dossier de ${al.observe_nom}</div>
                <div class="small muted">
                  ${al.observateur_fonction}
                  · <span class="mono">${al.observe_matricule}</span>
                  · ${new Date(al.cree_le).toLocaleString('fr-FR',
                      {day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}
                  ${al.contexte ? ' · ' + al.contexte : ''}
                </div>
              </div>
              <button class="btn sm light" onClick=${async ()=>{
                await db.rpc('marquer_alerte_vue', { p_id: al.id });
                charger();
              }}>Pris connaissance</button>
            </div>`)}
        </div>`}

      ${signalements.length > 0 && html`
        <div class="panneau" style="margin-bottom:24px;border-color:var(--laiton)">
          <div class="tete" style="border-bottom-color:var(--laiton)">
            <h3 style="font-size:17px">Signalements</h3>
            <span class="tag or">${signalements.length}</span>
          </div>
          ${signalements.map(sg => html`
            <div class="ligne" style="align-items:flex-start">
              <div style="flex:1;min-width:240px">
                <div>${motifLisible[sg.motif] || sg.motif}</div>
                <div class="small muted" style="margin-top:4px">
                  Signalé par ${sg.auteur_nom} <span class="mono">${sg.auteur_matricule}</span>
                  · ${jour(sg.cree_le)}
                </div>
                <div class="small muted">
                  Conversation entre ${sg.participants} · ${sg.nb_messages} message${sg.nb_messages>1?'s':''}
                </div>
                ${sg.details && html`<div class="small" style="margin-top:8px;max-width:56ch">
                  « ${sg.details} »</div>`}
                ${sg.assigne_nom && html`<div style="margin-top:8px">
                  <span class="tag bleu">Confié à ${sg.assigne_nom}</span></div>`}
              </div>
              <div class="stack" style="min-width:220px">
                <div class="field" style="margin:0">
                  <label>Confier à</label>
                  <select value=${sg.assigne_a || ''}
                    onChange=${e => confier(sg, e.target.value || null)}>
                    <option value="">Direction générale</option>
                    ${encadrants.map(x => html`<option value=${x.id}>
                      ${nomComplet(x)} — ${x.fonction_nom}</option>`)}
                  </select>
                </div>
                <div class="row">
                  <a class="btn sm light" href="#/espace/messagerie">Lire l'échange</a>
                  <button class="btn sm" onClick=${()=>ouvrirDossier(sg)}>Ouvrir un dossier</button>
                  <button class="btn sm light" onClick=${()=>clore(sg, true)}>Fondé</button>
                  <button class="btn sm light" onClick=${()=>clore(sg, false)}>Non fondé</button>
                </div>
              </div>
            </div>`)}
        </div>`}

      <div class="panneau">
        <div class="tete">
          <h3 style="font-size:17px">Inscriptions à vérifier</h3>
          <span class="tag">${attente.length}</span>
        </div>
        ${attente.length === 0
          ? html`<div class="vide">Aucune inscription en attente.</div>`
          : attente.map(m => html`
            <div class="ligne">
              <div>
                <div>${nomComplet(m)} <span class="mono muted">${m.matricule}</span></div>
                <div class="small muted">${m.email} · ${m.territoire_nom || 'sans territoire'}
                  · inscrit le ${jour(m.cree_le)}</div>
              </div>
              <div class="row">
                <button class="btn sm" onClick=${()=>validerMembre(m.id,true)}>Activer</button>
                <button class="btn sm light" onClick=${()=>validerMembre(m.id,false)}>Écarter</button>
              </div>
            </div>`)}
      </div>

      <div class="panneau" style="margin-top:24px">
        <div class="tete">
          <h3 style="font-size:17px">Demandes d'accès</h3>
          <span class="tag">${demandes.length}</span>
        </div>
        ${demandes.length === 0
          ? html`<div class="vide">Aucune demande en instance.</div>`
          : demandes.map(d => html`
            <div class="ligne">
              <div>
                <div>${d.objet}</div>
                <div class="small muted">
                  ${d.auteur ? nomComplet(d.auteur) : 'Membre inconnu'}
                  <span class="mono">${d.auteur?.matricule||''}</span>
                  ${d.auteur?.territoire_nom ? ' · ' + d.auteur.territoire_nom : ''}
                  · ${jour(d.cree_le)}
                </div>
                ${d.message && html`<div class="small" style="margin-top:6px;max-width:56ch">
                  « ${d.message} »</div>`}
              </div>
              <div class="row">
                <button class="btn sm" onClick=${()=>traiter(d,true)}>Accorder</button>
                <button class="btn sm light" onClick=${()=>traiter(d,false)}>Refuser</button>
              </div>
            </div>`)}
      </div>
    </div>`;
}

/* --- Direction générale : réseau et fonctions ------------------------ */
function ReseauAdmin(){
  const [membres, setMembres] = useState([]);
  const [fonctions, setFonctions] = useState([]);
  const [terr, setTerr] = useState([]);
  const [q, setQ] = useState('');
  const [msg, setMsg] = useState('');

  const charger = useCallback(async () => {
    const [m, f, t] = await Promise.all([
      db.from('v_annuaire').select('*').order('niveau',{ascending:false}).order('nom'),
      db.from('fonctions').select('*').order('niveau'),
      db.from('territoires').select('id,nom,echelle,code').order('echelle').order('nom')
    ]);
    setMembres(m.data||[]); setFonctions(f.data||[]); setTerr(t.data||[]);
  }, []);
  useEffect(() => { charger(); }, [charger]);

  async function modifier(id, champ, valeur){
    const { error } = await db.from('profils').update({ [champ]: valeur }).eq('id', id);
    setMsg(error ? error.message : 'Enregistré.');
    charger();
  }

  const filtre = membres.filter(m =>
    (nomComplet(m)+' '+(m.territoire_nom||'')).toLowerCase().includes(q.toLowerCase()));

  return html`
    <div>
      <div class="eyebrow">Direction générale</div>
      <h1 style="margin:6px 0 8px">Réseau et fonctions</h1>
      <p class="muted">Nommer, muter, faire progresser. Chaque modification est immédiate.</p>
      ${msg && html`<div class="alerte ok" style="margin:16px 0">${msg}</div>`}

      <div class="field" style="max-width:360px;margin:24px 0">
        <input placeholder="Rechercher…" value=${q} onInput=${e=>setQ(e.target.value)} />
      </div>

      <div class="panneau" style="overflow-x:auto">
        <table>
          <thead><tr><th>Membre</th><th>Fonction</th><th>Territoire</th><th>Échelon</th>
            <th>Statut</th><th title="Toute consultation déclenche une alerte">Protégé</th></tr></thead>
          <tbody>
            ${filtre.map(m => html`
              <tr>
                <td><div>${nomComplet(m)}</div><div class="mono muted">${m.matricule}</div></td>
                <td>
                  <select value=${m.fonction} onChange=${e=>modifier(m.id,'fonction',e.target.value)}>
                    ${fonctions.map(f => html`<option value=${f.code}>${f.nom}</option>`)}
                  </select>
                </td>
                <td>
                  <select value=${m.territoire_id||''} onChange=${e=>modifier(m.id,'territoire_id',e.target.value||null)}>
                    <option value="">—</option>
                    ${terr.map(t => html`<option value=${t.id}>${t.nom} (${t.echelle})</option>`)}
                  </select>
                </td>
                <td>
                  <select value=${m.echelon} onChange=${e=>modifier(m.id,'echelon',Number(e.target.value))}>
                    ${[1,2,3,4,5,6,7].map(n => html`<option value=${n}>${n}</option>`)}
                  </select>
                </td>
                <td>
                  <select value=${m.statut} onChange=${e=>modifier(m.id,'statut',e.target.value)}>
                    ${['en_attente','actif','suspendu','archive'].map(s =>
                      html`<option value=${s}>${s.replace('_',' ')}</option>`)}
                  </select>
                </td>
                <td style="text-align:center">
                  <input type="checkbox" style="width:auto" checked=${!!m.protege}
                    title="Protection renforcée : toute consultation déclenche une alerte"
                    onChange=${e=>modifier(m.id,'protege',e.target.checked)} />
                </td>
              </tr>`)}
          </tbody>
        </table>
      </div>
    </div>`;
}

/* --- Direction générale : textes du site public ---------------------- */
function VitrineAdmin(){
  const [c, setC] = useState([]);
  const [msg, setMsg] = useState('');
  const charger = useCallback(() =>
    db.from('contenus').select('*').order('section').order('ordre')
      .then(({data}) => setC(data||[])), []);
  useEffect(() => { charger(); }, [charger]);

  async function enregistrer(cle, valeur){
    const { error } = await db.from('contenus').update({ valeur }).eq('cle', cle);
    setMsg(error ? error.message : 'Texte publié.');
  }

  const sections = [...new Set(c.map(x => x.section))];
  return html`
    <div>
      <div class="eyebrow">Direction générale</div>
      <h1 style="margin:6px 0 8px">Site public</h1>
      <p class="muted">Aucun texte public n'est écrit dans le code. Tout se modifie ici.</p>
      ${msg && html`<div class="alerte ok" style="margin:16px 0">${msg}</div>`}

      ${sections.map(s => html`
        <div class="panneau" style="margin-top:24px">
          <div class="tete"><h3 style="font-size:17px;text-transform:capitalize">${s}</h3></div>
          <div class="corps stack">
            ${c.filter(x => x.section === s).map(x => html`
              <div class="field">
                <label>${x.libelle}</label>
                ${x.format === 'long'
                  ? html`<textarea value=${x.valeur} onBlur=${e=>enregistrer(x.cle,e.target.value)} />`
                  : html`<input value=${x.valeur} onBlur=${e=>enregistrer(x.cle,e.target.value)} />`}
              </div>`)}
            <p class="small muted">Les modifications sont enregistrées lorsque vous
            quittez le champ.</p>
          </div>
        </div>`)}
    </div>`;
}

/* --- Coquille de l'espace membre ------------------------------------- */
function EnAttente({ p }){
  return html`
    <section class="bloc blanc">
      <div class="wrap" style="max-width:560px">
        <div class="eyebrow">Espace membre</div>
        <h1 style="margin:8px 0 24px">Votre dossier est en cours de vérification</h1>
        <div class="alerte">
          La Direction générale vérifie votre inscription avant d'ouvrir vos accès.
          Vous recevrez un message dès qu'elle sera validée.
        </div>
        <div style="margin-top:32px">
          <${CarteFederale} p=${p} />
        </div>
        <p style="margin-top:32px">
          <a href="#/" onClick=${()=>db.auth.signOut()}>Se déconnecter</a>
        </p>
      </div>
    </section>`;
}

function Espace({ session, sous }){
  const [p, setP] = useState(null);
  const [apps, setApps] = useState([]);
  const [demandes, setDemandes] = useState([]);
  const [chemin, setChemin] = useState('');
  const [pret, setPret] = useState(false);

  const charger = useCallback(async () => {
    const { data: profil } = await db.from('v_annuaire').select('*')
      .eq('id', session.user.id).maybeSingle();
    if (!profil){ setPret(true); return; }
    setP(profil);

    const [{ data: liste }, { data: mesAcces }, { data: mesDem }] = await Promise.all([
      db.from('applications').select('*').eq('actif',true).order('ordre'),
      db.from('acces_applications').select('application,statut').eq('profil_id', session.user.id),
      db.from('demandes').select('*').eq('profil_id', session.user.id).order('cree_le',{ascending:false})
    ]);
    const accordes = new Set((mesAcces||[]).filter(a=>a.statut==='accorde').map(a=>a.application));
    setApps((liste||[]).map(a => ({
      ...a,
      ouvert: profil.statut === 'actif' &&
              ((!a.sur_demande && profil.niveau >= a.niveau_min) || accordes.has(a.code))
    })));
    setDemandes(mesDem || []);

    // Les postes occupés : ils ouvrent des droits que la fonction ne
    // donne pas — référent RGPD, ordonnateur, conseil de discipline…
    const { data: mp } = await db.rpc('mes_postes');
    profil.postes = mp || [];
    setP({ ...profil });

    if (profil.territoire_id){
      const { data } = await db.rpc('chemin_territoire', { cible: profil.territoire_id });
      setChemin(data || '');
    }
    setPret(true);
  }, [session.user.id]);

  useEffect(() => { charger(); }, [charger]);

  if (!pret) return html`<div class="vide" style="padding:120px">Chargement…</div>`;
  if (!p) return html`<div class="vide" style="padding:120px">
    Profil introuvable. <a href="#/" onClick=${()=>db.auth.signOut()}>Se déconnecter</a></div>`;
  if (p.statut === 'suspendu') return html`<${EspaceSuspendu} p=${p} />`;
  if (p.statut !== 'actif') return html`<${EnAttente} p=${p} />`;

  const admin = p.niveau >= 90;
  const acces = c => apps.find(a => a.code === c && a.ouvert);
  const refus = html`<div class="alerte err">Cette application ne vous est pas ouverte.
    <a href="#/espace/demandes">Déposer une demande</a></div>`;

  let vue;
  if (sous.startsWith('groupe/')){
    const idG = sous.slice('groupe/'.length);
    return html`
      <div class="app">
        <${Flanc} p=${p} apps=${apps} page="groupes" />
        <main class="contenu">
          ${acces('groupes') ? html`<${Groupe} p=${p} id=${idG} />` : refus}
        </main>
      </div>`;
  }
  if (sous.startsWith('formation/')){
    const idF = sous.slice('formation/'.length);
    return html`
      <div class="app">
        <${Flanc} p=${p} apps=${apps} page="formations" />
        <main class="contenu">
          ${acces('formations') ? html`<${Formation} p=${p} id=${idF} />` : refus}
        </main>
      </div>`;
  }
  switch (sous){
    case '':           vue = html`<${TableauDeBord} p=${p} apps=${apps} chemin=${chemin} demandes=${demandes} />`; break;
    case 'compte':     vue = html`<${MonCompte} p=${p} recharger=${charger} />`; break;
    case 'mon-dossier':vue = html`<${MonDossier} p=${p} entier=${true} />`; break;
    case 'discipline': vue = acces('discipline') ? html`<${Discipline} p=${p} />` : refus; break;
    case 'demandes':   vue = html`<${MesDemandes} p=${p} apps=${apps} demandes=${demandes} recharger=${charger} />`; break;
    case 'annuaire':   vue = acces('annuaire') ? html`<${Annuaire} p=${p} />` : refus; break;
    case 'validation': vue = admin ? html`<${Validation} />` : refus; break;
    case 'reseau':     vue = admin ? html`<${ReseauAdmin} />` : refus; break;
    case 'vitrine':    vue = admin ? html`<${VitrineAdmin} />` : refus; break;
    case 'habilitations': vue = (admin || p.droits?.includes('habilitations.gerer'))
                          ? html`<${Habilitations} p=${p} />` : refus; break;
    case 'formations': vue = acces('formations') ? html`<${Formations} p=${p} />` : refus; break;
    case 'groupes':    vue = acces('groupes') ? html`<${Groupes} p=${p} />` : refus; break;
    case 'messagerie': vue = acces('messagerie') ? html`<${Messagerie} p=${p} />` : refus; break;
    case 'notes_frais':vue = acces('notes_frais') ? html`<${NotesFrais} p=${p} />` : refus; break;
    case 'tresorerie': vue = acces('tresorerie')
                       ? html`<${Finances} p=${p} role="tresorerie" />` : refus; break;
    case 'ordonnancement': vue = acces('ordonnancement')
                       ? html`<${Finances} p=${p} role="ordonnancement" />` : refus; break;
    default:           vue = html`<div class="vide">Page inconnue.</div>`;
  }

  return html`
    <div class="app">
      <${Flanc} p=${p} apps=${apps} page=${sous} />
      <main class="contenu">${vue}</main>
    </div>`;
}

/* =====================================================================
   6. RACINE
   ===================================================================== */
function Site(){
  const route = useRoute();
  const [session, setSession] = useState(undefined);
  const [txt, setTxt] = useState(null);

  useEffect(() => {
    db.auth.getSession().then(({data}) => setSession(data.session));
    const { data:{ subscription } } = db.auth.onAuthStateChange((_e,s) => setSession(s));
    return () => subscription.unsubscribe();
  }, []);

  useEffect(() => {
    db.from('contenus').select('cle,valeur').then(({data}) =>
      setTxt(Object.fromEntries((data||[]).map(c => [c.cle, c.valeur]))));
  }, []);

  if (session === undefined || txt === null)
    return html`<div class="vide" style="padding:140px">Chargement…</div>`;

  // Espace membre : mise en page propre, sans l'entête publique.
  if (route.startsWith('/espace')){
    if (!session) return html`
      <${EntetePublique} route=${route} session=${session} />
      <${Connexion} />
      <${Pied} txt=${txt} />`;
    const sous = route.replace('/espace','').replace(/^\//,'');
    return html`<${Espace} session=${session} sous=${sous} />`;
  }

  let page;
  switch (route){
    case '/':                 page = html`<${Accueil} txt=${txt} />`; break;
    case '/association':      page = html`<${Association} txt=${txt} />`; break;
    case '/actions':          page = html`<${Actions} />`; break;
    case '/reseau':           page = html`<${Reseau} />`; break;
    case '/rejoindre':        page = html`<${Rejoindre} />`; break;
    case '/contact':          page = html`<${Contact} txt=${txt} />`; break;
    case '/inscription':      page = session ? html`<${Accueil} txt=${txt} />` : html`<${Inscription} />`; break;
    case '/mentions':         page = html`<${PageTexte} titre="Mentions légales" corps=${txt.mentions} />`; break;
    case '/confidentialite':  page = html`<${PageTexte} titre="Politique de confidentialité" corps=${txt.confidentialite} />`; break;
    default:                  page = html`<${PageTexte} titre="Page introuvable"
                                  corps="Le lien que vous avez suivi ne mène nulle part." />`;
  }

  return html`
    <${EntetePublique} route=${route} session=${session} />
    ${page}
    <${Pied} txt=${txt} />`;
}

render(html`<${Site} />`, document.getElementById('racine'));
</script>
