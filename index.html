   inadvertance, on les ouvre parce qu'on en a besoin.
   --------------------------------------------------------------------- */
/* --- Complétude d'un dossier ------------------------------------------ */
function Completude({ id }){
  const [c, setC] = useState(null);
  useEffect(() => {
    db.rpc('completude_dossier', { p_profil: id || null }).then(({data}) => setC(data));
  }, [id]);
  if (!c) return null;
  return html`
    <div style="margin-top:8px">
      <div class="row" style="gap:8px">
        <div class="jauge" style="flex:1;max-width:180px;margin:0;height:5px">
          <i style=${'width:'+c.pourcent+'%;background:'+
            (c.complet?'var(--valide)':'var(--brun)')}></i></div>
        <span class=${'small '+(c.complet?'':'muted')}
          style=${c.complet?'color:var(--valide)':''}>
          ${c.complet ? 'Dossier complet' : c.pourcent + ' % — manque ' + c.manques.join(', ')}
        </span>
      </div>
    </div>`;
}

function ApercuAdhesion({ id }){
  const [d, setD] = useState(null);
  const [ouvert, setOuvert] = useState(false);

  async function ouvrir(){
    setOuvert(true);
    const { data } = await db.from('dossier_adhesion').select('*').eq('profil_id', id).maybeSingle();
    setD(data || {});
  }
  if (!ouvert) return html`
    <button class="btn sm light" style="margin-top:8px;border:0;background:transparent;
      padding:0;font-size:12.5px;color:var(--action)"
      onClick=${ouvrir}>Voir le dossier d\u2019adhésion</button>`;
  if (!d) return html`<div class="small muted" style="margin-top:8px">Chargement…</div>`;
  if (Object.keys(d).length === 0) return html`
    <div class="small muted" style="margin-top:8px">Dossier non complété par le membre.</div>`;

  const ligne = (l, v) => v ? html`
    <div style="display:flex;gap:8px;padding:3px 0">
      <span class="small muted" style="min-width:140px">${l}</span>
      <span class="small">${v}</span>
    </div>` : null;

  return html`
    <div style="margin-top:10px;padding:12px;background:var(--papier);
         border:1px solid var(--filet);border-radius:2px">
      ${ligne('Naissance', d.date_naissance ? jour(d.date_naissance) : null)}
      ${ligne('Adresse', [d.adresse, d.code_postal, d.ville].filter(Boolean).join(', '))}
      ${ligne('Situation', d.situation)}
      ${ligne('Profession', d.profession)}
      ${ligne('Compétences', d.competences)}
      ${ligne('Disponibilités', d.disponibilites)}
      ${ligne('Motivation', d.motivation)}
      ${ligne('Nous a connus par', d.origine)}
      ${ligne('Droit à l\u2019image', d.accepte_image ? 'Accordé' : 'Refusé')}
    </div>`;
}


/* =====================================================================
   COMMUNICATION
   Un chargé de com rédige, la direction valide, puis publie.
   ===================================================================== */

const CANAUX = { instagram:'Instagram', linkedin:'LinkedIn', facebook:'Facebook',
                 x:'X', site:'Site public', newsletter:'Infolettre', presse:'Presse' };
const ETAT_PUB = {
  brouillon:['Brouillon',''], a_valider:['À valider','bleu'],
  validee:['Validée','vert'], publiee:['Publiée','vert'],
  refusee:['À reprendre','rouge'], archivee:['Archivée','']
};

/* Adresse publique d'une image du dépôt vitrine. */
const urlPublique = chemin => chemin
  ? SUPABASE_URL + '/storage/v1/object/public/public/' + chemin : null;

/* Dépôt d'image partagé par la vitrine et la communication. */
async function deposerImage(fichier, prefixe){
  if (!fichier) return null;
  if (fichier.size > 5 * 1024 * 1024)
    throw new Error('L\u2019image ne doit pas dépasser 5 Mo.');
  const ext = fichier.name.split('.').pop();
  const chemin = prefixe + '/' + Date.now() + '.' + ext;
  const { error } = await db.storage.from('public').upload(chemin, fichier);
  if (error) throw error;
  return chemin;
}

function Communication({ p }){
  const [onglet, setOnglet] = useState('calendrier');
  const [pubs, setPubs] = useState([]);
  const [campagnes, setCampagnes] = useState([]);
  const [modeles, setModeles] = useState([]);
  const [edition, setEdition] = useState(null);
  const [msg, setMsg] = useState('');

  const valide = (p.postes||[]).some(x => x.nom.includes('communication')) || p.niveau >= 90;

  const charger = useCallback(async () => {
    const [a, b, c] = await Promise.all([
      db.rpc('calendrier_com', { p_depuis: null, p_jusqu: null }),
      db.from('campagnes').select('*').order('debut', {nullsFirst:false}),
      db.from('modeles_com').select('*').order('titre')
    ]);
    setPubs(a.data||[]); setCampagnes(b.data||[]); setModeles(c.data||[]);
  }, []);
  useEffect(() => { charger(); }, [charger]);

  async function statuer(pub, issue){
    const obs = issue === 'refusee' ? prompt('Ce qu\u2019il faut reprendre (obligatoire)') : null;
    if (issue === 'refusee' && !obs) return;
    const { data, error } = await db.rpc('statuer_publication',
      { p_id: pub.id, p_issue: issue, p_observation: obs });
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data.ok) return setMsg('Erreur : ' + data.message);
    setMsg('Publication mise à jour.'); charger();
  }

  async function soumettre(pub){
    const { data, error } = await db.rpc('soumettre_publication', { p_id: pub.id });
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data.ok) return setMsg('Erreur : ' + data.message);
    setMsg('Transmise à la direction de la communication.'); charger();
  }

  if (edition) return html`<${EditionPublication} p=${p} pub=${edition}
    campagnes=${campagnes} modeles=${modeles}
    fermer=${()=>{ setEdition(null); charger(); }} />`;

  const aValider = pubs.filter(x => x.statut === 'a_valider');
  const aVenir = pubs.filter(x => ['validee','a_valider','brouillon'].includes(x.statut)
    && x.date_prevue && new Date(x.date_prevue) >= new Date());

  const lignePub = x => html`
    <div class="ligne" style="align-items:flex-start">
      ${x.image && html`<img src=${urlPublique(x.image)} alt=""
        style="width:64px;height:64px;object-fit:cover;border:1px solid var(--filet);
               border-radius:2px;flex:0 0 64px" />`}
      <div style="flex:1;min-width:220px;cursor:pointer" onClick=${()=>setEdition(x)}>
        <div>${x.titre}</div>
        <div class="small muted">
          ${CANAUX[x.canal]||x.canal}
          ${x.campagne ? ' · ' + x.campagne : ''}
          ${x.date_prevue ? ' · ' + new Date(x.date_prevue).toLocaleString('fr-FR',
              {day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}) : ' · sans date'}
          ${x.auteur ? ' · ' + x.auteur : ''}
        </div>
        ${x.observation && html`<div class="small" style="color:var(--bordeaux);margin-top:4px">
          ${x.observation}</div>`}
      </div>
      <div class="row">
        <span class=${'tag '+(ETAT_PUB[x.statut]||['',''])[1]}>
          ${(ETAT_PUB[x.statut]||[x.statut,''])[0]}</span>
        ${x.statut === 'brouillon' && html`
          <button class="btn sm light" onClick=${()=>soumettre(x)}>Soumettre</button>`}
        ${x.statut === 'a_valider' && valide && html`
          <button class="btn sm" onClick=${()=>statuer(x,'validee')}>Valider</button>
          <button class="btn sm light" onClick=${()=>statuer(x,'refusee')}>À reprendre</button>`}
        ${x.statut === 'validee' && valide && html`
          <button class="btn sm" onClick=${()=>statuer(x,'publiee')}>Marquer publiée</button>`}
      </div>
    </div>`;

  return html`
    <div>
      <div class="spread">
        <div>
          <div class="eyebrow">Communication</div>
          <h1 style="margin:6px 0 0">Calendrier éditorial</h1>
        </div>
        <button class="btn" onClick=${()=>setEdition({nouveau:true})}>
          Nouvelle publication</button>
      </div>
      ${msg && html`<div class=${'alerte '+(msg.startsWith('Erreur')?'err':'ok')}
        style="margin-top:16px">${msg}</div>`}

      <div class="chiffres" style="margin:24px 0">

function Campagnes({ valide, campagnes, recharger, setMsg }){
  const [ouvert, setOuvert] = useState(false);
  const [f, setF] = useState({titre:'',objectif:'',debut:'',fin:''});

  async function creer(e){
    e.preventDefault();
    const { error } = await db.from('campagnes').insert({
      titre: f.titre, objectif: f.objectif || null,
      debut: f.debut || null, fin: f.fin || null
    });
    if (error) return setMsg('Erreur : ' + error.message);
    setF({titre:'',objectif:'',debut:'',fin:''}); setOuvert(false);
    setMsg('Campagne créée.'); recharger();
  }

  return html`
    <div>
      ${valide && html`
        <div class="spread" style="margin-bottom:16px">
          <span class="small muted">${campagnes.length} campagne${campagnes.length>1?'s':''}</span>
          <button class="btn sm" onClick=${()=>setOuvert(o=>!o)}>
            ${ouvert ? 'Annuler' : 'Nouvelle campagne'}</button>
        </div>`}
      ${ouvert && html`
        <form onSubmit=${creer} class="panneau" style="margin-bottom:24px">
          <div class="corps stack">
            <div class="field"><label>Titre</label>
              <input required value=${f.titre}
                onInput=${e=>setF(o=>({...o,titre:e.target.value}))} /></div>
            <div class="field"><label>Objectif</label>
              <textarea value=${f.objectif}
                onInput=${e=>setF(o=>({...o,objectif:e.target.value}))} /></div>
            <div class="row" style="gap:16px;align-items:flex-start">
              <div class="field" style="flex:1;min-width:140px;margin:0"><label>Début</label>
                <input type="date" value=${f.debut}
                  onInput=${e=>setF(o=>({...o,debut:e.target.value}))} /></div>
              <div class="field" style="flex:1;min-width:140px;margin:0"><label>Fin</label>
                <input type="date" value=${f.fin}
                  onInput=${e=>setF(o=>({...o,fin:e.target.value}))} /></div>
            </div>
            <div><button class="btn">Créer</button></div>
          </div>
        </form>`}
      <div class="panneau">
        ${campagnes.length === 0
          ? html`<div class="vide">Aucune campagne.</div>`
          : campagnes.map(c => html`
            <div class="ligne">
              <div><div>${c.titre}</div>
                <div class="small muted">${c.objectif||''}
                  ${c.debut ? ' · ' + jour(c.debut) : ''}
                  ${c.fin ? ' au ' + jour(c.fin) : ''}</div></div>
              <span class="tag">${c.statut.replace('_',' ')}</span>
            </div>`)}
      </div>
    </div>`;
}

function EditionPublication({ p, pub, campagnes, modeles, fermer }){
  const neuf = !!pub.nouveau;
  const [f, setF] = useState({
    titre: pub.titre||'', canal: pub.canal||'instagram', texte: pub.texte||'',
    lien: pub.lien||'', campagne_id: pub.campagne_id||'',
    date_prevue: pub.date_prevue ? pub.date_prevue.slice(0,16) : '', image: pub.image||''
  });
  const [fichier, setFichier] = useState(null);
  const [msg, setMsg] = useState('');
  const [envoi, setEnvoi] = useState(false);

  useEffect(() => { (async () => {
    if (neuf || !pub.id) return;
    const { data } = await db.from('publications').select('*').eq('id', pub.id).maybeSingle();
    if (data) setF({
      titre:data.titre, canal:data.canal, texte:data.texte||'', lien:data.lien||'',
      campagne_id:data.campagne_id||'', image:data.image||'',
      date_prevue: data.date_prevue ? data.date_prevue.slice(0,16) : ''
    });
  })(); }, [pub.id, neuf]);

  async function enregistrer(e){
    e.preventDefault(); setEnvoi(true); setMsg('');
    try {
      let image = f.image;
      if (fichier) image = await deposerImage(fichier, 'com');
      const corps = {
        titre: f.titre, canal: f.canal, texte: f.texte || null,
        lien: f.lien || null, campagne_id: f.campagne_id || null,
        date_prevue: f.date_prevue || null, image: image || null
      };
      if (neuf){
        const { error } = await db.from('publications')
          .insert({ ...corps, auteur_id: p.id });
        if (error) throw error;
      } else {
        const { error } = await db.from('publications').update(corps).eq('id', pub.id);
        if (error) throw error;
      }
      fermer();
    } catch (err){ setMsg(err.message || 'Enregistrement impossible.'); }
    setEnvoi(false);
  }

  const limites = { instagram:2200, x:280, linkedin:3000, facebook:5000 };
  const limite = limites[f.canal];

  return html`
    <div>
      <button class="lien-discret" onClick=${fermer}>← Calendrier</button>
      <h1 style="font-size:28px;margin:12px 0 24px">
        ${neuf ? 'Nouvelle publication' : f.titre || 'Publication'}</h1>
      ${msg && html`<div class="alerte err" style="margin-bottom:16px">${msg}</div>`}

      <form onSubmit=${enregistrer} class="panneau">
        <div class="corps stack">
          <div class="row" style="gap:16px;align-items:flex-start">
            <div class="field" style="flex:2;min-width:200px;margin:0"><label>Titre interne</label>
              <input required value=${f.titre}
                onInput=${e=>setF(o=>({...o,titre:e.target.value}))} /></div>
            <div class="field" style="flex:1;min-width:150px;margin:0"><label>Canal</label>
              <select value=${f.canal} onChange=${e=>setF(o=>({...o,canal:e.target.value}))}>
                ${Object.entries(CANAUX).map(([k,v]) => html`<option value=${k}>${v}</option>`)}
              </select></div>
          </div>

          <div class="field">
            <div class="spread" style="margin-bottom:6px">
              <label style="margin:0">Texte</label>
              ${limite && html`<span class=${'small '+(f.texte.length>limite?'':'muted')}
                style=${f.texte.length>limite?'color:var(--bordeaux)':''}>
                ${f.texte.length} / ${limite} signes</span>`}
            </div>
            <textarea value=${f.texte} style="min-height:180px"
              onInput=${e=>setF(o=>({...o,texte:e.target.value}))} />
          </div>

          ${modeles.length > 0 && html`
            <div class="field">
              <label>Partir d\u2019un modèle</label>
              <select value="" onChange=${e=>{
                const m = modeles.find(x => x.id === e.target.value);
                if (m) setF(o => ({...o, texte: m.contenu}));
              }}>
                <option value="">Choisir…</option>
                ${modeles.map(m => html`<option value=${m.id}>${m.titre}</option>`)}
              </select>
            </div>`}

          <div class="row" style="gap:16px;align-items:flex-start">
            <div class="field" style="flex:1;min-width:190px;margin:0"><label>Campagne</label>
              <select value=${f.campagne_id}
                onChange=${e=>setF(o=>({...o,campagne_id:e.target.value}))}>
                <option value="">Aucune</option>
                ${campagnes.map(c => html`<option value=${c.id}>${c.titre}</option>`)}
              </select></div>
            <div class="field" style="flex:1;min-width:190px;margin:0"><label>Date prévue</label>
              <input type="datetime-local" value=${f.date_prevue}
                onInput=${e=>setF(o=>({...o,date_prevue:e.target.value}))} /></div>
          </div>

          <div class="field"><label>Lien</label>
            <input type="url" value=${f.lien}
              onInput=${e=>setF(o=>({...o,lien:e.target.value}))} /></div>

          <div class="field"><label>Visuel</label>
            ${f.image && html`<img src=${urlPublique(f.image)} alt=""
              style="max-width:220px;display:block;margin-bottom:10px;
                     border:1px solid var(--filet);border-radius:2px" />`}
            <input type="file" accept="image/*"
              onChange=${e=>setFichier(e.target.files[0]||null)} />
            <p class="small muted" style="margin:6px 0 0">
              Cinq mégaoctets maximum. Aucun visage de mineur sans autorisation écrite.
            </p>
          </div>

          <div><button class="btn" disabled=${envoi}>
            ${envoi ? 'Enregistrement…' : 'Enregistrer'}</button></div>
        </div>
      </form>
    </div>`;
}

/* --- Chancellerie ------------------------------------------------------
   Reconnaître ce qui est donné. Le barème, les classements, les
   promotions.
   --------------------------------------------------------------------- */
function Chancellerie({ p }){
  const [onglet, setOnglet] = useState('synthese');
  const [s, setS] = useState(null);
  const [bareme, setBareme] = useState([]);
  const [classement, setClassement] = useState([]);
  const [promos, setPromos] = useState([]);
  const [terr, setTerr] = useState([]);
  const [filtreT, setFiltreT] = useState('');
  const [msg, setMsg] = useState('');

  const charger = useCallback(async () => {
    const [a,b,c,d,e] = await Promise.all([
      db.rpc('chancellerie_synthese'),
      db.from('bareme_points').select('*').order('ordre'),
      db.rpc('classement_merites', { p_territoire: filtreT || null, p_limite: 60 }),
      db.from('promotions').select('*').order('cree_le',{ascending:false}).limit(40),
      db.from('territoires').select('id,nom,echelle').in('echelle',['region','departement']).order('nom')
    ]);
    setS(a.data); setBareme(b.data||[]); setClassement(c.data||[]);
    setPromos(d.data||[]); setTerr(e.data||[]);
  }, [filtreT]);
  useEffect(() => { charger(); }, [charger]);

  async function reglerPoints(cle, points){
    const { data, error } = await db.rpc('regler_bareme',
      { p_cle: cle, p_points: Number(points) });
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data.ok) return setMsg('Erreur : ' + data.message);
    setMsg('Barème enregistré. Tous les totaux sont recalculés.');
    charger();
  }

  async function promouvoirMembre(x){
    const motif = prompt('Motif de la promotion (obligatoire)\n\n' +
      x.membre + ' — échelon ' + x.echelon + ' → ' + (x.echelon+1) +
      '\n' + x.points + ' points');
    if (!motif) return;
    const { data, error } = await db.rpc('promouvoir',
      { p_profil: x.profil_id, p_echelon: x.echelon + 1, p_motif: motif });
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data.ok) return setMsg('Erreur : ' + data.message);
    setMsg('Promotion arrêtée.'); charger();
  }

  if (!s) return html`<div class="vide">Chargement…</div>`;
  if (s.erreur) return html`<div class="alerte err">${s.erreur}</div>`;

  const aPromouvoir = classement.filter(x => x.atteint);

  return html`
    <div>
      <div class="eyebrow">Chancellerie</div>
      <h1 style="margin:6px 0 8px">Valorisation des compétences</h1>
      <p class="muted" style="max-width:60ch">
        Reconnaître ce qui est donné. Le barème fixe la valeur de chaque
        contribution ; les points se recalculent à chaque lecture, jamais
        stockés. Atteindre un palier ne promeut pas : vous décidez, et vous
        motivez.
      </p>
      ${msg && html`<div class=${'alerte '+(msg.startsWith('Erreur')?'err':'ok')}
        style="margin-top:16px">${msg}</div>`}

      <div class="chiffres" style="margin:24px 0">
        <div><div class="n" style="font-size:30px">${aPromouvoir.length}</div>
          <div class="l">Paliers atteints</div></div>
        <div><div class="n" style="font-size:30px">${Number(s.heures_mois||0)}</div>
          <div class="l">Heures ce mois</div></div>
        <div><div class="n" style="font-size:30px">${s.certifications_mois}</div>
          <div class="l">Certifications ce mois</div></div>
        <div><div class="n" style="font-size:30px">${s.dormants}</div>
          <div class="l">Membres sans activité</div></div>
      </div>

      <div class="row" style="margin:0 0 24px;gap:0;border-bottom:1px solid var(--filet)">
        ${[['synthese','Synthèse'],['classement','Classement'],
           ['promouvoir','À promouvoir'],['distinctions','Distinctions'],
           ['bareme','Barème'],['historique','Décisions']]
          .map(([k,t]) => html`
          <button class="btn light" style=${'border:0;border-bottom:2px solid '+
            (onglet===k?'var(--bordeaux)':'transparent')+';border-radius:0;background:transparent'}
            onClick=${()=>setOnglet(k)}>${t}${k==='promouvoir'&&aPromouvoir.length
              ? ' ('+aPromouvoir.length+')' : ''}</button>`)}
      </div>

      ${onglet === 'synthese' && html`
        <div>
          <div class="panneau">
            <div class="tete"><h3 style="font-size:17px">Répartition par échelon</h3></div>
            <div class="corps">
              ${Object.entries(s.par_echelon || {}).map(([nom, n]) => {
                const max = Math.max(...Object.values(s.par_echelon||{1:1}));
                return html`
                  <div style="padding:7px 0">
                    <div class="spread small">
                      <span>${nom}</span><span class="mono">${n}</span>
                    </div>
                    <div class="jauge" style="margin-top:5px">
                      <i style=${'width:'+Math.round(n/Math.max(max,1)*100)+'%'}></i></div>
                  </div>`;
              })}
            </div>
          </div>
          <div class="panneau" style="margin-top:24px">
            <div class="tete"><h3 style="font-size:17px">L\u2019année en cours</h3></div>
            <div class="ligne"><span class="muted">Heures de bénévolat déclarées</span>
              <span class="mono">${Number(s.heures_annee||0)} h</span></div>
            <div class="ligne"><span class="muted">Promotions arrêtées</span>
              <span class="mono">${s.promotions_annee}</span></div>
            <div class="ligne"><span class="muted">Membres actifs</span>
              <span class="mono">${s.membres_actifs}</span></div>
            <div class="corps small muted" style="border-top:1px solid var(--filet)">
              Un membre est dit sans activité s\u2019il n\u2019a ouvert aucune application
              depuis 90 jours et n\u2019a déclaré aucune heure depuis trois mois.
              Ce n\u2019est pas un reproche : c\u2019est un signal pour reprendre contact.
            </div>
          </div>
        </div>`}

      ${(onglet === 'classement' || onglet === 'promouvoir') && html`
        <div>
          <div class="field" style="max-width:280px;margin-bottom:20px">
            <label>Périmètre</label>
            <select value=${filtreT} onChange=${e=>setFiltreT(e.target.value)}>
              <option value="">Toute la fédération</option>
              ${terr.map(t => html`<option value=${t.id}>${t.nom}</option>`)}
            </select>
          </div>
          <div class="panneau" style="overflow-x:auto">
            <table>
              <thead><tr><th></th><th>Membre</th><th>Échelon</th><th>Points</th>
                <th>Heures cette année</th><th>Missions</th><th>Certifications</th>
                <th></th></tr></thead>
              <tbody>
                ${(onglet === 'promouvoir' ? aPromouvoir : classement).map((x, i) => html`
                  <tr>
                    <td class="mono muted">${onglet === 'classement' ? i+1 : ''}</td>
                    <td><div>${x.membre}</div>
                      <div class="small muted">${x.fonction}
                        ${x.territoire ? ' · ' + x.territoire : ''}</div></td>
                    <td><span class="tag or">${x.echelon}</span></td>
                    <td><span class="mono" style="font-size:15px">${x.points}</span>
                      ${x.palier_suivant && html`<span class="small muted">
                        /${x.palier_suivant}</span>`}</td>
                    <td class="mono">${Number(x.heures_annee||0)}</td>
                    <td class="mono">${x.missions}</td>
                    <td class="mono">${x.certifications}</td>
                    <td>${x.atteint && x.palier_suivant
                      ? html`<button class="btn sm"
                          onClick=${()=>promouvoirMembre(x)}>Promouvoir</button>`
                      : ''}</td>
                  </tr>`)}
              </tbody>
            </table>
            ${(onglet === 'promouvoir' ? aPromouvoir : classement).length === 0 && html`
              <div class="vide">${onglet === 'promouvoir'
                ? 'Personne n\u2019a atteint son palier.' : 'Aucun membre.'}</div>`}
          </div>
        </div>`}

      ${onglet === 'distinctions' && html`<${Distinctions} classement=${classement}
        recharger=${charger} setMsg=${setMsg} />`}

      ${onglet === 'bareme' && html`
        <div>
          <p class="small muted" style="margin-bottom:20px;max-width:62ch">
            Modifier une valeur recalcule aussitôt les totaux de tous les
            membres. Rien n\u2019est stocké : personne ne perd de points, les
            équilibres changent simplement.
          </p>
          <div class="panneau">
            ${bareme.map(b => html`
              <div class="ligne">
                <div style="flex:1;min-width:220px">
                  <div>${b.libelle}</div>
                  <div class="small muted">${b.unite}
                    ${b.maj_le ? ' · révisé le ' + jour(b.maj_le) : ''}</div>
                </div>
                <div class="row" style="gap:8px">
                  <input type="number" min="0" max="500" defaultValue=${b.points}
                    style="width:90px;text-align:right"
                    onBlur=${e=>reglerPoints(b.cle, e.target.value)} />
                  <span class="small muted">points</span>
                </div>
              </div>`)}
          </div>
          <div class="panneau" style="margin-top:24px">
            <div class="tete"><h3 style="font-size:17px">Paliers d\u2019échelon</h3></div>
            <div class="corps small muted">
              Les seuils se règlent dans la table <span class="mono">echelons</span>.
              Modifier un seuil ne rétrograde jamais personne : un échelon acquis
              reste acquis jusqu\u2019à décision motivée.
            </div>
          </div>
        </div>`}

      ${onglet === 'historique' && html`
        <div class="panneau">
          ${promos.length === 0
            ? html`<div class="vide">Aucune promotion arrêtée.</div>`
            : promos.map(x => {
              const m = classement.find(c => c.profil_id === x.profil_id);
              return html`
                <div class="ligne">
                  <div style="flex:1;min-width:220px">
                    <div>${m ? m.membre : 'Membre'} — échelon ${x.ancien} → ${x.nouveau}</div>
                    <div class="small muted">${x.motif}</div>
                  </div>
                  <div class="row">
                    <span class="tag or">${x.points} pts</span>
                    <span class="small muted">${jour(x.cree_le)}</span>
                  </div>
                </div>`;
            })}
        </div>`}
    </div>`;
}


/* =====================================================================
   VIE STATUTAIRE
   Un mandat électif n'est pas une fonction opérationnelle. Le mandat
   vient du vote et a un terme ; la fonction vient de la nomination et
   se retire par décision.
   ===================================================================== */

const PHASES = ['annoncee','candidatures','scrutin','depouillement','proclamee'];
const PHASE_NOM = { annoncee:'Convoquée', candidatures:'Appel à candidatures',
  scrutin:'Scrutin ouvert', depouillement:'Dépouillement', proclamee:'Proclamée',
  annulee:'Annulée' };
const TYPE_AG = { constitutive:'Constitutive', ordinaire:'Ordinaire',
                  extraordinaire:'Extraordinaire' };

function Assemblees({ p }){
  const [liste, setListe] = useState(null);
  const [ouverte, setOuverte] = useState(null);
  const [creation, setCreation] = useState(false);
  const [terr, setTerr] = useState([]);
  const [renouveler, setRenouveler] = useState([]);
  const [f, setF] = useState({territoire:'', titre:'', type:'ordinaire', date:'',
    lieu:'', ordre:'', cloture_cand:'', ouverture_scrutin:'', cloture_scrutin:'',
    quorum:'25', duree:'3'});
  const [msg, setMsg] = useState('');

  const organise = p.niveau >= 60 || (p.postes||[]).length > 0;

  const charger = useCallback(async () => {
    const [a, b, c] = await Promise.all([
      db.rpc('mes_assemblees'),
      db.from('territoires').select('id,nom,echelle').eq('actif',true).order('echelle').order('nom'),
      db.rpc('mandats_a_renouveler')
    ]);
    setListe(a.data||[]); setTerr(b.data||[]); setRenouveler(c.data||[]);
  }, []);
  useEffect(() => { charger(); }, [charger]);

  async function creer(e){
    e.preventDefault();
    const { data, error } = await db.rpc('creer_assemblee', {
      p_territoire: f.territoire, p_titre: f.titre, p_type: f.type,
      p_date: f.date, p_lieu: f.lieu || null, p_ordre_du_jour: f.ordre || null,
      p_cloture_cand: f.cloture_cand || null,
      p_ouverture_scrutin: f.ouverture_scrutin || null,
      p_cloture_scrutin: f.cloture_scrutin || null,
      p_quorum: Number(f.quorum||0), p_duree: Number(f.duree||3)
    });
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data.ok) return setMsg('Erreur : ' + data.message);
    setCreation(false); setMsg('Assemblée convoquée. L\u2019appel à candidatures est ouvert.');
    charger(); setOuverte(data.id);
  }

  if (!liste) return html`<div class="vide">Chargement…</div>`;
  if (ouverte) return html`<${Assemblee} p=${p} id=${ouverte}
    fermer=${()=>{ setOuverte(null); charger(); }} />`;

  const enCours = liste.filter(x => x.statut !== 'proclamee' && x.statut !== 'annulee');
  const passees = liste.filter(x => x.statut === 'proclamee' || x.statut === 'annulee');
  const aFaire = liste.filter(x =>
    (x.statut === 'candidatures' && x.electeur && !x.ma_candidature) ||
    (x.statut === 'scrutin' && x.electeur && !x.a_vote));

  const ligne = x => html`
    <div class="ligne" style="cursor:pointer" onClick=${()=>setOuverte(x.id)}>
      <div style="flex:1;min-width:230px">
        <div class="row" style="gap:8px">
          <span>${x.titre}</span>
          ${x.type === 'constitutive' && html`<span class="tag or">Constitutive</span>`}
        </div>
        <div class="small muted">
          <span class="mono">${x.reference}</span> · ${x.territoire}
          · ${new Date(x.date_tenue).toLocaleDateString('fr-FR',
              {day:'numeric',month:'long',year:'numeric'})}
          ${x.lieu ? ' · ' + x.lieu : ''}
        </div>
        <div class="small muted">
          ${x.candidats} candidature${x.candidats>1?'s':''}
          ${x.inscrits ? ' · ' + x.votants + '/' + x.inscrits + ' votants' : ''}
        </div>
      </div>
      <div class="row">
        ${x.statut === 'scrutin' && x.electeur && !x.a_vote && html`
          <span class="tag rouge">À voter</span>`}
        ${x.a_vote && html`<span class="tag vert">Vous avez voté</span>`}
        ${x.ma_candidature && html`<span class="tag bleu">Candidat</span>`}
        <span class="tag">${PHASE_NOM[x.statut]}</span>
      </div>
    </div>`;

  return html`
    <div>
      <div class="spread">
        <div>
          <div class="eyebrow">Vie statutaire</div>
          <h1 style="margin:6px 0 0">Assemblées et mandats</h1>
        </div>
        ${organise && html`<button class="btn" onClick=${()=>setCreation(c=>!c)}>
          ${creation ? 'Annuler' : 'Convoquer une assemblée'}</button>`}
      </div>
      <p class="muted" style="max-width:60ch;margin-top:12px">
        Un mandat électif vient du vote des adhérents et a un terme fixé par les
        statuts. Il ne se retire pas par décision : il s\u2019éteint, ou une
        nouvelle assemblée le renouvelle.
      </p>
      ${msg && html`<div class=${'alerte '+(msg.startsWith('Erreur')?'err':'ok')}
        style="margin-top:16px">${msg}</div>`}

      ${aFaire.length > 0 && html`
        <div class="alerte" style="margin-top:24px;border-left-color:var(--bordeaux)">
          ${aFaire.length} assemblée${aFaire.length>1?'s':''} attend
          ${aFaire.length>1?'ent':''} votre participation.
        </div>`}

      ${renouveler.length > 0 && organise && html`
        <div class="panneau" style="margin-top:24px;border-color:var(--brun)">
          <div class="tete" style="border-bottom-color:var(--brun)">
            <h3 style="font-size:17px">Mandats arrivant à terme</h3>
            <span class="tag or">${renouveler.length}</span>
          </div>
          ${renouveler.map(m => html`
            <div class="ligne">
              <div>
                <div>${m.membre} — ${m.poste_nom}</div>
                <div class="small muted">${m.territoire || 'National'}
                  · mandat du ${jour(m.debut)} au ${jour(m.fin)}</div>
              </div>
              <span class=${'tag '+(m.jours_restants < 0 ? 'rouge' : 'or')}>
                ${m.jours_restants < 0
                  ? 'Échu depuis ' + Math.abs(m.jours_restants) + ' j'
                  : m.jours_restants + ' jours'}</span>
            </div>`)}
        </div>`}

      ${creation && html`
        <form onSubmit=${creer} class="panneau" style="margin-top:24px">
          <div class="tete"><h3 style="font-size:17px">Convocation</h3></div>
          <div class="corps stack">
            <div class="row" style="gap:16px;align-items:flex-start">
              <div class="field" style="flex:2;min-width:200px;margin:0"><label>Structure</label>
                <select required value=${f.territoire}
                  onChange=${e=>setF(o=>({...o,territoire:e.target.value}))}>
                  <option value="">Choisir…</option>
                  ${terr.map(t => html`<option value=${t.id}>${t.nom} (${t.echelle})</option>`)}
                </select></div>
              <div class="field" style="flex:1;min-width:170px;margin:0"><label>Nature</label>
                <select value=${f.type} onChange=${e=>setF(o=>({...o,type:e.target.value}))}>
                  ${Object.entries(TYPE_AG).map(([k,v]) => html`<option value=${k}>${v}</option>`)}
                </select></div>
            </div>
            <div class="field"><label>Intitulé</label>
              <input required value=${f.titre}
                onInput=${e=>setF(o=>({...o,titre:e.target.value}))}
                placeholder="Assemblée générale constitutive de l\u2019unité locale de Foix" /></div>
            <div class="field"><label>Ordre du jour</label>
              <textarea value=${f.ordre}
                onInput=${e=>setF(o=>({...o,ordre:e.target.value}))} /></div>
            <div class="row" style="gap:16px;align-items:flex-start">
              <div class="field" style="flex:1;min-width:190px;margin:0"><label>Date de tenue</label>
                <input type="datetime-local" required value=${f.date}
                  onInput=${e=>setF(o=>({...o,date:e.target.value}))} /></div>
              <div class="field" style="flex:1;min-width:190px;margin:0"><label>Lieu</label>
                <input value=${f.lieu} onInput=${e=>setF(o=>({...o,lieu:e.target.value}))} /></div>
            </div>
            <div class="row" style="gap:16px;align-items:flex-start">
              <div class="field" style="flex:1;min-width:170px;margin:0">
                <label>Clôture des candidatures</label>
                <input type="date" value=${f.cloture_cand}
                  onInput=${e=>setF(o=>({...o,cloture_cand:e.target.value}))} /></div>
              <div class="field" style="flex:1;min-width:190px;margin:0">
                <label>Clôture du scrutin</label>
                <input type="datetime-local" value=${f.cloture_scrutin}
                  onInput=${e=>setF(o=>({...o,cloture_scrutin:e.target.value}))} /></div>
            </div>
            <div class="row" style="gap:16px;align-items:flex-start">
              <div class="field" style="flex:1;min-width:150px;margin:0">
                <label>Quorum requis (%)</label>
                <input type="number" min="0" max="100" value=${f.quorum}
                  onInput=${e=>setF(o=>({...o,quorum:e.target.value}))} /></div>
              <div class="field" style="flex:1;min-width:150px;margin:0">
                <label>Durée du mandat (ans)</label>
                <input type="number" min="1" max="6" value=${f.duree}
                  onInput=${e=>setF(o=>({...o,duree:e.target.value}))} /></div>
            </div>
            <div><button class="btn">Convoquer</button></div>
            <p class="small muted">
              Un quorum non atteint interdit la proclamation. Fixez-le selon vos
              statuts — 25 % est un usage courant pour une unité locale.
            </p>
          </div>
        </form>`}

      <div class="panneau" style="margin-top:24px">
        <div class="tete"><h3 style="font-size:17px">En cours</h3>
          <span class="tag">${enCours.length}</span></div>
        ${enCours.length === 0
          ? html`<div class="vide">Aucune assemblée en cours.</div>`
          : enCours.map(ligne)}
      </div>

      ${passees.length > 0 && html`
        <div class="panneau" style="margin-top:24px">
          <div class="tete"><h3 style="font-size:17px">Archives</h3></div>
          ${passees.map(ligne)}
        </div>`}
    </div>`;
}

function Assemblee({ p, id, fermer }){
  const [a, setA] = useState(null);
  const [cands, setCands] = useState([]);
  const [corps, setCorps] = useState([]);
  const [dep, setDep] = useState(null);
  const [choix, setChoix] = useState({});
  const [foi, setFoi] = useState('');
  const [postePostule, setPostePostule] = useState('');
  const [postes, setPostes] = useState([]);
  const [msg, setMsg] = useState('');

  const organise = p.niveau >= 60 || (p.postes||[]).length > 0;

  const charger = useCallback(async () => {
    const [l, c, e, d, po] = await Promise.all([
      db.rpc('mes_assemblees'),
      db.from('candidatures').select('*').eq('assemblee_id', id),
      db.rpc('corps_electoral', { p_assemblee: id }),
      db.rpc('depouillement', { p_assemblee: id }),
      db.from('postes').select('code,nom,description').eq('actif',true)
    ]);
    setA((l.data||[]).find(x => x.id === id) || null);
    setCorps(e.data||[]); setDep(d.data); setPostes(po.data||[]);

    const cs = c.data || [];
    if (cs.length){
      const { data: gens } = await db.from('v_annuaire')
        .select('id,prenom,nom,matricule,fonction_nom').in('id', cs.map(x=>x.profil_id));
      const m = Object.fromEntries((gens||[]).map(g => [g.id, g]));
      setCands(cs.map(x => ({...x, personne: m[x.profil_id]})));
    } else setCands([]);
  }, [id]);
  useEffect(() => { charger(); }, [charger]);

  if (!a) return html`<div class="vide">Assemblée introuvable.</div>`;
  const i = PHASES.indexOf(a.statut);
  const nomPoste = c => (postes.find(x=>x.code===c)||{}).nom || c;

  async function postuler(e){
    e.preventDefault();
    const { data, error } = await db.rpc('deposer_candidature', {
      p_assemblee: id, p_poste: postePostule, p_profession_foi: foi, p_fichier: null });
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data.ok) return setMsg('Erreur : ' + data.message);
    setFoi(''); setPostePostule(''); setMsg('Candidature déposée.'); charger();
  }

  async function examiner(c, ok){
    const motif = ok ? null : prompt('Motif de l\u2019irrecevabilité (obligatoire)');
    if (!ok && !motif) return;
    const { data, error } = await db.rpc('examiner_candidature',
      { p_id: c.id, p_recevable: ok, p_motif: motif });
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data.ok) return setMsg('Erreur : ' + data.message);
    charger();
  }

  async function phase(st){
    const { data, error } = await db.rpc('changer_phase_assemblee',
      { p_assemblee: id, p_statut: st });
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data.ok) return setMsg('Erreur : ' + data.message);
    setMsg('Phase modifiée.'); charger();
  }

  async function envoyerVote(){
    const postesOuverts = [...new Set(cands.filter(c=>c.statut==='recevable').map(c=>c.poste))];
    if (postesOuverts.some(x => !choix[x]))
      return setMsg('Erreur : exprimez-vous sur chaque poste, ou votez blanc.');
    if (!confirm('Votre vote est définitif. Confirmez-vous ?')) return;
    const { data, error } = await db.rpc('voter', { p_assemblee: id, p_choix: choix });
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data.ok) return setMsg('Erreur : ' + data.message);
    setMsg('Vote enregistré. Merci.'); charger();
  }

  async function proclamerResultats(){
    const pv = prompt('Procès-verbal (obligatoire)\n\nRésumé des opérations, incidents éventuels, résultats.');
    if (!pv) return;
    const { data, error } = await db.rpc('proclamer',
      { p_assemblee: id, p_pv: pv, p_pv_fichier: null });
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data.ok) return setMsg('Erreur : ' + data.message);
    setMsg(data.elus + ' mandat(s) proclamé(s), jusqu\u2019au ' + jour(data.fin_mandat) + '.');
    charger();
  }

  const lienPublic = location.origin + location.pathname + '#/appel/' + a.public_token;
  const recevables = cands.filter(c => c.statut === 'recevable');
  const postesOuverts = [...new Set(recevables.map(c => c.poste))];

  return html`
    <div>
      <button class="lien-discret" onClick=${fermer}>← Toutes les assemblées</button>
      <div class="spread" style="margin-top:12px">
        <div>
          <h1 style="font-size:28px">${a.titre}</h1>
          <div class="small muted" style="margin-top:4px">
            <span class="mono">${a.reference}</span> · ${a.territoire}
            · ${new Date(a.date_tenue).toLocaleString('fr-FR',
                {day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'})}
            ${a.lieu ? ' · ' + a.lieu : ''}
          </div>
        </div>
        <span class="tag">${PHASE_NOM[a.statut]}</span>
      </div>
      ${msg && html`<div class=${'alerte '+(msg.startsWith('Erreur')?'err':'ok')}
        style="margin-top:16px">${msg}</div>`}

      <div class="panneau" style="margin-top:24px"><div class="corps">
        <div class="row" style="gap:0;flex-wrap:nowrap;overflow-x:auto">
          ${PHASES.map((ph, n) => html`
            <div style=${'flex:1;min-width:96px;padding-right:8px;'+(n<=i?'':'opacity:.35')}>
              <div style=${'height:3px;background:'+(n<=i?'var(--bleu)':'var(--filet)')}></div>
              <div class="small" style="margin-top:6px;line-height:1.3">${PHASE_NOM[ph]}</div>
            </div>`)}
        </div>
      </div></div>

      ${organise && html`
        <div class="panneau" style="margin-top:24px">
          <div class="tete"><h3 style="font-size:17px">Appel public</h3></div>
          <div class="corps">
            <p class="small muted" style="margin:0 0 10px">
              Ce lien s\u2019ouvre sans compte : diffusez-le pour toucher des
              personnes qui ne sont pas encore sur la plateforme.
            </p>
            <div class="row" style="gap:8px">
              <input readonly value=${lienPublic} style="flex:1;min-width:220px"
                onClick=${e=>e.target.select()} />
              <button class="btn sm light" onClick=${()=>{
                navigator.clipboard.writeText(lienPublic); setMsg('Lien copié.');
              }}>Copier</button>
            </div>
          </div>
          <div class="corps row" style="border-top:1px solid var(--filet);gap:10px">
            ${a.statut === 'candidatures' && html`
              <button class="btn sm" onClick=${()=>phase('scrutin')}>Ouvrir le scrutin</button>`}
            ${a.statut === 'scrutin' && html`
              <button class="btn sm" onClick=${()=>phase('depouillement')}>Clore le scrutin</button>`}
            ${(a.statut === 'depouillement' || a.statut === 'scrutin') && html`
              <button class="btn sm" onClick=${proclamerResultats}>Proclamer</button>`}
          </div>
        </div>`}

      ${a.statut === 'candidatures' && a.electeur && !a.ma_candidature && html`
        <form onSubmit=${postuler} class="panneau" style="margin-top:24px">
          <div class="tete"><h3 style="font-size:17px">Me porter candidat</h3></div>
          <div class="corps stack">
            <div class="field"><label>Poste</label>
              <select required value=${postePostule}
                onChange=${e=>setPostePostule(e.target.value)}>
                <option value="">Choisir…</option>
                ${postes.filter(x => x.code.endsWith('_structure')).map(x =>
                  html`<option value=${x.code}>${x.nom}</option>`)}
              </select></div>
            <div class="field"><label>Profession de foi</label>
              <textarea required value=${foi} style="min-height:140px"
                onInput=${e=>setFoi(e.target.value)}
                placeholder="Ce que vous voulez faire, pourquoi, et ce que vous savez faire." /></div>
            <div><button class="btn">Déposer ma candidature</button></div>
            <p class="small muted">
              Elle sera visible des électeurs et sur l\u2019appel public, sous la
              forme « Prénom N. ».
            </p>
          </div>
        </form>`}

      <div class="panneau" style="margin-top:24px">
        <div class="tete"><h3 style="font-size:17px">Candidatures</h3>
          <span class="tag">${cands.length}</span></div>
        ${cands.length === 0
          ? html`<div class="vide">Aucune candidature déposée.</div>`
          : cands.map(c => html`
            <div class="ligne" style="align-items:flex-start">
              <div style="flex:1;min-width:230px">
                <div class="row" style="gap:8px">
                  <strong>${c.personne ? nomComplet(c.personne) : 'Membre'}</strong>
                  <span class="tag">${nomPoste(c.poste)}</span>
                </div>
                <p class="small" style="margin:8px 0 0;white-space:pre-wrap;max-width:60ch">
                  ${c.profession_foi}</p>
                ${c.motif && html`<p class="small" style="margin:6px 0 0;color:var(--bordeaux)">
                  ${c.motif}</p>`}
              </div>
              <div class="row">
                <span class=${'tag '+(c.statut==='elue'?'vert':
                  c.statut==='recevable'?'bleu':c.statut==='irrecevable'?'rouge':'')}>
                  ${c.statut}</span>
                ${organise && c.statut === 'deposee' && html`
                  <button class="btn sm" onClick=${()=>examiner(c,true)}>Recevable</button>
                  <button class="btn sm light" onClick=${()=>examiner(c,false)}>Écarter</button>`}
              </div>
            </div>`)}
      </div>

      ${a.statut === 'scrutin' && a.electeur && !a.a_vote && postesOuverts.length > 0 && html`
        <div class="panneau" style="margin-top:24px;border-color:var(--bordeaux)">
          <div class="tete" style="border-bottom-color:var(--bordeaux)">
            <h3 style="font-size:17px">Votre bulletin</h3>
          </div>
          <div class="corps">
            <p class="small muted" style="margin:0 0 16px">
              Votre vote est secret : la plateforme enregistre que vous avez voté,
              et ce qui a été voté, mais jamais le lien entre les deux.
            </p>
            ${postesOuverts.map(po => html`
              <div style="margin-bottom:20px;padding-bottom:16px;
                   border-bottom:1px solid var(--filet)">
                <div class="eyebrow" style="margin-bottom:10px">${nomPoste(po)}</div>
                ${recevables.filter(c => c.poste === po).map(c => html`
                  <label class="row" style="text-transform:none;letter-spacing:0;
                      font-size:15px;color:var(--nuit);padding:7px 0;margin:0;cursor:pointer">
                    <input type="radio" style="width:auto" name=${'p_'+po}
                      checked=${choix[po] === c.id}
                      onChange=${()=>setChoix(o=>({...o,[po]:c.id}))} />
                    <span>${c.personne ? nomComplet(c.personne) : 'Candidat'}</span>
                  </label>`)}
                <label class="row" style="text-transform:none;letter-spacing:0;
                    font-size:15px;color:var(--gris);padding:7px 0;margin:0;cursor:pointer">
                  <input type="radio" style="width:auto" name=${'p_'+po}
                    checked=${choix[po] === 'blanc'}
                    onChange=${()=>setChoix(o=>({...o,[po]:'blanc'}))} />
                  <span>Voter blanc</span>
                </label>
              </div>`)}
            <button class="btn" onClick=${envoyerVote}>Déposer mon bulletin</button>
            <p class="small muted" style="margin:10px 0 0">Le vote est définitif.</p>
          </div>
        </div>`}

      ${dep && (a.statut === 'depouillement' || a.statut === 'proclamee' || organise) && html`
        <div class="panneau" style="margin-top:24px">
          <div class="tete"><h3 style="font-size:17px">Participation</h3>
            <span class=${'tag '+(dep.quorum_atteint?'vert':'rouge')}>
              ${dep.quorum_atteint ? 'Quorum atteint' : 'Quorum non atteint'}</span></div>
          <div class="ligne"><span class="muted">Inscrits</span>
            <span class="mono">${dep.inscrits}</span></div>
          <div class="ligne"><span class="muted">Votants</span>
            <span class="mono">${dep.votants}</span></div>
          <div class="ligne"><span class="muted">Participation</span>
            <span class="mono">${dep.participation} %
              ${dep.quorum_requis > 0 ? ' (quorum ' + dep.quorum_requis + ' %)' : ''}</span></div>
        </div>`}

      ${dep && Object.keys(dep.resultats||{}).length > 0 &&
        (a.statut === 'depouillement' || a.statut === 'proclamee') && html`
        <div class="panneau" style="margin-top:24px">
          <div class="tete"><h3 style="font-size:17px">Résultats</h3></div>
          <div class="corps">
            ${Object.entries(dep.resultats).map(([po, lignes]) => {
              const total = lignes.reduce((n,x)=>n+x.voix,0) || 1;
              return html`
                <div style="margin-bottom:22px">
                  <div class="eyebrow" style="margin-bottom:10px">${po}</div>
                  ${lignes.map((x, n) => html`
                    <div style="padding:6px 0">
                      <div class="spread small">
                        <span>${n===0 && a.statut==='proclamee'
                          ? html`<strong>${x.nom}</strong>` : x.nom}</span>
                        <span class="mono">${x.voix} voix · ${Math.round(x.voix/total*100)} %</span>
                      </div>
                      <div class="jauge" style="margin-top:5px">
                        <i style=${'width:'+Math.round(x.voix/total*100)+'%;background:'+
                          (x.candidature_id ? 'var(--bleu)' : 'var(--gris-bleu)')}></i></div>
                    </div>`)}
                </div>`;
            })}
          </div>
        </div>`}

      ${a.statut === 'scrutin' && a.electeur && html`
        <div class="panneau" style="margin-top:24px">
          <div class="tete"><h3 style="font-size:17px">Émargement</h3>
            <span class="tag">${corps.filter(c=>c.a_vote).length}/${corps.length}</span></div>
          <div class="corps">
            <div class="row" style="gap:6px">
              ${corps.map(c => html`
                <span class=${'tag '+(c.a_vote?'vert':'')}>${c.membre}</span>`)}
            </div>
            <p class="small muted" style="margin:12px 0 0">
              L\u2019émargement est ouvert au corps électoral : chacun doit pouvoir
              vérifier le quorum. Le contenu des bulletins, lui, n\u2019est
              accessible à personne.
            </p>
          </div>
        </div>`}
    </div>`;
}

/* --- L'appel public, hors connexion ----------------------------------- */
function AppelPublic({ token }){
  const [a, setA] = useState(undefined);
  useEffect(() => {
    db.rpc('appel_public', { p_token: token }).then(({data}) => setA(data || null));
  }, [token]);

  if (a === undefined) return html`<div class="vide" style="padding:120px">Chargement…</div>`;
  if (!a) return html`
    <section class="bloc blanc"><div class="wrap">
      <h1>Appel introuvable</h1>
      <p style="margin-top:16px">Ce lien n\u2019est plus valide.
        <a href="#/">Retour à l\u2019accueil</a></p>
    </div></section>`;

  return html`
    <section class="bloc blanc">
      <div class="wrap" style="max-width:780px">
        <div class="eyebrow">Appel à candidatures</div>
        <h1 style="margin:8px 0 12px">${a.titre}</h1>
        <p class="muted">${a.chemin || a.territoire}
          · <span class="mono">${a.reference}</span></p>

        <div class="panneau" style="margin-top:32px">
          <div class="tete"><h3 style="font-size:17px">L\u2019assemblée</h3>
            <span class="tag">${PHASE_NOM[a.statut] || a.statut}</span></div>
          <div class="ligne"><span class="muted">Date</span>
            <span>${new Date(a.date_tenue).toLocaleString('fr-FR',
              {day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'})}</span></div>
          ${a.lieu && html`<div class="ligne"><span class="muted">Lieu</span>
            <span>${a.lieu}</span></div>`}
          ${a.cloture && html`<div class="ligne"><span class="muted">Dépôt des candidatures</span>
            <span>jusqu\u2019au ${jour(a.cloture)}</span></div>`}
          <div class="ligne"><span class="muted">Durée des mandats</span>
            <span>${a.duree_mandat} an${a.duree_mandat>1?'s':''}</span></div>
        </div>

        ${a.ordre_du_jour && html`
          <div class="panneau" style="margin-top:24px">
            <div class="tete"><h3 style="font-size:17px">Ordre du jour</h3></div>
            <div class="corps" style="white-space:pre-wrap">${a.ordre_du_jour}</div>
          </div>`}

        <div class="panneau" style="margin-top:24px">
          <div class="tete"><h3 style="font-size:17px">Postes à pourvoir</h3></div>
          ${(a.postes||[]).map(x => html`
            <div class="ligne">
              <div><div>${x.nom}</div>
                <div class="small muted" style="max-width:52ch">${x.description||''}</div></div>
            </div>`)}
        </div>

        ${(a.candidats||[]).length > 0 && html`
          <div class="panneau" style="margin-top:24px">
            <div class="tete"><h3 style="font-size:17px">Candidatures déclarées</h3></div>
            ${a.candidats.map(c => html`
              <div class="ligne" style="align-items:flex-start">
                <div>
                  <div class="row" style="gap:8px">
                    <strong>${c.nom}</strong><span class="tag">${c.poste}</span>
                  </div>
                  <p class="small muted" style="margin:8px 0 0;white-space:pre-wrap;max-width:56ch">
                    ${c.profession_foi}</p>
                </div>
              </div>`)}
          </div>`}

        ${a.resultats && html`
          <div class="panneau" style="margin-top:24px;border-color:var(--bleu)">
            <div class="tete" style="border-bottom-color:var(--bleu)">
              <h3 style="font-size:17px">Résultats proclamés</h3></div>
            ${a.resultats.map(r => html`
              <div class="ligne">
                <div><div>${r.poste}</div>
                  <div class="small muted">Mandat jusqu\u2019au ${jour(r.fin)}</div></div>
                <strong>${r.elu}</strong>
              </div>`)}
          </div>`}

        <div class="panneau" style="margin-top:32px">
          <div class="corps">
            <h3 style="font-size:17px;margin-bottom:8px">Vous voulez vous présenter ?</h3>
            <p class="small muted">
              Seuls les membres actifs rattachés à ce territoire peuvent déposer
              une candidature. Si vous n\u2019êtes pas encore adhérent, c\u2019est le
              moment.
            </p>
            <div class="row" style="margin-top:16px">
              <a class="btn" href="#/inscription">Adhérer à la fédération</a>
              <a class="btn ghost" href="#/espace">J\u2019ai déjà un compte</a>
            </div>
          </div>
        </div>
      </div>
    </section>`;
}


/* =====================================================================
   PARCOURS ADHÉRENT
   Six marches, de l'inscription à la première mission. Chacune est
   datée par le système quand il peut la constater.
   ===================================================================== */

function ParcoursAdherent({ p }){
  const [onglet, setOnglet] = useState('accueillir');
  const [liste, setListe] = useState([]);
  const [tunnel, setTunnel] = useState(null);
  const [creneaux, setCreneaux] = useState([]);
  const [rdv, setRdv] = useState([]);
  const [msg, setMsg] = useState('');

  const charger = useCallback(async () => {
    const [a,b,c,d] = await Promise.all([
      db.rpc('nouveaux_a_accueillir_maj', { p_territoire: null }),
      db.rpc('tunnel_benevole', { p_territoire: null, p_mois: 6 }),
      db.from('creneaux').select('*').eq('hote_id', p.id).is('annule_le', null)
        .gte('debut', new Date().toISOString()).order('debut'),
      db.rpc('mes_rendez_vous')
    ]);
    setListe(a.data||[]); setTunnel(b.data);
    setCreneaux(c.data||[]); setRdv(d.data||[]);
  }, [p.id]);
  useEffect(() => { charger(); }, [charger]);

  const enRetard = liste.filter(x => x.jours > 14);

  return html`
    <div>
      <div class="eyebrow">Parcours adhérent</div>
      <h1 style="margin:6px 0 8px">Accueillir</h1>
      <p class="muted" style="max-width:60ch">
        Personne ne doit se perdre entre l\u2019inscription et la première mission.
        Chaque étape se date d\u2019elle-même quand le système peut la constater.
      </p>
      ${msg && html`<div class=${'alerte '+(msg.startsWith('Erreur')?'err':'ok')}
        style="margin-top:16px">${msg}</div>`}

      <div class="chiffres" style="margin:24px 0">
        <div><div class="n" style="font-size:30px">${liste.length}</div>
          <div class="l">À accompagner</div></div>
        <div><div class="n" style="font-size:30px">${enRetard.length}</div>
          <div class="l">Sans réponse depuis 15 j</div></div>
        <div><div class="n" style="font-size:30px">
          ${rdv.filter(r=>!r.passe).length}</div>
          <div class="l">Rendez-vous à venir</div></div>
        <div><div class="n" style="font-size:30px">
          ${tunnel && tunnel.retention_6m !== null ? tunnel.retention_6m + ' %' : '—'}</div>
          <div class="l">Encore là à six mois</div></div>
      </div>

      <div class="row" style="margin:0 0 24px;gap:0;border-bottom:1px solid var(--filet)">
        ${[['accueillir','À accompagner'],['rdv','Rendez-vous'],
           ['creneaux','Mes disponibilités'],['tunnel','Le tunnel']]
          .map(([k,t]) => html`
          <button class="btn light" style=${'border:0;border-bottom:2px solid '+
            (onglet===k?'var(--bordeaux)':'transparent')+';border-radius:0;background:transparent'}
            onClick=${()=>setOnglet(k)}>${t}</button>`)}
      </div>

      ${onglet === 'accueillir' && html`<${FileAccueil} liste=${liste}
        recharger=${charger} setMsg=${setMsg} />`}

      ${onglet === 'rdv' && html`
        <div class="panneau">
          ${rdv.length === 0
            ? html`<div class="vide">Aucun rendez-vous.</div>`
            : rdv.map(r => html`
              <div class="ligne">
                <div>
                  <div>${r.avec} <span class="small muted">${r.avec_fonction||''}</span></div>
                  <div class="small muted">
                    ${new Date(r.debut).toLocaleString('fr-FR',
                      {weekday:'long',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'})}
                    · ${r.duree_min} min
                    ${r.lieu ? ' · ' + r.lieu : ''}
                  </div>
                  ${r.visio && html`<a class="small" href=${r.visio}
                    target="_blank" rel="noopener">Rejoindre en visioconférence ↗</a>`}
                </div>
                <div class="row">
                  ${r.passe
                    ? html`<span class="tag">Passé</span>`
                    : html`<button class="btn sm light" onClick=${async ()=>{
                        const m = prompt('Motif de l\u2019annulation') || '';
                        await db.rpc('annuler_creneau', { p_creneau: r.id, p_motif: m });
                        charger();
                      }}>Annuler</button>`}
                </div>
              </div>`)}
        </div>`}

      ${onglet === 'creneaux' && html`<${MesCreneaux} p=${p} creneaux=${creneaux}
        recharger=${charger} setMsg=${setMsg} />`}

      ${onglet === 'tunnel' && tunnel && html`<${Tunnel} t=${tunnel} />`}
    </div>`;
}


/* --- La file d'accueil -------------------------------------------------
   Une ligne, une action évidente. Ce qui n'a pas eu de nouvelles depuis
   une semaine remonte en tête, et on peut agir sur plusieurs personnes
   d'un coup : le suivi ne doit pas coûter plus cher que le geste qu'il
   enregistre.
   --------------------------------------------------------------------- */
function FileAccueil({ liste, recharger, setMsg }){
  const [choisis, setChoisis] = useState([]);
  const [ouvert, setOuvert] = useState(null);

  const basculer = id => setChoisis(c =>
    c.includes(id) ? c.filter(x => x !== id) : [...c, id]);

  async function agir(id, action, texte){
    const { data, error } = await db.rpc('agir_parcours',
      { p_profil: id, p_action: action, p_texte: texte || null });
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data.ok) return setMsg('Erreur : ' + data.message);
    setMsg('Enregistré.'); recharger();
  }

  async function agirGroupe(action, texte){
    if (choisis.length === 0) return;
    const { data, error } = await db.rpc('agir_parcours_groupe',
      { p_profils: choisis, p_action: action, p_texte: texte || null });
    if (error) return setMsg('Erreur : ' + error.message);
    setMsg(data.traites + ' membre(s) traité(s)' +
           (data.echecs ? ', ' + data.echecs + ' hors périmètre' : '') + '.');
    setChoisis([]); recharger();
  }

  const urgents = liste.filter(x => x.sans_nouvelles);

  return html`
    <div>
      ${urgents.length > 0 && html`
        <div class="alerte" style="margin-bottom:16px;border-left-color:var(--bordeaux)">
          ${urgents.length} personne${urgents.length>1?'s':''} sans nouvelles depuis
          plus d\u2019une semaine.
        </div>`}

      ${choisis.length > 0 && html`
        <div class="panneau" style="margin-bottom:16px;border-color:var(--action)">
          <div class="corps row" style="gap:10px">
            <span class="small"><strong>${choisis.length}</strong> sélectionné${choisis.length>1?'s':''}</span>
            <button class="btn sm" onClick=${()=>agirGroupe('prendre_en_charge')}>
              Je m\u2019en charge</button>
            <button class="btn sm light" onClick=${()=>{
              const t = prompt('Note commune (facultatif)');
              if (t !== null) agirGroupe('contact', t);
            }}>Marquer contactés</button>
            <button class="btn sm light" onClick=${()=>{
              const t = prompt('Objet de la relance (facultatif)');
              if (t !== null) agirGroupe('relancer', t);
            }}>Relancer</button>
            <button class="btn sm light" onClick=${()=>setChoisis([])}>Désélectionner</button>
          </div>
        </div>`}

      <div class="panneau">
        <div class="tete">
          <label class="row" style="text-transform:none;letter-spacing:0;margin:0;
              font-size:13px;color:var(--gris);cursor:pointer">
            <input type="checkbox" style="width:auto"
              checked=${choisis.length === liste.length && liste.length > 0}
              onChange=${e=>setChoisis(e.target.checked ? liste.map(x=>x.profil_id) : [])} />
            <span>Tout sélectionner</span>
          </label>
          <span class="tag">${liste.length}</span>
        </div>

        ${liste.length === 0
          ? html`<div class="vide">Personne n\u2019attend. C\u2019est bon signe.</div>`
          : liste.map(x => html`
            <div style=${'border-bottom:1px solid var(--filet);'+
                 (x.sans_nouvelles ? 'border-left:3px solid var(--bordeaux)' : '')}>
              <div class="ligne" style="border:0;align-items:flex-start">
                <input type="checkbox" style="width:auto;margin-top:4px"
                  checked=${choisis.includes(x.profil_id)}
                  onChange=${()=>basculer(x.profil_id)} />

                <div style="flex:1;min-width:230px;cursor:pointer"
                  onClick=${()=>setOuvert(ouvert===x.profil_id?null:x.profil_id)}>
                  <div class="row" style="gap:8px">
                    <strong>${x.membre}</strong>
                    <span class="tag">${x.etape_rang}/6 · ${x.etape}</span>
                    ${x.sans_nouvelles && html`
                      <span class="tag rouge">${x.jours} j sans contact</span>`}
                  </div>
                  <div class="small muted" style="margin-top:4px">
                    ${x.territoire || 'sans territoire'} · inscrit le ${jour(x.inscrit_le)}
                    ${x.referent ? ' · suivi par ' + x.referent : ''}
                  </div>
                  <div style="display:flex;gap:3px;margin-top:8px;max-width:220px">
                    ${[1,2,3,4,5,6].map(n => html`
                      <div style=${'height:4px;flex:1;background:'+
                        (n <= x.etape_rang ? 'var(--bleu)' : 'var(--filet)')}></div>`)}
                  </div>
                  ${x.prochaine_action && html`
                    <div class="small" style="margin-top:8px;color:var(--action)">
                      → ${x.prochaine_action}</div>`}
                </div>

                <div class="row" style="gap:6px">
                  ${x.email && html`<a class="btn sm light"
                    href=${'mailto:'+x.email+'?subject='+encodeURIComponent(
                      'Bienvenue à la FFCE')}
                    onClick=${()=>agir(x.profil_id,'contact','courriel envoyé')}>
                    Écrire</a>`}
                  ${x.telephone && html`<a class="btn sm light"
                    href=${'tel:'+x.telephone.replace(/\s/g,'')}
                    onClick=${()=>agir(x.profil_id,'contact','appel téléphonique')}>
                    Appeler</a>`}
                  ${x.etape_rang === 2 && html`<button class="btn sm"
                    onClick=${()=>agir(x.profil_id,'valider')}>Valider l\u2019adhésion</button>`}
                  ${!x.referent && html`<button class="btn sm light"
                    onClick=${()=>agir(x.profil_id,'prendre_en_charge')}>
                    Je m\u2019en charge</button>`}
                </div>
              </div>

              ${ouvert === x.profil_id && html`
                <div class="corps" style="background:var(--papier);padding-top:0">
                  <div class="row" style="gap:24px;align-items:flex-start;
                       padding-top:16px;border-top:1px solid var(--filet)">
                    <div style="flex:1;min-width:200px">
                      <div class="eyebrow" style="margin-bottom:8px">Coordonnées</div>
                      <div class="small"><span class="mono">${x.matricule}</span></div>
                      <div class="small">${x.email}</div>
                      ${x.telephone && html`<div class="small">${x.telephone}</div>`}
                    </div>
                    <div style="flex:1;min-width:200px">
                      <div class="eyebrow" style="margin-bottom:8px">Dossier</div>
                      <div class="jauge" style="margin:0;height:5px">
                        <i style=${'width:'+x.completude+'%;background:'+
                          (x.completude===100?'var(--valide)':'var(--brun)')}></i></div>
                      <div class="small muted" style="margin-top:6px">
                        ${x.completude} %${x.manques ? ' — manque ' + x.manques : ' — complet'}
                      </div>
                    </div>
                  </div>
                  ${x.rdv_le && html`<p class="small" style="margin:14px 0 0">
                    Rendez-vous le ${new Date(x.rdv_le).toLocaleString('fr-FR',
                      {weekday:'long',day:'numeric',month:'long',
                       hour:'2-digit',minute:'2-digit'})}</p>`}
                  ${x.notes && html`
                    <div style="margin-top:14px">
                      <div class="eyebrow" style="margin-bottom:6px">Suivi</div>
                      <div class="small" style="white-space:pre-wrap">${x.notes}</div>
                    </div>`}
                  <div class="row" style="margin-top:16px;gap:8px">
                    <button class="btn sm light" onClick=${()=>{
                      const t = prompt('Ajouter au suivi');
                      if (t) agir(x.profil_id,'contact',t);
                    }}>Ajouter une note</button>
                    <button class="btn sm light" onClick=${()=>{
                      const t = prompt('Pourquoi le parcours s\u2019arrête (obligatoire)');
                      if (t) agir(x.profil_id,'clore',t);
                    }}>Clore le parcours</button>
                  </div>
                </div>`}
            </div>`)}
      </div>
    </div>`;
}

function MesCreneaux({ p, creneaux, recharger, setMsg }){
  const [f, setF] = useState({date:'', heures:'', duree:'30', lieu:'', visio:''});

  async function poser(e){
    e.preventDefault();
    const liste = f.heures.split(',').map(h => h.trim()).filter(Boolean)
      .map(h => new Date(f.date + 'T' + h).toISOString());
    if (liste.length === 0) return setMsg('Erreur : indiquez au moins une heure.');
    const { data, error } = await db.rpc('poser_creneaux', {
      p_creneaux: liste, p_duree: Number(f.duree||30),
      p_lieu: f.lieu || null, p_visio: f.visio || null,
      p_territoire: p.territoire_id || null
    });
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data.ok) return setMsg('Erreur : ' + data.message);
    setF({date:'', heures:'', duree:'30', lieu:'', visio:''});
    setMsg(data.poses + ' créneau(x) posé(s).'); recharger();
  }

  return html`
    <div>
      <form onSubmit=${poser} class="panneau" style="margin-bottom:24px">
        <div class="tete"><h3 style="font-size:17px">Ouvrir des créneaux</h3></div>
        <div class="corps stack">
          <div class="row" style="gap:16px;align-items:flex-start">
            <div class="field" style="flex:1;min-width:160px;margin:0"><label>Jour</label>
              <input type="date" required value=${f.date}
                onInput=${e=>setF(o=>({...o,date:e.target.value}))} /></div>
            <div class="field" style="flex:2;min-width:200px;margin:0"><label>Heures</label>
              <input required value=${f.heures} placeholder="18:00, 18:30, 19:00"
                onInput=${e=>setF(o=>({...o,heures:e.target.value}))} /></div>
            <div class="field" style="flex:0 0 110px;margin:0"><label>Durée</label>
              <input type="number" min="15" step="15" value=${f.duree}
                onInput=${e=>setF(o=>({...o,duree:e.target.value}))} /></div>
          </div>
          <div class="row" style="gap:16px;align-items:flex-start">
            <div class="field" style="flex:1;min-width:180px;margin:0"><label>Lieu</label>
              <input value=${f.lieu} placeholder="Maison des associations"
                onInput=${e=>setF(o=>({...o,lieu:e.target.value}))} /></div>
            <div class="field" style="flex:1;min-width:180px;margin:0"><label>Lien visio</label>
              <input type="url" value=${f.visio}
                onInput=${e=>setF(o=>({...o,visio:e.target.value}))} /></div>
          </div>
          <div><button class="btn">Ouvrir ces créneaux</button></div>
          <p class="small muted">
            Séparez les heures par des virgules. Ils seront proposés aux nouveaux
            adhérents de votre territoire et de ceux qui en dépendent.
          </p>
        </div>
      </form>

      <div class="panneau">
        <div class="tete"><h3 style="font-size:17px">Créneaux ouverts</h3>
          <span class="tag">${creneaux.length}</span></div>
        ${creneaux.length === 0
          ? html`<div class="vide">Aucun créneau ouvert.</div>`
          : creneaux.map(c => html`
            <div class="ligne">
              <div>
                <div>${new Date(c.debut).toLocaleString('fr-FR',
                  {weekday:'long',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'})}</div>
                <div class="small muted">${c.duree_min} min
                  ${c.lieu ? ' · ' + c.lieu : ''}${c.visio ? ' · visioconférence' : ''}</div>
              </div>
              <div class="row">
                ${c.reserve_par
                  ? html`<span class="tag vert">Réservé</span>`
                  : html`<span class="tag">Libre</span>
                    <button class="btn sm light" onClick=${async ()=>{
                      await db.from('creneaux').delete().eq('id', c.id);
                      recharger();
                    }}>Retirer</button>`}
              </div>
            </div>`)}
      </div>
    </div>`;
}

/* --- Le tunnel : chaque marche perdue se voit ------------------------- */
function Tunnel({ t, compact }){
  if (!t || t.erreur) return html`<div class="alerte err">${t?.erreur||'Indisponible.'}</div>`;
  const depart = t.marches[0].n || 1;
  return html`
    <div>
      <div class="panneau">
        <div class="tete">
          <div class="row" style="gap:8px">
            <h3 style="font-size:17px">De l\u2019inscription à la première mission</h3>
            <${Info} texte="Sur les six derniers mois. Chaque marche montre combien de personnes l'ont franchie, et combien s'y sont arrêtées. C'est là qu'il faut agir." />
          </div>
          <span class="small muted">${t.periode_mois} derniers mois</span>
        </div>
        <div class="corps">
          ${t.marches.map(m => {
            const pct = Math.round(m.n / depart * 100);
            return html`
              <div style="margin-bottom:14px">
                <div class="spread small">
                  <span>${m.rang}. ${m.nom}</span>
                  <span>
                    <span class="mono">${m.n}</span>
                    <span class="muted"> · ${pct} %</span>
                    ${m.perte > 0 && html`<span style="color:var(--bordeaux)">
                      · ${m.perte} perdu${m.perte>1?'s':''}</span>`}
                  </span>
                </div>
                <div style="height:22px;background:var(--filet);margin-top:5px;position:relative">
                  <div style=${'height:100%;width:'+pct+'%;background:'+
                    (m.rang===6?'var(--valide)':'var(--bleu)')}></div>
                </div>
              </div>`;
          })}
        </div>
      </div>

      ${!compact && html`
        <div class="panneau" style="margin-top:24px">
          <div class="tete"><h3 style="font-size:17px">Ce que disent les délais</h3></div>
          <div class="ligne"><span class="muted">Délai médian de validation</span>
            <span class="mono">${t.delai_median_validation !== null
              ? t.delai_median_validation + ' jours' : '—'}</span></div>
          <div class="ligne"><span class="muted">Délai médian jusqu\u2019à la formation</span>
            <span class="mono">${t.delai_median_formation !== null
              ? t.delai_median_formation + ' jours' : '—'}</span></div>
          <div class="ligne"><span class="muted">Encore présents à six mois</span>
            <span class="mono">${t.retention_6m !== null
              ? t.retention_6m + ' %' : '—'}
              ${t.cohorte_6m ? html`<span class="muted"> sur ${t.cohorte_6m}</span>` : ''}</span></div>
          <div class="ligne"><span class="muted">Parcours interrompus</span>
            <span class="mono">${t.abandons}</span></div>
        </div>`}
    </div>`;
}

/* =====================================================================
   PILOTAGE DU RÉSEAU
   Trois vues selon l'échelon : local, territorial, national.
   ===================================================================== */
function Pilotage({ p }){
  const national = p.niveau >= 80;
  const [onglet, setOnglet] = useState(national ? 'national' : 'local');

  const vues = [['local','Mon terrain']];
  if (p.niveau >= 50) vues.push(['tunnel','Tunnel du bénévole']);
  if (p.niveau >= 60) vues.push(['structures','Structures']);
  if (national) vues.push(['national','Vue nationale']);

  return html`
    <div>
      <div class="eyebrow">Pilotage</div>
      <h1 style="margin:6px 0 8px">Où le réseau tient, où il lâche</h1>

      <div class="row" style="margin:28px 0 24px;gap:0;border-bottom:1px solid var(--filet)">
        ${vues.map(([k,t]) => html`
          <button class="btn light" style=${'border:0;border-bottom:2px solid '+
            (onglet===k?'var(--bordeaux)':'transparent')+';border-radius:0;background:transparent'}
            onClick=${()=>setOnglet(k)}>${t}</button>`)}
      </div>

      ${onglet === 'local'      && html`<${BordLocal} />`}
      ${onglet === 'tunnel'     && html`<${BordTunnel} p=${p} />`}
      ${onglet === 'structures' && html`<${Structures} setMsg=${()=>{}} ouvrir=${()=>{}} />`}
      ${onglet === 'national'   && html`<${BordNational} />`}
    </div>`;
}
