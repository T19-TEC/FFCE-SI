        ${role === 'ordonnancement'
          ? 'Vous décidez d\u2019engager les dépenses instruites par la direction financière. Vous n\u2019exécutez pas les paiements.'
          : 'Vous contrôlez la forme des notes et exécutez les paiements ordonnancés. Vous ne décidez pas de l\u2019engagement.'}
      </p>
      ${msg && html`<div class=${'alerte '+(msg.startsWith('Erreur')?'err':'ok')}
        style="margin-top:16px">${msg}</div>`}

      <div class="chiffres" style="margin:24px 0">
        ${role === 'tresorerie' && html`
          <div><div class="n" style="font-size:32px">${L('instruire').length}</div>
            <div class="l">À instruire</div></div>`}
        <div><div class="n" style="font-size:32px">${L('ordonnancer').length}</div>
          <div class="l">À ordonnancer</div></div>
        ${role === 'tresorerie' && html`
          <div><div class="n" style="font-size:32px">${L('payer').length}</div>
            <div class="l">À payer</div></div>`}
        <div><div class="n" style="font-size:32px">${EURO(paye)}</div>
          <div class="l">Déjà remboursé</div></div>
      </div>

      <div class="row" style="margin:0 0 24px;gap:0;border-bottom:1px solid var(--filet)">
        ${onglets.map(([k,t]) => html`
          <button class="btn light" style=${'border:0;border-bottom:2px solid '+
            (onglet===k?'var(--encre)':'transparent')+';border-radius:0;background:transparent'}
            onClick=${()=>setOnglet(k)}>${t}</button>`)}
      </div>

      ${onglet === 'virements' && html`<${SuiviVirements} setMsg=${setMsg} />`}

      ${onglet !== 'bareme' && onglet !== 'virements' && html`
        <div class="panneau">
          ${L(onglet).length === 0
            ? html`<div class="vide">Rien à traiter ici.</div>`
            : L(onglet).map(n => ligneNote(n, html`
                <button class="btn sm" onClick=${()=>ouvrir(n)}>Ouvrir</button>`))}
        </div>`}

      ${onglet === 'bareme' && html`
        <div class="panneau">
          <div class="tete"><h3 style="font-size:17px">Barème et plafonds</h3></div>
          <div class="corps stack">
            ${param.map(x => html`
              <div class="field">
                <label>${x.libelle} (${x.unite})</label>
                <input type="number" step="0.001" defaultValue=${x.valeur}
                  onBlur=${e=>majParam(x.cle, e.target.value)} />
              </div>`)}
            <p class="small muted">Enregistré à la sortie du champ.</p>
          </div>
        </div>`}
    </div>`;
}

/* --- Mes coordonnées bancaires ---------------------------------------- */
function MonRib(){
  const [r, setR] = useState(null);
  const [f, setF] = useState({titulaire:'', iban:'', bic:''});
  const [ouvert, setOuvert] = useState(false);
  const [msg, setMsg] = useState('');

  const charger = useCallback(async () => {
    const { data } = await db.rpc('mon_rib');
    setR(data);
  }, []);
  useEffect(() => { charger(); }, [charger]);

  async function enregistrer(e){
    e.preventDefault();
    const { data, error } = await db.rpc('enregistrer_rib',
      { p_titulaire: f.titulaire, p_iban: f.iban, p_bic: f.bic || null });
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data.ok) return setMsg('Erreur : ' + data.message);
    setF({titulaire:'', iban:'', bic:''}); setOuvert(false);
    setMsg('Coordonnées enregistrées.'); charger();
  }

  if (!r) return null;
  return html`
    <div class="panneau" style="margin-top:24px">
      <div class="tete">
        <h3 style="font-size:17px">Coordonnées bancaires</h3>
        <button class="btn sm light" onClick=${()=>setOuvert(o=>!o)}>
          ${ouvert ? 'Annuler' : (r.enregistre ? 'Modifier' : 'Enregistrer')}</button>
      </div>
      ${msg && html`<div class="corps"><div class=${'alerte '+(msg.startsWith('Erreur')?'err':'ok')}>
        ${msg}</div></div>`}
      ${r.enregistre && !ouvert && html`
        <div>
          <div class="ligne"><span class="muted">Titulaire</span><span>${r.titulaire}</span></div>
          <div class="ligne"><span class="muted">IBAN</span>
            <span class="mono">${r.iban_masque}</span></div>
          <div class="ligne"><span class="muted">Consultations par la trésorerie</span>
            <span class="mono">${r.consultations}</span></div>
        </div>`}
      ${!r.enregistre && !ouvert && html`
        <div class="corps small muted">
          Aucune coordonnée enregistrée. Elles sont nécessaires pour un
          remboursement par virement.
        </div>`}
      ${ouvert && html`
        <form onSubmit=${enregistrer} class="corps stack">
          <div class="field"><label>Titulaire du compte</label>
            <input required value=${f.titulaire}
              onInput=${e=>setF(o=>({...o,titulaire:e.target.value}))} /></div>
          <div class="field"><label>IBAN</label>
            <input required value=${f.iban} placeholder="FR76 ...."
              onInput=${e=>setF(o=>({...o,iban:e.target.value}))} /></div>
          <div class="field"><label>BIC (facultatif)</label>
            <input value=${f.bic} onInput=${e=>setF(o=>({...o,bic:e.target.value}))} /></div>
          <div><button class="btn">Enregistrer</button></div>
          <p class="small muted">
            Vos coordonnées sont conservées à part et ne sont lisibles que par la
            direction financière, au moment du paiement. Chaque consultation est
            enregistrée et vous pouvez la voir ici.
          </p>
        </form>`}
    </div>`;
}

/* =====================================================================

  const [onglet, setOnglet] = useState('membres');

  const [fiche, setFiche] = useState(null);

  if (fiche) return html`<${FicheAdmin} p=${p} id=${fiche}
    fermer=${()=>setFiche(null)} setMsg=${setMsg} />`;

  return html`
    <div>
      <div class="eyebrow">Pilotage</div>
      <h1 style="margin:6px 0 8px">Réseau et habilitations</h1>
      <p class="muted" style="max-width:62ch">
        Deux entrées : par la <strong>personne</strong>, pour tout régler sur une
        fiche unique ; par la <strong>structure</strong>, pour voir où le réseau
        tient et où il manque du monde.
      </p>
      ${msg && html`<div class=${'alerte '+(msg.startsWith('Erreur')?'err':'ok')}
        style="margin-top:16px">${msg}</div>`}

      <div class="row" style="margin:32px 0 24px;gap:0;border-bottom:1px solid var(--filet)">
        ${[['membres','Membres'],['structures','Structures'],
           ['postes','Postes et droits'],['interims','Intérims'],
           ['conformite','Conformité des postes'],['applications','Applications']]
          .map(([k,t]) => html`
          <button class="btn light" style=${'border:0;border-bottom:2px solid '+
            (onglet===k?'var(--bordeaux)':'transparent')+';border-radius:0;background:transparent'}
            onClick=${()=>setOnglet(k)}>${t}</button>`)}
      </div>

      ${onglet === 'membres'      && html`<${ListeMembres} ouvrir=${setFiche} />`}
      ${onglet === 'structures'   && html`<${Structures} setMsg=${setMsg} ouvrir=${setFiche} />`}
      ${onglet === 'postes'       && html`<${PostesEtDroits} setMsg=${setMsg} />`}
      ${onglet === 'interims'   && html`<${Interims} p=${p} setMsg=${setMsg} />`}
      ${onglet === 'conformite' && html`<${ConformitePostes} setMsg=${setMsg} />`}
      ${onglet === 'applications' && html`<${IdentiteApplications} setMsg=${setMsg} />`}
    </div>`;
}

/* --- Liste des membres, une seule porte d'entrée ---------------------- */
function ListeMembres({ ouvrir }){
  const [m, setM] = useState(null);
  const [q, setQ] = useState('');
  const [filtre, setFiltre] = useState('actifs');

  useEffect(() => {
    db.from('v_annuaire').select('*').order('niveau',{ascending:false}).order('nom')
      .then(({data}) => setM(data||[]));
  }, []);
  if (!m) return html`<div class="vide">Chargement…</div>`;

  const liste = m
    .filter(x => filtre === 'tous' ? true
      : filtre === 'actifs' ? x.statut === 'actif'
      : filtre === 'attente' ? x.statut === 'en_attente'
      : x.statut === 'suspendu')
    .filter(x => (nomComplet(x)+' '+(x.territoire_nom||'')+' '+x.matricule+' '+x.fonction_nom)
      .toLowerCase().includes(q.toLowerCase()));

  return html`
    <div>
      <div class="row" style="margin-bottom:20px;gap:12px">
        <div class="field" style="flex:1;min-width:220px;margin:0">
          <input placeholder="Rechercher un nom, un matricule, un territoire…"
            value=${q} onInput=${e=>setQ(e.target.value)} />
        </div>
        <div class="field" style="width:auto;margin:0">
          <select value=${filtre} onChange=${e=>setFiltre(e.target.value)}>
            <option value="actifs">Actifs</option>
            <option value="attente">En attente</option>
            <option value="suspendus">Suspendus</option>
            <option value="tous">Tous</option>
          </select>
        </div>
      </div>

      <div class="panneau">
        <div class="tete"><span class="small muted">
          ${liste.length} membre${liste.length>1?'s':''}</span></div>
        ${liste.length === 0
          ? html`<div class="vide">Aucun résultat.</div>`
          : liste.slice(0, 200).map(x => html`
            <div class="ligne" style="cursor:pointer" onClick=${()=>ouvrir(x.id)}>
              <div style="flex:1;min-width:200px">
                <div class="row" style="gap:8px">
                  <a href="#" onClick=${e=>e.preventDefault()}>${nomComplet(x)}</a>
                  ${x.protege && html`<span class="tag or">Protégé</span>`}
                </div>
                <div class="small muted">
                  <span class="mono">${x.matricule}</span> · ${x.fonction_nom}
                  ${x.territoire_nom ? ' · ' + x.territoire_nom : ''}
                </div>
              </div>
              <div class="row">
                <span class="tag or">Éch. ${x.echelon}</span>
                <span class=${'tag '+(x.statut==='actif'?'vert':
                  x.statut==='suspendu'?'rouge':'')}>${x.statut.replace('_',' ')}</span>
              </div>
            </div>`)}
        ${liste.length > 200 && html`<div class="corps small muted">
          Seuls les 200 premiers résultats sont affichés. Affinez votre recherche.</div>`}
      </div>
    </div>`;
}

/* --- La fiche unique : tout se règle ici ------------------------------ */
function FicheAdmin({ p, id, fermer, setMsg }){
  const [f, setF] = useState(null);
  const [ref, setRef] = useState({fonctions:[], terr:[], postes:[], apps:[]});
  const [nouveauPoste, setNouveauPoste] = useState({poste:'', territoire:'', fin:'', motif:''});
  const [nouvelAcces, setNouvelAcces] = useState({app:'', motif:'', expire:''});
  const [tous, setTous] = useState([]);
  const [local, setLocal] = useState('');

  const charger = useCallback(async () => {
    const [a, b] = await Promise.all([
      db.rpc('fiche_admin', { p_profil: id }),
      db.rpc('acces_complets', { p_profil: id })
    ]);
    setF(a.data); setTous(b.data || []);
  }, [id]);
  useEffect(() => { charger(); }, [charger]);

  useEffect(() => { (async () => {
    const [a,b,c,d] = await Promise.all([
      db.from('fonctions').select('*').order('niveau'),
      db.from('territoires').select('id,nom,echelle').order('echelle').order('nom'),
      db.from('postes').select('code,nom').eq('actif',true).order('nom'),
      db.from('applications').select('code,nom').eq('actif',true).order('ordre')
    ]);
    setRef({fonctions:a.data||[], terr:b.data||[], postes:c.data||[], apps:d.data||[]});
  })(); }, []);

  if (!f) return html`<div class="vide">Chargement…</div>`;
  if (f.erreur) return html`<div class="alerte err">${f.erreur}</div>`;
  const i = f.identite;

  // Toute modification passe par modifier_membre() : la garde
  // hiérarchique et l'inscription au registre des actes y sont tenues.
  async function modifier(champ, valeur){
    const { data, error } = await db.rpc('modifier_membre',
      { p_profil: id, p_champ: champ, p_valeur: String(valeur) });
    if (error) return setLocal('Erreur : ' + error.message);
    if (!data.ok) return setLocal('Erreur : ' + data.message);
    setLocal('Enregistré. L\u2019acte est soumis au contrôle de l\u2019administrateur.');
    setTimeout(()=>setLocal(''), 4000);
    charger();
  }

  async function nommerA(e){
    e.preventDefault();
    const { data, error } = await db.rpc('nommer', {
      p_profil: id, p_poste: nouveauPoste.poste,
      p_territoire: nouveauPoste.territoire || null,
      p_fin: nouveauPoste.fin || null, p_motif: nouveauPoste.motif || null
    });
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data.ok) return setMsg('Erreur : ' + data.message);
    setNouveauPoste({poste:'', territoire:'', fin:'', motif:''});
    setMsg('Nomination enregistrée.'); charger();
  }

  async function revoquerPoste(n){
    const motif = prompt('Motif de la révocation (obligatoire)');
    if (!motif) return;
    const { data, error } = await db.rpc('revoquer',
      { p_nomination: n.nomination_id, p_motif: motif });
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data.ok) return setMsg('Erreur : ' + data.message);
    setMsg('Nomination révoquée.'); charger();
  }

  async function ouvrirAcces(e){
    e.preventDefault();
    const { data, error } = await db.rpc('accorder_acces', {
      p_profil: id, p_app: nouvelAcces.app,
      p_motif: nouvelAcces.motif || null, p_expire: nouvelAcces.expire || null
    });
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data.ok) return setMsg('Erreur : ' + data.message);
    setNouvelAcces({app:'', motif:'', expire:''});
    setMsg('Accès ouvert.'); charger();
  }

  async function ouvrirDirect(app){
    const motif = prompt('Motif de l\u2019ouverture (facultatif)') || '';
    const { data, error } = await db.rpc('accorder_acces',
      { p_profil: id, p_app: app, p_motif: motif, p_expire: null });
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data.ok) return setMsg('Erreur : ' + data.message);
    setMsg('Accès ouvert.'); charger();
  }

  async function fermerAcces(a){
    const motif = prompt('Motif de la révocation (obligatoire)');
    if (!motif) return;
    const { data, error } = await db.rpc('revoquer_acces',
      { p_profil: id, p_app: a.application, p_motif: motif });
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data.ok) return setMsg('Erreur : ' + data.message);
    setMsg('Accès révoqué.'); charger();
  }

  const c = f.completude;

  return html`
    <div>
      <button class="lien-discret" onClick=${fermer}>← Tous les membres</button>

      <div class="row" style="margin-top:16px;gap:18px;align-items:flex-start">
        <${Portrait} chemin=${i.photo_url} nom=${[i.prenom,i.nom].join(' ')} taille=${72} />
        <div style="flex:1;min-width:220px">
          <h1 style="font-size:29px">${[i.prenom,i.nom].filter(Boolean).join(' ') || i.matricule}</h1>
          <div class="small muted" style="margin-top:4px">
            <span class="mono">${i.matricule}</span> · ${i.email}
            ${i.telephone ? ' · ' + i.telephone : ''}
          </div>
          <div class="row" style="margin-top:10px;gap:6px">
            <span class="tag or">${f.points.total} points</span>
            <span class=${'tag '+(i.statut==='actif'?'vert':i.statut==='suspendu'?'rouge':'')}>
              ${i.statut.replace('_',' ')}</span>
            ${i.protege && html`<span class="tag or">Dossier protégé</span>`}
            ${i.sous_suivi && html`<span class="tag rouge">Sous suivi</span>`}
            ${f.dossiers.ouverts > 0 && html`
              <span class="tag rouge">${f.dossiers.ouverts} dossier(s) en cours</span>`}
          </div>
        </div>
      </div>
      ${local && html`<div class="alerte ok" style="margin-top:16px">${local}</div>`}

      ${!c.complet && html`
        <div class="alerte" style="margin-top:24px;border-left-color:var(--brun)">
          Dossier d\u2019adhésion à ${c.pourcent} %. Manque : ${c.manques.join(', ')}.
        </div>`}

      <div class="panneau" style="margin-top:24px">
        <div class="tete"><h3 style="font-size:17px">Position dans la fédération</h3></div>
        <div class="corps stack">
          <div class="row" style="gap:16px;align-items:flex-start">
            <div class="field" style="flex:1;min-width:190px;margin:0"><label>Fonction</label>
              <select value=${i.fonction} onChange=${e=>modifier('fonction', e.target.value)}>
                ${ref.fonctions.map(x => html`<option value=${x.code}>${x.nom}</option>`)}
              </select></div>
            <div class="field" style="flex:1;min-width:190px;margin:0"><label>Territoire</label>
              <select value=${i.territoire_id||''}
                onChange=${e=>modifier('territoire_id', e.target.value||null)}>
                <option value="">—</option>
                ${ref.terr.map(t => html`<option value=${t.id}>${t.nom} (${t.echelle})</option>`)}
              </select></div>
          </div>
          <div class="row" style="gap:16px;align-items:flex-start">
            <div class="field" style="flex:1;min-width:130px;margin:0"><label>Échelon</label>
              <select value=${i.echelon}
                onChange=${e=>modifier('echelon', Number(e.target.value))}>
                ${[1,2,3,4,5,6,7].map(n => html`<option value=${n}>${n}</option>`)}
              </select></div>
            <div class="field" style="flex:1;min-width:150px;margin:0"><label>Statut</label>
              <select value=${i.statut} onChange=${e=>modifier('statut', e.target.value)}>
                ${['en_attente','actif','suspendu','archive'].map(x =>
                  html`<option value=${x}>${x.replace('_',' ')}</option>`)}
              </select></div>
            <div class="field" style="flex:1;min-width:170px;margin:0"><label>Protection</label>
              <select value=${i.protege ? 'oui':'non'}
                onChange=${e=>modifier('protege', e.target.value==='oui')}>
                <option value="non">Normale</option>
                <option value="oui">Renforcée — consultations tracées</option>
              </select></div>
          </div>
          <p class="small muted">
            ${i.chemin || 'Sans rattachement'} · membre depuis ${jour(i.cree_le)}
            ${i.date_adhesion ? ' · adhésion au ' + jour(i.date_adhesion) : ''}
          </p>
        </div>
      </div>

      <div class="panneau" style="margin-top:24px">
        <div class="tete"><h3 style="font-size:17px">Postes occupés</h3>
          <span class="tag">${f.postes.length}</span></div>
        ${f.postes.length === 0
          ? html`<div class="corps small muted">Aucun mandat en cours.</div>`
          : f.postes.map(x => html`
            <div class="ligne">
              <div>
                <div class="row" style="gap:8px">
                  <span class=${'tag '+(x.couleur==='neutre'?'':x.couleur)}>${x.nom}</span>
                </div>
                <div class="small muted" style="margin-top:4px">
                  ${x.territoire || 'National'} · depuis le ${jour(x.debut)}
                  ${x.fin ? ' · jusqu\u2019au ' + jour(x.fin) : ' · sans terme'}
                </div>
              </div>
              <button class="btn sm light" onClick=${()=>revoquerPoste(x)}>Révoquer</button>
            </div>`)}
        <form onSubmit=${nommerA} class="corps"
          style="border-top:1px solid var(--filet)">
          <div class="row" style="gap:12px;align-items:flex-end">
            <div class="field" style="flex:1;min-width:170px;margin:0"><label>Nommer à</label>
              <select required value=${nouveauPoste.poste}
                onChange=${e=>setNouveauPoste(o=>({...o,poste:e.target.value}))}>
                <option value="">Choisir…</option>
                ${ref.postes.map(x => html`<option value=${x.code}>${x.nom}</option>`)}
              </select></div>
            <div class="field" style="flex:1;min-width:150px;margin:0"><label>Périmètre</label>
              <select value=${nouveauPoste.territoire}
                onChange=${e=>setNouveauPoste(o=>({...o,territoire:e.target.value}))}>
                <option value="">National</option>
                ${ref.terr.map(t => html`<option value=${t.id}>${t.nom}</option>`)}
              </select></div>
            <div class="field" style="flex:0 0 150px;margin:0"><label>Fin</label>
              <input type="date" value=${nouveauPoste.fin}
                onInput=${e=>setNouveauPoste(o=>({...o,fin:e.target.value}))} /></div>
            <button class="btn sm">Nommer</button>
          </div>
        </form>
      </div>

      <div class="panneau" style="margin-top:24px">
        <div class="tete">

/* --- Les structures : où le réseau tient, où il manque du monde ------- */
function Structures({ setMsg, ouvrir }){
  const [echelle, setEchelle] = useState('departement');
  const [liste, setListe] = useState(null);
  const [q, setQ] = useState('');
  const [vacants, setVacants] = useState(false);

  useEffect(() => {
    setListe(null);
    db.rpc('etat_reseau', { p_echelle: echelle }).then(({data}) => setListe(data||[]));
  }, [echelle]);

  if (!liste) return html`<div class="vide">Chargement…</div>`;

  const filtre = liste
    .filter(x => !vacants || x.mandats_pourvus < 3)
    .filter(x => (x.territoire + ' ' + (x.parent||'')).toLowerCase().includes(q.toLowerCase()));

  const sansPersonne = liste.filter(x => x.membres === 0).length;
  const sansBureau = liste.filter(x => x.mandats_pourvus === 0).length;

  return html`
    <div>
      <div class="chiffres" style="margin:0 0 24px">
        <div><div class="n" style="font-size:30px">${liste.length}</div>
          <div class="l">Structures</div></div>
        <div><div class="n" style="font-size:30px">
          ${liste.reduce((n,x)=>n+x.actifs,0)}</div>
          <div class="l">Membres actifs</div></div>
        <div><div class="n" style="font-size:30px">${sansPersonne}</div>
          <div class="l">Sans aucun membre</div></div>
        <div><div class="n" style="font-size:30px">${sansBureau}</div>
          <div class="l">Sans bureau constitué</div></div>
      </div>

      <div class="row" style="margin-bottom:20px;gap:12px">
        <div class="field" style="width:auto;margin:0">
          <select value=${echelle} onChange=${e=>setEchelle(e.target.value)}>
            <option value="region">Régions</option>
            <option value="departement">Départements</option>
            <option value="local">Antennes locales</option>
          </select>
        </div>
        <div class="field" style="flex:1;min-width:200px;margin:0">
          <input placeholder="Rechercher…" value=${q} onInput=${e=>setQ(e.target.value)} />
        </div>
        <label class="row" style="text-transform:none;letter-spacing:0;font-size:13.5px;
            color:var(--nuit);margin:0;cursor:pointer;width:auto">
          <input type="checkbox" style="width:auto" checked=${vacants}
            onChange=${e=>setVacants(e.target.checked)} />
          <span>Bureaux incomplets seulement</span>
        </label>
      </div>

      <div class="panneau" style="overflow-x:auto">
        <table>
          <thead><tr>
            <th>Structure</th><th>Membres</th><th>Encadrants</th>
            <th>Président</th><th>Trésorier</th><th>Secrétaire</th>
            <th>Groupes</th><th>Heures ce mois</th>
          </tr></thead>
          <tbody>
            ${filtre.map(x => html`
              <tr>
                <td>
                  <div>${x.territoire}</div>
                  ${x.parent && html`<div class="small muted">${x.parent}</div>`}
                </td>
                <td class="mono">${x.actifs}${x.membres > x.actifs
                  ? html`<span class="small muted"> /${x.membres}</span>` : ''}</td>
                <td class="mono">${x.encadrants}</td>
                <td class="small">${x.president
                  || html`<span class="tag rouge">Vacant</span>`}</td>
                <td class="small">${x.tresorier
                  || html`<span class="tag">Vacant</span>`}</td>
                <td class="small">${x.secretaire
                  || html`<span class="tag">Vacant</span>`}</td>
                <td class="mono">${x.groupes}</td>
                <td class="mono">${Number(x.engagement_mois||0)} h</td>
              </tr>`)}
          </tbody>
        </table>
        ${filtre.length === 0 && html`<div class="vide">Aucun résultat.</div>`}
      </div>
      <p class="small muted" style="margin-top:12px;max-width:62ch">
        Les mandats de bureau se confient depuis la fiche d\u2019un membre, onglet
        Membres : postes Président, Trésorier et Secrétaire de structure, avec le
        territoire comme périmètre.
      </p>
    </div>`;
}

/* --- Identité des applications ---------------------------------------- */
function IdentiteApplications({ setMsg }){
  const [apps, setApps] = useState([]);
  const [dirs, setDirs] = useState([]);
  const [ouvert, setOuvert] = useState(null);
  const [f, setF] = useState({});
  const [fichier, setFichier] = useState(null);

  const charger = useCallback(async () => {
    const [a, d] = await Promise.all([
      db.from('applications').select('*').eq('actif',true).order('ordre'),
      db.rpc('liste_directions')
    ]);
    setApps(a.data||[]); setDirs(d.data||[]);
  }, []);
  useEffect(() => { charger(); }, [charger]);

  const TEINTES = { bleu:'Bleu profond', bordeaux:'Rouge bordeaux', nuit:'Bleu nuit',
                    brun:'Brun chaud', action:'Bleu vif', framboise:'Rose framboise' };
  const HEX = { bleu:'#00325B', bordeaux:'#A5053C', nuit:'#1E2A38',
                brun:'#6B4C3B', action:'#0045D1', framboise:'#E80855' };

  function editer(a){
    setOuvert(a.code);
    setF({nom:a.nom, nom_court:a.nom_court||'', description:a.description||'',
          accroche:a.accroche||'', couleur:a.couleur||'bleu', logo:a.logo||'',
          direction:a.direction||'', direction_locale:a.direction_locale||'',
          ordre:a.ordre});
    setFichier(null);
  }

  async function enregistrer(e, code){
    e.preventDefault();
    let logo = f.logo;
    try { if (fichier) logo = await deposerImage(fichier, 'apps'); }
    catch (err){ return setMsg('Erreur : ' + err.message); }
    const { data, error } = await db.rpc('regler_application', {
      p_code: code, p_nom: f.nom, p_nom_court: f.nom_court,
      p_description: f.description, p_accroche: f.accroche,
      p_couleur: f.couleur, p_logo: logo,
      p_direction: f.direction, p_direction_locale: f.direction_locale,
      p_ordre: Number(f.ordre) || 100
    });
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data.ok) return setMsg('Erreur : ' + data.message);
    setOuvert(null); setMsg('Application mise à jour.'); charger();
  }

  return html`
    <div>
      <p class="small muted" style="margin-bottom:20px;max-width:62ch">

        direction qu\u2019elle décide et dans l\u2019ordre qu\u2019elle choisit. Le second
        rangement, dit territorial, ne vaut que pour les échelons locaux :
        c\u2019est ainsi que le Pilotage se lit sous la Direction générale au
        national et sous Ma structure sur le terrain.
      </p>
      ${apps.map(a => html`
        <div class="panneau" style="margin-bottom:16px">
          <div class="tete">
            <div class="row" style="gap:12px">
              ${a.logo
                ? html`<img src=${urlPublique(a.logo)} alt=""
                    style="width:28px;height:28px;object-fit:contain" />`
                : html`<span style=${'width:14px;height:14px;border-radius:2px;background:'
                    +(HEX[a.couleur]||HEX.bleu)}></span>`}
              <div>
                <h3 style="font-size:17px">${a.nom_court || a.nom}</h3>
                <div class="small muted">${a.accroche || a.description || ''}</div>
              </div>
            </div>
            <button class="btn sm light" onClick=${()=>ouvert===a.code?setOuvert(null):editer(a)}>
              ${ouvert===a.code ? 'Annuler' : 'Personnaliser'}</button>
          </div>
          ${ouvert === a.code && html`
            <form onSubmit=${e=>enregistrer(e, a.code)} class="corps stack">
              <div class="row" style="gap:16px;align-items:flex-start">
                <div class="field" style="flex:2;min-width:200px;margin:0"><label>Nom complet</label>
                  <input value=${f.nom} onInput=${e=>setF(o=>({...o,nom:e.target.value}))} /></div>
                <div class="field" style="flex:1;min-width:150px;margin:0"><label>Nom court</label>
                  <input value=${f.nom_court} placeholder="Sur la tuile"
                    onInput=${e=>setF(o=>({...o,nom_court:e.target.value}))} /></div>
              </div>
              <div class="field"><label>Accroche</label>
                <input value=${f.accroche} maxlength="90"
                  onInput=${e=>setF(o=>({...o,accroche:e.target.value}))} /></div>
              <div class="field"><label>Description</label>
                <textarea value=${f.description}
                  onInput=${e=>setF(o=>({...o,description:e.target.value}))} /></div>
              <div class="field"><label>Couleur</label>
                <select value=${f.couleur} onChange=${e=>setF(o=>({...o,couleur:e.target.value}))}>
                  ${Object.entries(TEINTES).map(([k,v]) => html`<option value=${k}>${v}</option>`)}
                </select></div>
              <div class="row" style="gap:16px;align-items:flex-start">
                <div class="field" style="flex:1;min-width:170px;margin:0">
                  <label>Direction (vue fédérale)</label>
                  <select value=${f.direction}
                    onChange=${e=>setF(o=>({...o,direction:e.target.value}))}>
                    <option value="">Mon activité — aucune direction</option>
                    ${dirs.map(d => html`<option value=${d.code}>${d.nom_court || d.nom}</option>`)}
                  </select></div>
                <div class="field" style="flex:1;min-width:170px;margin:0">
                  <label>Direction (vue territoriale)</label>
                  <select value=${f.direction_locale}
                    onChange=${e=>setF(o=>({...o,direction_locale:e.target.value}))}>
                    <option value="">Le même rangement pour tous</option>
                    ${dirs.map(d => html`<option value=${d.code}>${d.nom_court || d.nom}</option>`)}
                  </select></div>
                <div class="field" style="flex:0 0 110px;margin:0">
                  <label>Ordre</label>
                  <input type="number" min="1" value=${f.ordre}
                    onInput=${e=>setF(o=>({...o,ordre:e.target.value}))} /></div>
              </div>
              <div class="field"><label>Pictogramme</label>
                ${f.logo && html`<img src=${urlPublique(f.logo)} alt=""
                  style="width:44px;height:44px;object-fit:contain;display:block;margin-bottom:8px" />`}
                <input type="file" accept="image/png,image/svg+xml"
                  onChange=${e=>setFichier(e.target.files[0]||null)} />
                <p class="small muted" style="margin:6px 0 0">
                  PNG transparent ou SVG, carré. Le logo de la fédération ne se
                  décline pas : n\u2019utilisez pas ses éléments ici.</p>
              </div>
              <div><button class="btn">Enregistrer</button></div>
            </form>`}
        </div>`)}
    </div>`;
}

function Nominations({ postes, noms, gens, terr, nomDe, actif, recharger, setMsg }){

  const [historique, setHistorique] = useState(false);

  async function nommer(e){
    e.preventDefault();
    const { data, error } = await db.rpc('nommer', {
      p_profil: f.profil, p_poste: f.poste,
      p_territoire: f.territoire || null, p_fin: f.fin || null, p_motif: f.motif || null
    });
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data.ok) return setMsg('Erreur : ' + data.message);
    setF({profil:'', poste:'', territoire:'', fin:'', motif:''});
    setMsg('Nomination enregistrée.'); recharger();
  }

  async function revoquer(n){
    const motif = prompt('Motif de la révocation (obligatoire)');
    if (!motif) return;
    const { data, error } = await db.rpc('revoquer', { p_nomination: n.id, p_motif: motif });
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data.ok) return setMsg('Erreur : ' + data.message);
    setMsg('Nomination révoquée.'); recharger();
  }

  const enCours = noms.filter(actif);
  const closes  = noms.filter(n => !actif(n));
  const posteNom = c => (postes.find(x => x.code === c)||{}).nom || c;
  const terrNom  = i => (terr.find(x => x.id === i)||{}).nom;

  return html`
    <div>
      <form onSubmit=${nommer} class="panneau" style="margin-bottom:24px">
        <div class="tete"><h3 style="font-size:17px">Nommer</h3></div>
        <div class="corps stack">
          <div class="row" style="gap:16px;align-items:flex-start">
            <div class="field" style="flex:1;min-width:200px;margin:0"><label>Membre</label>
              <select required value=${f.profil} onChange=${e=>setF(o=>({...o,profil:e.target.value}))}>
                <option value="">Choisir…</option>
                ${gens.map(g => html`<option value=${g.id}>${nomComplet(g)} — ${g.fonction_nom}</option>`)}
              </select></div>
            <div class="field" style="flex:1;min-width:200px;margin:0"><label>Poste</label>
              <select required value=${f.poste} onChange=${e=>setF(o=>({...o,poste:e.target.value}))}>
                <option value="">Choisir…</option>
                ${postes.filter(x=>x.actif).map(x => html`<option value=${x.code}>${x.nom}</option>`)}
              </select></div>
          </div>
          <div class="row" style="gap:16px;align-items:flex-start">
            <div class="field" style="flex:1;min-width:200px;margin:0"><label>Périmètre</label>
              <select value=${f.territoire} onChange=${e=>setF(o=>({...o,territoire:e.target.value}))}>
                <option value="">National</option>
                ${terr.map(t => html`<option value=${t.id}>${t.nom} (${t.echelle})</option>`)}
              </select></div>
            <div class="field" style="flex:1;min-width:160px;margin:0"><label>Fin du mandat</label>
              <input type="date" value=${f.fin} onInput=${e=>setF(o=>({...o,fin:e.target.value}))} />
            </div>
          </div>
          <div class="field"><label>Motif</label>
            <input value=${f.motif} onInput=${e=>setF(o=>({...o,motif:e.target.value}))}
              placeholder="Élu au bureau du 12 mars" /></div>
          <div><button class="btn">Nommer</button></div>
          <p class="small muted">
            Sans date de fin, le mandat court jusqu\u2019à révocation. Un mandat
            à durée déterminée s\u2019éteint seul : c\u2019est plus sûr qu\u2019un rappel.
          </p>
        </div>
      </form>

      <div class="panneau">
        <div class="tete"><h3 style="font-size:17px">Postes occupés</h3>
          <span class="tag">${enCours.length}</span></div>
        ${enCours.length === 0
          ? html`<div class="vide">Aucune nomination en cours.</div>`
          : enCours.map(n => html`
            <div class="ligne">
              <div style="flex:1;min-width:220px">
                <div>${nomDe(n.profil_id)} — <strong>${posteNom(n.poste)}</strong></div>
                <div class="small muted">
                  ${n.territoire_id ? terrNom(n.territoire_id) : 'National'}
                  · depuis le ${jour(n.debut)}
                  ${n.fin ? ' · jusqu\u2019au ' + jour(n.fin) : ' · sans terme'}
                  ${n.motif ? ' · ' + n.motif : ''}
                </div>
              </div>
              <button class="btn sm light" onClick=${()=>revoquer(n)}>Révoquer</button>
            </div>`)}
      </div>

      ${closes.length > 0 && html`
        <div style="margin-top:24px">
          <button class="btn light" style="border:0;background:transparent;padding:0;
            font-size:13px;color:var(--gris)" onClick=${()=>setHistorique(h=>!h)}>
            ${historique ? 'Masquer' : 'Voir'} les mandats clos (${closes.length})</button>
          ${historique && html`
            <div class="panneau" style="margin-top:12px">
              ${closes.map(n => html`
                <div class="ligne">
                  <div>
                    <div class="muted">${nomDe(n.profil_id)} — ${posteNom(n.poste)}</div>
                    <div class="small muted">
                      ${n.revoque_le
                        ? 'Révoqué le ' + jour(n.revoque_le) +
                          (n.motif_revocation ? ' · ' + n.motif_revocation : '')
                        : 'Mandat échu le ' + jour(n.fin)}
                    </div>
                  </div>
                  <span class="tag">Clos</span>
                </div>`)}
            </div>`}
        </div>`}
    </div>`;
}

function Postes({ postes, droits, liens, recharger, setMsg }){
  const [creation, setCreation] = useState(false);
  const [f, setF] = useState({code:'', nom:'', description:'', couleur:'neutre'});
  const [ouvert, setOuvert] = useState(null);

  async function creer(e){
    e.preventDefault();
    const code = f.code.trim().toLowerCase().replace(/[^a-z0-9_]/g,'_');
    const { error } = await db.from('postes').insert({
      code, nom: f.nom, description: f.description || null, couleur: f.couleur
    });
    if (error) return setMsg('Erreur : ' + error.message);
    setF({code:'', nom:'', description:'', couleur:'neutre'}); setCreation(false);
    setMsg('Poste créé. Cochez maintenant ses droits.'); recharger();
  }

  async function basculer(poste, droit, coche){
    if (coche)
      await db.from('poste_droits').insert({ poste, droit });
    else
      await db.from('poste_droits').delete().eq('poste', poste).eq('droit', droit);
    recharger();
  }

  async function desactiver(x){
    if (!confirm('Désactiver « ' + x.nom + ' » ? Les nominations en cours cessent de produire effet.')) return;
    await db.from('postes').update({ actif: !x.actif }).eq('code', x.code);
    recharger();
  }

  const categories = [...new Set(droits.map(d => d.categorie))];

  return html`
    <div>
      <div class="spread" style="margin-bottom:16px">
        <span class="small muted">${postes.length} poste${postes.length>1?'s':''}</span>
        <button class="btn sm" onClick=${()=>setCreation(c=>!c)}>
          ${creation ? 'Annuler' : 'Créer un poste'}</button>
      </div>

      ${creation && html`
        <form onSubmit=${creer} class="panneau" style="margin-bottom:24px">
          <div class="corps stack">
            <div class="row" style="gap:16px;align-items:flex-start">
              <div class="field" style="flex:1;min-width:200px;margin:0"><label>Nom</label>
                <input required value=${f.nom} onInput=${e=>setF(o=>({...o,nom:e.target.value}))}
                  placeholder="Référent laïcité" /></div>
              <div class="field" style="flex:1;min-width:160px;margin:0"><label>Identifiant</label>
                <input required value=${f.code} onInput=${e=>setF(o=>({...o,code:e.target.value}))}
                  placeholder="ref_laicite" /></div>
            </div>
            <div class="field"><label>À quoi sert ce poste</label>
              <textarea value=${f.description}
                onInput=${e=>setF(o=>({...o,description:e.target.value}))} /></div>
            <div class="field"><label>Couleur de l\u2019étiquette</label>
              <select value=${f.couleur} onChange=${e=>setF(o=>({...o,couleur:e.target.value}))}>
                <option value="neutre">Neutre</option><option value="or">Or</option>
                <option value="bleu">Bleu</option><option value="vert">Vert</option>
                <option value="rouge">Rouge</option>
              </select></div>
            <div><button class="btn">Créer</button></div>
          </div>
        </form>`}

      ${postes.map(x => {
        const siens = liens.filter(l => l.poste === x.code).map(l => l.droit);
        return html`
          <div class="panneau" style="margin-bottom:16px">
            <div class="tete">
              <div>
                <div class="row" style="gap:8px">
                  <h3 style="font-size:17px">${x.nom}</h3>
                  <span class=${'tag '+(x.couleur==='neutre'?'':x.couleur)}>${siens.length} droit${siens.length>1?'s':''}</span>
                  ${!x.actif && html`<span class="tag rouge">Désactivé</span>`}
                  ${x.systeme && html`<span class="tag">Fourni d\u2019origine</span>`}
                </div>
                ${x.description && html`<div class="small muted" style="margin-top:4px;max-width:60ch">
                  ${x.description}</div>`}
              </div>
              <div class="row">
                <button class="btn sm light" onClick=${()=>setOuvert(o => o===x.code?null:x.code)}>
                  ${ouvert===x.code ? 'Replier' : 'Droits'}</button>
                <button class="btn sm light" onClick=${()=>desactiver(x)}>
                  ${x.actif ? 'Désactiver' : 'Réactiver'}</button>
              </div>
            </div>
            ${ouvert === x.code && html`
              <div class="corps">
                ${categories.map(cat => html`
                  <div style="margin-bottom:20px">
                    <div class="eyebrow" style="margin-bottom:8px">${cat}</div>
                    ${droits.filter(d => d.categorie === cat).map(d => html`
                      <label class="row" style="text-transform:none;letter-spacing:0;
                          font-size:14px;color:var(--encre);padding:4px 0;margin:0;cursor:pointer">
                        <input type="checkbox" style="width:auto"
                          checked=${siens.includes(d.code)}
                          onChange=${e=>basculer(x.code, d.code, e.target.checked)} />
                        <span>${d.nom}</span>
                        ${d.sensible && html`<span class="tag or">Sensible</span>`}
                      </label>`)}
                  </div>`)}
              </div>`}
          </div>`;
      })}
    </div>`;
}

function PilotageAcces({ acces, apps, gens, recharger, setMsg }){
  const [f, setF] = useState({profil:'', app:'', motif:'', expire:''});
  const [filtre, setFiltre] = useState('actifs');

  async function accorder(e){
    e.preventDefault();
    const { data, error } = await db.rpc('accorder_acces', {
      p_profil: f.profil, p_app: f.app,
      p_motif: f.motif || null, p_expire: f.expire || null
    });
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data.ok) return setMsg('Erreur : ' + data.message);
    setF({profil:'', app:'', motif:'', expire:''});
    setMsg('Accès ouvert.'); recharger();
  }

  async function revoquer(a){
    const motif = prompt('Motif de la révocation (obligatoire)');
    if (!motif) return;
    const { data, error } = await db.rpc('revoquer_acces',
      { p_profil: a.profil_id, p_app: a.application, p_motif: motif });
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data.ok) return setMsg('Erreur : ' + data.message);
    setMsg('Accès révoqué.'); recharger();
  }

  const liste = acces.filter(a => filtre === 'tous' ? true : a.statut === 'Actif');
  const dormants = acces.filter(a => a.statut === 'Actif' && !a.derniere_utilisation);

  return html`
    <div>
      <form onSubmit=${accorder} class="panneau" style="margin-bottom:24px">
        <div class="tete"><h3 style="font-size:17px">Ouvrir un accès</h3></div>
        <div class="corps stack">
          <div class="row" style="gap:16px;align-items:flex-start">
            <div class="field" style="flex:1;min-width:200px;margin:0"><label>Membre</label>
              <select required value=${f.profil} onChange=${e=>setF(o=>({...o,profil:e.target.value}))}>
                <option value="">Choisir…</option>
                ${gens.map(g => html`<option value=${g.id}>${nomComplet(g)}</option>`)}
              </select></div>
            <div class="field" style="flex:1;min-width:180px;margin:0"><label>Application</label>
              <select required value=${f.app} onChange=${e=>setF(o=>({...o,app:e.target.value}))}>
                <option value="">Choisir…</option>
                ${apps.map(a => html`<option value=${a.code}>${a.nom}</option>`)}
              </select></div>
            <div class="field" style="flex:1;min-width:150px;margin:0"><label>Expire le</label>
              <input type="date" value=${f.expire}
                onInput=${e=>setF(o=>({...o,expire:e.target.value}))} /></div>
          </div>
          <div class="field"><label>Motif</label>
            <input value=${f.motif} onInput=${e=>setF(o=>({...o,motif:e.target.value}))}
              placeholder="Trésorier adjoint depuis mars" /></div>
          <div><button class="btn">Ouvrir</button></div>
        </div>
      </form>

      ${dormants.length > 0 && html`
        <div class="alerte" style="margin-bottom:24px;border-left-color:var(--laiton)">
          ${dormants.length} accès ouvert${dormants.length>1?'s':''} n\u2019
          ${dormants.length>1?'ont':'a'} jamais servi. Un accès inutilisé est un
          accès à retirer.
        </div>`}

      <div class="spread" style="margin-bottom:16px">
        <span class="small muted">${liste.length} ligne${liste.length>1?'s':''}</span>
        <select style="width:auto" value=${filtre} onChange=${e=>setFiltre(e.target.value)}>
          <option value="actifs">Accès actifs</option>
          <option value="tous">Tout l\u2019historique</option>
        </select>
      </div>

      <div class="panneau" style="overflow-x:auto">
        ${liste.length === 0
          ? html`<div class="vide">Aucun accès nominatif ouvert.</div>`
          : html`
            <table>
              <thead><tr>
                <th>Membre</th><th>Application</th><th>Ouvert le</th>
                <th>Dernier usage</th><th>Ouvertures</th><th>État</th><th></th>
              </tr></thead>
              <tbody>
                ${liste.map(a => html`
                  <tr>
                    <td><div>${a.membre}</div>
                      <div class="mono muted">${a.matricule}</div></td>
                    <td>${a.app_nom}</td>
                    <td class="small">${jour(a.accorde_le)}
                      ${a.expire_le ? html`<div class="small muted">expire le ${jour(a.expire_le)}</div>` : ''}</td>
                    <td class="small">${a.derniere_utilisation
                      ? jour(a.derniere_utilisation)
                      : html`<span class="tag or">Jamais</span>`}</td>
                    <td class="mono">${a.nb_ouvertures}</td>
                    <td>${a.statut === 'Actif'
                      ? html`<span class="tag vert">Actif</span>`
                      : html`<span class="tag rouge">${a.statut}</span>`}</td>
                    <td>${a.statut === 'Actif' && html`
                      <button class="btn sm light" onClick=${()=>revoquer(a)}>Révoquer</button>`}</td>
                  </tr>`)}
              </tbody>
            </table>`}
      </div>
    </div>`;
}


/* =====================================================================
   5 septies. DISCIPLINE, RECOURS ET ARCHIVES
   Aucune mesure ne produit d'effet sans avoir été notifiée, et aucune
   notification n'est valable sans voie de recours ouverte.
   ===================================================================== */

const MESURES = {
  classement:          'Classement sans suite',
  rappel_regles:       'Rappel des règles',
  avertissement:       'Avertissement',
  suivi_usages:        'Suivi des usages',
  retrait_habilitation:'Retrait des habilitations',
  suspension:          'Suspension du compte',
  radiation:           'Radiation'
};
const GRAVITE = { faible:['Faible',''], moyenne:['Moyenne','bleu'], elevee:['Élevée','rouge'] };
const ETAPES = ['ouvert','instruction','decision','notifie','recours','clos'];
const ETAPE_NOM = {
  ouvert:'Dossier ouvert', instruction:'Instruction en cours',
  decision:'Décision prise', notifie:'Décision notifiée',
  recours:'Recours en examen', clos:'Dossier clos'
};

/* --- Le fil du dossier, vu par l'intéressé ---------------------------- */
function FilDossier({ d, compact }){
  const i = ETAPES.indexOf(d.statut);
  return html`
    <div>
      <div class="row" style="gap:0;margin-bottom:16px;flex-wrap:nowrap;overflow-x:auto">
        ${ETAPES.map((e, n) => html`
          <div style=${'flex:1;min-width:82px;padding-right:8px;'+
            (n <= i ? '' : 'opacity:.35')}>
            <div style=${'height:3px;background:'+(n <= i ? 'var(--encre)' : 'var(--filet)')}></div>
            <div class="small" style="margin-top:6px;line-height:1.3">${ETAPE_NOM[e]}</div>
          </div>`)}
      </div>
      ${!compact && d.qualification && html`
        <p class="small muted">Qualification retenue : ${d.qualification}</p>`}
    </div>`;
}

/* --- Ce que voit un membre : bandeau, ou page entière si suspendu ----- */
function MonDossier({ p, entier }){
  const [d, setD] = useState(null);
  const [msg, setMsg] = useState('');
  const [obs, setObs] = useState({});
  const [rec, setRec] = useState({});
  const [doc, setDoc] = useState({});
  const [renonce, setRenonce] = useState({});

  const charger = useCallback(async () => {
    const { data } = await db.rpc('mon_dossier');
    setD(data || null);
  }, []);
  useEffect(() => { charger(); }, [charger]);

  if (!d) return null;
  const dossiers = d.dossiers || [];
  const ouverts = dossiers.filter(x => x.statut !== 'clos');
  if (!entier && ouverts.length === 0 && !d.sous_suivi) return null;

  async function accuser(m){
    const { data } = await db.rpc('accuser_reception', { p_mesure: m.id });
    if (!data.ok) return setMsg(data.message);
    setMsg('Réception accusée. Le délai de recours court à compter de ce jour.');
    charger();
  }

  async function deposerObs(dos, e){
    e.preventDefault();
    const texte = obs[dos.id] || '';
    const fichier = doc[dos.id];
    if (!texte.trim() && !fichier) return;
    let chemin = null;
    try {
      if (fichier){
        if (fichier.size > 10 * 1024 * 1024)
          throw new Error('Le document ne doit pas dépasser 10 Mo.');
        const ext = fichier.name.split('.').pop();
        chemin = p.id + '/' + dos.id + '-' + Date.now() + '.' + ext;
        const { error: eUp } = await db.storage.from('dossiers').upload(chemin, fichier);
        if (eUp) throw eUp;
      }
    } catch (err){ return setMsg(err.message || 'Téléversement impossible.'); }

    const { data, error } = await db.rpc('verser_piece', {
      p_dossier: dos.id, p_type: fichier ? 'piece_jointe' : 'observation',
      p_titre: fichier ? fichier.name : 'Observations',
      p_contenu: texte || null, p_fichier: chemin, p_communicable: true
    });
    if (error) return setMsg(error.message);
    if (!data.ok) return setMsg(data.message);
    setObs(o => ({...o, [dos.id]: ''}));
    setDoc(o => ({...o, [dos.id]: null}));
    setMsg('Vos observations sont versées au dossier.');
    charger();
  }

  async function renoncer(dos, e){
    e.preventDefault();
    const texte = renonce[dos.id] || '';
    if (!texte.trim()) return;
    if (!confirm('Cette renonciation est définitive. Confirmez-vous ?')) return;
    const { data, error } = await db.rpc('renoncer_gracieux',
      { p_dossier: dos.id, p_texte: texte });
    if (error) return setMsg(error.message);
    if (!data.ok) return setMsg(data.message);
    setRenonce(o => { const c = {...o}; delete c[dos.id]; return c; });
    setMsg('Renonciation enregistrée et versée au dossier.');
    charger();
  }

  async function ouvrirPiece(pc){
    if (!pc.fichier) return;
    const { data, error } = await db.storage.from('dossiers')
      .createSignedUrl(pc.fichier, 120);
    if (error) return setMsg('Document introuvable.');
    window.open(data.signedUrl, '_blank', 'noopener');
  }

  async function deposerRecours(m, e){
    e.preventDefault();
    const texte = rec[m.id] || '';
    if (!texte.trim()) return;
    const { data, error } = await db.rpc('deposer_recours',
      { p_mesure: m.id, p_contenu: texte, p_fichier: null });
    if (error) return setMsg(error.message);
    if (!data.ok) return setMsg(data.message);
    setRec(o => ({...o, [m.id]: ''}));
    setMsg('Recours déposé. Il sera examiné et la décision vous sera notifiée.');
    charger();
  }

  const bloc = (dos) => html`
    <div class="panneau" style="margin-bottom:24px">
      <div class="tete">
        <div>
          <h3 style="font-size:17px">${dos.objet}</h3>
          <div class="small muted"><span class="mono">${dos.reference}</span>
            · ouvert le ${jour(dos.ouvert_le)}</div>
        </div>
        <span class="tag">${ETAPE_NOM[dos.statut]}</span>
      </div>
      <div class="corps">
        <${FilDossier} d=${dos} />

        ${dos.conclusion && html`
          <div class="alerte" style="margin-top:16px">Conclusion : ${dos.conclusion}</div>`}

        ${(dos.mesures||[]).map(m => html`
          <div style="margin-top:24px;padding:16px;border:1px solid var(--filet);
               border-left:3px solid var(--encre);border-radius:2px">
            <div class="spread">
              <strong>${MESURES[m.type] || m.type}</strong>
              <span class=${'tag '+(m.statut==='annulee'?'vert':m.statut==='executee'?'rouge':'')}>
                ${m.statut}</span>
            </div>
            <p style="margin:8px 0 0">${m.motif}</p>
            ${m.texte && html`<p class="small" style="margin:8px 0 0;white-space:pre-wrap">${m.texte}</p>`}
            <div class="small muted" style="margin-top:8px">
              Effet au ${jour(m.date_effet)}${m.date_fin ? ' · jusqu\u2019au ' + jour(m.date_fin) : ''}
              ${m.notifiee_le ? ' · notifiée le ' + jour(m.notifiee_le) : ''}
            </div>

            ${!m.accusee_le && m.notifiee_le && html`
              <div style="margin-top:12px">
                <button class="btn sm" onClick=${()=>accuser(m)}>
                  J\u2019accuse réception de cette décision</button>
                <p class="small muted" style="margin:6px 0 0">
                  Le délai de recours de ${30} jours court à compter de votre accusé de
                  réception, ou à défaut quinze jours après la notification.</p>
              </div>`}

            ${m.recours_ouvert && m.limite_recours && html`
              <p class="small muted" style="margin-top:8px">
                Recours possible jusqu\u2019au ${jour(m.limite_recours)}
                — ${m.recours_restants} recours restant${m.recours_restants>1?'s':''}.</p>`}
            ${!m.recours_ouvert && m.motif_fermeture && html`
              <p class="small muted" style="margin-top:8px">${m.motif_fermeture}</p>`}
            ${m.renonce_le && html`
              <div style="margin-top:12px;padding:12px;background:var(--papier);
                   border:1px solid var(--filet);border-radius:2px">
                <div class="small muted">Renonciation du ${jour(m.renonce_le)}</div>
                <p class="small" style="margin:6px 0 0;white-space:pre-wrap">${m.renonce_texte}</p>
              </div>`}

            ${(m.recours||[]).map(r => html`
              <div style="margin-top:12px;padding:12px;background:var(--papier);
                   border:1px solid var(--filet);border-radius:2px">
                <div class="small muted">Recours déposé le ${jour(r.cree_le)}
                  · <span class="tag">${r.statut}</span></div>
                <p class="small" style="margin:8px 0 0;white-space:pre-wrap">${r.contenu}</p>
                ${r.decision && html`
                  <p class="small" style="margin:12px 0 0;padding-top:12px;
                     border-top:1px solid var(--filet)">
                    <strong>Décision du ${jour(r.decide_le)} :</strong> ${r.decision}</p>`}
              </div>`)}

            ${m.recours_ouvert && (m.recours||[]).filter(r =>
                ['depose','recevable'].includes(r.statut)).length === 0 && html`
              <form onSubmit=${e=>deposerRecours(m, e)} style="margin-top:16px">
                <div class="field">
                  <label>Déposer un recours gracieux</label>
                  <textarea value=${rec[m.id]||''} onInput=${e=>setRec(o=>({...o,[m.id]:e.target.value}))}
                    placeholder="Exposez les motifs pour lesquels vous contestez cette décision." />
                </div>
                <button class="btn sm" style="margin-top:8px">Déposer le recours</button>
              </form>`}
          </div>`)}

        ${(dos.pieces||[]).length > 0 && html`
          <div style="margin-top:24px">
            <div class="eyebrow" style="margin-bottom:12px">Pièces du dossier</div>
            ${dos.pieces.map(pc => html`
              <div style="padding:10px 0;border-bottom:1px solid var(--filet)">
                <div class="spread">
                  <span>${pc.fichier
                    ? html`<a href="#" onClick=${e=>{e.preventDefault();ouvrirPiece(pc)}}>
                        ${pc.titre} ↗</a>`
                    : pc.titre}</span>
                  <span class="small muted">${jour(pc.cree_le)}</span>
                </div>
                ${pc.contenu && html`<p class="small muted"
                  style="margin:6px 0 0;white-space:pre-wrap">${pc.contenu}</p>`}
              </div>`)}
            ${dos.pieces_non_communicables > 0 && html`
              <p class="small muted" style="margin-top:12px">
                ${dos.pieces_non_communicables} pièce${dos.pieces_non_communicables>1?'s':''}
                du dossier ${dos.pieces_non_communicables>1?'ne sont':'n\u2019est'} pas
                communicable${dos.pieces_non_communicables>1?'s':''}, afin de protéger
                l\u2019identité de personnes tierces.</p>`}
          </div>`}

        ${dos.scelle && html`
          <p class="small muted" style="margin-top:24px;padding-top:24px;
             border-top:1px solid var(--filet)">
            Ce dossier est clos et scellé. Plus aucune pièce ne peut y être versée.
          </p>`}

        ${!dos.scelle && html`
          <form onSubmit=${e=>deposerObs(dos, e)} style="margin-top:24px;
               padding-top:24px;border-top:1px solid var(--filet)">
            <div class="field">
              <label>Vos observations</label>
              <textarea value=${obs[dos.id]||''}
                onInput=${e=>setObs(o=>({...o,[dos.id]:e.target.value}))}
                placeholder="Tout ce que vous souhaitez porter à la connaissance de l\u2019instruction." />
            </div>
            <div class="field">
              <label>Joindre un document</label>
              <input type="file" accept="image/*,.pdf,.doc,.docx"
                onChange=${e=>setDoc(o=>({...o,[dos.id]:e.target.files[0]||null}))} />
              <p class="small muted" style="margin:6px 0 0">
                Photo, PDF ou document, 10 Mo maximum.</p>
            </div>
            <button class="btn sm" style="margin-top:8px">Verser au dossier</button>
          </form>

          ${dos.peut_renoncer && html`
            <div style="margin-top:24px;padding-top:24px;border-top:1px solid var(--filet)">
              ${renonce[dos.id] === undefined
                ? html`<button class="btn light" style="border:0;background:transparent;
                    padding:0;font-size:13px;color:var(--gris)"
                    onClick=${()=>setRenonce(o=>({...o,[dos.id]:''}))}>
                    Renoncer à mes voies de recours gracieux</button>`
                : html`
                  <form onSubmit=${e=>renoncer(dos, e)}>
                    <div class="alerte err" style="margin-bottom:16px">
                      La renonciation est définitive. Elle met fin aux recours en cours
                      et ferme la voie gracieuse pour toutes les décisions déjà notifiées
                      de ce dossier. Elle ne vous prive d\u2019aucun droit devant les
                      juridictions compétentes.
                    </div>
                    <div class="field">
                      <label>Écrivez votre renonciation</label>
                      <textarea required value=${renonce[dos.id]}
                        onInput=${e=>setRenonce(o=>({...o,[dos.id]:e.target.value}))}
                        placeholder="Je soussigné(e) …, renonce expressément aux voies de recours gracieux ouvertes contre les décisions du présent dossier." />
                    </div>
                    <div class="row" style="margin-top:12px">
                      <button class="btn danger">Je renonce</button>
                      <button type="button" class="btn light"
                        onClick=${()=>setRenonce(o=>{const c={...o};delete c[dos.id];return c})}>
                        Annuler</button>
                    </div>
                  </form>`}
            </div>`}`}
      </div>
    </div>`;

  // Bandeau, pour un compte actif.
  if (!entier) return html`
    <div style="margin-bottom:24px">
      ${d.sous_suivi && html`
        <p class="small" style="padding:10px 14px;border:1px solid var(--filet);
           border-left:3px solid var(--laiton);background:#fff;border-radius:2px">
          Votre compte fait l\u2019objet d\u2019une mesure de suivi des usages.
        </p>`}
      ${ouverts.length > 0 && html`
        <div class="alerte" style=${d.sous_suivi?'margin-top:8px':''}>
          ${ouverts.length === 1
            ? 'Un dossier vous concernant est en cours : ' + ETAPE_NOM[ouverts[0].statut].toLowerCase() + '.'
            : ouverts.length + ' dossiers vous concernant sont en cours.'}
          <a href="#/espace/mon-dossier">Consulter et répondre</a>
        </div>`}
    </div>`;

  // Page entière.
  return html`
    <div>
      <div class="eyebrow">Mon dossier</div>
      <h1 style="margin:6px 0 8px">Suivi et voies de recours</h1>
      <p class="muted" style="max-width:60ch">
