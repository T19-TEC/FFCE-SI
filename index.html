}

/* =====================================================================
   LA FICHE D'OUVERTURE
   « Comment tout lui débloquer, et rien de plus. » La question se posait
   à chaque arrivée sans réponse écrite. Le membre et celui qui
   l'accompagne lisent maintenant la même liste, dans les mêmes mots.
   ===================================================================== */
function FicheOuverture({ profil, titre, compact }){
  const [l, setL] = useState(null);
  useEffect(() => {
    db.rpc('checklist_ouverture', { p_profil: profil || null })
      .then(({data}) => setL(data || []));
  }, [profil]);
  if (!l) return null;

  const reste = l.filter(x => x.etat !== 'fait');
  if (compact && reste.length === 0) return null;

  const marque = e => e === 'fait'
    ? html`<span class="tag vert">Fait</span>`
    : e === 'bloquant'
      ? html`<span class="tag rouge">Bloquant</span>`
      : html`<span class="tag or">À faire</span>`;

  const lignes = compact ? reste : l;

  return html`
    <div class="panneau">
      <div class="tete spread">
        <h3 style="font-size:17px">${titre || 'Ce qu\u2019il reste à ouvrir'}</h3>
        <span class="small muted">${l.filter(x=>x.etat==='fait').length} sur ${l.length}</span>
      </div>
      ${lignes.map(x => html`
        <div class="ligne" key=${x.code} style="align-items:flex-start">
          <div style="flex:1;min-width:220px">
            <div>${x.libelle}</div>
            <div class="small muted" style="margin-top:3px">${x.detail}</div>
          </div>
          <div class="row" style="gap:10px">
            ${marque(x.etat)}
            ${x.etat !== 'fait' && html`<a class="btn sm light" href=${x.lien}>Ouvrir</a>`}
          </div>
        </div>`)}
    </div>`;
}

/* --- Nommer dans sa structure ------------------------------------------
   La liste des postes vient de `postes_conferables` : l'écran ne peut
   pas proposer ce que la base refusera. Si elle est vide, on le dit.
   --------------------------------------------------------------------- */
function NommerLocal({ p, territoire, setMsg }){
  const [postes, setPostes] = useState([]);
  const [gens, setGens] = useState([]);
  const [noms, setNoms] = useState([]);
  const [f, setF] = useState({ profil:'', poste:'', fin:'', motif:'' });
  const [ouvert, setOuvert] = useState(false);
  const [fiche, setFiche] = useState(null);

  const charger = useCallback(async () => {
    const [a, b] = await Promise.all([
      db.rpc('postes_conferables', { p_territoire: territoire || null }),
      db.from('v_annuaire').select('id,prenom,nom,fonction_nom,territoire_nom,photo_url')
        .eq('statut','actif').order('nom')
    ]);
    setPostes(a.data||[]); setGens(b.data||[]);
    // Sans territoire, il n'y a pas de nominations locales à lister — et
    // une chaîne vide n'est pas un identifiant valide.
    if (!territoire){ setNoms([]); return; }
    const { data } = await db.from('nominations')
      .select('id,poste,fin,cree_le,profil_id,territoire_id,postes(nom,rang)')
      .is('revoque_le', null).eq('territoire_id', territoire);
    setNoms(data || []);
  }, [territoire]);
  useEffect(() => { charger(); }, [charger]);

  const appel = async (fn, args, ok) => {
    const { data, error } = await db.rpc(fn, args);
    if (error) return setMsg('Erreur : ' + error.message);
    if (data && data.ok === false) return setMsg('Erreur : ' + data.message);
    setMsg(ok); charger();
  };

  const nomDe = id => {
    const g = gens.find(x => x.id === id);
    return g ? nomComplet(g) : 'Membre';
  };

  async function nommer(e){
    e.preventDefault();
    if (!f.profil || !f.poste) return setMsg('Erreur : choisissez un membre et un poste.');
    const ok = await appel('nommer', {
      p_profil: f.profil, p_poste: f.poste, p_territoire: territoire || null,
      p_fin: f.fin || null, p_motif: f.motif || null
    }, 'Nomination enregistrée. Les accès du poste sont ouverts.');
    setF({ profil:'', poste:'', fin:'', motif:'' }); setOuvert(false);
  }

  return html`
    <div class="panneau" style="margin-top:24px">
      <div class="tete spread">
        <h3 style="font-size:17px">Confier un poste</h3>
        ${postes.length > 0 && html`
          <button class="btn sm" onClick=${()=>setOuvert(!ouvert)}>
            ${ouvert ? 'Fermer' : 'Nommer quelqu\u2019un'}</button>`}
      </div>

      ${postes.length === 0
        ? html`<div class="corps small muted">
            Vous ne pouvez conférer aucun poste ici. On ne nomme qu\u2019en dessous
            de soi, dans son périmètre, et jamais à un poste ouvrant des droits
            sensibles \u2014 ceux-là restent à la direction.</div>`
        : ouvert && html`
          <form onSubmit=${nommer} class="corps stack">
            <div class="row" style="gap:16px;align-items:flex-start">
              <div class="field" style="flex:2;min-width:200px;margin:0">
                <label>Membre</label>
                <select value=${f.profil}
                  onChange=${e=>setF(o=>({...o,profil:e.target.value}))}>
                  <option value="">— Choisir —</option>
                  ${gens.map(g => html`<option value=${g.id}>
                    ${nomComplet(g)} · ${g.fonction_nom}${
                      g.territoire_nom ? ' · '+g.territoire_nom : ''}</option>`)}
                </select></div>
              <div class="field" style="flex:1;min-width:180px;margin:0">
                <label>Poste</label>
                <select value=${f.poste}
                  onChange=${e=>setF(o=>({...o,poste:e.target.value}))}>
                  <option value="">— Choisir —</option>
                  ${postes.map(x => html`<option value=${x.code}>${x.nom}</option>`)}
                </select></div>
              <div class="field" style="flex:0 0 160px;margin:0">
                <label>Fin du mandat</label>
                <input type="date" value=${f.fin}
                  onInput=${e=>setF(o=>({...o,fin:e.target.value}))} /></div>
            </div>
            <div class="field"><label>Motif</label>
              <input value=${f.motif} placeholder="Élu en assemblée du…, désigné par le bureau…"
                onInput=${e=>setF(o=>({...o,motif:e.target.value}))} /></div>
            ${f.poste && html`<div class="small muted">
              ${(postes.find(x=>x.code===f.poste)||{}).description || ''}</div>`}
            <div><button class="btn">Nommer</button></div>
          </form>`}

      ${noms.length > 0 && html`
        <div>
          ${noms.map(n => html`
            <div class="ligne" key=${n.id} style="align-items:flex-start">
              <div style="flex:1;min-width:200px">
                <div>${nomDe(n.profil_id)}</div>
                <div class="small muted">${n.postes?.nom || n.poste}
                  · depuis le ${jour(n.cree_le)}
                  ${n.fin ? ' · jusqu\u2019au ' + jour(n.fin) : ''}</div>
              </div>
              <div class="row" style="gap:8px">
                <button class="btn sm light"
                  onClick=${()=>setFiche(fiche===n.profil_id?null:n.profil_id)}>
                  ${fiche===n.profil_id ? 'Masquer' : 'Ce qui lui manque'}</button>
                <button class="btn sm light" onClick=${()=>{
                  const m = prompt('Motif du retrait (obligatoire)');
                  if (m) appel('revoquer', { p_nomination:n.id, p_motif:m },
                    'Poste retiré. Les accès qu\u2019il ouvrait se referment.');
                }}>Retirer</button>
              </div>
            </div>
            ${fiche === n.profil_id && html`
              <div style="padding:0 20px 20px">
                <${FicheOuverture} profil=${n.profil_id}
                  titre=${'Ouverture du dossier de ' + nomDe(n.profil_id)} />
              </div>`}`)}
        </div>`}
    </div>`;
}

/* =====================================================================
   LE CABINET DE LA PRÉSIDENCE
   La présidence est nationale : ce cabinet est unique. Tout ce que le
   réseau lui adresse arrive ici sans filtre de périmètre, et tout ce
   qu'elle décide en repart sous forme d'acte.

   La séparation qui structure l'écran est celle qui structure la base :
   le cabinet rédige les projets, la présidence seule signe.
   ===================================================================== */
const NATURE_REMONTEE = { information:'Information', alerte:'Alerte',
  proposition:'Proposition', arbitrage:'Demande d\u2019arbitrage', contact:'Contact' };
const TYPE_ACTE = { nomination:'Nomination', delegation:'Délégation',
  decision:'Décision', convocation:'Convocation', motion:'Motion',
  note:'Note de service', abrogation:'Abrogation' };

function Cabinet({ p }){
  const [onglet, setOnglet] = useState('table');
  const [tb, setTb] = useState(null);
  const [remontees, setRemontees] = useState([]);
  const [actes, setActes] = useState([]);
  const [signataire, setSignataire] = useState(false);
  const [msg, setMsg] = useState('');

  const charger = useCallback(async () => {
    const [a, b, c, s] = await Promise.all([
      db.rpc('tableau_cabinet'),
      db.rpc('remontees_du_cabinet', { p_filtre: 'ouvertes' }),
      db.rpc('recueil_actes', { p_filtre: 'tous' }),
      db.rpc('puis_je_signer_acte')
    ]);
    setTb(a.data); setRemontees(b.data || []); setActes(c.data || []);
    setSignataire(!!s.data);
  }, []);
  useEffect(() => { charger(); }, [charger]);

  const appel = async (fn, args, ok) => {
    setMsg('');
    const { data, error } = await db.rpc(fn, args);
    if (error){ setMsg('Erreur : ' + error.message); return false; }
    if (data && data.ok === false){ setMsg('Erreur : ' + data.message); return false; }
    setMsg(ok); charger(); return true;
  };

  if (!tb) return html`<div class="vide" style="padding:120px">Chargement…</div>`;

  const projets = actes.filter(a => a.statut === 'projet');
  const tabs = [['table','L\u2019état de la fédération'], ['remontees','Remontées'],
                ['actes','Actes'], ['rapport','Rapport d\u2019activité']];

  return html`
    <div>
      <div class="eyebrow">Cabinet de la présidence</div>
      <h1 style="margin:6px 0 8px">Tout remonte ici, tout en repart</h1>
      <p class="muted" style="max-width:62ch">
        Le réseau adresse à la présidence ce qu\u2019il veut porter à sa
        connaissance, à toute échelle et sans filtre. La présidence répond
        par des actes : visas, considérants, articles. Un acte se signe, se
        notifie, et reste au recueil, que tout adhérent peut lire.
        ${signataire
          ? ' Vous signez.'
          : ' Vous préparez les projets ; la présidence les signe.'}
      </p>

      <div class="row" style="margin:28px 0 24px;gap:0;border-bottom:1px solid var(--filet);
        flex-wrap:wrap">
        ${tabs.map(([k,t]) => html`
          <button class="btn light" style=${'border:0;border-bottom:2px solid '+
            (onglet===k?'var(--nuit)':'transparent')+';border-radius:0;background:transparent'}
            onClick=${()=>{setOnglet(k);setMsg('')}}>${t}${
              k==='remontees' && tb.remontees_ouvertes ? ' ('+tb.remontees_ouvertes+')' : ''}${
              k==='actes' && projets.length ? ' ('+projets.length+')' : ''}</button>`)}
      </div>

      ${msg && html`<div class=${'alerte '+(msg.startsWith('Erreur')?'err':'ok')}
        style="margin-bottom:20px">${msg}</div>`}

      ${onglet === 'table' && html`<${CabinetEtat} tb=${tb} />`}
      ${onglet === 'remontees' && html`<${CabinetRemontees}
        remontees=${remontees} appel=${appel} />`}
      ${onglet === 'actes' && html`<${CabinetActes} p=${p} actes=${actes}
        projets=${projets} signataire=${signataire} appel=${appel} setMsg=${setMsg} />`}
      ${onglet === 'rapport' && html`<${Rapport} p=${p} />`}
    </div>`;
}

/* --- L'état de la fédération, vu d'en haut ------------------------------ */

        <div><div class="n" style="font-size:30px">${tb.encadrants}</div>

        ${alerte(tb.sans_president > 0,

          + 'Une structure sans président n\u2019a personne pour la représenter.',

        ${alerte(tb.sans_tresorier > 0,

        ${alerte(tb.en_attente > 0,

        ${alerte(tb.actes_a_controler > 0,

        ${alerte(tb.discipline_en_cours > 0,

        ${(tb.alertes + tb.arbitrages + tb.sans_president + tb.sans_tresorier

      </div>

      <p class="small muted" style="max-width:60ch">

        disciplinaires suivent leur circuit propre et les bulletins de vote
        n\u2019ont aucune politique de lecture : rien ici ne les ouvre.
      </p>
    </div>`;
}

/* --- Préparer, signer, abroger ------------------------------------------ */
function CabinetActes({ p, actes, projets, signataire, appel, setMsg }){
  const vierge = { type:'decision', objet:'', visas:'', considerants:'',
                   destinataire:'', poste:'', effet:'', territoire:'' };
  const [f, setF] = useState(vierge);
  const [articles, setArticles] = useState(['']);
  const [gens, setGens] = useState([]);
  const [postes, setPostes] = useState([]);
  const [terr, setTerr] = useState([]);
  const [ouvert, setOuvert] = useState(null);
  const [texte, setTexte] = useState(null);
  const maj = (k,v) => setF(o => ({...o, [k]: v}));

  useEffect(() => {
    db.from('v_annuaire').select('id,prenom,nom,fonction_nom,territoire_nom')
      .eq('statut','actif').order('nom').then(({data}) => setGens(data||[]));
    db.from('postes').select('code,nom,rang').eq('actif',true)
      .order('rang',{ascending:false}).then(({data}) => setPostes(data||[]));
    db.from('territoires').select('id,nom,echelle').order('nom')
      .then(({data}) => setTerr(data||[]));
  }, []);

  async function enregistrer(e){
    e.preventDefault();
    const arts = articles.map(a => a.trim()).filter(Boolean);
    if (arts.length === 0)
      return setMsg('Erreur : un acte sans article ne décide rien.');
    const ok = await appel('prendre_acte', {
      p_type: f.type, p_objet: f.objet, p_visas: f.visas || null,
      p_considerants: f.considerants || null, p_articles: arts,
      p_destinataire: f.destinataire || null, p_poste: f.poste || null,
      p_effet: f.effet || null, p_territoire: f.territoire || null
    }, 'Projet d\u2019acte enregistré. Il ne produit effet qu\u2019à la signature.');
    if (ok){ setF(vierge); setArticles(['']); }
  }

  async function lire(a){
    if (ouvert === a.id){ setOuvert(null); setTexte(null); return; }
    const { data } = await db.rpc('texte_acte', { p_id: a.id });
    setOuvert(a.id); setTexte(data);
  }

  function telecharger(){
    if (!texte) return;
    const l = [];
    l.push('FÉDÉRATION FRANÇAISE POUR LA CITOYENNETÉ ET L\u2019ÉGALITÉ DES CHANCES');
    l.push('Présidence de la fédération');
    l.push(''); l.push(texte.reference);
    l.push((TYPE_ACTE[texte.type] || texte.type).toUpperCase());
    l.push(''); l.push(texte.objet);
    l.push('Portée : ' + texte.portee); l.push('');
    if (texte.visas){ l.push(texte.visas); l.push(''); }
    if (texte.considerants){ l.push(texte.considerants); l.push(''); }
    (texte.articles||[]).forEach((a,i) => { l.push('Article '+(i+1)+' — '+a); l.push(''); });
    l.push('Prend effet le ' + jour(texte.prend_effet_le)); l.push('');

          <div class="row" style="gap:16px;align-items:flex-start">

              <select value=${f.destinataire}
                onChange=${e=>maj('destinataire', e.target.value)}>
                <option value="">— Aucun —</option>
                ${gens.map(g => html`<option value=${g.id}>

            ${f.type === 'nomination' && html`

/* --- Le recueil, application ouverte à tous ----------------------------- */
function Recueil(){
  const [actes, setActes] = useState([]);
  const [ouvert, setOuvert] = useState(null);
  const [texte, setTexte] = useState(null);

  useEffect(() => {
    db.rpc('recueil_actes', { p_filtre: 'en_vigueur' })
      .then(({data}) => setActes(data || []));
  }, []);

  async function lire(a){
    if (ouvert === a.id){ setOuvert(null); setTexte(null); return; }
    const { data } = await db.rpc('texte_acte', { p_id: a.id });
    setOuvert(a.id); setTexte(data);
  }
  function telecharger(){
    if (!texte) return;
    const l = ['FÉDÉRATION FRANÇAISE POUR LA CITOYENNETÉ ET L\u2019ÉGALITÉ DES CHANCES',
      'Présidence de la fédération', '', texte.reference,
      (TYPE_ACTE[texte.type] || texte.type).toUpperCase(), '', texte.objet,
      'Portée : ' + texte.portee, ''];
    if (texte.visas){ l.push(texte.visas); l.push(''); }
    if (texte.considerants){ l.push(texte.considerants); l.push(''); }
    (texte.articles||[]).forEach((a,i) => { l.push('Article '+(i+1)+' — '+a); l.push(''); });
    l.push('Prend effet le ' + jour(texte.prend_effet_le)); l.push('');
    l.push((texte.signataire || texte.auteur) + ', ' + texte.auteur_fonction);
    const url = URL.createObjectURL(new Blob([l.join('\n')],
      { type:'text/plain;charset=utf-8' }));
    const el = document.createElement('a');
    el.href = url; el.download = texte.reference + '.txt'; el.click();
    URL.revokeObjectURL(url);
  }

  return html`
    <div>
      <div class="eyebrow">Recueil des actes</div>
      <h1 style="margin:6px 0 8px">Ce que la fédération a décidé</h1>
      <p class="muted" style="max-width:62ch">
        Les actes pris par la présidence, en vigueur ou abrogés. Chacun
        indique sa portée, sa date d\u2019effet et son signataire. Un acte
        abrogé reste ici : on doit pouvoir savoir ce qui s\u2019appliquait hier.
      </p>
      <div style="margin-top:24px">
        <${RecueilListe} actes=${actes} ouvert=${ouvert} texte=${texte}
          lire=${lire} telecharger=${telecharger} abroger=${null} />
      </div>
    </div>`;
}

/* --- Porter au cabinet, depuis n'importe où ----------------------------- */
function VersLeCabinet(){
  const [ouvert, setOuvert] = useState(false);
  const [f, setF] = useState({ nature:'information', objet:'', corps:'' });
  const [msg, setMsg] = useState('');

  async function envoyer(e){
    e.preventDefault();
    const { data, error } = await db.rpc('flecher_vers_cabinet', {
      p_nature: f.nature, p_objet: f.objet, p_corps: f.corps,
      p_lien: location.hash || null
    });
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data.ok) return setMsg('Erreur : ' + data.message);
    setF({ nature:'information', objet:'', corps:'' });
    setMsg('Transmis au cabinet de la présidence.');
    setOuvert(false);
  }

  return html`
    <div class="panneau">
      <div class="tete spread">
        <h3 style="font-size:17px">Porter à la présidence</h3>
        <button class="btn sm light" onClick=${()=>setOuvert(!ouvert)}>
          ${ouvert ? 'Fermer' : 'Écrire'}</button>
      </div>
      ${msg && html`<div class=${'alerte '+(msg.startsWith('Erreur')?'err':'ok')}
        style="margin:16px 20px 0">${msg}</div>`}
      ${ouvert
        ? html`<form onSubmit=${envoyer} class="corps stack">
            <div class="field"><label>Nature</label>
              <select value=${f.nature}
                onChange=${e=>setF(o=>({...o,nature:e.target.value}))}>
                ${Object.entries(NATURE_REMONTEE).map(([k,v]) =>
                  html`<option value=${k}>${v}</option>`)}
              </select></div>
            <div class="field"><label>Objet</label>
              <input value=${f.objet}
                onInput=${e=>setF(o=>({...o,objet:e.target.value}))} /></div>
            <div class="field"><label>Ce que vous voulez porter à sa connaissance</label>
              <textarea value=${f.corps}
                onInput=${e=>setF(o=>({...o,corps:e.target.value}))}></textarea></div>
            <div><button class="btn">Transmettre</button></div>
          </form>`
        : html`<div class="corps small muted">
            Une information, une alerte, une proposition ou une demande
            d\u2019arbitrage. Elle arrive directement au cabinet, quelle que soit
            votre échelle, et y reste jusqu\u2019à ce qu\u2019on l\u2019ait traitée
            \u2014 elle ne se perd pas en conversation.</div>`}
    </div>`;
}

/* --- Le journal des envois ---------------------------------------------
   Qui, quand, vers qui, quel nom, quelle taille. Ni le message, ni le
   fichier : c'est une trace, pas une clé.
   --------------------------------------------------------------------- */
function JournalPieces({ setMsg }){
  const [l, setL] = useState([]);
  const [jours, setJours] = useState(30);
  const charger = useCallback(() =>
    db.rpc('journal_pieces', { p_jours: jours }).then(({data}) => setL(data||[])),
    [jours]);
  useEffect(() => { charger(); }, [charger]);

  const ko = n => n ? (n >= 1048576
    ? (n/1048576).toFixed(1) + ' Mo' : Math.round(n/1024) + ' ko') : '—';

  return html`
    <div class="panneau">
      <div class="tete spread">
        <h3 style="font-size:17px">Pièces échangées en messagerie</h3>
        <div class="row" style="gap:8px">
          <select value=${jours} style="width:auto;padding:5px 8px;font-size:13px"
            onChange=${e=>setJours(Number(e.target.value))}>
            <option value="7">7 jours</option>
            <option value="30">30 jours</option>
            <option value="90">90 jours</option>
          </select>
          <button class="btn sm light" onClick=${async ()=>{
            const { data } = await db.rpc('marquer_pieces_vues');
            if (data && data.ok) setMsg('Contrôle enregistré.');
          }}>J\u2019ai contrôlé</button>
        </div>
      </div>
      <div class="corps small muted" style="padding-bottom:0">
        Le journal dit qu\u2019un fichier est parti, de qui, vers qui et quand. Il
        ne donne ni le message, ni le moyen d\u2019ouvrir la pièce : la
        traçabilité n\u2019est pas un droit de lecture.
      </div>
      ${l.length === 0
        ? html`<div class="corps muted">Aucun envoi sur la période.</div>`
        : html`<div style="overflow-x:auto;padding:16px 20px">
            <table>
              <thead><tr><th>Date</th><th>De</th><th>Vers</th>
                <th>Fichier</th><th style="text-align:right">Taille</th></tr></thead>
              <tbody>
                ${l.map((x,i) => html`
                  <tr key=${i}>
                    <td class="small">${new Date(x.envoye_le).toLocaleString('fr-FR',
                      {day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</td>
                    <td><div>${x.auteur}</div>
                      <div class="small muted">${x.auteur_fonction}${
                        x.territoire ? ' · '+x.territoire : ''}</div></td>
                    <td class="small">${x.destinataires || '—'}</td>
                    <td class="small mono">${x.nom || 'sans nom'}</td>
                    <td class="small mono" style="text-align:right">${ko(x.taille)}</td>
                  </tr>`)}
              </tbody>
            </table>
          </div>`}
    </div>`;
}

function Espace({ session, sous }){
  const [p, setP] = useState(null);
  const [apps, setApps] = useState([]);
  const [demandes, setDemandes] = useState([]);
  const [chemin, setChemin] = useState('');
  const [blocage, setBlocage] = useState(null);
  const [directions, setDirections] = useState([]);
  const [attentes, setAttentes] = useState([]);
  const [menu, setMenu] = useState(false);
  const [pret, setPret] = useState(false);

  const charger = useCallback(async () => {
    const { data: profil } = await db.from('v_annuaire').select('*')
      .eq('id', session.user.id).maybeSingle();
    if (!profil){ setPret(true); return; }
    setP(profil);

    // La matrice décide de ce qui s'affiche, de ce qui est grisé, et de
    // ce qui n'apparaît pas du tout. Elle se règle dans Habilitations.
    const [{ data: liste }, { data: mesDem }, { data: dirs },
           { data: mesDroits }, { data: file }] = await Promise.all([
      db.rpc('mes_applications'),
      db.from('demandes').select('*').eq('profil_id', session.user.id)
        .order('cree_le',{ascending:false}),
      db.rpc('mes_directions'),
      db.rpc('mes_droits'),
      db.rpc('ce_qui_attend')
    ]);
    setApps((liste||[]).map(a => ({ ...a, actif: true })));
    setDirections(dirs || []);
    setDemandes(mesDem || []);
    setAttentes(file || []);
    // Les droits sont énoncés par la base. L'interface ne les devine plus :
    // `v_annuaire` ne les porte pas, la devinette était toujours fausse.
    profil.droits = (mesDroits || []).map(d => d.code);

    // Les postes occupés : ils ouvrent des droits que la fonction ne
    // donne pas — référent RGPD, ordonnateur, conseil de discipline…
    const { data: mp } = await db.rpc('mes_postes');
    profil.postes = mp || [];
    setP({ ...profil });

    // Un dossier incomplet retient le membre sur son compte : la
    // fédération ne peut pas travailler avec des fiches à trous.
    const { data: comp } = await db.rpc('completude_bloquante');
    setBlocage(comp && comp.bloquant ? comp.manques : null);

    if (profil.territoire_id){
      const { data } = await db.rpc('chemin_territoire', { cible: profil.territoire_id });
      setChemin(data || '');
    }
    setPret(true);
  }, [session.user.id]);

  useEffect(() => { charger(); }, [charger]);

  if (!pret) return html`<div class="vide" style="padding:120px">Chargement…</div>`;
  if (!p) return html`<div class="vide" style="padding:120px">
    Profil introuvable. <a href="#/" onClick=${()=>db.auth.signOut()}>Se déconnecter</a></div>`;
  if (p.statut === 'suspendu') return html`<${EspaceSuspendu} p=${p} />`;
  if (blocage && sous !== 'compte') return html`
    <div class="app">
      <${Flanc} p=${p} apps=${apps} directions=${directions} page="compte"
        ouvert=${false} fermer=${()=>{}} attentes=${attentes} />
      <main class="contenu"><${DossierIncomplet} p=${p} manques=${blocage} /></main>
    </div>`;
  if (p.statut !== 'actif') return html`<${EnAttente} p=${p} />`;

  const admin = p.niveau >= 90;
  const acces = c => apps.find(a => a.code === c && a.ouvert);
  const refus = html`<div class="alerte err">Cette application ne vous est pas ouverte.
    <a href="#/espace/demandes">Déposer une demande</a></div>`;

  let vue;
  if (sous.startsWith('groupe/')){
    const idG = sous.slice('groupe/'.length);
    return html`
      <div class="app">
        <${Flanc} p=${p} apps=${apps} directions=${directions} page="groupes"
          attentes=${attentes} />
        <main class="contenu">
          ${acces('groupes') ? html`<${Groupe} p=${p} id=${idG} />` : refus}
        </main>
      </div>`;
  }
  if (sous.startsWith('formation/')){
    const idF = sous.slice('formation/'.length);
    return html`
      <div class="app">
        <${Flanc} p=${p} apps=${apps} directions=${directions} page="formations"
          attentes=${attentes} />
        <main class="contenu">
          ${acces('formations') ? html`<${Formation} p=${p} id=${idF} />` : refus}
        </main>
      </div>`;
  }
  switch (sous){
    case '':           vue = html`<${TableauDeBord} p=${p} apps=${apps} chemin=${chemin}
                         demandes=${demandes} attentes=${attentes} />`; break;
    case 'mandats':    vue = html`<${MesMandats} p=${p} recharger=${charger} />`; break;
    case 'cabinet':    vue = acces('cabinet') ? html`<${Cabinet} p=${p} />` : refus; break;
    case 'recueil':    vue = html`<${Recueil} />`; break;
    case 'compte':     vue = html`<${MonCompte} p=${p} recharger=${charger} />`; break;
    case 'mon-dossier':vue = html`<${MonDossier} p=${p} entier=${true} />`; break;
    case 'referentiel':vue = html`<${Referentiel} />`; break;
    case 'engagement': vue = acces('engagement') ? html`<${Engagement} p=${p} />` : refus; break;
    case 'comite':     vue = acces('comite')
                       ? html`<${MonComite} p=${p} apps=${apps} />` : refus; break;
    case 'budget':     vue = acces('budget') ? html`<${Budget} p=${p} />` : refus; break;
    case 'publier':    vue = acces('publier') ? html`<${Publier} p=${p} />` : refus; break;
    case 'editeur':    vue = (admin || (p.postes||[]).length > 0)
                       ? html`<${EditeurFormations} p=${p} />` : refus; break;
    case 'rapport':    vue = acces('rapport') ? html`<${Rapport} p=${p} />` : refus; break;
    case 'passeport':  vue = html`<${Passeport} p=${p} />`; break;
    case 'conformite': vue = html`<${Conformite} p=${p} />`; break;
    case 'parcours':   vue = acces('parcours')
                          ? html`<${ParcoursAdherent} p=${p} />` : refus; break;
    case 'pilotage':   vue = acces('pilotage')
                          ? html`<${Pilotage} p=${p} />` : refus; break;
    case 'assemblees': vue = acces('assemblees')
                          ? html`<${Assemblees} p=${p} />` : refus; break;
    case 'chancellerie': vue = acces('chancellerie')
                          ? html`<${Chancellerie} p=${p} />` : refus; break;
    case 'communication': vue = acces('communication')
                          ? html`<${Communication} p=${p} />` : refus; break;
    case 'discipline': vue = acces('discipline') ? html`<${Discipline} p=${p} />` : refus; break;
    case 'demandes':   vue = html`<${MesDemandes} p=${p} apps=${apps} demandes=${demandes} recharger=${charger} />`; break;
    case 'annuaire':   vue = acces('annuaire') ? html`<${Annuaire} p=${p} />` : refus; break;
    case 'validation': vue = (admin || (p.droits||[]).includes('membres.valider')
                          || (p.droits||[]).includes('rgpd.alertes'))
                          ? html`<${Validation} p=${p} />` : refus; break;
    case 'reseau':     vue = admin ? html`<${Habilitations} p=${p} />` : refus; break;
    case 'vitrine':    vue = admin ? html`<${VitrineAdmin} />` : refus; break;
    case 'habilitations': vue = (admin || p.droits?.includes('habilitations.gerer'))
                          ? html`<${Habilitations} p=${p} />` : refus; break;
    case 'formations': vue = acces('formations') ? html`<${Formations} p=${p} />` : refus; break;
    case 'groupes':    vue = acces('groupes') ? html`<${Groupes} p=${p} />` : refus; break;
    case 'messagerie': vue = acces('messagerie') ? html`<${Messagerie} p=${p} />` : refus; break;
    case 'notes_frais':vue = acces('notes_frais') ? html`<${NotesFrais} p=${p} />` : refus; break;
    case 'tresorerie': vue = acces('tresorerie')
                       ? html`<${Finances} p=${p} role="tresorerie" />` : refus; break;
    case 'ordonnancement': vue = acces('ordonnancement')
                       ? html`<${Finances} p=${p} role="ordonnancement" />` : refus; break;
    case 'ressources': vue = acces('ressources')
                       ? html`<${Ressources} p=${p} />` : refus; break;
    default:           vue = html`<div class="vide">Page inconnue.</div>`;
  }

  return html`
    <div class="app">
      <div class="bascule">
        <${Logo} baseline=${false} />
        <div class="row" style="gap:10px">
          <a href="#/espace/compte">
            <${Portrait} chemin=${p.photo_url} nom=${nomComplet(p)} taille=${38} />
          </a>
          <button aria-label="Menu" onClick=${()=>setMenu(true)}>
            <span class="barres"></span></button>
        </div>
      </div>
      <div class=${'voile'+(menu?' ouvert':'')} onClick=${()=>setMenu(false)}></div>
      <${Flanc} p=${p} apps=${apps} directions=${directions} page=${sous}
        ouvert=${menu} fermer=${()=>setMenu(false)} attentes=${attentes} />
      <main class="contenu">${vue}</main>
    </div>`;
}

/* =====================================================================
   6. RACINE
   ===================================================================== */
function Site(){
  const route = useRoute();
  const [session, setSession] = useState(undefined);
  const [txt, setTxt] = useState(null);

  useEffect(() => {
    db.auth.getSession().then(({data}) => setSession(data.session));
    const { data:{ subscription } } = db.auth.onAuthStateChange((_e,s) => setSession(s));
    return () => subscription.unsubscribe();
  }, []);

  useEffect(() => {
    db.from('contenus').select('cle,valeur').then(({data}) =>
      setTxt(Object.fromEntries((data||[]).map(c => [c.cle, c.valeur]))));
  }, []);

  if (session === undefined || txt === null)
    return html`<div class="vide" style="padding:140px">Chargement…</div>`;

  // Espace membre : mise en page propre, sans l'entête publique.
  if (route.startsWith('/espace')){
    if (!session) return html`
      <${EntetePublique} route=${route} session=${session} />
      <${Connexion} />
      <${Pied} txt=${txt} />`;
    const sous = route.replace('/espace','').replace(/^\//,'');
    return html`<${Espace} session=${session} sous=${sous} />`;
  }

  if (route.startsWith('/appel/')){
    return html`
      <${EntetePublique} route=${route} session=${session} />
      <${AppelPublic} token=${route.slice('/appel/'.length)} />
      <${Pied} txt=${txt} />`;
  }

  if (route.startsWith('/actualite/')){
    return html`
      <${EntetePublique} route=${route} session=${session} />
      <${PageArticle} slug=${route.slice('/actualite/'.length)} />
      <${Pied} txt=${txt} />`;
  }

  let page;
  switch (route){
    case '/':                 page = html`<${Accueil} txt=${txt} />`; break;
    case '/association':      page = html`<${Association} txt=${txt} />`; break;
    case '/actions':          page = html`<${Actions} />`; break;
    case '/reseau':           page = html`<${Reseau} />`; break;
    case '/rejoindre':        page = html`<${Rejoindre} />`; break;
    case '/contact':          page = html`<${Contact} txt=${txt} />`; break;
    case '/actualites':       page = html`<${PageActualites} />`; break;
    case '/inscription':      page = session ? html`<${Accueil} txt=${txt} />` : html`<${Inscription} />`; break;
    case '/mentions':         page = html`<${PageTexte} titre="Mentions légales" corps=${txt.mentions} />`; break;
    case '/confidentialite':  page = html`<${PageTexte} titre="Politique de confidentialité" corps=${txt.confidentialite} />`; break;
    default:                  page = html`<${PageTexte} titre="Page introuvable"
                                  corps="Le lien que vous avez suivi ne mène nulle part." />`;
  }

  return html`
    <${EntetePublique} route=${route} session=${session} />
    ${page}
    <${Pied} txt=${txt} />`;
}

render(html`<${Site} />`, document.getElementById('racine'));
</script>
</body>
</html>
