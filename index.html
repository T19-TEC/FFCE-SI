function Formation({ p, id }){
  const [f, setF] = useState(null);
  const [parcours, setParcours] = useState([]);
  const [faites, setFaites] = useState({});
  const [ouverte, setOuverte] = useState(null);   // leçon affichée

  const charger = useCallback(async () => {
    const { data: form } = await db.from('formations').select('*').eq('id', id).maybeSingle();
    setF(form);
    const { data: par } = await db.from('v_parcours').select('*')
      .eq('formation_id', id).order('rang');
    setParcours(par || []);
    const { data: pr } = await db.from('progression').select('lecon_id,score')
      .eq('profil_id', p.id);
    setFaites(Object.fromEntries((pr||[]).map(x => [x.lecon_id, x.score])));
  }, [id, p.id]);

  useEffect(() => { charger(); }, [charger]);

  if (!f) return html`<div class="vide">Chargement…</div>`;

  const total = parcours.length;
  const nbFaites = parcours.filter(l => l.lecon_id in faites).length;
  const pct = total ? Math.round(nbFaites / total * 100) : 0;

  // Une leçon est ouverte si la précédente est achevée.
  const estOuverte = i => i === 0 || (parcours[i-1] && parcours[i-1].lecon_id in faites);

  if (ouverte){
    const i = parcours.findIndex(l => l.lecon_id === ouverte);
    return html`<${Lecon} lecon=${parcours[i]} suivante=${parcours[i+1]}
      dejaFaite=${ouverte in faites}
      fermer=${() => { setOuverte(null); charger(); }}
      allerSuivante=${() => { setOuverte(parcours[i+1]?.lecon_id || null); charger(); }} />`;
  }

  const modules = [];
  parcours.forEach(l => {
    let m = modules.find(x => x.id === l.module_id);
    if (!m){ m = { id: l.module_id, titre: l.module_titre, lecons: [] }; modules.push(m); }
    m.lecons.push(l);
  });

  const picto = { lecture:'Lecture', video:'Vidéo', document:'Document', quiz:'Quiz' };

  return html`
    <div>
      <a class="small" href="#/espace/formations">← Toutes les formations</a>
      <h1 style="margin:12px 0 8px">${f.titre}</h1>
      <p class="muted" style="max-width:60ch">${f.description || f.resume || ''}</p>

      <div class="panneau" style="margin-top:24px">
        <div class="corps">
          <div class="spread">
            <span class="small">${nbFaites} leçon${nbFaites>1?'s':''} sur ${total}</span>
            <span class="mono">${pct} %</span>
          </div>
          <div class="jauge" style="margin-top:10px"><i style=${'width:'+pct+'%'}></i></div>
          ${pct === 100 && html`<div class="alerte ok" style="margin-top:16px">
            Parcours achevé. Votre certification est inscrite à votre compte.</div>`}
        </div>
      </div>

      ${modules.map(m => html`
        <div class="panneau" style="margin-top:24px">
          <div class="tete"><h3 style="font-size:17px">${m.titre}</h3></div>
          ${m.lecons.map(l => {
            const i = parcours.findIndex(x => x.lecon_id === l.lecon_id);
            const faite = l.lecon_id in faites;
            const ok = estOuverte(i);
            return html`
              <div class="ligne">
                <div>
                  <div style=${ok ? '' : 'opacity:.5'}>${l.lecon_titre}</div>
                  <div class="small muted">
                    ${picto[l.type]}${l.duree_min ? ' · ' + l.duree_min + ' min' : ''}
                    ${faite && faites[l.lecon_id] != null ? ' · ' + faites[l.lecon_id] + ' %' : ''}
                  </div>
                </div>
                ${faite
                  ? html`<div class="row"><span class="tag vert">Achevée</span>
                      <button class="btn sm light" onClick=${()=>setOuverte(l.lecon_id)}>Revoir</button></div>`
                  : ok
                    ? html`<button class="btn sm" onClick=${()=>setOuverte(l.lecon_id)}>Commencer</button>`
                    : html`<span class="tag">Verrouillée</span>`}
              </div>`;
          })}
        </div>`)}
    </div>`;
}

function Lecon({ lecon, suivante, dejaFaite, fermer, allerSuivante }){
  const [detail, setDetail] = useState(null);
  const [questions, setQuestions] = useState([]);
  const [choix, setChoix] = useState({});      // question_id → Set d'id de réponses
  const [resultat, setResultat] = useState(null);
  const [msg, setMsg] = useState('');
  const [envoi, setEnvoi] = useState(false);

  useEffect(() => { (async () => {
    const { data: l } = await db.from('lecons').select('*').eq('id', lecon.lecon_id).maybeSingle();
    setDetail(l);
    if (l && l.type === 'quiz'){
      const { data: qs } = await db.from('questions').select('*')
        .eq('lecon_id', l.id).order('ordre');
      const avec = await Promise.all((qs||[]).map(async q => {
        const { data: rs } = await db.from('v_choix').select('id,texte,ordre')
          .eq('question_id', q.id).order('ordre');
        return { ...q, choix: rs || [] };
      }));
      setQuestions(avec);
    }
  })(); }, [lecon.lecon_id]);

  if (!detail) return html`<div class="vide">Chargement…</div>`;

  function cocher(qid, rid){
    setChoix(c => {
      const s = new Set(c[qid] || []);
      s.has(rid) ? s.delete(rid) : s.add(rid);
      return { ...c, [qid]: s };
    });
  }

  async function achever(){
    setEnvoi(true); setMsg('');
    const { data, error } = await db.rpc('terminer_lecon', { p_lecon: detail.id });
    setEnvoi(false);
    if (error) return setMsg(error.message);
    if (!data.ok) return setMsg(data.message);
    suivante ? allerSuivante() : fermer();
  }

  async function corriger(){
    setEnvoi(true); setMsg('');
    const tous = Object.values(choix).flatMap(s => [...s]);
    const { data, error } = await db.rpc('valider_quiz',
      { p_lecon: detail.id, p_choix: tous });
    setEnvoi(false);
    if (error) return setMsg(error.message);
    if (!data.ok) return setMsg(data.message);
    setResultat(data);
  }

  return html`
    <div>
      <a class="small" href="#" onClick=${e=>{e.preventDefault();fermer()}}>← Retour au parcours</a>
      <div class="eyebrow" style="margin-top:16px">${lecon.module_titre}</div>
      <h1 style="margin:6px 0 24px">${detail.titre}</h1>

      ${detail.type === 'lecture' && html`
        <div class="panneau"><div class="corps"
          style="white-space:pre-wrap;font-size:16px;max-width:62ch">${detail.contenu||''}</div></div>`}

      ${detail.type === 'video' && html`
        <div class="panneau"><div class="corps">
          <p><a class="btn" href=${detail.url} target="_blank" rel="noopener">Ouvrir la vidéo ↗</a></p>
          ${detail.contenu && html`<div style="white-space:pre-wrap;margin-top:16px">${detail.contenu}</div>`}
        </div></div>`}

      ${detail.type === 'document' && html`
        <div class="panneau"><div class="corps">
          <p><a class="btn" href=${detail.url} target="_blank" rel="noopener">Ouvrir le document ↗</a></p>
          ${detail.contenu && html`<div style="white-space:pre-wrap;margin-top:16px">${detail.contenu}</div>`}
        </div></div>`}

      ${detail.type === 'quiz' && html`
        <div>
          ${resultat && html`
            <div class=${'alerte ' + (resultat.reussi ? 'ok' : 'err')} style="margin-bottom:24px">
              ${resultat.justes} bonne${resultat.justes>1?'s':''} réponse${resultat.justes>1?'s':''}
              sur ${resultat.total} — ${resultat.score} %.
              ${resultat.reussi
                ? ' Quiz validé.'
                : ' Il en faut ' + resultat.seuil + ' % pour valider. Reprenez vos réponses.'}
            </div>`}

          ${questions.map((q, n) => html`
            <div class="panneau" style="margin-bottom:16px">
              <div class="corps">
                <div class="mono muted">Question ${n+1} sur ${questions.length}</div>
                <div style="font-size:16px;margin:8px 0 16px">${q.enonce}</div>
                ${q.choix.map(r => html`
                  <label class="row" style="text-transform:none;letter-spacing:0;
                      font-size:15px;color:var(--encre);padding:6px 0;margin:0;cursor:pointer">
                    <input type="checkbox" style="width:auto"
                      checked=${(choix[q.id]||new Set()).has(r.id)}
                      onChange=${()=>cocher(q.id, r.id)} />
                    <span>${r.texte}</span>
                  </label>`)}
                ${q.aide && html`<p class="small muted" style="margin:12px 0 0">${q.aide}</p>`}
              </div>
            </div>`)}
          <p class="small muted">Une question peut appeler plusieurs réponses.</p>
        </div>`}

      ${msg && html`<div class="alerte err" style="margin-top:24px">${msg}</div>`}

      <div class="row" style="margin-top:32px">
        ${detail.type === 'quiz'
          ? (resultat && resultat.reussi
              ? (suivante
                  ? html`<button class="btn" onClick=${allerSuivante}>Leçon suivante</button>`
                  : html`<button class="btn" onClick=${fermer}>Terminer le parcours</button>`)
              : html`<button class="btn" onClick=${corriger} disabled=${envoi}>
                  ${envoi ? 'Correction…' : (resultat ? 'Corriger à nouveau' : 'Valider mes réponses')}</button>`)
          : (dejaFaite
              ? (suivante
                  ? html`<button class="btn" onClick=${allerSuivante}>Leçon suivante</button>`
                  : html`<button class="btn" onClick=${fermer}>Retour au parcours</button>`)
              : html`<button class="btn" onClick=${achever} disabled=${envoi}>
                  ${envoi ? 'Enregistrement…' : 'J\u2019ai terminé cette leçon'}</button>`)}
        <button class="btn light" onClick=${fermer}>Revenir au parcours</button>
      </div>
    </div>`;
}


/* =====================================================================
   5 ter. GROUPES DE TRAVAIL
   Le catalogue, l'entrée dans un groupe, les documents, les tâches.
   Un groupe peut exiger une certification : la formation conditionne
   alors l'accès au projet.
   ===================================================================== */

function Groupes({ p }){
  const [liste, setListe] = useState(null);
  const [miens, setMiens] = useState({});
  const [certifs, setCertifs] = useState([]);
  const [terr, setTerr] = useState([]);
  const [creer, setCreer] = useState(false);
  const [f, setF] = useState({nom:'',objet:'',territoire:'',certification:'',niveau:'10',ouvert:'true'});
  const [msg, setMsg] = useState('');

  const peutCreer = p.echelon >= 3 || p.niveau >= 50;

  const charger = useCallback(async () => {
    const [{ data: gs }, { data: ms }, { data: cs }, { data: ts }] = await Promise.all([
      db.from('v_groupes').select('*').eq('statut','actif').order('nom'),
      db.from('gt_membres').select('groupe_id,role,statut').eq('profil_id', p.id),
      db.from('certifications').select('code,nom').eq('actif', true).order('nom'),
      db.from('territoires').select('id,nom,echelle').order('echelle').order('nom')
    ]);
    setListe(gs || []);
    setMiens(Object.fromEntries((ms||[]).map(m => [m.groupe_id, m])));
    setCertifs(cs || []); setTerr(ts || []);
  }, [p.id]);

  useEffect(() => { charger(); }, [charger]);

  async function rejoindre(id){
    setMsg('');
    const { data, error } = await db.rpc('rejoindre_groupe', { p_groupe: id });
    if (error) return setMsg(error.message);
    if (!data.ok) return setMsg(data.message);
    charger();
  }

  async function repondre(id, oui){
    await db.rpc('repondre_invitation', { p_groupe: id, p_accepte: oui });
    charger();
  }

  async function envoyerCreation(e){
    e.preventDefault(); setMsg('');
    const { data, error } = await db.rpc('creer_groupe', {
      p_nom: f.nom, p_objet: f.objet,
      p_territoire: f.territoire || null,
      p_certification: f.certification || null,
      p_niveau_min: Number(f.niveau),
      p_ouvert: f.ouvert === 'true'
    });
    if (error) return setMsg(error.message);
    if (!data.ok) return setMsg(data.message);
    setCreer(false); setF({nom:'',objet:'',territoire:'',certification:'',niveau:'10',ouvert:'true'});
    aller('/espace/groupe/' + data.id);
  }

  if (!liste) return html`<div class="vide">Chargement…</div>`;

  const invitations = liste.filter(g => miens[g.id]?.statut === 'invite');
  const mesGroupes  = liste.filter(g => miens[g.id]?.statut === 'actif');
  const autres      = liste.filter(g => !miens[g.id] || miens[g.id].statut === 'parti');

  const carteGroupe = (g, action) => html`
    <div class="ligne">
      <div style="flex:1;min-width:220px">
        <div>${g.nom}</div>
        <div class="small muted">${g.objet || ''}</div>
        <div class="row" style="margin-top:8px;gap:6px">
          <span class="tag">${g.nb_membres} membre${g.nb_membres>1?'s':''}</span>
          ${g.territoire_nom && html`<span class="tag">${g.territoire_nom}</span>`}
          ${g.certification_nom && html`<span class="tag or">${g.certification_nom} requis</span>`}
          ${!g.ouvert && html`<span class="tag">Sur invitation</span>`}
        </div>
      </div>
      ${action}
    </div>`;

  return html`
    <div>
      <div class="spread">
        <div>
          <div class="eyebrow">Groupes de travail</div>
          <h1 style="margin:6px 0 0">Projets et chantiers</h1>
        </div>
        ${peutCreer && html`<button class="btn" onClick=${()=>setCreer(c=>!c)}>
          ${creer ? 'Annuler' : 'Créer un groupe'}</button>`}
      </div>
      <p class="muted" style="max-width:58ch;margin-top:12px">
        Certains groupes exigent une certification. Vous l\u2019obtenez en
        achevant la formation correspondante.
      </p>

      ${msg && html`<div class="alerte err" style="margin-top:24px">${msg}</div>`}

      ${creer && html`
        <form onSubmit=${envoyerCreation} class="panneau" style="margin-top:24px">
          <div class="tete"><h3 style="font-size:17px">Nouveau groupe</h3></div>
          <div class="corps stack">
            <div class="field"><label>Nom</label>
              <input required value=${f.nom} onInput=${e=>setF(o=>({...o,nom:e.target.value}))} /></div>
            <div class="field"><label>Objet</label>
              <textarea required value=${f.objet}
                onInput=${e=>setF(o=>({...o,objet:e.target.value}))}
                placeholder="À quoi sert ce groupe, en deux phrases."></textarea></div>
            <div class="field"><label>Périmètre</label>
              <select value=${f.territoire} onChange=${e=>setF(o=>({...o,territoire:e.target.value}))}>
                <option value="">National — ouvert à tous</option>
                ${terr.map(t => html`<option value=${t.id}>${t.nom} (${t.echelle})</option>`)}
              </select></div>
            <div class="field"><label>Certification exigée</label>
              <select value=${f.certification} onChange=${e=>setF(o=>({...o,certification:e.target.value}))}>
                <option value="">Aucune</option>
                ${certifs.map(c => html`<option value=${c.code}>${c.nom}</option>`)}
              </select></div>
            <div class="field"><label>Entrée</label>
              <select value=${f.ouvert} onChange=${e=>setF(o=>({...o,ouvert:e.target.value}))}>
                <option value="true">Libre — on rejoint seul</option>
                <option value="false">Sur invitation du responsable</option>
              </select></div>
            <div><button class="btn">Créer le groupe</button></div>
            <p class="small muted">Vous en serez le responsable.</p>
          </div>
        </form>`}

      ${invitations.length > 0 && html`
        <div class="panneau" style="margin-top:24px">
          <div class="tete"><h3 style="font-size:17px">Invitations reçues</h3>
            <span class="tag bleu">${invitations.length}</span></div>
          ${invitations.map(g => carteGroupe(g, html`
            <div class="row">
              <button class="btn sm" onClick=${()=>repondre(g.id,true)}>Accepter</button>
              <button class="btn sm light" onClick=${()=>repondre(g.id,false)}>Décliner</button>
            </div>`))}
        </div>`}

      <div class="panneau" style="margin-top:24px">
        <div class="tete"><h3 style="font-size:17px">Mes groupes</h3>
          <span class="tag">${mesGroupes.length}</span></div>
        ${mesGroupes.length === 0
          ? html`<div class="vide">Vous ne participez à aucun groupe pour l\u2019instant.</div>`
          : mesGroupes.map(g => carteGroupe(g, html`
              <div class="row">
                ${miens[g.id]?.role === 'responsable' && html`<span class="tag or">Responsable</span>`}
                <a class="btn sm" href=${'#/espace/groupe/'+g.id}>Ouvrir</a>
              </div>`))}
      </div>

      <div class="panneau" style="margin-top:24px">
        <div class="tete"><h3 style="font-size:17px">Autres groupes</h3></div>
        ${autres.length === 0
          ? html`<div class="vide">Rien d\u2019autre à rejoindre.</div>`
          : autres.map(g => carteGroupe(g,
              g.ouvert
                ? html`<button class="btn sm light" onClick=${()=>rejoindre(g.id)}>Rejoindre</button>`
                : html`<span class="tag">Sur invitation</span>`))}
      </div>
    </div>`;
}

function Groupe({ p, id }){
  const [g, setG] = useState(null);
  const [onglet, setOnglet] = useState('taches');
  const [membres, setMembres] = useState([]);
  const [docs, setDocs] = useState([]);
  const [taches, setTaches] = useState([]);
  const [gens, setGens] = useState({});     // id → profil, pour les noms
  const [msg, setMsg] = useState('');
  const [refuse, setRefuse] = useState('');

  const charger = useCallback(async () => {
    const { data: gr } = await db.from('v_groupes').select('*').eq('id', id).maybeSingle();
    setG(gr);
    if (!gr) return;

    const { data: ms } = await db.from('gt_membres').select('*').eq('groupe_id', id);
    setMembres(ms || []);

    const [{ data: ds }, { data: ts }] = await Promise.all([
      db.from('gt_documents').select('*').eq('groupe_id', id).order('cree_le', {ascending:false}),
      db.from('gt_taches').select('*').eq('groupe_id', id).order('echeance', {nullsFirst:false})
    ]);
    setDocs(ds || []); setTaches(ts || []);

    // gt_taches pointe deux fois vers profils : on lit les noms à part.
    const ids = [...new Set([
      ...(ms||[]).map(m => m.profil_id),
      ...(ts||[]).map(t => t.assigne_a).filter(Boolean),
      ...(ds||[]).map(d => d.depose_par).filter(Boolean)
    ])];
    if (ids.length){
      const { data: ps } = await db.from('v_annuaire')
        .select('id,prenom,nom,matricule,fonction_nom,echelon').in('id', ids);
      setGens(Object.fromEntries((ps||[]).map(x => [x.id, x])));
    }
  }, [id]);

  useEffect(() => { charger(); }, [charger]);

  useEffect(() => { (async () => {
    const { data } = await db.rpc('obstacle_groupe', { p_groupe: id });
    setRefuse(data || '');
  })(); }, [id]);

  if (!g) return html`<div class="vide">Groupe introuvable ou fermé.</div>`;

  const moi = membres.find(m => m.profil_id === p.id && m.statut === 'actif');
  const responsable = moi?.role === 'responsable' || p.niveau >= 90;

  if (!moi) return html`
    <div>
      <a class="small" href="#/espace/groupes">← Tous les groupes</a>
      <h1 style="margin:12px 0 8px">${g.nom}</h1>
      <p class="muted" style="max-width:58ch">${g.objet||''}</p>
      <div class="alerte" style="margin-top:24px">
        ${refuse
          ? refuse
          : (g.ouvert
              ? 'Vous ne participez pas encore à ce groupe.'
              : 'Ce groupe se rejoint sur invitation de son responsable.')}
      </div>
      ${!refuse && g.ouvert && html`
        <div style="margin-top:24px">
          <button class="btn" onClick=${async ()=>{
            const { data } = await db.rpc('rejoindre_groupe', { p_groupe: id });
            if (data?.ok) charger(); else setMsg(data?.message||'');
          }}>Rejoindre ce groupe</button>
        </div>`}
      ${msg && html`<div class="alerte err" style="margin-top:16px">${msg}</div>`}
    </div>`;

  return html`
    <div>
      <a class="small" href="#/espace/groupes">← Tous les groupes</a>
      <div class="spread" style="margin-top:12px">
        <div>
          <h1>${g.nom}</h1>
          <div class="row" style="margin-top:8px;gap:6px">
            <span class="tag">${g.nb_membres} membre${g.nb_membres>1?'s':''}</span>
            ${g.territoire_nom && html`<span class="tag">${g.territoire_nom}</span>`}
            ${g.certification_nom && html`<span class="tag or">${g.certification_nom}</span>`}
            ${responsable && html`<span class="tag or">Vous êtes responsable</span>`}
          </div>
        </div>
      </div>
      <p class="muted" style="max-width:60ch;margin-top:16px">${g.objet||''}</p>

      <div style="margin-top:24px">
        <button class="btn light" onClick=${async ()=>{
          const { data } = await db.rpc('conversation_groupe', { p_groupe: id });
          if (data?.ok) aller('/espace/messagerie'); else setMsg(data?.message||'');
        }}>Ouvrir la discussion du groupe</button>
      </div>

      <div class="row" style="margin:32px 0 24px;gap:0;border-bottom:1px solid var(--filet)">
        ${[['taches','Tâches'],['documents','Documents'],['membres','Membres']].map(([k,t]) => html`
          <button class="btn light" style=${'border:0;border-bottom:2px solid '+
            (onglet===k?'var(--encre)':'transparent')+';border-radius:0;background:transparent'}
            onClick=${()=>setOnglet(k)}>${t}</button>`)}
      </div>

      ${msg && html`<div class="alerte err" style="margin-bottom:16px">${msg}</div>`}

      ${onglet === 'taches' && html`<${GtTaches} p=${p} groupe=${g} taches=${taches}
        membres=${membres} gens=${gens} responsable=${responsable} recharger=${charger} />`}
      ${onglet === 'documents' && html`<${GtDocuments} p=${p} groupe=${g} docs=${docs}
        gens=${gens} responsable=${responsable} recharger=${charger} />`}
      ${onglet === 'membres' && html`<${GtMembres} p=${p} groupe=${g} membres=${membres}
        gens=${gens} responsable=${responsable} recharger=${charger} />`}
    </div>`;
}

function GtTaches({ p, groupe, taches, membres, gens, responsable, recharger }){
  const [ouvrir, setOuvrir] = useState(false);
  const [f, setF] = useState({titre:'',description:'',assigne:'',echeance:'',priorite:'normale'});
  const [msg, setMsg] = useState('');

  const actifs = membres.filter(m => m.statut === 'actif');

  async function ajouter(e){
    e.preventDefault(); setMsg('');
    const { error } = await db.from('gt_taches').insert({
      groupe_id: groupe.id, titre: f.titre, description: f.description || null,
      assigne_a: f.assigne || null, echeance: f.echeance || null,
      priorite: f.priorite, cree_par: p.id
    });
    if (error) return setMsg(error.message);
    setF({titre:'',description:'',assigne:'',echeance:'',priorite:'normale'});
    setOuvrir(false); recharger();
  }

  async function changer(t, statut){
    const { error } = await db.from('gt_taches').update({
      statut, faite_le: statut === 'faite' ? new Date().toISOString() : null
    }).eq('id', t.id);
    if (error) setMsg(error.message);
    recharger();
  }

  const enCours = taches.filter(t => t.statut === 'a_faire' || t.statut === 'en_cours');
  const closes  = taches.filter(t => t.statut === 'faite' || t.statut === 'abandonnee');
  const retard  = t => t.echeance && new Date(t.echeance) < new Date() && t.statut !== 'faite';

  const ligneTache = t => html`
    <div class="ligne">
      <div style="flex:1;min-width:220px">
        <div style=${t.statut==='faite'||t.statut==='abandonnee' ? 'opacity:.55' : ''}>${t.titre}</div>
        ${t.description && html`<div class="small muted">${t.description}</div>`}
        <div class="row" style="margin-top:8px;gap:6px">
          ${t.assigne_a
            ? html`<span class="tag bleu">${nomComplet(gens[t.assigne_a]||{})}</span>`
            : html`<span class="tag">Non assignée</span>`}
          ${t.echeance && html`<span class=${'tag'+(retard(t)?' rouge':'')}>
            ${retard(t)?'En retard · ':''}${jour(t.echeance)}</span>`}
          ${t.priorite === 'haute' && html`<span class="tag rouge">Prioritaire</span>`}
        </div>
      </div>
      <div class="row">
        ${t.statut === 'a_faire' && html`
          <button class="btn sm light" onClick=${()=>changer(t,'en_cours')}>Commencer</button>`}
        ${(t.statut === 'a_faire' || t.statut === 'en_cours') && html`
          <button class="btn sm" onClick=${()=>changer(t,'faite')}>Terminer</button>`}
        ${(t.statut === 'faite' || t.statut === 'abandonnee') && html`
          <button class="btn sm light" onClick=${()=>changer(t,'a_faire')}>Rouvrir</button>`}
      </div>
    </div>`;

  return html`
    <div>
      <div class="spread" style="margin-bottom:16px">
        <span class="small muted">${enCours.length} tâche${enCours.length>1?'s':''} en cours</span>
        <button class="btn sm" onClick=${()=>setOuvrir(o=>!o)}>
          ${ouvrir ? 'Annuler' : 'Ajouter une tâche'}</button>
      </div>
      ${msg && html`<div class="alerte err" style="margin-bottom:16px">${msg}</div>`}

      ${ouvrir && html`
        <form onSubmit=${ajouter} class="panneau" style="margin-bottom:24px">
          <div class="corps stack">
            <div class="field"><label>Intitulé</label>
              <input required value=${f.titre} onInput=${e=>setF(o=>({...o,titre:e.target.value}))} /></div>
            <div class="field"><label>Précisions</label>
              <textarea value=${f.description} onInput=${e=>setF(o=>({...o,description:e.target.value}))} /></div>
            <div class="row" style="gap:16px;align-items:flex-start">
              <div class="field" style="flex:1;min-width:180px"><label>Assignée à</label>
                <select value=${f.assigne} onChange=${e=>setF(o=>({...o,assigne:e.target.value}))}>
                  <option value="">Personne</option>
                  ${actifs.map(m => html`<option value=${m.profil_id}>
                    ${nomComplet(gens[m.profil_id]||{})}</option>`)}
                </select></div>
              <div class="field" style="flex:1;min-width:140px;margin-top:0"><label>Échéance</label>
                <input type="date" value=${f.echeance}
                  onInput=${e=>setF(o=>({...o,echeance:e.target.value}))} /></div>
              <div class="field" style="flex:1;min-width:140px;margin-top:0"><label>Priorité</label>
                <select value=${f.priorite} onChange=${e=>setF(o=>({...o,priorite:e.target.value}))}>
                  <option value="basse">Basse</option>
                  <option value="normale">Normale</option>
                  <option value="haute">Haute</option>
                </select></div>
            </div>
            <div><button class="btn">Ajouter</button></div>
          </div>
        </form>`}

      <div class="panneau">
        <div class="tete"><h3 style="font-size:17px">À faire</h3></div>
        ${enCours.length === 0
          ? html`<div class="vide">Rien en cours. C\u2019est peut-être le moment d\u2019ajouter une tâche.</div>`
          : enCours.map(ligneTache)}
      </div>

      ${closes.length > 0 && html`
        <div class="panneau" style="margin-top:24px">
          <div class="tete"><h3 style="font-size:17px">Terminées</h3>
            <span class="tag">${closes.length}</span></div>
          ${closes.map(ligneTache)}
        </div>`}
    </div>`;
}

function GtDocuments({ p, groupe, docs, gens, responsable, recharger }){
  const [ouvrir, setOuvrir] = useState(false);
  const [f, setF] = useState({titre:'',type:'drive',url:'',description:''});
  const [msg, setMsg] = useState('');

  const libelle = { lien:'Lien', drive:'Drive', docs:'Document', sheets:'Tableur',
                    agenda:'Agenda', note:'Note' };

  async function ajouter(e){
    e.preventDefault(); setMsg('');
    const { error } = await db.from('gt_documents').insert({
      groupe_id: groupe.id, titre: f.titre, type: f.type,
      url: f.url || null, description: f.description || null, depose_par: p.id
    });
    if (error) return setMsg(error.message);
    setF({titre:'',type:'drive',url:'',description:''}); setOuvrir(false); recharger();
  }

  async function retirer(d){
    if (!confirm('Retirer « ' + d.titre + ' » de ce groupe ?')) return;
    await db.from('gt_documents').delete().eq('id', d.id);
    recharger();
  }

  return html`
    <div>
      <div class="spread" style="margin-bottom:16px">
        <span class="small muted">
          Les fichiers restent sur le Drive de la fédération. On n\u2019en garde ici que le lien.
        </span>
        <button class="btn sm" onClick=${()=>setOuvrir(o=>!o)}>
          ${ouvrir ? 'Annuler' : 'Ajouter un document'}</button>
      </div>
      ${msg && html`<div class="alerte err" style="margin-bottom:16px">${msg}</div>`}

      ${ouvrir && html`
        <form onSubmit=${ajouter} class="panneau" style="margin-bottom:24px">
          <div class="corps stack">
            <div class="field"><label>Titre</label>
              <input required value=${f.titre} onInput=${e=>setF(o=>({...o,titre:e.target.value}))} /></div>
            <div class="field"><label>Nature</label>
              <select value=${f.type} onChange=${e=>setF(o=>({...o,type:e.target.value}))}>
                ${Object.entries(libelle).map(([k,v]) => html`<option value=${k}>${v}</option>`)}
              </select></div>
            <div class="field"><label>Adresse</label>
              <input type="url" value=${f.url} placeholder="https://docs.google.com/…"
                onInput=${e=>setF(o=>({...o,url:e.target.value}))} /></div>
            <div class="field"><label>À quoi sert ce document</label>
              <textarea value=${f.description}
                onInput=${e=>setF(o=>({...o,description:e.target.value}))} /></div>
            <div><button class="btn">Ajouter</button></div>
          </div>
        </form>`}

      <div class="panneau">
        ${docs.length === 0
          ? html`<div class="vide">Aucun document partagé pour l\u2019instant.</div>`
          : docs.map(d => html`
            <div class="ligne">
              <div style="flex:1;min-width:220px">
                <div>${d.url
                  ? html`<a href=${d.url} target="_blank" rel="noopener">${d.titre} ↗</a>`
                  : d.titre}</div>
                ${d.description && html`<div class="small muted">${d.description}</div>`}
                <div class="row" style="margin-top:8px;gap:6px">
                  <span class="tag">${libelle[d.type]||d.type}</span>
                  <span class="small muted">
                    ${nomComplet(gens[d.depose_par]||{})} · ${jour(d.cree_le)}</span>
                </div>
              </div>
              ${(d.depose_par === p.id || responsable) && html`
                <button class="btn sm light" onClick=${()=>retirer(d)}>Retirer</button>`}
            </div>`)}
      </div>
    </div>`;
}

function GtMembres({ p, groupe, membres, gens, responsable, recharger }){
  const [candidats, setCandidats] = useState([]);
  const [choix, setChoix] = useState('');
  const [msg, setMsg] = useState('');

  useEffect(() => { (async () => {
    if (!responsable) return;
    const { data } = await db.rpc('destinataires_possibles');
    setCandidats(data || []);
  })(); }, [responsable]);

  async function inviter(e){
    e.preventDefault(); setMsg('');
    const { data, error } = await db.rpc('inviter_au_groupe',
      { p_groupe: groupe.id, p_profil: choix });
    if (error) return setMsg(error.message);
    if (!data.ok) return setMsg(data.message);
    setChoix(''); setMsg('Invitation envoyée.'); recharger();
  }

  async function changerRole(m, role){
    await db.from('gt_membres').update({ role }).eq('id', m.id);
    recharger();
  }

  async function retirer(m){
    if (!confirm('Retirer ce membre du groupe ?')) return;
    await db.from('gt_membres').update({ statut: 'parti' }).eq('id', m.id);
    recharger();
  }

  async function partir(){
    const { data } = await db.rpc('quitter_groupe', { p_groupe: groupe.id });
    if (!data.ok) return setMsg(data.message);
    aller('/espace/groupes');
  }

  const dejaLa = new Set(membres.map(m => m.profil_id));
  const actifs = membres.filter(m => m.statut === 'actif');
  const invites = membres.filter(m => m.statut === 'invite');

  return html`
    <div>
      ${msg && html`<div class=${'alerte '+(msg.startsWith('Invitation')?'ok':'err')}
        style="margin-bottom:16px">${msg}</div>`}

      ${responsable && html`
        <form onSubmit=${inviter} class="panneau" style="margin-bottom:24px">
          <div class="tete"><h3 style="font-size:17px">Inviter un membre</h3></div>
          <div class="corps row" style="align-items:flex-end;gap:12px">
            <div class="field" style="flex:1;min-width:220px;margin:0">
              <label>Membre</label>
              <select required value=${choix} onChange=${e=>setChoix(e.target.value)}>
                <option value="">Choisir…</option>
                ${candidats.filter(c => !dejaLa.has(c.id)).map(c => html`
                  <option value=${c.id}>${nomComplet(c)} — ${c.fonction_nom}</option>`)}
              </select>
            </div>
            <button class="btn">Inviter</button>
          </div>
        </form>`}

      <div class="panneau">
        <div class="tete"><h3 style="font-size:17px">Membres</h3>
          <span class="tag">${actifs.length}</span></div>
        ${actifs.map(m => {
          const g = gens[m.profil_id] || {};
          return html`
            <div class="ligne">
              <div>
                <div>${nomComplet(g)}
                  ${m.role === 'responsable' && html`<span class="tag or"
                    style="margin-left:8px">Responsable</span>`}</div>
                <div class="small muted">${g.fonction_nom||''}
                  <span class="mono">${g.matricule||''}</span></div>
              </div>
              ${responsable && m.profil_id !== p.id && html`
                <div class="row">
                  ${m.role === 'membre'
                    ? html`<button class="btn sm light"
                        onClick=${()=>changerRole(m,'responsable')}>Nommer responsable</button>`
                    : html`<button class="btn sm light"
                        onClick=${()=>changerRole(m,'membre')}>Retirer la responsabilité</button>`}
                  <button class="btn sm light" onClick=${()=>retirer(m)}>Retirer</button>
                </div>`}
            </div>`;
        })}
      </div>

      ${invites.length > 0 && html`
        <div class="panneau" style="margin-top:24px">
          <div class="tete"><h3 style="font-size:17px">Invitations en attente</h3></div>
          ${invites.map(m => html`
            <div class="ligne">
              <div>${nomComplet(gens[m.profil_id]||{})}</div>
              <span class="tag bleu">Invité</span>
            </div>`)}
        </div>`}

      <div style="margin-top:32px">
        <button class="btn light" onClick=${partir}>Quitter ce groupe</button>
      </div>
    </div>`;
}


/* =====================================================================
   5 quater. MESSAGERIE
   Conversations privées et de groupe. La supervision hiérarchique est
   annoncée à l'écran, toujours — c'est une obligation, pas une option.
   ===================================================================== */

function Messagerie({ p, ouvrir }){
  const [convs, setConvs] = useState(null);
  const [active, setActive] = useState(ouvrir || null);
  const [nouvelle, setNouvelle] = useState(false);
  const [candidats, setCandidats] = useState([]);
  const [mesGroupes, setMesGroupes] = useState([]);
  const [msg, setMsg] = useState('');

  const charger = useCallback(async () => {
    const { data, error } = await db.rpc('mes_conversations');
    if (error) setMsg(error.message);
    setConvs(data || []);
  }, []);

  useEffect(() => { charger(); }, [charger]);

  useEffect(() => { (async () => {
    // Voir l'annuaire et pouvoir écrire sont deux droits distincts :
    // un adhérent ne consulte pas la liste de son département, mais il
    // peut y adresser un message. D'où cette fonction dédiée.
    const [{ data: ps }, { data: ms }] = await Promise.all([
      db.rpc('destinataires_possibles'),
      db.from('gt_membres').select('groupe_id').eq('profil_id', p.id).eq('statut','actif')
    ]);
    setCandidats(ps || []);
    if (ms && ms.length){
      const { data: gs } = await db.from('v_groupes').select('id,nom')
        .in('id', ms.map(m => m.groupe_id));
      setMesGroupes(gs || []);
    }
  })(); }, [p.id]);

  async function ouvrirPrivee(idAutre){
    setMsg('');
    const { data, error } = await db.rpc('conversation_privee', { p_autre: idAutre });
    if (error) return setMsg(error.message);
    if (!data.ok) return setMsg(data.message);
    setNouvelle(false); setActive(data.id); charger();
  }

  async function ouvrirGroupe(idG){
    setMsg('');
    const { data, error } = await db.rpc('conversation_groupe', { p_groupe: idG });
    if (error) return setMsg(error.message);
    if (!data.ok) return setMsg(data.message);
    setNouvelle(false); setActive(data.id); charger();
  }

  if (!convs) return html`<div class="vide">Chargement…</div>`;

  if (active) return html`<${Conversation} p=${p} id=${active}
    fermer=${() => { setActive(null); charger(); }} />`;

  const nonLus = convs.reduce((n,c) => n + (c.non_lus||0), 0);

  return html`
    <div>
      <div class="spread">
        <div>
          <div class="eyebrow">Messagerie</div>
          <h1 style="margin:6px 0 0">Échanges</h1>
        </div>
        <button class="btn" onClick=${()=>setNouvelle(n=>!n)}>
          ${nouvelle ? 'Annuler' : 'Nouvelle conversation'}</button>
      </div>

      <p class="small muted" style="margin-top:12px;max-width:62ch">
        Les échanges internes peuvent être consultés par l’encadrement dans le
        cadre de ses fonctions. <a href="#/confidentialite">En savoir plus</a>.
      </p>

      ${msg && html`<div class="alerte err" style="margin-top:16px">${msg}</div>`}

      ${nouvelle && html`
        <div class="panneau" style="margin-top:24px">
          <div class="tete"><h3 style="font-size:17px">Écrire à</h3></div>
          <div class="corps stack">
            <div class="field">
              <label>Un membre</label>
              <select onChange=${e => e.target.value && ouvrirPrivee(e.target.value)}>
                <option value="">Choisir…</option>
                ${candidats.map(c => html`<option value=${c.id}>
                  ${nomComplet(c)} — ${c.fonction_nom}${c.territoire_nom ? ' · '+c.territoire_nom : ''}
                </option>`)}
              </select>
            </div>
            ${mesGroupes.length > 0 && html`
              <div class="field">
                <label>Un de mes groupes</label>
                <select onChange=${e => e.target.value && ouvrirGroupe(e.target.value)}>
                  <option value="">Choisir…</option>
                  ${mesGroupes.map(g => html`<option value=${g.id}>${g.nom}</option>`)}
                </select>
              </div>`}
          </div>
        </div>`}

      <div class="panneau" style="margin-top:24px">
        <div class="tete">
          <h3 style="font-size:17px">Conversations</h3>
          ${nonLus > 0 && html`<span class="tag bleu">${nonLus} non lu${nonLus>1?'s':''}</span>`}
        </div>
        ${convs.length === 0
          ? html`<div class="vide">Aucune conversation. Commencez par en ouvrir une.</div>`
          : convs.map(c => html`
            <div class="ligne" style="cursor:pointer" onClick=${()=>setActive(c.id)}>
              <div style="flex:1;min-width:200px">
                <div class="row" style="gap:8px">
                  <span style=${c.non_lus>0 ? 'font-weight:600' : ''}>${c.titre||'Conversation'}</span>
                  ${c.type === 'groupe' && html`<span class="tag">Groupe</span>`}
                  ${c.superviseur && html`<span class="tag or">Supervision</span>`}
                </div>
                <div class="small muted" style="margin-top:4px;max-width:52ch;
                  overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
                  ${c.dernier_message || 'Pas encore de message'}
                </div>
              </div>
              <div class="row">
                ${c.non_lus > 0 && html`<span class="tag bleu">${c.non_lus}</span>`}
                <span class="small muted">${jour(c.derniere_activite)}</span>
              </div>
            </div>`)}
      </div>
    </div>`;
}

function Conversation({ p, id, fermer }){
  const [entete, setEntete] = useState(null);
  const [gens, setGens] = useState([]);
  const [messages, setMessages] = useState([]);
  const [texte, setTexte] = useState('');
  const [msg, setMsg] = useState('');
  const [envoi, setEnvoi] = useState(false);
  const [signaler, setSignaler] = useState(false);
  const [motif, setMotif] = useState('propos_deplaces');
  const [details, setDetails] = useState('');
  const [piece, setPiece] = useState(null);
  const [profilOuvert, setProfilOuvert] = useState(null);
  const [liens, setLiens] = useState({});

  const charger = useCallback(async () => {
    const [{ data: cs }, { data: ps }, { data: ms }] = await Promise.all([
      db.rpc('mes_conversations'),
      db.rpc('participants_conversation', { p_conv: id }),
      db.from('messages').select('*').eq('conversation_id', id)
        .order('cree_le', { ascending: true })
    ]);
    setEntete((cs||[]).find(c => c.id === id) || null);
    setGens(ps || []);
    setMessages(ms || []);
    await db.rpc('marquer_lu', { p_conv: id });
  }, [id]);

  useEffect(() => { charger(); }, [charger]);

  // Rafraîchissement discret, toutes les quinze secondes.
  useEffect(() => {
    const t = setInterval(charger, 15000);
    return () => clearInterval(t);
  }, [charger]);

  async function envoyer(e){
    e.preventDefault();
    if (!texte.trim() && !piece) return;
    setEnvoi(true); setMsg('');

    // Le chemin commence par l'identifiant de la conversation : c'est ce
    // qui permet à Storage d'appliquer la règle d'accès de la messagerie
    // au lieu d'en écrire une seconde.
    let chemin = null;
    if (piece){
      if (piece.size > 10485760){
        setEnvoi(false);
        return setMsg('Fichier trop lourd : 10 Mo au maximum.');
      }
      chemin = id + '/' + crypto.randomUUID() + '-' + piece.name.replace(/[^\w.\-]/g,'_');
      const { error: eUp } = await db.storage.from('pieces').upload(chemin, piece);
      if (eUp){ setEnvoi(false); return setMsg('Dépôt impossible : ' + eUp.message); }
    }

    const { data, error } = await db.rpc('envoyer_message', {
      p_conv: id, p_contenu: texte || null, p_piece: chemin,
      p_piece_nom: piece ? piece.name : null,
      p_taille: piece ? piece.size : null,
      p_type: piece ? (piece.type || null) : null
    });
    setEnvoi(false);
    if (error) return setMsg(error.message);
    if (!data.ok) return setMsg(data.message);
    setTexte(''); setPiece(null); charger();
  }

  // Les liens de téléchargement sont signés et expirent : une pièce ne
  // circule pas hors de la conversation qui la porte.
  async function ouvrirPiece(m){
    if (liens[m.id]){ window.open(liens[m.id], '_blank'); return; }
    const { data, error } = await db.storage.from('pieces')
      .createSignedUrl(m.piece, 120);
    if (error) return setMsg('Pièce indisponible : ' + error.message);
    setLiens(l => ({ ...l, [m.id]: data.signedUrl }));
    window.open(data.signedUrl, '_blank');
  }

  async function retirer(m){
    if (!confirm('Retirer ce message ?')) return;
    const { data, error } = await db.rpc('retirer_message', { p_id: m.id });
    if (error) return setMsg(error.message);
    if (data && !data.ok) return setMsg(data.message);
    charger();
  }

  async function envoyerSignalement(e){
    e.preventDefault(); setMsg('');
    const { data, error } = await db.rpc('signaler_conversation',
      { p_conv: id, p_motif: motif, p_details: details, p_message: null });
    if (error) return setMsg(error.message);
    if (!data.ok) return setMsg(data.message);
    setSignaler(false); setDetails('');
    setMsg('Signalement transmis. La direction l\u2019examinera.');
    charger();
  }

  const nom = i => {
    const g = gens.find(x => x.profil_id === i);
    return g ? [g.prenom, g.nom].filter(Boolean).join(' ') || g.matricule : 'Membre';
  };
  const superviseur = entete?.superviseur;

  return html`
    <div>
      <a class="small" href="#" onClick=${e=>{e.preventDefault();fermer()}}>← Toutes les conversations</a>
      <div class="spread" style="margin-top:12px">
        <h1 style="font-size:28px">${entete?.titre || 'Conversation'}</h1>
        ${entete?.type === 'groupe' && html`<span class="tag">Groupe de travail</span>`}
      </div>
      <div class="small muted" style="margin-top:6px">
        ${gens.map((g,i) => html`${i>0 ? ' · ' : ''}<a href="#"
          onClick=${e=>{e.preventDefault();
            setProfilOuvert(profilOuvert===g.profil_id?null:g.profil_id)}}
          >${[g.prenom,g.nom].filter(Boolean).join(' ')}</a>`)}
      </div>
      ${profilOuvert && html`<${ProfilInterne} profil=${profilOuvert}
        fermer=${()=>setProfilOuvert(null)} />`}

      ${superviseur && html`
        <p class="small muted" style="margin-top:16px">
          Consultation au titre de l’encadrement. Vous ne participez pas à cet
          échange et ne pouvez pas y écrire.
        </p>`}

      ${entete?.signale && html`
        <p class="small" style="margin-top:8px;color:var(--laiton)">
          Cette conversation fait l’objet d’un examen.
        </p>`}

      <div class="panneau" style="margin-top:24px">
        <div class="corps" style="max-height:52vh;overflow-y:auto">
          ${messages.length === 0
            ? html`<div class="vide">Aucun message. À vous d\u2019ouvrir l\u2019échange.</div>`
            : messages.map(m => {
              const moi = m.auteur_id === p.id;
              return html`
                <div style=${'margin-bottom:20px;'+(moi?'text-align:right':'')}>
                  <div class="small muted" style="margin-bottom:4px">
                    ${moi ? 'Vous' : nom(m.auteur_id)} ·
                    ${new Date(m.cree_le).toLocaleString('fr-FR',
                      {day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}
                  </div>
                  <div style=${'display:inline-block;text-align:left;max-width:80%;'+
                    'padding:10px 14px;border:1px solid var(--filet);border-radius:2px;'+
                    'white-space:pre-wrap;'+
                    (moi ? 'background:var(--bleu-clair);border-color:#C9D8EC' : 'background:#fff')}>
                    ${m.retire
                      ? html`<span class="muted"><em>Message retiré</em></span>`
                      : m.contenu}
                    ${!m.retire && m.piece && html`
                      <div style="margin-top:10px;padding-top:10px;
                        border-top:1px solid var(--filet)">
                        <a href="#" onClick=${e=>{e.preventDefault();ouvrirPiece(m)}}>
                          ${m.piece_nom || 'Pièce jointe'}</a>
                        <span class="small muted"> · ${m.piece_taille
                          ? (m.piece_taille >= 1048576
                             ? (m.piece_taille/1048576).toFixed(1)+' Mo'
                             : Math.round(m.piece_taille/1024)+' ko')
                          : ''}</span>
                      </div>`}
                  </div>
                  ${!m.retire && (moi || p.echelon >= 6 || p.niveau >= 90) && html`
                    <div><button class="btn sm light" style="margin-top:6px;border:0;
                      background:transparent;padding:2px 0;font-size:12px"
                      onClick=${()=>retirer(m)}>Retirer</button></div>`}
                </div>`;
            })}
        </div>

        ${!superviseur && html`
          <form onSubmit=${envoyer} style="border-top:1px solid var(--filet);padding:16px 20px">
            <div class="field" style="margin:0">
              <textarea value=${texte} onInput=${e=>setTexte(e.target.value)}
                placeholder="Votre message" style="min-height:80px"
                onKeyDown=${e => { if (e.key==='Enter' && (e.metaKey||e.ctrlKey)) envoyer(e); }} />
            </div>
            <div class="row" style="gap:10px;margin-top:10px;align-items:center;flex-wrap:wrap">
              <input type="file" style="width:auto;font-size:13px;padding:4px 0;border:0"
                onChange=${e=>setPiece(e.target.files[0] || null)} />
              ${piece && html`<span class="small muted">${piece.name} ·
                ${Math.round(piece.size/1024)} ko
                <a href="#" onClick=${e=>{e.preventDefault();setPiece(null)}}>retirer</a>
              </span>`}
              <span class="small muted">10 Mo au maximum. Tout envoi est
                consigné : qui, quand, vers qui — jamais le contenu.</span>
            </div>
            <div class="spread" style="margin-top:12px">
              <span class="small muted">Ctrl + Entrée pour envoyer</span>
              <button class="btn" disabled=${envoi || !texte.trim()}>
                ${envoi ? 'Envoi…' : 'Envoyer'}</button>
            </div>
          </form>`}
      </div>
      ${msg && html`<div class=${'alerte '+(msg.startsWith('Signalement')?'ok':'err')}
        style="margin-top:16px">${msg}</div>`}

      ${!superviseur && html`
        <div style="margin-top:24px">
          ${signaler
            ? html`
              <form class="panneau" onSubmit=${envoyerSignalement}>
                <div class="tete"><h3 style="font-size:17px">Signaler cette conversation</h3></div>
                <div class="corps stack">
                  <div class="field"><label>Motif</label>
                    <select value=${motif} onChange=${e=>setMotif(e.target.value)}>
                      <option value="propos_deplaces">Propos déplacés</option>
                      <option value="harcelement">Harcèlement</option>
                      <option value="securite">Situation préoccupante</option>
                      <option value="hors_sujet">Usage hors mission</option>
                      <option value="autre">Autre</option>
                    </select></div>
                  <div class="field"><label>Ce que vous voulez dire</label>
                    <textarea required value=${details} onInput=${e=>setDetails(e.target.value)}
                      placeholder="Ce qui vous a alerté, en quelques lignes." /></div>
                  <div class="row">
                    <button class="btn">Transmettre à la direction</button>
                    <button type="button" class="btn light"
                      onClick=${()=>setSignaler(false)}>Annuler</button>
                  </div>
                  <p class="small muted">
                    Le signalement est examiné par la Direction générale, qui peut le
                    confier à un encadrant. Les personnes concernées n’en sont pas
                    averties automatiquement.
                  </p>
                </div>
              </form>`
            : html`<button class="btn light" style="border:0;background:transparent;
                padding:0;font-size:13px;color:var(--gris)"
                onClick=${()=>setSignaler(true)}>Signaler cette conversation</button>`}
        </div>`}
    </div>`;
}


/* =====================================================================
   5 quinquies. NOTES DE FRAIS ET DIRECTION FINANCIÈRE
   Circuit à trois temps : le membre dépose, son encadrement instruit,
   le trésorier valide puis paie.
   ===================================================================== */

const EURO = n => (Number(n)||0).toLocaleString('fr-FR',
  {style:'currency', currency:'EUR'});

const ETAT_NOTE = {
  brouillon: ['Brouillon', ''],
  deposee:   ['Déposée', 'bleu'],
  instruite: ['Avis favorable', 'bleu'],
  ordonnancee:['Ordonnancée', 'vert'],
  payee:     ['Payée', 'vert'],
  refusee:   ['Refusée', 'rouge']
};
const etatNote = st => {
  const [t, c] = ETAT_NOTE[st] || [st, ''];
  return html`<span class=${'tag '+c}>${t}</span>`;
};

const CATEGORIES = {
  transport:'Transport', kilometres:'Indemnité kilométrique', repas:'Repas',
  hebergement:'Hébergement', materiel:'Matériel', autre:'Autre'
};

function NotesFrais({ p }){
  const [notes, setNotes] = useState(null);
  const [param, setParam] = useState({});
  const [ouverte, setOuverte] = useState(null);
  const [creation, setCreation] = useState(false);
  const [objet, setObjet] = useState('');
  const [groupe, setGroupe] = useState('');
  const [mesGroupes, setMesGroupes] = useState([]);
  const [msg, setMsg] = useState('');

  const charger = useCallback(async () => {
    const [{ data: ns }, { data: ps }, { data: gm }] = await Promise.all([
      db.rpc('v_notes', { p_filtre: 'miennes' }),
      db.from('parametres_frais').select('*'),
      db.from('gt_membres').select('groupe_id').eq('profil_id', p.id).eq('statut','actif')
    ]);
    setNotes(ns || []);
    setParam(Object.fromEntries((ps||[]).map(x => [x.cle, Number(x.valeur)])));
    if (gm && gm.length){
      const { data: gs } = await db.from('v_groupes').select('id,nom')
        .in('id', gm.map(x => x.groupe_id));
      setMesGroupes(gs || []);
    }
  }, [p.id]);

  useEffect(() => { charger(); }, [charger]);

  async function creer(e){
    e.preventDefault(); setMsg('');
    const { data, error } = await db.from('notes_frais')
      .insert({ profil_id: p.id, objet, groupe_id: groupe || null })
      .select().single();
    if (error) return setMsg(error.message);
    setObjet(''); setGroupe(''); setCreation(false); setOuverte(data.id); charger();
  }

  if (!notes) return html`<div class="vide">Chargement…</div>`;
  if (ouverte) return html`<${NoteFrais} p=${p} id=${ouverte} param=${param}
    fermer=${() => { setOuverte(null); charger(); }} />`;

  const aRembourser = notes.filter(n => ['deposee','instruite','ordonnancee'].includes(n.statut))
                           .reduce((t,n) => t + Number(n.total||0), 0);

  return html`
    <div>
      <div class="spread">
        <div>
          <div class="eyebrow">Notes de frais</div>
          <h1 style="margin:6px 0 0">Mes dépenses</h1>
        </div>
        <button class="btn" onClick=${()=>setCreation(c=>!c)}>
          ${creation ? 'Annuler' : 'Nouvelle note'}</button>
      </div>
      <p class="muted" style="max-width:58ch;margin-top:12px">
        Indemnité kilométrique à ${EURO(param.taux_km||0)} du kilomètre.
        Plafond de ${EURO(param.plafond_note||0)} par note.
        Un justificatif est exigé pour chaque dépense réelle.
      </p>

      ${msg && html`<div class="alerte err" style="margin-top:16px">${msg}</div>`}

      ${aRembourser > 0 && html`
        <div class="alerte" style="margin-top:24px">
          ${EURO(aRembourser)} en cours de traitement.
        </div>`}

      ${creation && html`
        <form onSubmit=${creer} class="panneau" style="margin-top:24px">
          <div class="corps stack">
            <div class="field"><label>Objet</label>
              <input required value=${objet} onInput=${e=>setObjet(e.target.value)}
                placeholder="Déplacement au collège Jean-Moulin, 12 mars" /></div>
            ${mesGroupes.length > 0 && html`
              <div class="field"><label>Rattacher à un projet</label>
                <select value=${groupe} onChange=${e=>setGroupe(e.target.value)}>
                  <option value="">Aucun</option>
                  ${mesGroupes.map(g => html`<option value=${g.id}>${g.nom}</option>`)}
                </select></div>`}
            <div><button class="btn">Créer la note</button></div>
          </div>
        </form>`}

      <div class="panneau" style="margin-top:24px">
        ${notes.length === 0
          ? html`<div class="vide">Aucune note de frais. Créez-en une quand vous avancez des frais.</div>`
          : notes.map(n => html`
            <div class="ligne" style="cursor:pointer" onClick=${()=>setOuverte(n.id)}>
              <div style="flex:1;min-width:220px">
                <div>${n.objet}</div>
                <div class="small muted">
                  <span class="mono">${n.reference}</span> · ${n.nb_lignes} ligne${n.nb_lignes>1?'s':''}
                  ${n.groupe_nom ? ' · ' + n.groupe_nom : ''}
                  ${n.deposee_le ? ' · déposée le ' + jour(n.deposee_le) : ''}
                </div>
                ${n.motif_refus && html`<div class="small" style="color:var(--rouge);margin-top:4px">
                  ${n.motif_refus}</div>`}
              </div>
              <div class="row">
                <span class="mono">${EURO(n.total)}</span>
                ${etatNote(n.statut)}
              </div>
            </div>`)}
      </div>
    </div>`;
}

function NoteFrais({ p, id, param, fermer }){
  const [note, setNote] = useState(null);
  const [lignes, setLignes] = useState([]);
  const [f, setF] = useState({date_depense:'', categorie:'transport',
                              description:'', montant:'', kilometres:''});
  const [fichier, setFichier] = useState(null);
  const [msg, setMsg] = useState('');
  const [envoi, setEnvoi] = useState(false);

  const charger = useCallback(async () => {
    const { data: ns } = await db.rpc('v_notes', { p_filtre: 'miennes' });
    setNote((ns||[]).find(x => x.id === id) || null);
    const { data: ls } = await db.from('nf_lignes').select('*')
      .eq('note_id', id).order('date_depense');
    setLignes(ls || []);
  }, [id]);

  useEffect(() => { charger(); }, [charger]);

  if (!note) return html`<div class="vide">Note introuvable.</div>`;
  const modifiable = note.statut === 'brouillon';

  const montantDe = l => l.categorie === 'kilometres'
    ? (Number(l.kilometres||0) * (param.taux_km||0))
    : Number(l.montant||0);
  const total = lignes.reduce((t,l) => t + montantDe(l), 0);

  async function ajouter(e){
    e.preventDefault(); setMsg(''); setEnvoi(true);
    let chemin = null;
    try {
      if (fichier){
        if (fichier.size > 5 * 1024 * 1024)
          throw new Error('Le justificatif ne doit pas dépasser 5 Mo.');
        const ext = fichier.name.split('.').pop();
        chemin = p.id + '/' + id + '-' + Date.now() + '.' + ext;
        const { error: eUp } = await db.storage.from('justificatifs')
          .upload(chemin, fichier);
        if (eUp) throw eUp;
      }
      const { error } = await db.from('nf_lignes').insert({
        note_id: id, date_depense: f.date_depense, categorie: f.categorie,
        description: f.description,
        montant: f.categorie === 'kilometres' ? null : Number(f.montant||0),
        kilometres: f.categorie === 'kilometres' ? Number(f.kilometres||0) : null,
        justificatif: chemin
      });
      if (error) throw error;
      setF({date_depense:'', categorie:'transport', description:'', montant:'', kilometres:''});
      setFichier(null);
      const champ = document.getElementById('justif'); if (champ) champ.value = '';
      charger();
    } catch (err){
      setMsg(err.message || 'Ajout impossible.');
    }
    setEnvoi(false);
  }

  async function retirer(l){
    if (!confirm('Retirer cette dépense ?')) return;
    if (l.justificatif) await db.storage.from('justificatifs').remove([l.justificatif]);
    await db.from('nf_lignes').delete().eq('id', l.id);
    charger();
  }

  async function voirJustificatif(chemin){
    const { data, error } = await db.storage.from('justificatifs')
      .createSignedUrl(chemin, 120);
    if (error) return setMsg('Justificatif introuvable.');
    window.open(data.signedUrl, '_blank', 'noopener');
  }

  async function deposer(){
    setMsg(''); setEnvoi(true);
    const { data, error } = await db.rpc('deposer_note', { p_note: id });
    setEnvoi(false);
    if (error) return setMsg(error.message);
    if (!data.ok) return setMsg(data.message);
    charger();
  }

  async function supprimer(){
    if (!confirm('Supprimer définitivement cette note ?')) return;
    await db.from('notes_frais').delete().eq('id', id);
    fermer();
  }

  return html`
    <div>
      <a class="small" href="#" onClick=${e=>{e.preventDefault();fermer()}}>← Toutes mes notes</a>
      <div class="spread" style="margin-top:12px">
        <div>
          <h1 style="font-size:30px">${note.objet}</h1>
          <div class="small muted" style="margin-top:4px">
            <span class="mono">${note.reference}</span>
            ${note.groupe_nom ? ' · ' + note.groupe_nom : ''}
          </div>
        </div>
        ${etatNote(note.statut)}
      </div>

      ${note.avis && html`<div class="alerte" style="margin-top:16px">
        Avis de l\u2019encadrement : ${note.avis}</div>`}
      ${note.motif_refus && html`<div class="alerte err" style="margin-top:16px">
        ${note.motif_refus}</div>`}
      ${note.statut === 'payee' && html`<div class="alerte ok" style="margin-top:16px">
        ${note.mode_remboursement === 'abandon_creance'
          ? 'Créance abandonnée. Reçu fiscal ' + (note.recu_fiscal||'') + '.'
          : 'Payée' + (note.reference_paiement ? ' — référence ' + note.reference_paiement : '') + '.'}
        </div>`}
      ${note.statut === 'ordonnancee' && html`<div class="alerte" style="margin-top:16px">
        Dépense ordonnancée. Le paiement sera exécuté par la direction financière.</div>`}
      ${msg && html`<div class="alerte err" style="margin-top:16px">${msg}</div>`}

      <div class="panneau" style="margin-top:24px">
        <div class="tete">
          <h3 style="font-size:17px">Dépenses</h3>
          <span class="mono" style="font-size:16px">${EURO(total)}</span>
        </div>
        ${lignes.length === 0
          ? html`<div class="vide">Aucune dépense saisie.</div>`
          : lignes.map(l => html`
            <div class="ligne">
              <div style="flex:1;min-width:220px">
                <div>${l.description}</div>
                <div class="small muted">
                  ${CATEGORIES[l.categorie]} · ${jour(l.date_depense)}
                  ${l.categorie === 'kilometres' ? ' · ' + l.kilometres + ' km' : ''}
                </div>
              </div>
              <div class="row">
                ${l.justificatif
                  ? html`<button class="btn sm light"
                      onClick=${()=>voirJustificatif(l.justificatif)}>Justificatif</button>`
                  : (l.categorie !== 'kilometres'
                      ? html`<span class="tag rouge">Sans justificatif</span>` : null)}
                <span class="mono">${EURO(montantDe(l))}</span>
                ${modifiable && html`<button class="btn sm light"
                  onClick=${()=>retirer(l)}>Retirer</button>`}
              </div>
            </div>`)}
      </div>

      ${modifiable && html`
        <form onSubmit=${ajouter} class="panneau" style="margin-top:24px">
          <div class="tete"><h3 style="font-size:17px">Ajouter une dépense</h3></div>
          <div class="corps stack">
            <div class="row" style="gap:16px;align-items:flex-start">
              <div class="field" style="flex:1;min-width:150px;margin:0"><label>Date</label>
                <input type="date" required value=${f.date_depense}
                  onInput=${e=>setF(o=>({...o,date_depense:e.target.value}))} /></div>
              <div class="field" style="flex:1;min-width:180px;margin:0"><label>Nature</label>
                <select value=${f.categorie} onChange=${e=>setF(o=>({...o,categorie:e.target.value}))}>
                  ${Object.entries(CATEGORIES).map(([k,v]) => html`<option value=${k}>${v}</option>`)}
                </select></div>
            </div>
            <div class="field"><label>Description</label>
              <input required value=${f.description}
                onInput=${e=>setF(o=>({...o,description:e.target.value}))}
                placeholder="Aller-retour Foix – Pamiers" /></div>

            ${f.categorie === 'kilometres'
              ? html`
                <div class="field"><label>Distance parcourue (km)</label>
                  <input type="number" step="0.1" min="0" required value=${f.kilometres}
                    onInput=${e=>setF(o=>({...o,kilometres:e.target.value}))} />
                  <p class="small muted" style="margin:6px 0 0">
                    Soit ${EURO((Number(f.kilometres)||0) * (param.taux_km||0))}
                    au barème en vigueur. Aucun justificatif n\u2019est demandé.</p>
                </div>`
              : html`
                <div class="field"><label>Montant (€)</label>
                  <input type="number" step="0.01" min="0" required value=${f.montant}
                    onInput=${e=>setF(o=>({...o,montant:e.target.value}))} /></div>
                <div class="field"><label>Justificatif</label>
                  <input id="justif" type="file" accept="image/*,.pdf"
                    onChange=${e=>setFichier(e.target.files[0]||null)} />
                  <p class="small muted" style="margin:6px 0 0">
                    Photo ou PDF, 5 Mo maximum. Exigé pour déposer la note.</p>
                </div>`}

            <div><button class="btn" disabled=${envoi}>
              ${envoi ? 'Ajout…' : 'Ajouter la dépense'}</button></div>
          </div>
        </form>`}

      ${modifiable && html`
        <div class="panneau" style="margin-top:24px">
          <div class="tete"><h3 style="font-size:17px">Mode de remboursement</h3></div>
          <div class="corps stack">
            <div class="field" style="margin:0">
              <select value=${note.mode_remboursement||'virement'} onChange=${async e => {
                await db.from('notes_frais').update({ mode_remboursement: e.target.value })
                  .eq('id', id);
                charger();
              }}>
                <option value="virement">Virement sur mon compte</option>
                <option value="abandon_creance">J’abandonne la créance — reçu fiscal</option>
              </select>
            </div>
            <p class="small muted">
              L’abandon de créance vaut don à la fédération : vous renoncez au
              remboursement et recevez un reçu fiscal ouvrant droit à réduction
              d’impôt. Le virement exige des coordonnées bancaires enregistrées
              dans Mon compte.
            </p>
          </div>
        </div>

        <div class="row" style="margin-top:32px">
          <button class="btn" onClick=${deposer} disabled=${envoi || lignes.length===0}>
            Déposer la note</button>
          <button class="btn light" onClick=${supprimer}>Supprimer</button>
        </div>
        <p class="small muted" style="margin-top:12px">
          Une fois déposée, la note n\u2019est plus modifiable. Elle part à votre
          encadrement, qui donne un avis, puis à la direction financière.
        </p>`}
    </div>`;
}

/* --- Finances : instruction, ordonnancement, paiement ------------------
   Trois écrans distincts pour trois responsabilités distinctes. La
   séparation doit se voir, sinon elle ne sert à rien.
   --------------------------------------------------------------------- */
function Finances({ p, role }){
  // role : 'tresorerie' (instruire + payer) ou 'ordonnancement'
  const [onglet, setOnglet] = useState(role === 'ordonnancement' ? 'ordonnancer' : 'instruire');
  const [listes, setListes] = useState({});
  const [param, setParam] = useState([]);
  const [detail, setDetail] = useState(null);
  const [lignes, setLignes] = useState([]);
  const [rib, setRib] = useState(null);
  const [msg, setMsg] = useState('');

  const charger = useCallback(async () => {
    const filtres = ['avis','instruire','ordonnancer','payer','toutes'];
    const res = await Promise.all(filtres.map(f => db.rpc('v_notes', { p_filtre: f })));
    setListes(Object.fromEntries(filtres.map((f,i) => [f, res[i].data || []])));
    const { data: pr } = await db.from('parametres_frais').select('*').order('cle');
    setParam(pr || []);
  }, []);
  useEffect(() => { charger(); }, [charger]);

  async function ouvrir(n){
    setDetail(n); setMsg(''); setRib(null);
    const { data } = await db.from('nf_lignes').select('*')
      .eq('note_id', n.id).order('date_depense');
    setLignes(data || []);
  }

  async function justificatif(chemin){
    const { data, error } = await db.storage.from('justificatifs').createSignedUrl(chemin, 120);
    if (error) return setMsg('Justificatif introuvable.');
    window.open(data.signedUrl, '_blank', 'noopener');
  }

  async function voirRib(n){
    const { data, error } = await db.rpc('lire_rib', { p_note: n.id });
    if (error) return setMsg(error.message);
    if (!data.ok) return setMsg(data.message);
    setRib(data);
    setMsg('Consultation enregistrée : le membre en sera informé.');
  }

  const appel = async (fn, args, ok) => {
    const { data, error } = await db.rpc(fn, args);
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data.ok) return setMsg('Erreur : ' + data.message);
    setMsg(ok); setDetail(null); charger();
  };

  async function avis(n, favorable){
    const t = prompt(favorable ? 'Avis (facultatif)' : 'Motif de l\u2019avis défavorable');
    if (!favorable && !t) return;
    appel('donner_avis', { p_note: n.id, p_favorable: favorable, p_avis: t || '' },
      'Avis enregistré.');
  }
  async function instruire(n, ok){
    const t = prompt(ok ? 'Imputation budgétaire (facultatif)' : 'Motif du rejet (obligatoire)');
    if (!ok && !t) return;
    appel('instruire_note', { p_note: n.id, p_favorable: ok, p_avis: t || '' },
      ok ? 'Note instruite. Elle passe à l\u2019ordonnateur.' : 'Note rejetée.');
  }
  async function ordonnancer(n, ok){
    const t = ok ? null : prompt('Motif du refus (obligatoire)');
    if (!ok && !t) return;
    appel('ordonnancer_note', { p_note: n.id, p_ok: ok, p_motif: t },
      ok ? 'Dépense ordonnancée. Elle passe au paiement.' : 'Dépense refusée.');
  }
  async function payer(n){
    const ref = prompt('Référence du virement (facultatif)') || '';
    appel('payer_note', { p_note: n.id, p_reference: ref }, 'Note payée.');
  }
  async function majParam(cle, valeur){
    const { error } = await db.from('parametres_frais')
      .update({ valeur: Number(valeur) }).eq('cle', cle);
    setMsg(error ? 'Erreur : ' + error.message : 'Barème enregistré.');
    charger();
  }

  const taux = Number((param.find(x=>x.cle==='taux_km')||{}).valeur || 0);
  const montantDe = l => l.categorie === 'kilometres'
    ? Number(l.kilometres||0) * taux : Number(l.montant||0);

  const ligneNote = (n, actions) => html`
    <div class="ligne">
      <div style="flex:1;min-width:240px;cursor:pointer" onClick=${()=>ouvrir(n)}>
        <div>${n.objet}</div>
        <div class="small muted">
          ${n.deposant} <span class="mono">${n.matricule}</span>
          ${n.territoire_nom ? ' · ' + n.territoire_nom : ''}
          · <span class="mono">${n.reference}</span>
          ${n.deposee_le ? ' · ' + jour(n.deposee_le) : ''}
        </div>
        ${n.avis && html`<div class="small muted">Avis : ${n.avis}</div>`}
        ${n.mode_remboursement === 'abandon_creance' && html`
          <div style="margin-top:6px"><span class="tag vert">Abandon de créance</span></div>`}
        ${n.mode_remboursement === 'virement' && !n.a_un_rib && html`
          <div style="margin-top:6px"><span class="tag rouge">Sans coordonnées bancaires</span></div>`}
      </div>
      <div class="row">
        <span class="mono" style="font-size:15px">${EURO(n.total)}</span>
        ${etatNote(n.statut)}
        ${actions}
      </div>
    </div>`;

  if (detail) return html`
    <div>
      <a class="small" href="#" onClick=${e=>{e.preventDefault();setDetail(null)}}>← Retour</a>
      <div class="spread" style="margin-top:12px">
        <div>
          <h1 style="font-size:28px">${detail.objet}</h1>
          <div class="small muted" style="margin-top:4px">
            ${detail.deposant} <span class="mono">${detail.matricule}</span>
            ${detail.territoire_nom ? ' · ' + detail.territoire_nom : ''}
            · <span class="mono">${detail.reference}</span>
          </div>
        </div>
        ${etatNote(detail.statut)}
      </div>
      ${msg && html`<div class=${'alerte '+(msg.startsWith('Erreur')?'err':'ok')}
        style="margin-top:16px">${msg}</div>`}

      <div class="panneau" style="margin-top:24px">
        <div class="tete"><h3 style="font-size:17px">Suivi</h3></div>
        ${detail.avis_nom && html`<div class="ligne">
          <span class="muted">Avis hiérarchique</span>
          <span>${detail.avis_nom} — ${detail.avis||''}</span></div>`}
        ${detail.instruit_nom && html`<div class="ligne">
          <span class="muted">Instruite par</span>
          <span>${detail.instruit_nom}${detail.imputation ? ' · ' + detail.imputation : ''}</span></div>`}
        ${detail.ordonnance_nom && html`<div class="ligne">
          <span class="muted">Ordonnancée par</span><span>${detail.ordonnance_nom}</span></div>`}
        ${detail.paye_nom && html`<div class="ligne">
          <span class="muted">Payée par</span>
          <span>${detail.paye_nom}${detail.reference_paiement ? ' · ' + detail.reference_paiement : ''}</span></div>`}
        <div class="ligne"><span class="muted">Mode de remboursement</span>
          <span>${detail.mode_remboursement === 'abandon_creance'
            ? 'Abandon de créance — reçu fiscal'
            : 'Virement bancaire'}</span></div>
        ${detail.motif_refus && html`<div class="ligne">
          <span class="muted">Motif du refus</span>
          <span style="color:var(--rouge)">${detail.motif_refus}</span></div>`}
      </div>

      <div class="panneau" style="margin-top:24px">
        <div class="tete"><h3 style="font-size:17px">Dépenses</h3>
          <span class="mono" style="font-size:16px">${EURO(detail.total)}</span></div>
        ${lignes.map(l => html`
          <div class="ligne">
            <div style="flex:1;min-width:200px">
              <div>${l.description}</div>
              <div class="small muted">${CATEGORIES[l.categorie]} · ${jour(l.date_depense)}
                ${l.categorie === 'kilometres' ? ' · ' + l.kilometres + ' km' : ''}</div>
            </div>
            <div class="row">
              ${l.justificatif && html`<button class="btn sm light"
                onClick=${()=>justificatif(l.justificatif)}>Justificatif</button>`}
              <span class="mono">${EURO(montantDe(l))}</span>
            </div>
          </div>`)}
      </div>

      ${detail.statut === 'ordonnancee' && detail.mode_remboursement === 'virement' && html`
        <div class="panneau" style="margin-top:24px">
          <div class="tete"><h3 style="font-size:17px">Coordonnées bancaires</h3></div>
          <div class="corps">
            ${rib
              ? html`<div class="stack">
                  <div><span class="muted small">Titulaire</span><div>${rib.titulaire}</div></div>
                  <div><span class="muted small">IBAN</span>
                    <div class="mono" style="font-size:15px">${rib.iban}</div></div>
                  ${rib.bic && html`<div><span class="muted small">BIC</span>
                    <div class="mono">${rib.bic}</div></div>`}
                </div>`
              : html`<div>
                  <p class="small muted">La consultation est tracée et le membre en est informé.</p>
                  <button class="btn sm" onClick=${()=>voirRib(detail)}>Afficher l\u2019IBAN</button>
                </div>`}
          </div>
        </div>`}

      <div class="row" style="margin-top:32px">
        ${detail.statut === 'deposee' && a('avis') && html`
          <button class="btn light" onClick=${()=>avis(detail,true)}>Avis favorable</button>
          <button class="btn light" onClick=${()=>avis(detail,false)}>Avis défavorable</button>`}
        ${detail.statut === 'deposee' && role === 'tresorerie' && html`
          <button class="btn" onClick=${()=>instruire(detail,true)}>Instruire</button>
          <button class="btn light" onClick=${()=>instruire(detail,false)}>Rejeter</button>`}
        ${detail.statut === 'instruite' && role === 'ordonnancement' && html`
          <button class="btn" onClick=${()=>ordonnancer(detail,true)}>Ordonnancer</button>
          <button class="btn light" onClick=${()=>ordonnancer(detail,false)}>Refuser</button>`}
        ${detail.statut === 'ordonnancee' && role === 'tresorerie' && html`
          <button class="btn" onClick=${()=>payer(detail)}>Marquer comme payée</button>`}

    </div>`;

  function a(k){ return (listes[k]||[]).length > 0; }
  const L = k => listes[k] || [];
  const paye = L('toutes').filter(n => n.statut === 'payee')
                          .reduce((t,n) => t + Number(n.total||0), 0);

  const onglets = role === 'ordonnancement'

  return html`

        ${role === 'ordonnancement' ? 'Engager les dépenses' : 'Instruire et payer'}</h1>
