/* --- L'application Discipline ---------------------------------------- */
function Discipline({ p }){
  const [onglet, setOnglet] = useState('ouverts');
  const [dossiers, setDossiers] = useState([]);
  const [archives, setArchives] = useState([]);
  const [suivis, setSuivis] = useState([]);
  const [gens, setGens] = useState([]);
  const [detail, setDetail] = useState(null);
  const [creation, setCreation] = useState(false);
  const [f, setF] = useState({profil:'', objet:'', qualification:'', gravite:'moyenne'});
  const [msg, setMsg] = useState('');

  const charger = useCallback(async () => {
    const [a,b,c,d] = await Promise.all([
      db.rpc('dossiers_discipline', { p_filtre: 'ouverts' }),
      db.rpc('dossiers_discipline', { p_filtre: 'archives' }),
      db.rpc('suivi_en_cours'),
      db.rpc('membres_pour_discipline', { p_recherche: null })
    ]);
    setDossiers(a.data||[]); setArchives(b.data||[]);
    setSuivis(c.data||[]); setGens(d.data||[]);
    if (detail){
      const maj = [...(a.data||[]), ...(b.data||[])].find(x => x.id === detail.id);
      if (maj) setDetail(maj);
    }
  }, [detail]);
  useEffect(() => { charger(); }, []);

  // Extraction du registre : la DAJ a dans sa mission de tenir une
  // sauvegarde à jour. Chaque extraction est tracée au journal.
  async function exporter(){
    const { data, error } = await db.rpc('registre_discipline');
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data || data.length === 0) return setMsg('Erreur : registre vide ou accès refusé.');

    const colonnes = Object.keys(data[0]);
    const echappe = v => {
      if (v === null || v === undefined) return '';
      const t = String(v).replace(/"/g, '""');
      return /[";\n]/.test(t) ? '"' + t + '"' : t;
    };
    const csv = '\ufeff' + colonnes.join(';') + '\n' +
      data.map(l => colonnes.map(c => echappe(l[c])).join(';')).join('\n');

    const nom = 'FFCE-registre-discipline-' +
      new Date().toISOString().slice(0,10) + '.csv';
    const url = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
    const a = document.createElement('a');
    a.href = url; a.download = nom; a.click();
    URL.revokeObjectURL(url);

    await db.rpc('tracer_export', { p_objet: nom, p_lignes: data.length });
    setMsg(data.length + ' ligne(s) extraites. Déposez le fichier sur le Drive de la fédération.');
  }

  async function ouvrir(e){
    e.preventDefault();
    const { data, error } = await db.rpc('ouvrir_dossier', {
      p_profil: f.profil, p_objet: f.objet,
      p_qualification: f.qualification || null, p_gravite: f.gravite, p_signalement: null
    });
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data.ok) return setMsg('Erreur : ' + data.message);
    setF({profil:'', objet:'', qualification:'', gravite:'moyenne'}); setCreation(false);
    setMsg('Dossier ouvert. L\u2019intéressé est placé sous protection renforcée.');
    charger();
  }

  if (detail) return html`<${DossierDetail} p=${p} d=${detail} gens=${gens}
    fermer=${()=>{ setDetail(null); charger(); }} />`;

  const ligne = d => html`
    <div class="ligne" style="cursor:pointer" onClick=${()=>setDetail(d)}>
      <div style="flex:1;min-width:240px">
        <div>${d.objet}</div>
        <div class="small muted">
          <span class="mono">${d.reference}</span> · ${d.concerne}
          <span class="mono">${d.matricule}</span>
          ${d.territoire_nom ? ' · ' + d.territoire_nom : ''}
          · ${d.nb_pieces} pièce${d.nb_pieces>1?'s':''}
        </div>
        ${d.qualification && html`<div class="small muted">${d.qualification}</div>`}
      </div>
      <div class="row">
        ${d.recours_en_attente > 0 && html`
          <span class="tag or">${d.recours_en_attente} recours</span>`}
        <span class=${'tag '+(GRAVITE[d.gravite]||['',''])[1]}>
          ${(GRAVITE[d.gravite]||['',''])[0]}</span>
        <span class="tag">${ETAPE_NOM[d.statut]}</span>
      </div>
    </div>`;

  return html`
    <div>
      <div class="spread">
        <div>
          <div class="eyebrow">Discipline et recours</div>
          <h1 style="margin:6px 0 0">Dossiers</h1>
        </div>
        <button class="btn" onClick=${()=>setCreation(c=>!c)}>
          ${creation ? 'Annuler' : 'Ouvrir un dossier'}</button>
      </div>
      ${msg && html`<div class=${'alerte '+(msg.startsWith('Erreur')?'err':'ok')}
        style="margin-top:16px">${msg}</div>`}

      ${creation && html`
        <form onSubmit=${ouvrir} class="panneau" style="margin-top:24px">
          <div class="corps stack">
            <div class="field"><label>Membre concerné</label>
              <select required value=${f.profil} onChange=${e=>setF(o=>({...o,profil:e.target.value}))}>
                <option value="">Choisir…</option>
                ${gens.map(g => html`<option value=${g.id}>
                  ${nomComplet(g)} — ${g.fonction_nom}${g.territoire_nom?' · '+g.territoire_nom:''}
                  ${g.dossiers_ouverts > 0 ? ' · '+g.dossiers_ouverts+' dossier(s) en cours' : ''}
                </option>`)}
              </select></div>
            <div class="field"><label>Objet</label>
              <input required value=${f.objet} onInput=${e=>setF(o=>({...o,objet:e.target.value}))}
                placeholder="Manquement au cadre d\u2019intervention du 12 mars" /></div>
            <div class="field"><label>Qualification retenue</label>
              <input value=${f.qualification}
                onInput=${e=>setF(o=>({...o,qualification:e.target.value}))}
                placeholder="Article 8 du règlement intérieur" /></div>
            <div class="field"><label>Gravité</label>
              <select value=${f.gravite} onChange=${e=>setF(o=>({...o,gravite:e.target.value}))}>
                <option value="faible">Faible</option>
                <option value="moyenne">Moyenne</option>
                <option value="elevee">Élevée</option>
              </select></div>
            <div><button class="btn">Ouvrir le dossier</button></div>
            <p class="small muted">
              L\u2019ouverture place l\u2019intéressé sous protection renforcée : toute
              consultation de son profil sera tracée et signalée.
            </p>
          </div>
        </form>`}

      <div class="spread" style="margin-top:24px">
        <span class="small muted">
          ${dossiers.length} dossier${dossiers.length>1?'s':''} en cours
          · ${archives.length} archivé${archives.length>1?'s':''}
        </span>
        <button class="btn light" onClick=${exporter}>Extraire le registre</button>
      </div>

      <div class="row" style="margin:24px 0;gap:0;border-bottom:1px solid var(--filet)">
        ${[['ouverts','En cours'],['suivi','Suivi des usages'],['archives','Archives']]
          .map(([k,t]) => html`
          <button class="btn light" style=${'border:0;border-bottom:2px solid '+
            (onglet===k?'var(--encre)':'transparent')+';border-radius:0;background:transparent'}
            onClick=${()=>setOnglet(k)}>${t}${k==='suivi'&&suivis.length?' ('+suivis.length+')':''}</button>`)}
      </div>

      ${onglet === 'ouverts' && html`
        <div class="panneau">
          ${dossiers.length === 0
            ? html`<div class="vide">Aucun dossier en cours.</div>`
            : dossiers.map(ligne)}
        </div>`}

      ${onglet === 'archives' && html`
        <div class="panneau">
          ${archives.length === 0
            ? html`<div class="vide">Aucun dossier archivé.</div>`
            : archives.map(ligne)}
        </div>`}

      ${onglet === 'suivi' && html`<${SuiviUsages} recharger=${charger} />`}
    </div>`;
}

/* --- Suivi des usages, agrégé par membre -------------------------------
   Une liste d'événements bruts ne se suit pas. On regroupe par
   personne, avec la dernière activité et ce qui reste à examiner.
   --------------------------------------------------------------------- */
function SuiviUsages({ recharger }){
  const [liste, setListe] = useState(null);
  const [detail, setDetail] = useState(null);
  const [evenements, setEvenements] = useState([]);
  const [msg, setMsg] = useState('');

  const charger = useCallback(async () => {
    const { data } = await db.rpc('suivi_en_cours');
    setListe(data || []);
  }, []);
  useEffect(() => { charger(); }, [charger]);

  async function ouvrir(x){
    setDetail(x);
    const { data } = await db.rpc('detail_suivi', { p_profil: x.profil_id });
    setEvenements(data || []);
  }

  async function marquer(x){
    const { data, error } = await db.rpc('marquer_suivi_vu', { p_profil: x.profil_id });
    if (error) return setMsg(error.message);
    if (!data.ok) return setMsg(data.message);
    setMsg('Alertes classées.'); charger(); recharger && recharger();
  }

  if (!liste) return html`<div class="vide">Chargement…</div>`;

  if (detail) return html`
    <div>
      <button class="lien-discret" onClick=${()=>setDetail(null)}>← Tous les suivis</button>
      <h2 style="font-size:23px;margin:12px 0 4px">${detail.membre}</h2>
      <div class="small muted"><span class="mono">${detail.matricule}</span>
        ${detail.territoire_nom ? ' · ' + detail.territoire_nom : ''}
        · dossier <span class="mono">${detail.dossier_reference}</span></div>
      <div class="alerte" style="margin-top:16px">${detail.motif}</div>
      <div class="panneau" style="margin-top:24px">
        <div class="tete"><h3 style="font-size:17px">Activité enregistrée</h3>
          <span class="tag">${evenements.length}</span></div>
        ${evenements.length === 0
          ? html`<div class="vide">Aucune activité depuis la mise sous suivi.</div>`
          : evenements.map(e => html`
            <div class="ligne">
              <span>${e.app_nom || e.application}</span>
              <div class="row">
                ${!e.vue_le && html`<span class="tag or">Non examinée</span>`}
                <span class="small muted">${new Date(e.cree_le).toLocaleString('fr-FR',
                  {day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</span>
              </div>
            </div>`)}
      </div>
    </div>`;

  return html`
    <div>
      ${msg && html`<div class="alerte ok" style="margin-bottom:16px">${msg}</div>`}
      <p class="small muted" style="margin-bottom:16px;max-width:62ch">
        Ces comptes font l\u2019objet d\u2019une mesure de suivi prononcée et notifiée.
        Chaque ouverture d\u2019application y est enregistrée. La mesure s\u2019éteint
        seule à sa date de fin.
      </p>
      <div class="panneau">
        ${liste.length === 0
          ? html`<div class="vide">Aucun compte sous mesure de suivi.</div>`
          : liste.map(x => html`
            <div class="ligne" style="align-items:flex-start">
              <div style="flex:1;min-width:240px;cursor:pointer" onClick=${()=>ouvrir(x)}>
                <div class="row" style="gap:8px">
                  <strong>${x.membre}</strong>
                  ${x.alertes_non_vues > 0 && html`
                    <span class="pastille">${x.alertes_non_vues}</span>`}
                </div>
                <div class="small muted">
                  <span class="mono">${x.matricule}</span>
                  ${x.territoire_nom ? ' · ' + x.territoire_nom : ''}
                  · dossier <span class="mono">${x.dossier_reference}</span>
                  ${x.instructeur ? ' · instruit par ' + x.instructeur : ''}
                </div>
                <div class="small muted" style="margin-top:4px">
                  Effet au ${jour(x.date_effet)}
                  ${x.date_fin ? ' · fin le ' + jour(x.date_fin) : ' · sans terme'}
                  · ${x.alertes_total} événement${x.alertes_total>1?'s':''}
                  ${x.derniere_activite
                    ? ' · dernière activité ' + jour(x.derniere_activite)
                    : ' · aucune activité'}
                </div>
                ${x.applications && html`<div class="small muted" style="margin-top:4px">
                  Trente derniers jours : ${x.applications}</div>`}
              </div>
              <div class="row">
                <button class="btn sm light" onClick=${()=>ouvrir(x)}>Détail</button>
                ${x.alertes_non_vues > 0 && html`
                  <button class="btn sm" onClick=${()=>marquer(x)}>Tout classer</button>`}
              </div>
            </div>`)}
      </div>
    </div>`;
}

function DossierDetail({ p, d, gens, fermer }){
  const [pieces, setPieces] = useState([]);
  const [mesures, setMesures] = useState([]);
  const [recours, setRecours] = useState([]);
  const [piece, setPiece] = useState({type:'note_instruction', titre:'', contenu:'', communicable:false});
  const [fichier, setFichier] = useState(null);
  const [courrier, setCourrier] = useState(null);

  // Dépôt d'un courrier dans le dépôt privé des dossiers.
  async function deposerCourrier(f){
    if (!f) return null;
    if (f.size > 10 * 1024 * 1024) throw new Error('Le courrier ne doit pas dépasser 10 Mo.');
    const ext = f.name.split('.').pop();
    const chemin = p.id + '/' + d.id + '-' + Date.now() + '.' + ext;
    const { error } = await db.storage.from('dossiers').upload(chemin, f);
    if (error) throw error;
    return chemin;
  }
  const [mes, setMes] = useState({type:'avertissement', motif:'', texte:'', effet:'', fin:''});
  const [msg, setMsg] = useState('');

  const charger = useCallback(async () => {
    const [a,b] = await Promise.all([
      db.from('dossier_pieces').select('*').eq('dossier_id', d.id).order('cree_le'),
      db.from('mesures').select('*').eq('dossier_id', d.id).order('prise_le', {ascending:false})
    ]);
    setPieces(a.data||[]); setMesures(b.data||[]);
    if (b.data && b.data.length){
      const { data: r } = await db.from('recours').select('*')
        .in('mesure_id', b.data.map(x => x.id)).order('cree_le',{ascending:false});
      setRecours(r||[]);
    }
  }, [d.id]);
  useEffect(() => { charger(); }, [charger]);

  const nomDe = i => { const g = gens.find(x => x.id === i); return g ? nomComplet(g) : '—'; };

  async function verser(e){
    e.preventDefault();
    let chemin = null;
    try {
      if (fichier){
        if (fichier.size > 10 * 1024 * 1024)
          throw new Error('Le document ne doit pas dépasser 10 Mo.');
        const ext = fichier.name.split('.').pop();
        chemin = p.id + '/' + d.id + '-' + Date.now() + '.' + ext;
        const { error: eUp } = await db.storage.from('dossiers').upload(chemin, fichier);
        if (eUp) throw eUp;
      }
    } catch (err){ return setMsg('Erreur : ' + (err.message||'téléversement impossible')); }

    const { data, error } = await db.rpc('verser_piece', {
      p_dossier: d.id, p_type: piece.type, p_titre: piece.titre,
      p_contenu: piece.contenu || null, p_fichier: chemin,
      p_communicable: piece.communicable
    });
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data.ok) return setMsg('Erreur : ' + data.message);
    setPiece({type:'note_instruction', titre:'', contenu:'', communicable:false});
    setFichier(null);
    setMsg('Pièce versée au dossier.'); charger();
  }

  async function ouvrirFichier(pc){
    const { data, error } = await db.storage.from('dossiers')
      .createSignedUrl(pc.fichier, 120);
    if (error) return setMsg('Document introuvable.');
    window.open(data.signedUrl, '_blank', 'noopener');
  }

  async function prononcer(e){
    e.preventDefault();
    let chemin = null;
    try { chemin = await deposerCourrier(courrier); }
    catch (err){ return setMsg('Erreur : ' + err.message); }
    const { data, error } = await db.rpc('prononcer_mesure', {
      p_dossier: d.id, p_type: mes.type, p_motif: mes.motif,
      p_texte: mes.texte || null, p_effet: mes.effet || null, p_fin: mes.fin || null,
      p_fichier: chemin
    });
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data.ok) return setMsg('Erreur : ' + data.message);
    setMes({type:'avertissement', motif:'', texte:'', effet:'', fin:''});
    setCourrier(null);
    setMsg('Mesure prononcée. Elle ne produira effet qu\u2019une fois notifiée.');
    charger();
  }

  async function notifier(m, f){
    if (!confirm('Notifier cette décision ? Elle deviendra exécutoire et le délai de recours s\u2019ouvrira.')) return;
    let chemin = null;
    try { chemin = await deposerCourrier(f); }
    catch (err){ return setMsg('Erreur : ' + err.message); }
    const { data, error } = await db.rpc('notifier_mesure',
      { p_mesure: m.id, p_courrier: chemin });
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data.ok) return setMsg('Erreur : ' + data.message);
    setMsg('Décision notifiée.'); charger();
  }

  async function statuer(r, issue, f){
    const decision = prompt('Décision motivée (obligatoire)');
    if (!decision) return;
    let chemin = null;
    try { chemin = await deposerCourrier(f); }
    catch (err){ return setMsg('Erreur : ' + err.message); }
    const { data, error } = await db.rpc('statuer_recours', {
      p_recours: r.id, p_issue: issue, p_decision: decision,
      p_suspensif: false, p_fichier: chemin
    });
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data.ok) return setMsg('Erreur : ' + data.message);
    setMsg('Recours tranché.'); charger();
  }

  async function clore(){
    const conclusion = prompt('Conclusion du dossier (obligatoire)');
    if (!conclusion) return;
    const { data, error } = await db.rpc('clore_dossier',
      { p_dossier: d.id, p_conclusion: conclusion });
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data.ok) return setMsg('Erreur : ' + data.message);
    fermer();
  }

  return html`
    <div>
      <a class="small" href="#" onClick=${e=>{e.preventDefault();fermer()}}>← Tous les dossiers</a>
      <div class="spread" style="margin-top:12px">
        <div>
          <h1 style="font-size:28px">${d.objet}</h1>
          <div class="small muted" style="margin-top:4px">
            <span class="mono">${d.reference}</span> · ${d.concerne}
            <span class="mono">${d.matricule}</span>
            ${d.territoire_nom ? ' · ' + d.territoire_nom : ''}
            · ouvert le ${jour(d.ouvert_le)}
          </div>
        </div>
        <span class=${'tag '+(GRAVITE[d.gravite]||['',''])[1]}>
          ${(GRAVITE[d.gravite]||['',''])[0]}</span>
      </div>

      <div class="panneau" style="margin-top:24px"><div class="corps">
        <${FilDossier} d=${d} />
      </div></div>

      ${msg && html`<div class=${'alerte '+(msg.startsWith('Erreur')?'err':'ok')}
        style="margin-top:16px">${msg}</div>`}

      <div class="panneau" style="margin-top:24px">
        <div class="tete"><h3 style="font-size:17px">Mesures</h3>
          <span class="tag">${mesures.length}</span></div>
        ${mesures.length === 0
          ? html`<div class="vide">Aucune mesure prononcée.</div>`
          : mesures.map(m => {
            const rs = recours.filter(r => r.mesure_id === m.id);
            return html`
              <div class="ligne" style="align-items:flex-start">
                <div style="flex:1;min-width:240px">
                  <div><strong>${MESURES[m.type]||m.type}</strong></div>
                  <div class="small" style="margin-top:4px">${m.motif}</div>
                  <div class="small muted" style="margin-top:4px">
                    Prononcée le ${jour(m.prise_le)} par ${nomDe(m.prise_par)}
                    · effet au ${jour(m.date_effet)}
                    ${m.date_fin ? ' · fin le ' + jour(m.date_fin) : ''}
                    ${m.notifiee_le ? ' · notifiée le ' + jour(m.notifiee_le) : ''}
                    ${m.accusee_le ? ' · réception accusée le ' + jour(m.accusee_le) : ''}
                  </div>
                  ${rs.map(r => html`
                    <div style="margin-top:12px;padding:12px;background:var(--papier);
                         border:1px solid var(--filet);border-radius:2px">
                      <div class="spread">
                        <span class="small"><strong>Recours du ${jour(r.cree_le)}</strong></span>
                        <span class="tag">${r.statut}</span>
                      </div>
                      <p class="small" style="margin:8px 0 0;white-space:pre-wrap">${r.contenu}</p>
                      ${r.decision
                        ? html`<p class="small muted" style="margin:8px 0 0">
                            Décision : ${r.decision}</p>`
                        : html`<div class="row" style="margin-top:12px">
                            <button class="btn sm" onClick=${()=>statuer(r,'accepte',null)}>Accueillir</button>
                            <button class="btn sm light" onClick=${()=>statuer(r,'rejete',null)}>Rejeter</button>
                            <button class="btn sm light" onClick=${()=>statuer(r,'irrecevable',null)}>Irrecevable</button>
                          </div>`}
                    </div>`)}
                </div>
                <div class="row">
                  <span class=${'tag '+(m.statut==='executee'?'rouge':m.statut==='annulee'?'vert':'')}>
                    ${m.statut}</span>
                  ${!m.notifiee_le && html`
                    <label class="btn sm light" style="margin:0;cursor:pointer;
                        text-transform:none;letter-spacing:.02em">
                      Joindre le courrier
                      <input type="file" accept=".pdf,image/*" style="display:none"
                        onChange=${ev => notifier(m, ev.target.files[0])} />
                    </label>
                    <button class="btn sm" onClick=${()=>notifier(m, null)}>Notifier</button>`}
                  ${m.fichier && html`<button class="btn sm light"
                    onClick=${()=>ouvrirFichier({fichier:m.fichier})}>Courrier</button>`}
                </div>
              </div>`;
          })}
      </div>

      ${d.statut === 'clos' && html`
        <div class="alerte" style="margin-top:24px;border-left-color:var(--laiton)">
          Ce dossier est clos et scellé le ${jour(d.clos_le)}. Aucune pièce, mesure
          ou recours ne peut plus y être versé.
          ${d.conclusion ? ' Conclusion : ' + d.conclusion : ''}
        </div>`}

      ${d.statut !== 'clos' && html`
      <form onSubmit=${prononcer} class="panneau" style="margin-top:24px">
        <div class="tete"><h3 style="font-size:17px">Prononcer une mesure</h3></div>
        <div class="corps stack">
          <div class="field"><label>Nature</label>
            <select value=${mes.type} onChange=${e=>setMes(o=>({...o,type:e.target.value}))}>
              ${Object.entries(MESURES).map(([k,v]) => html`<option value=${k}>${v}</option>`)}
            </select></div>
          <div class="field"><label>Motif</label>
            <textarea required value=${mes.motif}
              onInput=${e=>setMes(o=>({...o,motif:e.target.value}))}
              placeholder="Les faits reprochés, les éléments retenus, la règle appliquée." /></div>
          <div class="field"><label>Texte complémentaire</label>
            <textarea value=${mes.texte} onInput=${e=>setMes(o=>({...o,texte:e.target.value}))} /></div>
          <div class="row" style="gap:16px;align-items:flex-start">
            <div class="field" style="flex:1;min-width:150px;margin:0"><label>Date d\u2019effet</label>
              <input type="date" value=${mes.effet}
                onInput=${e=>setMes(o=>({...o,effet:e.target.value}))} /></div>
            <div class="field" style="flex:1;min-width:150px;margin:0"><label>Fin (facultatif)</label>
              <input type="date" value=${mes.fin}
                onInput=${e=>setMes(o=>({...o,fin:e.target.value}))} /></div>
          </div>
          <div class="field"><label>Courrier de décision (PDF)</label>
            <input type="file" accept=".pdf,image/*"
              onChange=${e=>setCourrier(e.target.files[0]||null)} />
            <p class="small muted" style="margin:6px 0 0">
              Il sera versé au dossier et communicable à l\u2019intéressé.</p>
          </div>
          <div><button class="btn">Prononcer</button></div>
          <p class="small muted">
            Une mesure prononcée ne produit aucun effet tant qu\u2019elle n\u2019a pas été
            notifiée. La notification ouvre le délai de recours.
          </p>
        </div>
      </form>`}

      <div class="panneau" style="margin-top:24px">
        <div class="tete"><h3 style="font-size:17px">Pièces</h3>
          <span class="tag">${pieces.length}</span></div>
        ${pieces.map(pc => html`
          <div class="ligne">
            <div style="flex:1;min-width:240px">
              <div>${pc.fichier
                ? html`<a href="#" onClick=${e=>{e.preventDefault();ouvrirFichier(pc)}}>
                    ${pc.titre} ↗</a>`
                : pc.titre}</div>
              ${pc.contenu && html`<div class="small muted"
                style="margin-top:4px;white-space:pre-wrap;max-width:60ch">${pc.contenu}</div>`}
              <div class="small muted" style="margin-top:4px">
                ${pc.type} · ${nomDe(pc.auteur_id)} · ${jour(pc.cree_le)}</div>
            </div>
            ${pc.communicable
              ? html`<span class="tag vert">Communicable</span>`
              : html`<span class="tag or">Non communicable</span>`}
          </div>`)}
      </div>

      ${d.statut !== 'clos' && html`
      <form onSubmit=${verser} class="panneau" style="margin-top:24px">
        <div class="tete"><h3 style="font-size:17px">Verser une pièce</h3></div>
        <div class="corps stack">
          <div class="row" style="gap:16px;align-items:flex-start">
            <div class="field" style="flex:1;min-width:180px;margin:0"><label>Nature</label>
              <select value=${piece.type} onChange=${e=>setPiece(o=>({...o,type:e.target.value}))}>
                <option value="note_instruction">Note d\u2019instruction</option>
                <option value="temoignage">Témoignage</option>
                <option value="piece_jointe">Pièce</option>
                <option value="convocation">Convocation</option>
              </select></div>
            <div class="field" style="flex:1;min-width:200px;margin:0"><label>Titre</label>
              <input required value=${piece.titre}
                onInput=${e=>setPiece(o=>({...o,titre:e.target.value}))} /></div>
          </div>
          <div class="field"><label>Contenu</label>
            <textarea value=${piece.contenu}
              onInput=${e=>setPiece(o=>({...o,contenu:e.target.value}))} /></div>
          <label class="row" style="text-transform:none;letter-spacing:0;
              font-size:14px;color:var(--encre);margin:0;cursor:pointer">
            <input type="checkbox" style="width:auto" checked=${piece.communicable}
              onChange=${e=>setPiece(o=>({...o,communicable:e.target.checked}))} />
            <span>Communicable à l\u2019intéressé</span>
          </label>
          <p class="small muted">
            Une pièce non communicable existe et reste datée au dossier, mais son
            contenu n\u2019est pas ouvert — cela protège l\u2019identité d\u2019un témoin.
            Le contradictoire suppose que ce soit l\u2019exception.
          </p>
          <div class="field">
            <label>Document</label>
            <input type="file" accept="image/*,.pdf,.doc,.docx"
              onChange=${e=>setFichier(e.target.files[0]||null)} />
          </div>
          <div><button class="btn">Verser</button></div>
        </div>
      </form>`}

      ${d.statut !== 'clos' && html`
        <div style="margin-top:32px">
          <button class="btn light" onClick=${clore}>Clore le dossier</button>
          <p class="small muted" style="margin-top:8px">
            La clôture scelle le dossier. Tous les recours doivent avoir été
            tranchés au préalable.
          </p>
        </div>`}
    </div>`;
}


/* =====================================================================
   LISIBILITÉ DES DROITS
   Une infobulle, une fiche membre graduée, un référentiel ouvert, et
   la matrice des accès.
   ===================================================================== */

/* Une explication brève, à la demande. Pas un long texte : une phrase
   au moment où la question se pose. */
function Info({ texte }){
  const [ouvert, setOuvert] = useState(false);
  return html`
    <span style="position:relative;display:inline-block">
      <button onClick=${()=>setOuvert(o=>!o)} aria-label="Explication"
        style="border:1px solid var(--filet);background:#fff;color:var(--gris);
               width:17px;height:17px;border-radius:50%;font-size:11px;
               line-height:1;padding:0;font-family:var(--titre);font-weight:700">i</button>
      ${ouvert && html`
        <span onClick=${()=>setOuvert(false)} style="position:absolute;z-index:60;
          left:0;top:22px;width:270px;padding:12px 14px;background:#fff;
          border:1px solid var(--nuit);border-radius:2px;font-size:13px;
          line-height:1.45;color:var(--nuit);font-weight:400;text-transform:none;
          letter-spacing:0;display:block">${texte}</span>`}
    </span>`;
}

/* --- Fiche membre ------------------------------------------------------
   Trois paliers. Les coordonnées ne sortent que si on les demande, et
   la demande est tracée — c'est ce qui rend la trace honnête.
   --------------------------------------------------------------------- */
function FicheMembre({ id, fermer }){
  const [f, setF] = useState(null);
  const [msg, setMsg] = useState('');

  const charger = useCallback(async (reveler) => {
    const { data, error } = await db.rpc('fiche_membre',
      { p_profil: id, p_reveler: !!reveler });
    if (error) return setMsg(error.message);
    setF(data);
    if (reveler) setMsg('Consultation enregistrée. Le membre peut la voir.');
  }, [id]);
  useEffect(() => { charger(false); }, [charger]);

  if (!f) return html`<div class="vide">Chargement…</div>`;
  if (f.erreur) return html`
    <div>
      <a class="small" href="#" onClick=${e=>{e.preventDefault();fermer()}}>← Annuaire</a>
      <div class="alerte err" style="margin-top:16px">${f.erreur}</div>
    </div>`;

  const nom = [f.prenom, f.nom].filter(Boolean).join(' ') || f.matricule;

  return html`
    <div>
      <a class="small" href="#" onClick=${e=>{e.preventDefault();fermer()}}>← Annuaire</a>
      ${msg && html`<div class="alerte ok" style="margin-top:16px">${msg}</div>`}

      <div class="carte" style="margin-top:16px">
        <div class="matricule">${f.matricule}</div>
        <div class="nom">${nom}</div>
        <div class="poste">${f.fonction}</div>
        <div class="lieu">${f.chemin || f.territoire || 'Sans rattachement'}</div>
        ${f.postes.length > 0 && html`
          <div class="row" style="margin-top:12px;gap:6px">
            ${f.postes.map(x => html`<span class=${'tag '+(x.couleur==='neutre'?'':x.couleur)}>
              ${x.nom}${x.territoire ? ' · '+x.territoire : ''}</span>`)}
          </div>`}
        <div class="ech">
          <span class="tag or">Échelon ${f.echelon} · ${f.echelon_nom}</span>
          <span class="small muted">Membre depuis ${jour(f.membre_depuis)}</span>
        </div>
        <div class="jauge"><i style=${'width:'+Math.round(f.echelon/7*100)+'%'}></i></div>
      </div>

      ${f.bio && html`
        <div class="panneau" style="margin-top:24px">
          <div class="tete"><h3 style="font-size:17px">Présentation</h3></div>
          <div class="corps" style="white-space:pre-wrap">${f.bio}</div>
        </div>`}

      <div class="panneau" style="margin-top:24px">
        <div class="tete">
          <div class="row" style="gap:8px">
            <h3 style="font-size:17px">Coordonnées</h3>
            <${Info} texte="Les coordonnées d'un membre ne s'affichent pas d'emblée. Il faut les demander, et la demande est enregistrée : l'intéressé peut voir qui a consulté son dossier." />
          </div>
          ${!f.revele && f.droit_encadrement && html`
            <button class="btn sm light" onClick=${()=>charger(true)}>Afficher</button>`}
        </div>
        ${f.revele
          ? html`
            <div>
              <div class="ligne"><span class="muted">Adresse</span>
                <a href=${'mailto:'+f.email}>${f.email}</a></div>
              ${f.telephone && html`<div class="ligne"><span class="muted">Téléphone</span>
                <span>${f.telephone}</span></div>`}
              ${f.webmail && html`<div class="ligne"><span class="muted">Webmail</span>
                <span class="mono">${f.webmail}</span></div>`}
              ${f.date_adhesion && html`<div class="ligne"><span class="muted">Adhésion</span>
                <span>${jour(f.date_adhesion)}</span></div>`}
            </div>`
          : html`<div class="corps small muted">
              ${f.droit_encadrement
                ? 'Réservées. Cliquez sur Afficher : votre consultation sera enregistrée.'
                : 'Réservées à l\u2019encadrement du territoire de ce membre.'}
            </div>`}
      </div>

      ${f.revele && f.droit_habilite && html`
        <div class="panneau" style="margin-top:24px;border-color:var(--brun)">
          <div class="tete" style="border-bottom-color:var(--brun)">
            <h3 style="font-size:17px">Situation administrative</h3>
            <span class="tag or">Habilitation requise</span>
          </div>
          <div class="ligne"><span class="muted">Statut du compte</span>
            <span class=${'tag '+(f.statut==='actif'?'vert':'rouge')}>${f.statut}</span></div>
          ${f.protege && html`<div class="ligne"><span class="muted">Protection renforcée</span>
            <span>${f.motif_protection||'Oui'}</span></div>`}
          ${f.sous_suivi && html`<div class="ligne"><span class="muted">Suivi des usages</span>
            <span class="tag rouge">Sous mesure</span></div>`}
          <div class="ligne"><span class="muted">Dossiers disciplinaires</span>
            <span>${f.dossiers_ouverts} en cours · ${f.dossiers_clos} clos</span></div>
          ${(f.acces_nominatifs||[]).length > 0 && html`
            <div class="ligne"><span class="muted">Accès nominatifs</span>
              <div class="row" style="gap:6px;justify-content:flex-end">
                ${f.acces_nominatifs.map(x => html`
                  <span class=${'tag '+(x.statut==='accorde'?'vert':'rouge')}>${x.app}</span>`)}
              </div></div>`}
        </div>`}

      ${f.certifications.length > 0 && html`
        <div class="panneau" style="margin-top:24px">
          <div class="tete"><h3 style="font-size:17px">Certifications</h3></div>
          ${f.certifications.map(c => html`
            <div class="ligne">
              <div><div>${c.nom}</div>
                <div class="small muted">Délivrée le ${jour(c.obtenue_le)}
                  ${c.expire_le ? ' · valable jusqu\u2019au ' + jour(c.expire_le) : ''}</div></div>
              <span class="mono muted">${c.numero}</span>
            </div>`)}
        </div>`}

      ${f.groupes.length > 0 && html`
        <div class="panneau" style="margin-top:24px">
          <div class="tete"><h3 style="font-size:17px">Groupes de travail</h3></div>
          ${f.groupes.map(g => html`
            <div class="ligne"><span>${g.nom}</span>
              ${g.role === 'responsable' && html`<span class="tag or">Responsable</span>`}</div>`)}
        </div>`}
    </div>`;
}

/* --- Le référentiel, ouvert à tous ------------------------------------ */
function Referentiel(){
  const [r, setR] = useState(null);
  const [onglet, setOnglet] = useState('fonctions');
  useEffect(() => { db.rpc('referentiel').then(({data}) => setR(data)); }, []);
  if (!r) return html`<div class="vide">Chargement…</div>`;

  const etat = e => ({
    ouverte:    html`<span class="tag vert">Ouverte</span>`,
    sur_demande:html`<span class="tag or">Sur demande</span>`,
    invisible:  html`<span class="tag">Non ouverte</span>`
  })[e];

  return html`
    <div>
      <div class="eyebrow">Référentiel</div>
      <h1 style="margin:6px 0 12px">Comprendre les droits</h1>
      <p class="muted" style="max-width:62ch">
        Rien n\u2019est caché ici. Un système de droits que personne ne comprend
        n\u2019est pas accepté : il est subi. Vous êtes
        <strong>${r.ma_fonction}</strong>, à l\u2019échelon <strong>${r.mon_echelon}</strong>.
      </p>

      <div class="row" style="margin:32px 0 24px;gap:0;border-bottom:1px solid var(--filet)">
        ${[['fonctions','Fonctions'],['echelons','Échelons'],['postes','Postes'],
           ['applications','Applications']].map(([k,t]) => html`
          <button class="btn light" style=${'border:0;border-bottom:2px solid '+
            (onglet===k?'var(--bordeaux)':'transparent')+';border-radius:0;background:transparent'}
            onClick=${()=>setOnglet(k)}>${t}</button>`)}
      </div>

      ${onglet === 'fonctions' && html`
        <div>
          <p class="intro" style="margin-bottom:20px">
            La fonction est le poste que vous occupez dans la fédération. Elle
            détermine votre <strong>périmètre</strong> : vous voyez et accompagnez
            votre territoire et tout ce qui en dépend, jamais celui du voisin.
          </p>
          <div class="panneau" style="overflow-x:auto">
            <table>
              <thead><tr><th>Fonction</th><th>Famille</th><th>Échelle</th>
                <th>Niveau</th><th>Membres</th></tr></thead>
              <tbody>
                ${r.fonctions.map(f => html`
                  <tr>
                    <td>${f.nom}</td>
                    <td class="small muted">${f.famille}</td>
                    <td class="small muted">${f.echelle || '—'}</td>
                    <td class="mono">${f.niveau}</td>
                    <td class="mono">${f.effectif}</td>
                  </tr>`)}
              </tbody>
            </table>
          </div>
        </div>`}

      ${onglet === 'echelons' && html`
        <div>
          <p class="intro" style="margin-bottom:20px">
            L\u2019échelon reconnaît l\u2019expérience, indépendamment du poste.
            <strong>La fonction donne le pouvoir, l\u2019échelon reconnaît le parcours.</strong>
            Un bénévole de longue date peut être échelon 5 sans encadrer personne.
          </p>
          <div class="panneau">
            ${r.echelons.map(e => html`
              <div class="ligne">
                <div>
                  <div><strong>${e.niveau}. ${e.nom}</strong></div>
                  <div class="small muted">${e.ouvre || 'Aucun pouvoir particulier'}</div>
                </div>
                <div class="row">
                  <span class="tag">${e.points} points</span>
                  <span class="tag or">${e.effectif} membre${e.effectif>1?'s':''}</span>
                </div>
              </div>`)}
          </div>
        </div>`}

      ${onglet === 'postes' && html`
        <div>
          <p class="intro" style="margin-bottom:20px">
            Un poste est un mandat nommé, cumulable et révocable, indépendant du
            grade. Il ouvre des droits que la fonction ne donne pas. Savoir qui
            est référent RGPD ou membre du conseil de discipline fait partie du
            fonctionnement normal d\u2019une association.
          </p>
          ${r.postes.map(po => html`
            <div class="panneau" style="margin-bottom:16px">
              <div class="tete">
                <div>
                  <h3 style="font-size:17px">${po.nom}</h3>
                  ${po.description && html`<div class="small muted"
                    style="margin-top:4px;max-width:58ch">${po.description}</div>`}
                </div>
                <span class=${'tag '+(po.couleur==='neutre'?'':po.couleur)}>
                  ${(po.titulaires||[]).length} titulaire${(po.titulaires||[]).length>1?'s':''}</span>
              </div>
              <div class="corps">
                <div class="eyebrow" style="margin-bottom:8px">Droits ouverts</div>
                <div class="row" style="gap:6px">
                  ${(po.droits||[]).map(d => html`<span class="tag">${d}</span>`)}
                  ${(po.droits||[]).length === 0 && html`<span class="small muted">Aucun</span>`}
                </div>
                ${(po.titulaires||[]).length > 0 && html`
                  <div style="margin-top:16px">
                    <div class="eyebrow" style="margin-bottom:8px">Titulaires</div>
                    <div class="small">${po.titulaires.join(' · ')}</div>
                  </div>`}
              </div>
            </div>`)}
        </div>`}

      ${onglet === 'applications' && html`
        <div>
          <p class="intro" style="margin-bottom:20px">
            Voici ce que votre fonction vous ouvre aujourd\u2019hui.
            <strong>Ouverte</strong> : accessible immédiatement.
            <strong>Sur demande</strong> : à solliciter au guichet, la Direction
            générale décide. <strong>Non ouverte</strong> : hors de votre fonction,
            sauf poste particulier.
          </p>
          <div class="panneau">
            ${r.applications.map(a => html`
              <div class="ligne">
                <div style="flex:1;min-width:220px">
                  <div>${a.nom}</div>
                  <div class="small muted">${a.description || ''}</div>
                  ${a.droit_requis && html`<div class="small muted" style="margin-top:4px">
                    Exige le droit : ${a.droit_requis}</div>`}
                </div>
                ${etat(a.mon_etat)}
              </div>`)}
          </div>
        </div>`}
    </div>`;
}

/* --- La matrice des accès, côté pilotage ------------------------------ */
function Matrice({ setMsg }){
  const [m, setM] = useState([]);
  const charger = useCallback(async () => {
    const { data } = await db.rpc('matrice_acces');
    setM(data || []);
  }, []);
  useEffect(() => { charger(); }, [charger]);

  const suivant = { ouverte:'sur_demande', sur_demande:'invisible', invisible:'ouverte' };
  const style = {
    ouverte:    'background:var(--valide-clair);color:var(--valide);border-color:#C8DED3',
    sur_demande:'background:var(--brun-clair);color:var(--brun);border-color:#E0D5CC',
    invisible:  'background:var(--papier);color:var(--gris-bleu);border-color:var(--filet)'
  };
  const signe = { ouverte:'Ouverte', sur_demande:'Sur demande', invisible:'—' };

  async function basculer(c){
    const { data, error } = await db.rpc('regler_matrice',
      { p_app: c.application, p_fonction: c.fonction, p_etat: suivant[c.etat] });
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data.ok) return setMsg('Erreur : ' + data.message);
    charger();
  }

  const apps = [...new Map(m.map(x => [x.application,
    {code:x.application, nom:x.app_nom, droit:x.droit_requis}])).values()];
  const fonctions = [...new Map(m.map(x => [x.fonction,
    {code:x.fonction, nom:x.fonction_nom, niveau:x.niveau}])).values()]
    .sort((a,b) => a.niveau - b.niveau);

  return html`
    <div>
      <p class="small muted" style="margin-bottom:16px;max-width:64ch">
        Cliquez une case pour la faire tourner : ouverte → sur demande → non
        ouverte. Une application <strong>ouverte</strong> apparaît et fonctionne.
        <strong>Sur demande</strong>, elle apparaît grisée avec un bouton de
        demande. <strong>Non ouverte</strong>, elle n\u2019apparaît pas du tout.
        Un poste passe outre : un référent RGPD atteint son outil quelle que soit
        sa fonction. Le chiffre en brun sous une case indique combien de membres
        de cette fonction y accèdent malgré tout — par un poste ou un octroi
        nominatif. Fermer la case ne les ferme pas.
      </p>
      <div class="panneau" style="overflow-x:auto">
        <table style="font-size:12.5px">
          <thead><tr>
            <th style="position:sticky;left:0;background:#fff;min-width:190px">Application</th>
            ${fonctions.map(f => html`<th style="text-align:center;min-width:96px">
              ${f.nom}</th>`)}
          </tr></thead>
          <tbody>
            ${apps.map(a => html`
              <tr>
                <td style="position:sticky;left:0;background:#fff">
                  <div>${a.nom}</div>
                  ${a.droit && html`<div class="small muted">${a.droit_nom||'poste requis'}</div>`}
                </td>
                ${fonctions.map(f => {
                  const c = m.find(x => x.application === a.code && x.fonction === f.code);
                  if (!c) return html`<td></td>`;
                  return html`
                    <td style="text-align:center;padding:6px">
                      <button onClick=${()=>basculer(c)}
                        style=${'width:100%;padding:6px 4px;border:1px solid;border-radius:2px;'+
                          'font-family:var(--titre);font-weight:700;font-size:10px;'+
                          'letter-spacing:.04em;text-transform:uppercase;'+style[c.etat]}>
                        ${signe[c.etat]}</button>
                      ${c.contournements > 0 && html`
                        <div class="small" style="color:var(--brun);margin-top:3px;font-size:10px"
                          title="Membres qui y accèdent par un poste ou un octroi nominatif">
                          +${c.contournements}</div>`}
                    </td>`;
                })}
              </tr>`)}
          </tbody>
        </table>
      </div>
    </div>`;
}


/* =====================================================================
   MON ENGAGEMENT
   La première chose qu'on voit. Ce que je donne ce mois-ci, ce qu'on
   attend de moi, et ce que je peux rejoindre.
   ===================================================================== */

const MOIS = ['janvier','février','mars','avril','mai','juin','juillet',
              'août','septembre','octobre','novembre','décembre'];
const nomMois = d => { const x = new Date(d); return MOIS[x.getMonth()] + ' ' + x.getFullYear(); };

/* Le curseur d'engagement, en tête du tableau de bord. */
function CurseurEngagement({ compact }){
  const [e, setE] = useState(null);
  const [h, setH] = useState(0);
  const [enregistre, setEnregistre] = useState(false);

  const charger = useCallback(async () => {
    const { data } = await db.rpc('mon_engagement');
    setE(data); setH(Number(data?.heures_visees || 0));
  }, []);
  useEffect(() => { charger(); }, [charger]);

  async function poser(valeur){
    setH(valeur);
    await db.rpc('regler_engagement',
      { p_mois: null, p_visees: valeur, p_realisees: null, p_commentaire: null });
    setEnregistre(true);
    setTimeout(() => setEnregistre(false), 2000);
    charger();
  }

  if (!e) return null;
  const fait = Number(e.heures_realisees || 0);
  const pct = h > 0 ? Math.min(Math.round(fait / h * 100), 100) : 0;

  return html`
    <div class="panneau">
      <div class="tete">
        <div class="row" style="gap:8px">
          <h3 style="font-size:17px">Mon engagement — ${nomMois(e.mois)}</h3>
          <${Info} texte="Vous dites ce que vous pouvez donner ce mois-ci. Cela sert à s'organiser collectivement, jamais à vous être reproché : un bénévole n'est pas un salarié." />
        </div>
        ${enregistre && html`<span class="tag vert">Enregistré</span>`}
      </div>
      <div class="corps">
        <div class="spread" style="align-items:baseline">
          <span class="small muted">Je peux donner</span>
          <span style="font-family:var(--titre);font-weight:900;font-size:34px;
                       color:var(--bordeaux);line-height:1">
            ${h}<span style="font-size:16px;color:var(--gris)"> h</span></span>
        </div>
        <input type="range" min="0" max="40" step="1" value=${h}
          onInput=${ev => setH(Number(ev.target.value))}
          onChange=${ev => poser(Number(ev.target.value))}
          style="width:100%;margin-top:12px;accent-color:var(--bordeaux);padding:0" />
        <div class="spread small muted" style="margin-top:2px">
          <span>0 h</span><span>20 h</span><span>40 h et plus</span>
        </div>

        ${h > 0 && html`
          <div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--filet)">
            <div class="spread">
              <span class="small muted">Heures déjà réalisées</span>
              <span class="mono">${fait} / ${h} h</span>
            </div>
            <div class="jauge" style="margin-top:8px">
              <i style=${'width:'+pct+'%;background:var(--bleu)'}></i></div>
            <div class="row" style="margin-top:12px;gap:8px">
              ${[1,2,3,5].map(n => html`
                <button class="btn sm light" onClick=${async ()=>{
                  await db.rpc('regler_engagement', { p_mois:null, p_visees:h,
                    p_realisees: fait + n, p_commentaire:null });
                  charger();
                }}>+${n} h</button>`)}
              ${fait > 0 && html`<button class="btn sm light" onClick=${async ()=>{
                await db.rpc('regler_engagement', { p_mois:null, p_visees:h,
                  p_realisees: 0, p_commentaire:null });
                charger();
              }}>Remettre à zéro</button>`}
            </div>
          </div>`}

        ${!compact && (e.historique||[]).length > 1 && html`
          <div style="margin-top:24px;padding-top:16px;border-top:1px solid var(--filet)">
            <div class="eyebrow" style="margin-bottom:10px">Douze derniers mois</div>
            <div style="display:flex;gap:4px;align-items:flex-end;height:56px">
              ${[...e.historique].reverse().map(x => {
                const v = Number(x.visees||0), r = Number(x.realisees||0);
                const max = Math.max(v, r, 1);
                return html`
                  <div style="flex:1;display:flex;flex-direction:column;
                              justify-content:flex-end;height:100%" title=${nomMois(x.mois)}>
                    <div style=${'height:'+Math.round(r/max*100)+'%;background:var(--bleu);min-height:2px'}></div>
                    <div style=${'height:'+Math.round(Math.max(v-r,0)/max*100)+'%;background:var(--filet)'}></div>
                  </div>`;
              })}
            </div>
            <div class="small muted" style="margin-top:6px">
              En bleu, les heures réalisées ; en gris, ce qui restait annoncé.
            </div>
          </div>`}
      </div>
    </div>`;
}

function Engagement({ p }){
  const [e, setE] = useState(null);
  const [missions, setMissions] = useState([]);
  const [creation, setCreation] = useState(false);
  const [f, setF] = useState({titre:'',description:'',lieu:'',debut:'',fin:'',
                              heures:'',places:'1',territoire:'',certification:''});
  const [terr, setTerr] = useState([]);
  const [certifs, setCertifs] = useState([]);
  const [msg, setMsg] = useState('');

  const peutProposer = p.echelon >= 3 || p.niveau >= 50;

  const charger = useCallback(async () => {
    const [a, b] = await Promise.all([
      db.rpc('mon_engagement'), db.rpc('missions_ouvertes')
    ]);
    setE(a.data); setMissions(b.data || []);
  }, []);
  useEffect(() => { charger(); }, [charger]);

  useEffect(() => { (async () => {
    if (!peutProposer) return;
    const [t, c] = await Promise.all([
      db.from('territoires').select('id,nom,echelle').order('echelle').order('nom'),
      db.from('certifications').select('code,nom').eq('actif',true).order('nom')
    ]);
    setTerr(t.data||[]); setCertifs(c.data||[]);
  })(); }, [peutProposer]);

  async function postuler(m){
    const message = prompt('Un mot pour le porteur de la mission (facultatif)') || '';
    const { data, error } = await db.rpc('postuler_mission',
      { p_mission: m.id, p_message: message });
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data.ok) return setMsg('Erreur : ' + data.message);
    setMsg('Candidature transmise.'); charger();
  }

  async function proposer(ev){
    ev.preventDefault();
    const { data, error } = await db.rpc('creer_mission', {
      p_titre: f.titre, p_description: f.description || null,
      p_territoire: f.territoire || null, p_groupe: null,
      p_certification: f.certification || null, p_lieu: f.lieu || null,
      p_debut: f.debut || null, p_fin: f.fin || null,
      p_heures: f.heures ? Number(f.heures) : null,
      p_places: Number(f.places||1)
    });
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data.ok) return setMsg('Erreur : ' + data.message);
    setF({titre:'',description:'',lieu:'',debut:'',fin:'',heures:'',places:'1',
          territoire:'',certification:''});
    setCreation(false); setMsg('Mission publiée.'); charger();
  }

  if (!e) return html`<div class="vide">Chargement…</div>`;
  const taches = e.taches || [];
  const retards = taches.filter(t => t.retard);

  return html`
    <div>
      <div class="eyebrow">Mon engagement</div>
      <h1 style="margin:6px 0 8px">Ce que je donne, ce qui m\u2019attend</h1>
      <p class="muted" style="max-width:58ch">
        Vous fixez vous-même ce que vous pouvez donner. Rien ici n\u2019est un
        objectif imposé : c\u2019est un repère, pour vous et pour celles et ceux
        qui organisent les actions.
      </p>
      ${msg && html`<div class=${'alerte '+(msg.startsWith('Erreur')?'err':'ok')}
        style="margin-top:16px">${msg}</div>`}

      <div style="margin-top:24px"><${CurseurEngagement} /></div>

      <div class="panneau" style="margin-top:24px">
        <div class="tete">
          <h3 style="font-size:17px">Mes tâches</h3>
          <div class="row">
            ${retards.length > 0 && html`<span class="tag rouge">${retards.length} en retard</span>`}
            <span class="tag">${taches.length}</span>
          </div>
        </div>
        ${taches.length === 0
          ? html`<div class="vide">Aucune tâche ne vous est assignée.</div>`
          : taches.map(t => html`
            <div class="ligne">
              <div style="flex:1;min-width:220px">
                <div>${t.titre}</div>
                <div class="small muted">${t.groupe}
                  ${t.echeance ? ' · ' + jour(t.echeance) : ' · sans échéance'}</div>
              </div>
              <div class="row">
                ${t.retard && html`<span class="tag rouge">En retard</span>`}
                ${t.priorite === 'haute' && html`<span class="tag rouge">Prioritaire</span>`}
                <a class="btn sm light" href=${'#/espace/groupe/'+t.groupe_id}>Ouvrir</a>
              </div>
            </div>`)}
      </div>

      ${(e.formations_en_cours||[]).length > 0 && html`
        <div class="panneau" style="margin-top:24px">
          <div class="tete"><h3 style="font-size:17px">Formations commencées</h3></div>
          ${e.formations_en_cours.map(x => html`
            <div class="ligne">
              <div style="flex:1;min-width:200px">
                <div>${x.titre}</div>
                <div class="jauge" style="margin-top:8px">
                  <i style=${'width:'+x.pourcent+'%'}></i></div>
              </div>
              <div class="row">
                <span class="mono">${x.pourcent} %</span>
                <a class="btn sm light" href=${'#/espace/formation/'+x.id}>Reprendre</a>
              </div>
            </div>`)}
        </div>`}

      ${(e.missions||[]).length > 0 && html`
        <div class="panneau" style="margin-top:24px">
          <div class="tete"><h3 style="font-size:17px">Mes missions</h3></div>
          ${e.missions.map(m => html`
            <div class="ligne">
              <div><div>${m.titre}</div>
                <div class="small muted">${m.lieu||''}
                  ${m.debut ? ' · ' + jour(m.debut) : ''}</div></div>
              <span class=${'tag '+(m.statut==='retenu'?'vert':'bleu')}>
                ${m.statut === 'retenu' ? 'Retenu' : 'Candidature déposée'}</span>
            </div>`)}
        </div>`}

      <div class="spread" style="margin-top:40px">
        <div>
          <h2 style="font-size:23px">Missions ouvertes</h2>
          <p class="small muted" style="margin:4px 0 0">
            Des actions auxquelles vous pouvez vous porter volontaire.</p>
        </div>
        ${peutProposer && html`<button class="btn" onClick=${()=>setCreation(c=>!c)}>
          ${creation ? 'Annuler' : 'Proposer une mission'}</button>`}
      </div>

      ${creation && html`
        <form onSubmit=${proposer} class="panneau" style="margin-top:20px">
          <div class="corps stack">
            <div class="field"><label>Intitulé</label>
              <input required value=${f.titre} onInput=${ev=>setF(o=>({...o,titre:ev.target.value}))}
                placeholder="Animer un atelier citoyenneté au collège Jean-Moulin" /></div>
            <div class="field"><label>Description</label>
              <textarea value=${f.description}
                onInput=${ev=>setF(o=>({...o,description:ev.target.value}))} /></div>
            <div class="row" style="gap:16px;align-items:flex-start">
              <div class="field" style="flex:1;min-width:160px;margin:0"><label>Lieu</label>
                <input value=${f.lieu} onInput=${ev=>setF(o=>({...o,lieu:ev.target.value}))} /></div>
              <div class="field" style="flex:1;min-width:140px;margin:0"><label>Début</label>
                <input type="date" value=${f.debut}
                  onInput=${ev=>setF(o=>({...o,debut:ev.target.value}))} /></div>
              <div class="field" style="flex:1;min-width:140px;margin:0"><label>Fin</label>
                <input type="date" value=${f.fin}
                  onInput=${ev=>setF(o=>({...o,fin:ev.target.value}))} /></div>
            </div>
            <div class="row" style="gap:16px;align-items:flex-start">
              <div class="field" style="flex:1;min-width:120px;margin:0"><label>Heures estimées</label>
                <input type="number" step="0.5" min="0" value=${f.heures}
                  onInput=${ev=>setF(o=>({...o,heures:ev.target.value}))} /></div>
              <div class="field" style="flex:1;min-width:100px;margin:0"><label>Places</label>
                <input type="number" min="1" value=${f.places}
                  onInput=${ev=>setF(o=>({...o,places:ev.target.value}))} /></div>
            </div>
            <div class="field"><label>Territoire</label>
              <select value=${f.territoire} onChange=${ev=>setF(o=>({...o,territoire:ev.target.value}))}>
                <option value="">Toute la France</option>
                ${terr.map(t => html`<option value=${t.id}>${t.nom} (${t.echelle})</option>`)}
              </select></div>
            <div class="field"><label>Certification exigée</label>
              <select value=${f.certification}
                onChange=${ev=>setF(o=>({...o,certification:ev.target.value}))}>
                <option value="">Aucune</option>
                ${certifs.map(c => html`<option value=${c.code}>${c.nom}</option>`)}
              </select></div>
            <div><button class="btn">Publier la mission</button></div>
          </div>
        </form>`}

      <div class="tuiles" style="margin-top:20px">
        ${missions.length === 0
          ? html`<div class="tuile"><div class="vide">Aucune mission ouverte pour l\u2019instant.</div></div>`
          : missions.map(m => html`
            <div class="tuile" style="min-height:auto">
              <h3>${m.titre}</h3>
              <p>${m.description || ''}</p>
              <div class="row" style="margin-top:12px;gap:6px">
                ${m.lieu && html`<span class="tag">${m.lieu}</span>`}
                ${m.debut && html`<span class="tag">${jour(m.debut)}</span>`}
                ${m.heures_estimees && html`<span class="tag">${m.heures_estimees} h</span>`}
                <span class="tag">${m.retenus}/${m.places} place${m.places>1?'s':''}</span>
                ${m.certification_nom && html`<span class="tag or">${m.certification_nom}</span>`}
              </div>
              <div style="margin-top:14px">
                ${m.ma_candidature
                  ? html`<span class=${'tag '+(m.ma_candidature==='retenu'?'vert':'bleu')}>
                      ${m.ma_candidature === 'retenu' ? 'Vous êtes retenu' :
                        m.ma_candidature === 'candidat' ? 'Candidature déposée' : m.ma_candidature}
                    </span>`
                  : m.obstacle
                    ? html`<span class="small muted">${m.obstacle}</span>`
                    : html`<button class="btn sm" onClick=${()=>postuler(m)}>
                        Je me porte volontaire</button>`}
              </div>
              ${m.porteur && html`<div class="small muted" style="margin-top:10px">
                Proposée par ${m.porteur}</div>`}
            </div>`)}
      </div>
    </div>`;
}

/* --- Le dossier d'adhésion --------------------------------------------
   Quatre sections courtes plutôt qu'un formulaire d'un mètre. Ce qui
   manque est dit en tête, avec le nombre exact.
   --------------------------------------------------------------------- */
const SECTIONS_DOSSIER = [
  ['identite',    'Vous',            'Nom, téléphone, rattachement'],
  ['coordonnees', 'Vos coordonnées', 'Naissance, ville, code postal'],
  ['engagement',  'Votre engagement','Situation et motivation'],
  ['consentement','Vos accords',     'Statuts et données personnelles']
];

function DossierAdhesion({ p, recharger }){
  const [a, setA] = useState(null);
  const [c, setC] = useState(null);
  const [f, setF] = useState({});
  const [section, setSection] = useState(null);
  const [msg, setMsg] = useState('');

  const charger = useCallback(async () => {
    const [x, y] = await Promise.all([
      db.rpc('mon_adhesion'), db.rpc('completude_dossier', { p_profil: null })
    ]);
    setA(x.data || {}); setC(y.data);
    setF({ ...(x.data||{}), prenom: p?.prenom||'', nom: p?.nom||'',
           telephone: p?.telephone||'', territoire_id: p?.territoire_id||'' });
  }, [p]);
  useEffect(() => { charger(); }, [charger]);

  const [terr, setTerr] = useState([]);
  useEffect(() => {
    db.from('territoires').select('id,nom').eq('echelle','departement')
      .eq('actif',true).order('code').then(({data}) => setTerr(data||[]));
  }, []);

  if (!c) return null;
  const maj = (k,v) => setF(o => ({...o, [k]: v}));
  const manque = cle => (c.manques_detail||[]).some(m => m.cle === cle);

  // Le téléphone se met en forme pendant la frappe.
  function formatTel(v){
    const n = v.replace(/[^0-9+]/g, '');
    if (n.startsWith('0') && n.length <= 10)
      return n.replace(/(\d{2})(?=\d)/g, '$1 ').trim();
    return v;
  }

  async function enregistrer(e){
    e.preventDefault(); setMsg('');
    // Identité : elle vit dans profils.
    const majProfil = {};
    if (f.prenom !== p.prenom) majProfil.prenom = f.prenom;
    if (f.nom !== p.nom) majProfil.nom = f.nom;
    if (f.telephone !== p.telephone) majProfil.telephone = f.telephone;
    if (f.territoire_id && f.territoire_id !== p.territoire_id)
      majProfil.territoire_id = f.territoire_id;
    if (Object.keys(majProfil).length){
      const { error } = await db.from('profils').update(majProfil).eq('id', p.id);
      if (error) return setMsg('Erreur : ' + error.message);
    }
    // Le reste vit dans dossier_adhesion.
    const { data, error } = await db.rpc('enregistrer_adhesion', {
      d: { ...f, accepte_statuts: true, accepte_rgpd: true }
    });
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data.ok) return setMsg('Erreur : ' + data.message);
    setSection(null); setMsg('Enregistré.');
    charger(); recharger && recharger();
  }

  const champ = (cle, label, contenu) => html`
    <div class="field">
      <label style=${manque(cle)?'color:var(--bordeaux)':''}>
        ${label}${manque(cle) ? ' — à compléter' : ''}</label>
      ${contenu}
    </div>`;

  return html`
    <div class="panneau" style=${c.complet ? '' : 'border-left:3px solid var(--bordeaux)'}>
      <div class="tete">
        <div class="row" style="gap:8px">
          <h3 style="font-size:17px">Mon dossier d\u2019adhésion</h3>
          <${Info} texte="Ces informations sont conservées à part de l'annuaire et ne sont lisibles que par les personnes chargées de valider les adhésions." />
        </div>
        <span class=${'tag '+(c.complet?'vert':'rouge')}>
          ${c.complet ? 'Complet' : c.nb_manques + ' à compléter'}</span>
      </div>

      <div class="corps">
        <div class="jauge" style="height:6px;margin:0">
          <i style=${'width:'+c.pourcent+'%;background:'+
            (c.complet?'var(--valide)':'var(--bordeaux)')}></i></div>
        <div class="spread small muted" style="margin-top:6px">
          <span>${c.total - c.nb_manques} sur ${c.total} renseignés</span>
          <span class="mono">${c.pourcent} %</span>
        </div>
        ${!c.complet && html`
          <p class="small" style="margin:14px 0 0">
            Il manque : ${(c.manques||[]).join(', ')}.
          </p>`}
      </div>

      ${msg && html`<div class="corps" style="padding-top:0">
        <div class=${'alerte '+(msg.startsWith('Erreur')?'err':'ok')}>${msg}</div></div>`}

      ${SECTIONS_DOSSIER.map(([cle, titre, resume]) => {
        const st = (c.sections||{})[cle] || {total:0, faits:0, complet:true};
        const ouvert = section === cle;
        return html`
          <div style="border-top:1px solid var(--filet)">
            <div class="ligne" style="cursor:pointer"
              onClick=${()=>setSection(ouvert ? null : cle)}>
              <div>
                <div class="row" style="gap:8px">
                  <span style=${st.complet?'':'font-weight:700'}>${titre}</span>
                  ${st.complet
                    ? html`<span class="tag vert">Fait</span>`
                    : html`<span class="tag rouge">${st.total - st.faits} manquant${st.total-st.faits>1?'s':''}</span>`}
                </div>
                <div class="small muted">${resume}</div>
              </div>
              <button class="btn sm light">${ouvert ? 'Replier' : 'Compléter'}</button>
            </div>

const CANAUX = { instagram:'Instagram', linkedin:'LinkedIn', facebook:'Facebook',
                 x:'X', site:'Site public', newsletter:'Infolettre', presse:'Presse' };
const ETAT_PUB = {
  brouillon:['Brouillon',''], a_valider:['À valider','bleu'],
  validee:['Validée','vert'], publiee:['Publiée','vert'],
  refusee:['À reprendre','rouge'], archivee:['Archivée','']
};

/* Adresse publique d'une image du dépôt vitrine. */
const urlPublique = chemin => chemin
  ? SUPABASE_URL + '/storage/v1/object/public/public/' + chemin : null;

/* Dépôt d'image partagé par la vitrine et la communication. */
async function deposerImage(fichier, prefixe){
  if (!fichier) return null;
  if (fichier.size > 5 * 1024 * 1024)
    throw new Error('L\u2019image ne doit pas dépasser 5 Mo.');
  const ext = fichier.name.split('.').pop();
  const chemin = prefixe + '/' + Date.now() + '.' + ext;
  const { error } = await db.storage.from('public').upload(chemin, fichier);
  if (error) throw error;
  return chemin;
}

function Communication({ p }){
  const [onglet, setOnglet] = useState('calendrier');
  const [pubs, setPubs] = useState([]);
  const [campagnes, setCampagnes] = useState([]);
  const [modeles, setModeles] = useState([]);
  const [edition, setEdition] = useState(null);
  const [msg, setMsg] = useState('');

  const valide = (p.postes||[]).some(x => x.nom.includes('communication')) || p.niveau >= 90;

  const charger = useCallback(async () => {
    const [a, b, c] = await Promise.all([
      db.rpc('calendrier_com', { p_depuis: null, p_jusqu: null }),
      db.from('campagnes').select('*').order('debut', {nullsFirst:false}),
      db.from('modeles_com').select('*').order('titre')
    ]);
    setPubs(a.data||[]); setCampagnes(b.data||[]); setModeles(c.data||[]);
  }, []);
  useEffect(() => { charger(); }, [charger]);

  async function statuer(pub, issue){
    const obs = issue === 'refusee' ? prompt('Ce qu\u2019il faut reprendre (obligatoire)') : null;
    if (issue === 'refusee' && !obs) return;
    const { data, error } = await db.rpc('statuer_publication',
      { p_id: pub.id, p_issue: issue, p_observation: obs });
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data.ok) return setMsg('Erreur : ' + data.message);
    setMsg('Publication mise à jour.'); charger();
  }

  async function soumettre(pub){
    const { data, error } = await db.rpc('soumettre_publication', { p_id: pub.id });
    if (error) return setMsg('Erreur : ' + error.message);
    if (!data.ok) return setMsg('Erreur : ' + data.message);
    setMsg('Transmise à la direction de la communication.'); charger();
  }

  if (edition) return html`<${EditionPublication} p=${p} pub=${edition}
    campagnes=${campagnes} modeles=${modeles}
    fermer=${()=>{ setEdition(null); charger(); }} />`;

  const aValider = pubs.filter(x => x.statut === 'a_valider');
  const aVenir = pubs.filter(x => ['validee','a_valider','brouillon'].includes(x.statut)
    && x.date_prevue && new Date(x.date_prevue) >= new Date());

  const lignePub = x => html`
    <div class="ligne" style="align-items:flex-start">
      ${x.image && html`<img src=${urlPublique(x.image)} alt=""
        style="width:64px;height:64px;object-fit:cover;border:1px solid var(--filet);
               border-radius:2px;flex:0 0 64px" />`}
      <div style="flex:1;min-width:220px;cursor:pointer" onClick=${()=>setEdition(x)}>
        <div>${x.titre}</div>
        <div class="small muted">
          ${CANAUX[x.canal]||x.canal}
          ${x.campagne ? ' · ' + x.campagne : ''}
          ${x.date_prevue ? ' · ' + new Date(x.date_prevue).toLocaleString('fr-FR',
              {day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}) : ' · sans date'}
          ${x.auteur ? ' · ' + x.auteur : ''}
        </div>
        ${x.observation && html`<div class="small" style="color:var(--bordeaux);margin-top:4px">
          ${x.observation}</div>`}
      </div>
      <div class="row">
        <span class=${'tag '+(ETAT_PUB[x.statut]||['',''])[1]}>
          ${(ETAT_PUB[x.statut]||[x.statut,''])[0]}</span>
        ${x.statut === 'brouillon' && html`
          <button class="btn sm light" onClick=${()=>soumettre(x)}>Soumettre</button>`}
        ${x.statut === 'a_valider' && valide && html`
          <button class="btn sm" onClick=${()=>statuer(x,'validee')}>Valider</button>
          <button class="btn sm light" onClick=${()=>statuer(x,'refusee')}>À reprendre</button>`}
        ${x.statut === 'validee' && valide && html`
          <button class="btn sm" onClick=${()=>statuer(x,'publiee')}>Marquer publiée</button>`}
      </div>
    </div>`;

  return html`
    <div>
      <div class="spread">
        <div>
          <div class="eyebrow">Communication</div>
          <h1 style="margin:6px 0 0">Calendrier éditorial</h1>
        </div>
        <button class="btn" onClick=${()=>setEdition({nouveau:true})}>
          Nouvelle publication</button>
      </div>
      ${msg && html`<div class=${'alerte '+(msg.startsWith('Erreur')?'err':'ok')}
        style="margin-top:16px">${msg}</div>`}

      <div class="chiffres" style="margin:24px 0">
        <div><div class="n" style="font-size:32px">${aValider.length}</div>
          <div class="l">À valider</div></div>
        <div><div class="n" style="font-size:32px">${aVenir.length}</div>
          <div class="l">À venir</div></div>
        <div><div class="n" style="font-size:32px">
          ${pubs.filter(x=>x.statut==='publiee').length}</div>
          <div class="l">Publiées</div></div>
        <div><div class="n" style="font-size:32px">
          ${campagnes.filter(c=>c.statut==='en_cours').length}</div>
          <div class="l">Campagnes en cours</div></div>
      </div>

      <div class="row" style="margin:0 0 24px;gap:0;border-bottom:1px solid var(--filet)">
        ${[['calendrier','Calendrier'],['valider','À valider'],
           ['suggestions','Suggestions au réseau'],['campagnes','Campagnes'],
           ['modeles','Modèles'],['charte','La charte']]
          .map(([k,t]) => html`
          <button class="btn light" style=${'border:0;border-bottom:2px solid '+
            (onglet===k?'var(--bordeaux)':'transparent')+';border-radius:0;background:transparent'}
            onClick=${()=>setOnglet(k)}>${t}</button>`)}
      </div>

      ${onglet === 'calendrier' && html`
        <div class="panneau">
          ${pubs.length === 0
            ? html`<div class="vide">Aucune publication. Commencez par en créer une.</div>`
            : pubs.map(lignePub)}
        </div>`}

      ${onglet === 'valider' && html`
        <div class="panneau">
          ${aValider.length === 0
            ? html`<div class="vide">Rien à valider.</div>`
            : aValider.map(lignePub)}
        </div>`}

      ${onglet === 'suggestions' && html`<${SuggestionsAdmin} setMsg=${setMsg} />`}

      ${onglet === 'campagnes' && html`<${Campagnes} valide=${valide}
        campagnes=${campagnes} recharger=${charger} setMsg=${setMsg} />`}

      ${onglet === 'modeles' && html`
        <div>
          <p class="small muted" style="margin-bottom:16px;max-width:62ch">
            Des trames éprouvées. On les copie, on les adapte : personne ne
            réécrit un communiqué de zéro à minuit.
          </p>
          ${modeles.map(m => html`
            <div class="panneau" style="margin-bottom:16px">
              <div class="tete">
                <h3 style="font-size:17px">${m.titre}</h3>
                <div class="row">
                  ${m.canal && html`<span class="tag">${CANAUX[m.canal]||m.canal}</span>`}
                  <button class="btn sm light" onClick=${()=>{
                    navigator.clipboard.writeText(m.contenu);
                    setMsg('Modèle copié.');
                  }}>Copier</button>
                </div>
              </div>
              <div class="corps">
                <pre style="white-space:pre-wrap;font-family:var(--sans);font-size:14px;
                     margin:0;background:var(--papier);padding:14px;border-radius:2px">${m.contenu}</pre>
                ${m.conseils && html`<p class="small muted" style="margin:12px 0 0">
                  ${m.conseils}</p>`}
              </div>
            </div>`)}
        </div>`}

      ${onglet === 'charte' && html`<${RappelCharte} />`}
    </div>`;
}
