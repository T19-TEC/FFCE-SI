# =====================================================================
#  FFCE — Contrôles automatiques
#
#  Ce fichier n'est pas un programme de contrôle : c'est l'ordre donné à
#  GitHub de lancer ceux qui le sont — controles.py, schema.py,
#  carte.py, verifier_modules.py.
#
#  DEUX BRANCHES
#    `travail` — on y dépose. L'automate y régénère et y réenregistre
#                SCHEMA.md et CARTE.md.
#    `main`    — ce qui est en ligne. Protégée. L'automate n'y écrit
#                jamais : il se heurterait à la protection qu'il doit
#                lui-même satisfaire.
#
#  Sur `main`, si les abrégés ne sont pas à jour, on le SIGNALE sans
#  faire échouer. Bloquer serait absurde : les abrégés ne peuvent y
#  arriver que par une fusion depuis `travail`, et cette fusion serait
#  elle-même bloquée. Un contrôle qui s'interdit sa propre condition ne
#  contrôle rien.
# =====================================================================

name: Contrôles FFCE

on:
  push:
    branches: [travail, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Installer Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Régénérer l'abrégé du schéma
        run: python3 schema.py > SCHEMA.md

      - name: Régénérer la carte des modules
        run: python3 carte.py > CARTE.md

      - name: Charger réellement les modules
        run: python3 verifier_modules.py

      - name: Passer les dix-huit contrôles
        run: |
          # Les migrations peuvent vivre dans sql/ ou sql/SQL/ : on ne
          # fait pas échouer un contrôle pour une question de rangement.
          DERNIERE=$(ls sql/SQL/*.sql sql/*.sql migrations/*.sql 2>/dev/null \
                     | sort | tail -1 | xargs -n1 basename 2>/dev/null)
          echo "Dernière migration repérée : ${DERNIERE:-aucune}"
          python3 controles.py $DERNIERE | tee rapport.txt
          if ! grep -q "ANOMALIES BLOQUANTES : 0" rapport.txt; then
            echo "::error::Des anomalies bloquantes subsistent. Voir le rapport."
            exit 1
          fi

      - name: Publier le rapport
        if: always()
        run: |
          {
            echo "## Rapport des contrôles FFCE"
            echo ''
            echo '```'
            cat rapport.txt 2>/dev/null || echo "(un contrôle a échoué avant le rapport)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Sur `travail` : on régénère et on réenregistre.
      - name: Réenregistrer les abrégés
        if: success() && github.event_name == 'push' && github.ref_name == 'travail'
        run: |
          git config user.name  "Contrôles FFCE"
          git config user.email "actions@github.com"
          if [ -n "$(git status --porcelain SCHEMA.md CARTE.md)" ]; then
            git add SCHEMA.md CARTE.md
            git commit -m "Abrégés régénérés automatiquement"
            git push
          else
            echo "Les abrégés étaient déjà à jour."
          fi

      # Ailleurs : simple avertissement, jamais d'échec.
      - name: Signaler si les abrégés sont en retard
        if: success() && github.ref_name != 'travail'
        run: |
          if [ -n "$(git status --porcelain SCHEMA.md CARTE.md)" ]; then
            echo "::warning::SCHEMA.md ou CARTE.md est en retard sur le code. \
            Ils seront régénérés au prochain dépôt sur la branche travail."
            git --no-pager diff --stat SCHEMA.md CARTE.md
          else
            echo "Les abrégés sont à jour."
          fi
